name: Observe native Kubernetes CPU autoscaling
on:
  push:
    branches: [evidence/hpa-control-20261109]
    paths:
      - .github/workflows/hpa-control.yml
      - dist/labs/kubernetes-hpa/hpa_control_lab.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned official Kubernetes tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-hpa-tools"
          cd "$RUNNER_TEMP/guide-hpa-tools"
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind-linux-amd64
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum -o kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          python3 -c 'from pathlib import Path; import hashlib; assert hashlib.sha256(Path("kubectl").read_bytes()).hexdigest()==Path("kubectl.sha256").read_text().strip()'
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/guide-hpa-tools" >> "$GITHUB_PATH"
      - name: Observe metrics, HPA and the readiness gate
        shell: bash
        run: |
          python3 -B dist/labs/kubernetes-hpa/hpa_control_lab.py --output native-results/hpa-control.json
          python3 -B dist/labs/kubernetes-hpa/hpa_control_lab.py --check-record native-results/hpa-control.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hpa-control
          path: native-results/hpa-control.json
          retention-days: 1

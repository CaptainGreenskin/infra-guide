name: Pinned CUDA core compilation
on:
  push:
    branches: [content/cuda-core-20261108]
    paths:
      - dist/labs/cuda-core/**
      - .github/workflows/cuda-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build pinned NVIDIA toolkit, validate host oracle, probe without launching kernels
        run: >-
          python3 -B dist/labs/cuda-core/build.py
          --fetch-toolkit
          --output-dir cuda-core-results
          --cache-dir "${{ runner.temp }}/cuda-core-redist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-core-compilation-and-probe
          path: cuda-core-results/
          if-no-files-found: error
          retention-days: 7

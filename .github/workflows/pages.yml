name: Check and publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      reading_version: ${{ steps.fingerprint.outputs.reading_version }}
      reader_manifest_sha: ${{ steps.fingerprint.outputs.reader_manifest_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render and check content
        run: node scripts/check-all.cjs
      - name: Build project-site paths
        run: node scripts/build-github-pages.cjs --base-path "/${{ github.event.repository.name }}/" --origin "https://${{ github.repository_owner }}.github.io"
      - name: Check project-site links
        run: node scripts/check-github-pages.cjs
      - name: Fingerprint the checked Pages build
        id: fingerprint
        if: github.event_name != 'pull_request'
        env:
          PAGES_DIR: .pages/${{ github.event.repository.name }}
        run: |
          manifest="$PAGES_DIR/reader-runtime-manifest.json"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).staticReadingVersion' "$manifest")"
          checksum="$(sha256sum "$manifest")"
          printf 'reading_version=%s\nreader_manifest_sha=%s\n' "$version" "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: .pages/${{ github.event.repository.name }}
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify the published build
        timeout-minutes: 5
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          READING_VERSION: ${{ needs.build.outputs.reading_version }}
          READER_MANIFEST_SHA: ${{ needs.build.outputs.reader_manifest_sha }}
        run: |
          [[ "$PAGES_URL" == https://* && "$READING_VERSION" =~ ^[a-f0-9]{64}$ && "$READER_MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          site="${PAGES_URL%/}"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for attempt in {1..12}; do
            query="release=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt"
            if curl -fsSL --compressed --connect-timeout 5 --max-time 8 "$site/reader-runtime-manifest.json?$query" -o "$scratch/manifest.json" &&
               checksum="$(sha256sum "$scratch/manifest.json")" &&
               [[ "${checksum%% *}" == "$READER_MANIFEST_SHA" ]] &&
               curl -fsSL --compressed --connect-timeout 5 --max-time 8 "$site/article/transformer-model/?$query" -o "$scratch/article.html" &&
               grep -Fq "data-static-version=\"$READING_VERSION\"" "$scratch/article.html"; then
              printf 'Verified published reading version %s\n' "$READING_VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages did not serve the expected reader manifest and article version."
          exit 1

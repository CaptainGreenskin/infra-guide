name: Replay native JetStream redelivery on Linux
on:
  push:
    branches: ['evidence/jetstream-redelivery-v88']
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned client and verify official broker archive
        shell: bash
        run: |
          python -m pip install --require-hashes -r dist/labs/jetstream-redelivery/requirements.txt
          archive=nats-server-v2.15.2-linux-amd64.tar.gz
          curl -fsSL --retry 2 --connect-timeout 12 --max-time 110 -o "$RUNNER_TEMP/$archive" "https://github.com/nats-io/nats-server/releases/download/v2.15.2/$archive"
          printf '%s  %s\n' 67cb8e10bc6f0c4b47f75a728529a20953dbae2a4f9a4a52ae8517d65ae303ff "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --wildcards '*/nats-server'
      - name: Observe live redelivery and SQLite receiver effects
        shell: bash
        run: |
          mkdir -p native-results
          python -B dist/labs/jetstream-redelivery/jetstream_redelivery.py --server "$RUNNER_TEMP/nats-server-v2.15.2-linux-amd64/nats-server" --output native-results/validation.json
          printf '%s\n' "$GITHUB_SHA" > native-results/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jetstream-redelivery-native-proof
          path: native-results/
          retention-days: 2

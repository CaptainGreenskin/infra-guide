name: Observe native InnoDB plans, waits and deadlocks
on:
  workflow_dispatch:
  push:
    branches: [evidence/innodb-20261109]
    paths:
      - dist/labs/innodb/innodb_lab.py
      - .github/workflows/state-mechanisms.yml
permissions:
  contents: read
jobs:
  innodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run the owned MySQL container and verify its result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-results
          python3 -B dist/labs/innodb/innodb_lab.py --json native-results/validation.json | tee native-results/run.log
          python3 -B dist/labs/innodb/innodb_lab.py --check-record native-results/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-innodb
          path: native-results/
          retention-days: 7

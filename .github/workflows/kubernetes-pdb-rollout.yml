name: Native Kubernetes PDB and rollout
on:
  push:
    branches: [evidence/kubernetes-pdb-rollout-20261109]
    paths:
      - dist/labs/kubernetes-pdb-rollout/pdb_rollout.py
      - .github/workflows/kubernetes-pdb-rollout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned official Kubernetes tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-pdb-tools"
          cd "$RUNNER_TEMP/guide-pdb-tools"
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind-linux-amd64
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum -o kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          python3 -c 'from pathlib import Path; import hashlib; assert hashlib.sha256(Path("kubectl").read_bytes()).hexdigest()==Path("kubectl.sha256").read_text().strip()'
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/guide-pdb-tools" >> "$GITHUB_PATH"
      - name: Compare eviction, deletion, rollout and undo
        run: python3 -B dist/labs/kubernetes-pdb-rollout/pdb_rollout.py --output native-results/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-kubernetes-pdb-rollout
          path: native-results/validation.json
          retention-days: 1

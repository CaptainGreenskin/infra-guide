name: Observe Kueue quota, placement and indexed work
on:
  push:
    branches: [content/runtime-kueue-v85]
    paths:
      - .github/workflows/kueue-admission.yml
      - dist/labs/kueue-admission/kueue_admission.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kueue:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned official Kubernetes tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-kueue-tools"
          cd "$RUNNER_TEMP/guide-kueue-tools"
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind-linux-amd64
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum -o kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          python3 -c 'from pathlib import Path; import hashlib; assert hashlib.sha256(Path("kubectl").read_bytes()).hexdigest()==Path("kubectl.sha256").read_text().strip()'
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/guide-kueue-tools" >> "$GITHUB_PATH"
      - name: Observe Kueue admission, then Pod placement and output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-results
          python3 -B dist/labs/kueue-admission/kueue_admission.py --output native-results/kueue-admission.json | tee native-results/kueue-admission.log
          python3 -B dist/labs/kueue-admission/kueue_admission.py --check-record native-results/kueue-admission.json | tee -a native-results/kueue-admission.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-kueue-admission
          path: |
            native-results/kueue-admission.json
            native-results/kueue-admission.log
          retention-days: 1

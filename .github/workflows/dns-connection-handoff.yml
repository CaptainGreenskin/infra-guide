name: Native DNS and HTTP connection handoff
on:
  push:
    branches: [content/native-dns-connection-20261111]
    paths:
      - dist/labs/dns-connection-handoff/dns_connection_handoff.py
      - dist/labs/dns-cache/dns_cache.py
      - .github/workflows/dns-connection-handoff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Unbound and dig
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y unbound dnsutils
      - name: Observe one DNS address change and three HTTP requests
        run: |
          mkdir -p native-results
          python3 -B dist/labs/dns-connection-handoff/dns_connection_handoff.py \
            --unbound /usr/sbin/unbound --output native-results/linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-dns-connection-handoff
          path: native-results/linux.json
          if-no-files-found: error
          retention-days: 1

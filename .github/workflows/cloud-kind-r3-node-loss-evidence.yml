name: Cloud kind R3 node-loss evidence
on:
  push:
    branches: [evidence/cloud-kind-r3-node-loss]
    paths:
      - dist/labs/kind-r3-node-loss/node_loss_lab.py
      - .github/workflows/cloud-kind-r3-node-loss-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: dist/labs/kind-r3-node-loss
      - name: Install pinned official Kubernetes tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-r3-tools"
          cd "$RUNNER_TEMP/guide-r3-tools"
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind-linux-amd64
          curl --fail --location --retry 3 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum -o kind-linux-amd64.sha256sum
          sha256sum -c kind-linux-amd64.sha256sum
          mv kind-linux-amd64 kind
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl -o kubectl
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          python3 -c 'from pathlib import Path; import hashlib; assert hashlib.sha256(Path("kubectl").read_bytes()).hexdigest()==Path("kubectl.sha256").read_text().strip()'
          chmod +x kind kubectl
          echo "$RUNNER_TEMP/guide-r3-tools" >> "$GITHUB_PATH"
      - name: Stop owned worker A and verify readback through the same NodePort
        run: python3 -B dist/labs/kind-r3-node-loss/node_loss_lab.py --output native-results/kind-r3-node-loss.json
      - uses: actions/upload-artifact@v4
        with:
          name: kind-r3-node-loss
          path: |
            dist/labs/kind-r3-node-loss/node_loss_lab.py
            native-results/kind-r3-node-loss.json
          if-no-files-found: error
          retention-days: 2

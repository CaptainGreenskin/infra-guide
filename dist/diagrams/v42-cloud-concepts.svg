<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">从请求到云资源</title><desc id="desc">实线表示请求与响应，虚线表示运行依赖；云平台提供资源，服务程序负责处理业务。</desc>
<defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315dce"/></marker><marker id="dependency" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#65728a"/></marker><marker id="update" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#287b69"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="720" fill="#fff"/>
<text x="32" y="48" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">从一次访问，认识服务依赖的资源</text>
<text x="32" y="87" font-size="22" fill="#65728a" font-weight="400" text-anchor="start">实线：请求与响应　　虚线：运行依赖　　框内包含关系：平台提供资源</text>
<rect x="40" y="170" width="210" height="118" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="145.0" y="208" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">用户</text>
<text x="145.0" y="243" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">发起访问</text>
<rect x="365" y="170" width="230" height="118" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="480.0" y="208" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">网络传输</text>
<text x="480.0" y="243" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">传递请求与响应</text>
<rect x="710" y="170" width="370" height="118" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="895.0" y="208" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">服务程序</text>
<text x="895.0" y="243" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">由运行中的进程处理业务</text>
<polyline points="250,205 365,205" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="595,205 710,205" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="710,255 595,255" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="365,255 250,255" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<text x="305" y="190" font-size="20" fill="#315dce" font-weight="400" text-anchor="middle">请求</text>
<text x="652" y="280" font-size="20" fill="#315dce" font-weight="400" text-anchor="middle">响应</text>
<polyline points="895,288 895,342" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6"/>
<polyline points="170,342 950,342" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6"/>
<polyline points="170,342 170,420" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#dependency)"/>
<polyline points="430,342 430,420" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#dependency)"/>
<polyline points="690,342 690,420" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#dependency)"/>
<polyline points="950,342 950,420" fill="none" stroke="#65728a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#dependency)"/>
<rect x="24" y="395" width="1072" height="244" rx="10" fill="none" stroke="#a7b9dc" stroke-width="2"/>
<rect x="50" y="420" width="240" height="117" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="170.0" y="458" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">CPU</text>
<text x="170.0" y="493" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">执行指令</text>
<rect x="310" y="420" width="240" height="117" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="430.0" y="458" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">内存</text>
<text x="430.0" y="493" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">暂存运行数据</text>
<rect x="570" y="420" width="240" height="117" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="690.0" y="458" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">存储</text>
<text x="690.0" y="493" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">保留需要留下的数据</text>
<rect x="830" y="420" width="240" height="117" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="950.0" y="458" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">网络资源</text>
<text x="950.0" y="493" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">连接程序与机器</text>
<text x="560" y="590" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">云平台：让这些资源能够按需申请、管理与释放</text>
<text x="32" y="690" font-size="24" fill="#1c283d" font-weight="550" text-anchor="start">资源准备好以后，还要运行程序、开放访问，并验证用户真正得到结果。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="platform-lifecycle-title platform-lifecycle-desc">
<title id="platform-lifecycle-title">平台生命周期：六个阶段，六类验收证据</title>
<desc id="platform-lifecycle-desc">任务依次经过提交、准入、调度、启动、有效进展和结束。每一阶段具有独立证据，失败和取消也需要终态记录与清理。阶段不代表统一平台的固定状态枚举。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="590" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">平台生命周期：六个阶段，六类验收证据</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">这些名称是分析模型，不是任何特定平台的 API 状态枚举。</text>
<rect x="30" y="163" width="130" height="148" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="95.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">01 提交</text><text x="95.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Submitted</text><text x="95.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">接受请求</text><text x="95.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">返回任务标识</text><path d="M160 237 L185 237" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="185" y="163" width="130" height="148" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="250.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">02 准入</text><text x="250.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Admitted</text><text x="250.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">配额 / 队列</text><text x="250.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">获准进入执行</text><path d="M315 237 L340 237" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="163" width="130" height="148" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="405.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">03 调度</text><text x="405.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Scheduled</text><text x="405.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">匹配资源</text><text x="405.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">完成节点分配</text><path d="M470 237 L495 237" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="163" width="130" height="148" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="560.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">04 启动</text><text x="560.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Started</text><text x="560.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">进程 / 设备</text><text x="560.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">通信与依赖就绪</text><path d="M625 237 L650 237" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="163" width="130" height="148" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="715.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">05 进展</text><text x="715.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Progressing</text><text x="715.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">有效样本 / step</text><text x="715.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">结果持续更新</text><path d="M780 237 L805 237" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="805" y="163" width="130" height="148" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="870.0" y="194" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">06 结束</text><text x="870.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Terminal</text><text x="870.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">记录结果</text><text x="870.0" y="268" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">释放资源</text><rect x="30" y="354" width="285" height="108" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="48" y="383" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">管理状态</text><text x="48" y="409" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">提交成功不表示已得到资源</text><text x="48" y="432" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">准入不等于最终调度成功</text><rect x="337" y="354" width="285" height="108" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="355" y="383" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">运行状态</text><text x="355" y="409" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">Pod Running 不证明训练有效</text><text x="355" y="432" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">启动与有效进展分别观测</text><rect x="645" y="354" width="285" height="108" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="663" y="383" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">业务结果</text><text x="663" y="409" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">终态包括成功 / 失败 / 取消</text><text x="663" y="432" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">产物、原因和清理均需记录</text><text x="30" y="508" font-size="15" fill="#203553" text-anchor="start" font-weight="400">主图是成功路径；中间任一阶段也可能失败或取消，必须进入明确终态。</text><text x="30" y="538" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">同一个任务标识关联准入、节点、rank、日志、指标与产物。</text>
<text x="30" y="568" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
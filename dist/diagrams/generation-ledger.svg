<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">一次请求的输入、输出与KV位置数</title><desc id="desc">12-token提示经过预填充产生A，输入A产生B，输入B产生C后停止。每层缓存依次包含12、13、14个已处理位置。</desc><style>text{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="960" height="600" rx="12" fill="#f6f8fc"/><text x="30" y="31" font-size="11" fill="#315dce" font-weight="600">INFRAGUIDE / ONE REQUEST, THREE OUTPUT TOKENS</text><text x="30" y="70" font-size="25" fill="#203553" font-weight="700">生成了一个token，不等于已经处理了它</text><text x="30" y="103" font-size="15" fill="#61748e" font-weight="400">普通自回归循环 · 12个提示token · 每一行结束时观察每层的逻辑KV</text><text x="45" y="145" font-size="15" fill="#61748e" font-weight="600">执行阶段</text><text x="235" y="145" font-size="15" fill="#61748e" font-weight="600">本次模型输入</text><text x="510" y="145" font-size="15" fill="#61748e" font-weight="600">采样输出</text><text x="690" y="145" font-size="15" fill="#61748e" font-weight="600">结束后的KV位置数</text><rect x="30" y="165" width="900" height="76" rx="7" fill="#fff" stroke="#d7e1ef"/><text x="45" y="198" font-size="18" fill="#203553" font-weight="600">Prefill</text><text x="235" y="198" font-size="17" fill="#203553" font-weight="400">12个提示token</text><text x="510" y="199" font-size="24" fill="#315dce" font-weight="600">A</text><text x="690" y="195" font-size="24" fill="#315dce" font-weight="600">12</text><text x="690" y="221" font-size="13" fill="#61748e" font-weight="400">提示已处理；A还没作为输入</text><rect x="30" y="256" width="900" height="76" rx="7" fill="#fff" stroke="#d7e1ef"/><text x="45" y="289" font-size="18" fill="#203553" font-weight="600">Decode 1</text><text x="235" y="289" font-size="17" fill="#203553" font-weight="400">A</text><text x="510" y="290" font-size="24" fill="#315dce" font-weight="600">B</text><text x="690" y="286" font-size="24" fill="#315dce" font-weight="600">13</text><text x="690" y="312" font-size="13" fill="#61748e" font-weight="400">A已处理；B还没作为输入</text><rect x="30" y="347" width="900" height="76" rx="7" fill="#fff" stroke="#d7e1ef"/><text x="45" y="380" font-size="18" fill="#203553" font-weight="600">Decode 2</text><text x="235" y="380" font-size="17" fill="#203553" font-weight="400">B</text><text x="510" y="381" font-size="24" fill="#315dce" font-weight="600">C</text><text x="690" y="377" font-size="24" fill="#315dce" font-weight="600">14</text><text x="690" y="403" font-size="13" fill="#61748e" font-weight="400">B已处理；C还没作为输入</text><rect x="30" y="458" width="900" height="81" rx="7" fill="#edf2fe" stroke="#d7e1ef"/><text x="48" y="489" font-size="18" fill="#315dce" font-weight="600">到此停止：保留12个提示 + A + B；C是刚产生的输出。</text><text x="48" y="518" font-size="15" fill="#61748e" font-weight="400">若继续，下一步才会输入C。物理缓存预留、裁剪、推测解码不在这张简化账本内。</text><text x="30" y="572" font-size="13" fill="#61748e" font-weight="400">原创逻辑示意 · 字母仅表示输出标签 · 图中大小不表示时间、显存或真实模型行为</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 625" role="img" aria-labelledby="title desc"><title id="title">快照、日志与恢复范围：逐项对账</title><desc id="desc">快照和恢复日志覆盖到108，权威提交已到110，最后两项无法由现有材料证明恢复。</desc><defs></defs><rect width="960" height="625" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="46" font-size="26" fill="#24344d" text-anchor="start" font-weight="700">快照、日志与恢复范围：逐项对账</text><text x="30" y="90" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">教学序号：100 为快照点，101–110 为之后已确认的业务提交</text><text x="30" y="180" font-size="18" fill="#24344d" text-anchor="start" font-weight="600">权威提交</text><rect x="175" y="150" width="70" height="52" rx="6" fill="#e8eefc" stroke="none"/><text x="210" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">100</text><rect x="262" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="289.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">101</text><rect x="326" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="353.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">102</text><rect x="390" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="417.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">103</text><rect x="454" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="481.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">104</text><rect x="518" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="545.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">105</text><rect x="582" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="609.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">106</text><rect x="646" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="673.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">107</text><rect x="710" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="737.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">108</text><rect x="774" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="801.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">109</text><rect x="838" y="150" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="865.5" y="183" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">110</text><text x="178" y="227" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照</text><text x="450" y="227" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照之后需要日志、版本或等价恢复材料</text><text x="30" y="275" font-size="18" fill="#24344d" text-anchor="start" font-weight="600">恢复材料</text><rect x="175" y="245" width="70" height="52" rx="6" fill="#e8eefc" stroke="none"/><text x="210" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">100</text><rect x="262" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="289.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">101</text><rect x="326" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="353.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">102</text><rect x="390" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="417.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">103</text><rect x="454" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="481.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">104</text><rect x="518" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="545.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">105</text><rect x="582" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="609.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">106</text><rect x="646" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="673.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">107</text><rect x="710" y="245" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="737.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">108</text><rect x="774" y="245" width="55" height="52" rx="6" fill="#ffebd7" stroke="#e0b58d"/><text x="801.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">109</text><rect x="838" y="245" width="55" height="52" rx="6" fill="#ffebd7" stroke="#e0b58d"/><text x="865.5" y="278" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">110</text><text x="178" y="322" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照</text><text x="450" y="322" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照之后需要日志、版本或等价恢复材料</text><text x="30" y="370" font-size="18" fill="#24344d" text-anchor="start" font-weight="600">恢复结果</text><rect x="175" y="340" width="70" height="52" rx="6" fill="#e8eefc" stroke="none"/><text x="210" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">100</text><rect x="262" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="289.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">101</text><rect x="326" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="353.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">102</text><rect x="390" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="417.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">103</text><rect x="454" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="481.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">104</text><rect x="518" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="545.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">105</text><rect x="582" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="609.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">106</text><rect x="646" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="673.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">107</text><rect x="710" y="340" width="55" height="52" rx="6" fill="#d7eee9" stroke="#b8d6cf"/><text x="737.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">108</text><rect x="774" y="340" width="55" height="52" rx="6" fill="#ffebd7" stroke="#e0b58d"/><text x="801.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">109</text><rect x="838" y="340" width="55" height="52" rx="6" fill="#ffebd7" stroke="#e0b58d"/><text x="865.5" y="373" font-size="18" fill="#24344d" text-anchor="middle" font-weight="400">110</text><text x="178" y="417" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照</text><text x="450" y="417" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">快照之后需要日志、版本或等价恢复材料</text><text x="30" y="480" font-size="23" fill="#24344d" text-anchor="start" font-weight="600">复制 / 备份存在 ≠ 所有已确认结果都能恢复</text><text x="30" y="523" font-size="18" fill="#24344d" text-anchor="start" font-weight="400">材料只到 108 时，109、110 仍是已确认却未恢复的提交。</text><text x="30" y="559" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">RPO 需结合确认时间与恢复点定义，不能把序号差直接当秒数。</text><text x="30" y="594" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">这里只比较恢复范围；不模拟数据库日志格式、断电持久性或恢复耗时。</text></g></svg>
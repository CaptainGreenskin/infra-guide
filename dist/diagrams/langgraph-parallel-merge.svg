<svg xmlns="http://www.w3.org/2000/svg" width="460" height="550" viewBox="0 0 460 550" role="img" aria-labelledby="title desc">
  <title id="title">并行候选归并与发布重放</title>
  <desc id="desc">两个分支为同一操作提交候选。相同的正文归成一版，有冲突的正文保留两版供复核。重放发布使用原业务操作 ID，两次请求只提交一份效果。</desc>
  <metadata>{"operation":"report-A:publish","same":[42,42],"conflict":[42,41],"same_origins":["draft_a","draft_b"],"conflict_requests":0,"replay_next":["publish"],"requests":["committed","duplicate"],"effects":1}</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3e607a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="458" height="548" rx="16" fill="#fbfdff" stroke="#c7d5e2" stroke-width="2"/>
  <g font-family="system-ui, 'PingFang SC', 'Noto Sans SC', sans-serif" fill="#16334b">
    <text x="24" y="35" font-size="22" font-weight="700">同一操作，两条并行分支</text>
    <text x="24" y="61" font-size="15" fill="#425b70">业务操作 ID  report-A:publish</text>

    <rect x="24" y="83" width="192" height="62" rx="9" fill="#eaf4ff" stroke="#7aaccf"/>
    <rect x="244" y="83" width="192" height="62" rx="9" fill="#eaf4ff" stroke="#7aaccf"/>
    <text x="41" y="109" font-size="17" font-weight="700">分支 A</text>
    <text x="41" y="133" font-size="15">提出金额 42</text>
    <text x="261" y="109" font-size="17" font-weight="700">分支 B</text>
    <text x="261" y="133" font-size="15">提出金额 42 或 41</text>

    <g fill="none" stroke="#3e607a" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M120 145v16l64 19"/>
      <path d="M340 145v16l-64 19"/>
      <path d="M170 225l-51 25v9"/>
      <path d="M290 225l51 25v9"/>
      <path d="M120 354v24"/>
    </g>
    <rect x="111" y="182" width="238" height="43" rx="8" fill="#f0f5fa" stroke="#a3b6c7"/>
    <text x="230" y="209" text-anchor="middle" font-size="16" font-weight="700">按操作与正文归并来源</text>

    <rect x="24" y="261" width="192" height="93" rx="9" fill="#e7f6f1" stroke="#72aa99"/>
    <text x="41" y="288" font-size="17" font-weight="700">42 ＋ 42</text>
    <text x="41" y="312" font-size="15">保留一版金额 42</text>
    <text x="41" y="335" font-size="15">来源 A、B → 可发布</text>
    <rect x="244" y="261" width="192" height="93" rx="9" fill="#fff3dd" stroke="#c5a16a"/>
    <text x="261" y="288" font-size="17" font-weight="700">42 与 41</text>
    <text x="261" y="312" font-size="15">保留两版与各自来源</text>
    <text x="261" y="335" font-size="15">待复核 → 零发布请求</text>

    <rect x="24" y="380" width="412" height="145" rx="10" fill="#f0f5fa" stroke="#a3b6c7"/>
    <text x="42" y="411" font-size="17" font-weight="700">从发布前检查点重放</text>
    <text x="42" y="443" font-size="15">第 1 次发布  →  提交效果与回执</text>
    <text x="42" y="469" font-size="15">第 2 次发布  →  查回同一个回执</text>
    <text x="42" y="500" font-size="16" font-weight="700" fill="#145646">接收方实际效果 1 份</text>
  </g>
</svg>

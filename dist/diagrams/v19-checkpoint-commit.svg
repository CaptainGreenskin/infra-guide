<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">检查点的提交：先准备同一步，再发布给读者</title><desc id="desc">文件摘要、状态一致、提交可见与恢复等价，是四项不同检查。</desc>
<rect width="1120" height="650" fill="#f8fafd"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#71819b" stroke-width="1.4"/></marker></defs>
<g font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif">
<text x="40" y="46" font-size="25" fill="#1c283d" font-weight="700">检查点的提交：先准备同一步，再发布给读者</text>
<text x="40" y="80" font-size="15" fill="#617086" font-weight="400">文件摘要、状态一致、提交可见与恢复等价，是四项不同检查。</text>
<rect x="40" y="125" width="260" height="116" rx="8" fill="#edf2fe" stroke="#dbe3ee"/>
<text x="58" y="160" font-size="19" fill="#315dce" font-weight="600">旧恢复点：step 0</text>
<text x="58" y="190" font-size="16" fill="#617086" font-weight="400">CURRENT仍指向step 0</text>
<text x="58" y="216" font-size="16" fill="#617086" font-weight="400">半成品不改变旧提交</text>
<rect x="365" y="125" width="330" height="116" rx="8" fill="#edf2fe" stroke="#dbe3ee"/>
<text x="383" y="160" font-size="19" fill="#315dce" font-weight="600">准备新状态：step 3</text>
<text x="383" y="190" font-size="16" fill="#617086" font-weight="400">model / optimizer / input</text>
<text x="383" y="216" font-size="16" fill="#617086" font-weight="400">共享run、step与配置</text>
<rect x="760" y="125" width="320" height="116" rx="8" fill="#edf2fe" stroke="#dbe3ee"/>
<text x="778" y="160" font-size="19" fill="#315dce" font-weight="600">核对完整清单</text>
<text x="778" y="190" font-size="16" fill="#617086" font-weight="400">文件长度与SHA256</text>
<text x="778" y="216" font-size="16" fill="#617086" font-weight="400">各状态属于同一边界</text>
<path d="M307 182L356 182" fill="none" stroke="#71819b" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M702 182L751 182" fill="none" stroke="#71819b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="500" height="130" rx="8" fill="#fff6e9" stroke="#ead4b7"/>
<text x="60" y="327" font-size="20" fill="#9c5b16" font-weight="600">拒绝：混入step 4的optimizer</text>
<text x="60" y="359" font-size="16" fill="#1c283d" font-weight="400">即使这个文件的摘要正确，也不是step 3。</text>
<text x="60" y="390" font-size="16" fill="#617086" font-weight="400">发布失败，CURRENT保留旧值。</text>
<rect x="580" y="290" width="500" height="130" rx="8" fill="#edf7f3" stroke="#cce2d9"/>
<text x="600" y="327" font-size="20" fill="#287b69" font-weight="600">通过：三份状态全部为step 3</text>
<text x="600" y="359" font-size="16" fill="#1c283d" font-weight="400">校验完整后，才更新CURRENT。</text>
<text x="600" y="390" font-size="16" fill="#617086" font-weight="400">本地同目录替换；掉电持久性另行验证。</text>
<rect x="40" y="467" width="1040" height="139" rx="8" fill="#fff" stroke="#dbe3ee"/>
<text x="60" y="504" font-size="21" fill="#1c283d" font-weight="600">读取者：CURRENT → 清单 → 验证 → 加载整套状态</text>
<text x="60" y="539" font-size="17" fill="#617086" font-weight="400">不按目录时间挑文件，也不拼接“各自最新”的文件。</text>
<text x="60" y="574" font-size="16" fill="#287b69" font-weight="400">最终对照：连续6步 ＝ 3步＋保存加载＋3步；逐项比较参数、动量、游标与随机状态。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">弹性先补容量，再消化已经积累的工作</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315dce"/></marker></defs><rect width="960" height="540" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="30" y="44" font-size="24" fill="#24344d" text-anchor="start" font-weight="700">弹性先补容量，再消化已经积累的工作</text><text x="30" y="85" font-size="15" fill="#24344d" text-anchor="start" font-weight="400">假设固定区间：到达 180 次/秒，旧容量 120，新容量就绪后 240</text><rect x="80" y="125" width="400" height="165" fill="#fff2e5"/><rect x="480" y="125" width="400" height="165" fill="#eaf6ef"/><text x="280" y="164" font-size="22" fill="#9a5c22" text-anchor="middle" font-weight="600">扩容等待 75 秒</text><text x="280" y="204" font-size="19" fill="#24344d" text-anchor="middle" font-weight="400">每秒积压 +60</text><text x="280" y="242" font-size="19" fill="#24344d" text-anchor="middle" font-weight="400">累计 4500 次</text><text x="680" y="164" font-size="22" fill="#1b6c4b" text-anchor="middle" font-weight="600">新容量可用</text><text x="680" y="204" font-size="19" fill="#24344d" text-anchor="middle" font-weight="400">每秒净排空 60</text><text x="680" y="242" font-size="19" fill="#24344d" text-anchor="middle" font-weight="400">再需至少 75 秒</text><path d="M80 319 L890 319" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="80" y="347" font-size="14" fill="#24344d" text-anchor="middle" font-weight="400">0 秒</text><text x="480" y="347" font-size="14" fill="#24344d" text-anchor="middle" font-weight="400">75 秒</text><text x="880" y="347" font-size="14" fill="#24344d" text-anchor="middle" font-weight="400">150 秒</text><path d="M80 440 L480 390 L880 440" fill="none" stroke="#315dce" stroke-width="3"/><text x="480" y="469" font-size="15" fill="#24344d" text-anchor="middle" font-weight="400">积压数量：0 → 4500 → 0（示意，非实测）</text><text x="30" y="512" font-size="17" fill="#24344d" text-anchor="start" font-weight="600">如果新容量仅等于到达率 180，积压停止增加，但不会自行清空。</text></g></svg>
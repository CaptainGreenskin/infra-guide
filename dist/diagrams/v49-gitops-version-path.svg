22" fill="#24344d" font-weight="400" text-anchor="start">只改配置</text><text x="358" y="265" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">配置：v2</text><text x="358" y="310" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">同一个UID</text><text x="358" y="365" font-size="24" fill="#a34242" font-weight="600" text-anchor="start">HTTP：v1</text><path d="M620 270L640 270" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="644" y="130" width="280" height="285" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="664" y="170" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">703f38b</text><text x="664" y="210" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">再改模板</text><text x="664" y="265" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">配置：v2</text><text x="664" y="310" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">新UID</text><text x="664" y="365" font-size="24" fill="#236e5e" font-weight="600" text-anchor="start">HTTP：v2</text><text x="32" y="475" font-size="20" fill="#60708b" font-weight="400" text-anchor="start">第二步：声明相符仍未生效。第三步：新进程读取v2，用户断言才通过。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>任务成功，首次HTTP错误也不该被抹掉</title><desc>实际OpenTelemetry SDK 1.44.0通过HTTP注入与提取父上下文，在内存中导出五个跨度。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">任务成功，首次HTTP错误也不该被抹掉</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">实际OpenTelemetry SDK 1.44.0通过HTTP注入与提取父上下文，在内存中导出五个跨度。</text><rect x="36" y="129" width="1048" height="77" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="162" font-size="24" fill="#315dce" font-weight="700">agent.task / task R27</text><text x="58" y="192" font-size="20" fill="#17263e" font-weight="400">根跨度在产物验收后OK；首次尝试的ERROR仍保留。</text><path d="M378 211 L286 258" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M744 211 L834 258" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="269" width="500" height="101" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="56" y="305" font-size="22" fill="#315dce" font-weight="700">tool.attempt 1 / CLIENT</text><text x="56" y="347" font-size="20" fill="#17263e" font-weight="400">HTTP 503 → 结果未知 / ERROR</text><rect x="584" y="269" width="500" height="101" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="604" y="305" font-size="22" fill="#315dce" font-weight="700">tool.attempt 2 / CLIENT</text><text x="604" y="347" font-size="20" fill="#17263e" font-weight="400">同op_id重试 → 收到原回执</text><path d="M286 375 L286 415" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M834 375 L834 415" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="425" width="500" height="102" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="56" y="460" font-size="22" fill="#12725b" font-weight="700">tool.execute / SERVER</text><text x="56" y="500" font-size="21" fill="#17263e" font-weight="400">先提交效果，再注入503</text><rect x="584" y="425" width="500" height="102" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="604" y="460" font-size="22" fill="#12725b" font-weight="700">tool.execute / SERVER</text><text x="604" y="500" font-size="21" fill="#17263e" font-weight="400">查原回执，duplicate=true</text><rect x="36" y="574" width="1048" height="92" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="610" font-size="23" fill="#315dce" font-weight="700">W3C traceparent：同trace_id，不同attempt的span_id</text><text x="58" y="646" font-size="22" fill="#17263e" font-weight="400">5个真实span / 2次HTTP尝试 / 1笔SQLite效果 / 1个验收合格任务</text><text x="38" y="707" font-size="18" fill="#56667d" font-weight="400">树表示父子关联，不是耗时比例。traceparent只传关联，不能代替业务授权；未运行Collector或LLM。</text></g></svg>

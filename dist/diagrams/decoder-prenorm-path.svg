<svg xmlns="http://www.w3.org/2000/svg" width="920" height="409" viewBox="0 0 920 409" role="img" aria-labelledby="title desc">
<title id="title">一层 Decoder Block 的两次回加</title>
<desc id="desc">X 直接进入第一次加法，同时经 N1 和 Attention 得到修正。H1 再经 N2 和 FFN 修正后加回，得到 H2。主路径形状始终为二、四、八。</desc>
<metadata>{"main":["X","H1","H2"],"shape":[2,4,8],"attention_branch":["N1","Attention"],"ffn_branch":["N2","FFN"],"ffn_width":12}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="407" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">一层 Decoder Block 的两次回加</text>
<text x="32" y="78" font-size="17" fill="#506584" font-weight="500" text-anchor="start">主路径保留原表示。每个分支先归一化，计算出的修正再加回主路径。</text><rect x="128" y="123" width="101" height="49" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="178.5" y="153.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">N₁</text><rect x="259" y="123" width="132" height="49" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="325.0" y="153.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">Attention</text><rect x="538" y="123" width="101" height="49" rx="9" fill="#e4f5ef" stroke="#ccdaed"/><text x="588.5" y="153.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">N₂</text><rect x="669" y="123" width="127" height="49" rx="9" fill="#e4f5ef" stroke="#ccdaed"/><text x="732.5" y="153.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">FFN</text><path d="M103 261V147h22" fill="none" stroke="#315fb5" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M231 147h25" fill="none" stroke="#315fb5" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M325 174v41h58v46" fill="none" stroke="#315fb5" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M485 261V147h50" fill="none" stroke="#087767" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M641 147h25" fill="none" stroke="#087767" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M736 174v87" fill="none" stroke="#087767" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="63" y="262" width="80" height="51" rx="9" fill="#ffffff" stroke="#ccdaed"/><text x="103.0" y="293.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">X</text><text x="103" y="342" font-size="16" fill="#506584" font-weight="500" text-anchor="middle">[2, 4, 8]</text><rect x="445" y="262" width="80" height="51" rx="9" fill="#ffffff" stroke="#ccdaed"/><text x="485.0" y="293.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">H₁</text><text x="485" y="342" font-size="16" fill="#506584" font-weight="500" text-anchor="middle">[2, 4, 8]</text><rect x="805" y="262" width="80" height="51" rx="9" fill="#ffffff" stroke="#ccdaed"/><text x="845.0" y="293.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">H₂</text><text x="845" y="342" font-size="16" fill="#506584" font-weight="500" text-anchor="middle">[2, 4, 8]</text><circle cx="383" cy="287" r="23" fill="#ffffff" stroke="#ccdaed"/><text x="383" y="295" font-size="26" fill="#172743" font-weight="650" text-anchor="middle">+</text><circle cx="736" cy="287" r="23" fill="#ffffff" stroke="#ccdaed"/><text x="736" y="295" font-size="26" fill="#172743" font-weight="650" text-anchor="middle">+</text><path d="M144 287H356" fill="none" stroke="#172743" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M407 287H442" fill="none" stroke="#172743" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M526 287H710" fill="none" stroke="#172743" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M760 287H802" fill="none" stroke="#172743" stroke-width="2.8" marker-end="url(#arrow)"/><text x="32" y="385" font-size="17" fill="#172743" font-weight="600" text-anchor="start">FFN 内部可扩到 12 个特征，回加前恢复到 8 个特征。</text>
</g>
</svg>

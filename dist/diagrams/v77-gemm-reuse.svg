<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="gemm-reuse-title gemm-reuse-desc">
  <title id="gemm-reuse-title">同一块 GEMM 输出，复用一份 B</title>
  <desc id="gemm-reuse-desc">计算 32 乘 16 个输出，K 轴取连续 16 项。分块版用两个线程块，每个读一份 16 乘 16 的 A 和同一份 16 乘 16 的 B，合计装载 1024 个 FP32 值。复用版在一个线程块读 A 的两半和一份 B，B 同时供给两套输出累加器，合计装载 768 个 FP32 值。数字按源代码计算，实际显存流量需要采集。</desc>
  <defs>
    <marker id="gemm-reuse-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#536783"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="438" height="518" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#20314e">
    <text x="24" y="34" font-size="23" font-weight="bold">同一块输出，少搬一份 B</text>
    <text x="24" y="59" fill="#536783">32×16 输出，K 轴取 16 项</text>

    <g id="tiled" data-source-fp32-loads="1024">
      <rect x="16" y="75" width="408" height="195" rx="7" fill="#fff" stroke="#cbd5e1"/>
      <text x="26" y="101" font-size="18" font-weight="bold">分块版 · 两个线程块（CTA）</text>
      <g id="tiled-cta-0">
        <rect x="25" y="114" width="186" height="119" rx="5" fill="#f8fafc" stroke="#9baac1"/>
        <text x="35" y="135" font-size="15" font-weight="bold">CTA 0</text>
        <rect x="34" y="142" width="78" height="43" rx="4" fill="#dbf2eb" stroke="#7dbea9"/>
        <rect x="124" y="142" width="78" height="43" rx="4" fill="#fff0cf" stroke="#d6ab53"/>
        <g text-anchor="middle" font-size="15">
          <text x="73" y="160" fill="#205d4c">A 上半</text><text x="73" y="178" fill="#205d4c">16×16</text>
          <text x="163" y="160" fill="#775014">B 同块</text><text x="163" y="178" fill="#775014">16×16</text>
        </g>
        <rect x="34" y="200" width="168" height="25" rx="4" fill="#e2ecff" stroke="#8da9e5"/>
        <text x="118" y="219" text-anchor="middle" font-size="16" fill="#244d9b">C 上半累加</text>
      </g>
      <g id="tiled-cta-1">
        <rect x="229" y="114" width="186" height="119" rx="5" fill="#f8fafc" stroke="#9baac1"/>
        <text x="239" y="135" font-size="15" font-weight="bold">CTA 1</text>
        <rect x="238" y="142" width="78" height="43" rx="4" fill="#dbf2eb" stroke="#7dbea9"/>
        <rect x="328" y="142" width="78" height="43" rx="4" fill="#fff0cf" stroke="#d6ab53"/>
        <g text-anchor="middle" font-size="15">
          <text x="277" y="160" fill="#205d4c">A 下半</text><text x="277" y="178" fill="#205d4c">16×16</text>
          <text x="367" y="160" fill="#775014">B 同块</text><text x="367" y="178" fill="#775014">16×16</text>
        </g>
        <rect x="238" y="200" width="168" height="25" rx="4" fill="#e2ecff" stroke="#8da9e5"/>
        <text x="322" y="219" text-anchor="middle" font-size="16" fill="#244d9b">C 下半累加</text>
      </g>
      <g fill="none" stroke="#536783" stroke-width="1.5" marker-end="url(#gemm-reuse-arrow)">
        <path d="M73 186v12"/><path d="M163 186v12"/><path d="M277 186v12"/><path d="M367 186v12"/>
      </g>
      <text x="26" y="256" font-weight="bold">A 512 + B 512 = 1,024 个 FP32 值</text>
    </g>

    <g id="reuse" data-source-fp32-loads="768">
      <rect x="16" y="283" width="408" height="193" rx="7" fill="#fff" stroke="#cbd5e1"/>
      <text x="26" y="309" font-size="18" font-weight="bold">复用版 · 一个线程块</text>
      <g id="reuse-cta-0">
        <rect x="25" y="321" width="390" height="120" rx="5" fill="#f8fafc" stroke="#9baac1"/>
        <text x="35" y="342" font-size="15" font-weight="bold">CTA 0 · 每线程两条累加链</text>
        <rect x="34" y="349" width="110" height="40" rx="4" fill="#dbf2eb" stroke="#7dbea9"/>
        <rect x="165" y="349" width="110" height="40" rx="4" fill="#fff0cf" stroke="#d6ab53"/>
        <rect x="296" y="349" width="110" height="40" rx="4" fill="#dbf2eb" stroke="#7dbea9"/>
        <g text-anchor="middle" font-size="15">
          <text x="89" y="365" fill="#205d4c">A 上半</text><text x="89" y="383" fill="#205d4c">16×16</text>
          <text x="220" y="365" fill="#775014">B 装载一次</text><text x="220" y="383" fill="#775014">16×16</text>
          <text x="351" y="365" fill="#205d4c">A 下半</text><text x="351" y="383" fill="#205d4c">16×16</text>
        </g>
        <g fill="none" stroke="#536783" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#gemm-reuse-arrow)">
          <path d="M89 390v16"/><path d="M351 390v16"/>
          <path d="M220 390v7h-61v9"/><path d="M220 390v7h61v9"/>
        </g>
        <rect x="34" y="408" width="166" height="25" rx="4" fill="#e2ecff" stroke="#8da9e5"/>
        <rect x="240" y="408" width="166" height="25" rx="4" fill="#e2ecff" stroke="#8da9e5"/>
        <text x="117" y="427" text-anchor="middle" font-size="16" fill="#244d9b">C 上半累加</text>
        <text x="323" y="427" text-anchor="middle" font-size="16" fill="#244d9b">C 下半累加</text>
      </g>
      <text x="26" y="463" font-weight="bold">A 512 + B 256 = 768 个 FP32 值</text>
    </g>
    <text x="24" y="503" font-size="16" fill="#536783">按源码数装载次数，显存流量需另测。</text>
  </g>
</svg>

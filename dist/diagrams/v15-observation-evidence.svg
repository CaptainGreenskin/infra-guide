<svg xmlns="http://www.w3.org/2000/svg" width="960" height="763" viewBox="0 0 960 763" role="img" aria-labelledby="title desc">
<title id="title">指标、轨迹和日志怎样解释一条慢请求</title><desc id="desc">同一路由的总体指标确定范围。一条合成请求依次经过十、二十、一百八十、六十和三十毫秒，共三百毫秒，最长是等待连接。日志显示请求与取得连接的时刻。抽样轨迹不能充当全量请求。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2759a5"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="960" height="763" rx="16" fill="#f6f9fb" stroke="none"/>
<text x="36" y="40" fill="#2759a5" font-size="18" font-weight="700" text-anchor="start">SRE  /  证据关联</text>
<text x="36" y="84" fill="#20324a" font-size="30" font-weight="700" text-anchor="start">一次 300 ms 的慢查询，三种证据各回答什么？</text>
<text x="36" y="117" fill="#50647a" font-size="19" font-weight="400" text-anchor="start">全部数字来自合成请求。阶段串行、没有重叠，使用同一教学时钟。</text>
<rect x="36" y="151" width="888" height="78" rx="12" fill="#e8f0fc" stroke="none"/>
<text x="54" y="181" fill="#2759a5" font-size="21" font-weight="700" text-anchor="start">① 指标｜有多广？</text>
<text x="54" y="209" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">先看同一路由在 15 分钟窗口的请求数、失败率和延迟分布。单个样本不能代表 p99。</text>
<text x="36" y="268" fill="#08776d" font-size="23" font-weight="700" text-anchor="start">② 轨迹｜时间花在哪里？</text>
<text x="910" y="269" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">单位：ms</text>
<text x="270" y="303" fill="#50647a" font-size="18" font-weight="400" text-anchor="middle">0</text>
<path d="M270 312 V539" fill="none" stroke="#c7d4df" stroke-width="2" stroke-dasharray="6 5" />
<text x="478" y="303" fill="#50647a" font-size="18" font-weight="400" text-anchor="middle">100</text>
<path d="M478 312 V539" fill="none" stroke="#c7d4df" stroke-width="2" stroke-dasharray="6 5" />
<text x="686" y="303" fill="#50647a" font-size="18" font-weight="400" text-anchor="middle">200</text>
<path d="M686 312 V539" fill="none" stroke="#c7d4df" stroke-width="2" stroke-dasharray="6 5" />
<text x="894" y="303" fill="#50647a" font-size="18" font-weight="400" text-anchor="middle">300</text>
<path d="M894 312 V539" fill="none" stroke="#c7d4df" stroke-width="2" stroke-dasharray="6 5" />
<text x="54" y="346" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">入口</text>
<text x="242" y="346" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">10 ms</text>
<rect x="270" y="326" width="20.8" height="23" rx="3" fill="#2759a5" stroke="none"/>
<text x="54" y="388" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">校验</text>
<text x="242" y="388" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">20 ms</text>
<rect x="290.8" y="368" width="41.6" height="23" rx="3" fill="#2759a5" stroke="none"/>
<text x="54" y="430" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">等待连接</text>
<text x="242" y="430" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">180 ms</text>
<rect x="332.4" y="410" width="374.40000000000003" height="23" rx="3" fill="#9e4a16" stroke="none"/>
<text x="519.6" y="429" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">30 → 210</text>
<text x="54" y="472" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">数据库执行</text>
<text x="242" y="472" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">60 ms</text>
<rect x="706.8" y="452" width="124.80000000000001" height="23" rx="3" fill="#08776d" stroke="none"/>
<text x="54" y="514" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">返回响应</text>
<text x="242" y="514" fill="#50647a" font-size="18" font-weight="400" text-anchor="end">30 ms</text>
<rect x="831.6" y="494" width="62.400000000000006" height="23" rx="3" fill="#2759a5" stroke="none"/>
<text x="36" y="571" fill="#20324a" font-size="19" font-weight="700" text-anchor="start">根跨度 0–300：10 + 20 + 180 + 60 + 30 = 300 ms。连接等待占 60%。</text>
<rect x="36" y="594" width="888" height="99" rx="12" fill="#e1f2ec" stroke="none"/>
<text x="54" y="626" fill="#08776d" font-size="21" font-weight="700" text-anchor="start">③ 日志｜发生了什么？</text>
<text x="54" y="663" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">t=30 请求连接；t=210 获得；t=270 查询结束。按 trace_id 关联，再核对池占用。</text>
<text x="36" y="733" fill="#50647a" font-size="18" font-weight="400" text-anchor="start">被保留的轨迹用于解释样本。头部或尾部采样、遗漏传播与导出失败都会影响它的覆盖范围。</text>
</svg>

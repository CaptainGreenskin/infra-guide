<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="title desc">
<title id="title">矩阵乘法的行主序与访问路径</title><desc id="desc">2×3乘3×4；同一C00为2.375，ijk读取B列跨4元素，ikj访问B行连续4元素。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="640" fill="white"/>
<text x="32" y="48" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">先算同一个输出，再比较访问顺序</text>
<text x="32" y="89" font-size="22" fill="#66738a" font-weight="400" text-anchor="start">A[2,3] × B[3,4] → C[2,4]；连续行主序，每元素8字节。</text>
<text x="32" y="145" font-size="25" fill="#315dce" font-weight="600" text-anchor="start">B的行列与线性偏移</text>
<rect x="32" y="173" width="132" height="80" rx="5" fill="#eaf0ff" stroke="#dce3ed"/>
<text x="98" y="203" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[0,0] → 0</text>
<text x="98" y="235" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">-1.5</text>
<rect x="182" y="173" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="248" y="203" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[0,1] → 1</text>
<text x="248" y="235" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">0</text>
<rect x="332" y="173" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="398" y="203" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[0,2] → 2</text>
<text x="398" y="235" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">1.5</text>
<rect x="482" y="173" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="548" y="203" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[0,3] → 3</text>
<text x="548" y="235" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">-0.5</text>
<rect x="32" y="271" width="132" height="80" rx="5" fill="#eaf0ff" stroke="#dce3ed"/>
<text x="98" y="301" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[1,0] → 4</text>
<text x="98" y="333" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">1</text>
<rect x="182" y="271" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="248" y="301" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[1,1] → 5</text>
<text x="248" y="333" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">-1</text>
<rect x="332" y="271" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="398" y="301" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[1,2] → 6</text>
<text x="398" y="333" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">0.5</text>
<rect x="482" y="271" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="548" y="301" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[1,3] → 7</text>
<text x="548" y="333" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">-1.5</text>
<rect x="32" y="369" width="132" height="80" rx="5" fill="#eaf0ff" stroke="#dce3ed"/>
<text x="98" y="399" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[2,0] → 8</text>
<text x="98" y="431" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">0</text>
<rect x="182" y="369" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="248" y="399" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[2,1] → 9</text>
<text x="248" y="431" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">1.5</text>
<rect x="332" y="369" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="398" y="399" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[2,2] → 10</text>
<text x="398" y="431" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">-0.5</text>
<rect x="482" y="369" width="132" height="80" rx="5" fill="#f3f5fa" stroke="#dce3ed"/>
<text x="548" y="399" font-size="19" fill="#66738a" font-weight="400" text-anchor="middle">[2,3] → 11</text>
<text x="548" y="431" font-size="25" fill="#1c283d" font-weight="550" text-anchor="middle">1</text>
<text x="690" y="207" font-size="22" fill="#315dce" font-weight="550" text-anchor="start">ijk：B[0,0] → B[1,0] → B[2,0]</text>
<text x="690" y="248" font-size="23" fill="#1c283d" font-weight="400" text-anchor="start">每次跨4元素，即32字节。</text>
<text x="690" y="313" font-size="23" fill="#287b69" font-weight="550" text-anchor="start">ikj：固定t，连续遍历j</text>
<text x="690" y="354" font-size="23" fill="#1c283d" font-weight="400" text-anchor="start">B[t,0] → B[t,1] → …</text>
<text x="690" y="395" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">A[i,t]可用于这一行的多个输出。</text>
<rect x="32" y="492" width="1056" height="95" rx="5" fill="#edf6f2" stroke="#dce3ed"/>
<text x="52" y="531" font-size="26" fill="#287b69" font-weight="550" text-anchor="start">C[0,0] = (−1.25)×(−1.5) + 0.5×1 + (−0.5)×0 = 2.375</text>
<text x="52" y="566" font-size="22" fill="#66738a" font-weight="400" text-anchor="start">尾块另验：5×7乘7×3，tile=4；图不表示缓存命中或硬件流量。</text>

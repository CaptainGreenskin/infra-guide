<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="692" viewBox="0 0 1120 692" role="img"><title>Agent执行：谁提议，谁批准，谁证明完成</title><desc>真实HTTP实验采用固定提议脚本；图中模型为系统职责示意，不代表本实验调用了LLM。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="690" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">Agent执行：谁提议，谁批准，谁证明完成</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">真实HTTP实验采用固定提议脚本；图中模型为系统职责示意，不代表本实验调用了LLM。</text><rect x="36" y="145" width="235" height="208" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="54" y="183" font-size="23" fill="#315dce" font-weight="700">模型提议</text><text x="54" y="227" font-size="17" fill="#17263e" font-weight="400">选择工具名与参数</text><text x="54" y="265" font-size="17" fill="#17263e" font-weight="400">或提出“已经完成”</text><text x="54" y="303" font-size="17" fill="#17263e" font-weight="400">外部文字只是数据</text><rect x="307" y="145" width="235" height="208" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="325" y="183" font-size="23" fill="#315dce" font-weight="700">执行层</text><text x="325" y="227" font-size="17" fill="#17263e" font-weight="400">工具白名单 + 类型检查</text><text x="325" y="265" font-size="17" fill="#17263e" font-weight="400">提议/实际尝试分别计数</text><text x="325" y="303" font-size="17" fill="#17263e" font-weight="400">校验结果后才加入观察</text><rect x="578" y="145" width="235" height="208" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="596" y="183" font-size="23" fill="#315dce" font-weight="700">工具服务</text><text x="596" y="227" font-size="17" fill="#17263e" font-weight="400">主体与对象授权</text><text x="596" y="265" font-size="17" fill="#17263e" font-weight="400">版本前提 + 同操作去重</text><text x="596" y="303" font-size="17" fill="#17263e" font-weight="400">执行后返回结构化回执</text><rect x="849" y="145" width="235" height="208" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="867" y="183" font-size="23" fill="#315dce" font-weight="700">任务验收</text><text x="867" y="227" font-size="17" fill="#17263e" font-weight="400">读真实产物</text><text x="867" y="265" font-size="17" fill="#17263e" font-weight="400">核对目标/总数/来源版本</text><text x="867" y="303" font-size="17" fill="#17263e" font-weight="400">合格才SUCCEEDED</text><path d="M275 247 L302 247" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M546 247 L573 247" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M817 247 L844 247" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="399" width="1048" height="112" rx="12" fill="#edf2ff" stroke="#b5c8fa"/><text x="58" y="438" font-size="23" fill="#315dce" font-weight="700">一次提议可能不调用工具，也可能因只读重试产生两次HTTP尝试。</text><text x="58" y="478" font-size="19" fill="#17263e" font-weight="400">本例上限：4次提议、3次工具尝试；发现工具列表另计，完成验收不消耗工具预算。</text><rect x="36" y="547" width="1048" height="106" rx="12" fill="#fff1e6" stroke="#e8cda9"/><text x="58" y="585" font-size="21" fill="#b53e3e" font-weight="700">工具写入总数38：JSON合法、类型合法、写入成功、效果1次；任务仍不合格。</text><text x="58" y="622" font-size="20" fill="#17263e" font-weight="400">固定任务要求37。工具回执证明发生了什么；独立评分器再判断是否符合任务。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Pod没有运行：先找到停在哪一层</title><desc id="desc">配额失败没有Pod对象；调度失败对象存在但无节点绑定；绑定以后还需节点执行和业务验收。</desc><metadata>{&quot;kind&quot;: &quot;stage_mapping&quot;, &quot;quota&quot;: {&quot;object_exists&quot;: false, &quot;error&quot;: &quot;Error from server (Forbidden): error when creating \&quot;STDIN\&quot;: pods \&quot;second\&quot; is forbidden: exceeded quota: cpu-budget, requested: requests.cpu=100m, used: requests.cpu=250m, limited: requests.cpu=300m&quot;, &quot;quota&quot;: {&quot;hard&quot;: {&quot;requests.cpu&quot;: &quot;300m&quot;}, &quot;used&quot;: {&quot;requests.cpu&quot;: &quot;250m&quot;}}}, &quot;oversized&quot;: {&quot;uid&quot;: &quot;1b317f71-453d-41f6-9328-af8da97cf88d&quot;, &quot;phase&quot;: &quot;Pending&quot;, &quot;node&quot;: null, &quot;conditions&quot;: [{&quot;lastProbeTime&quot;: null, &quot;lastTransitionTime&quot;: &quot;2026-11-08T01:03:25Z&quot;, &quot;message&quot;: &quot;0/3 nodes are available: 1 node(s) had untolerated taint(s), 2 Insufficient cpu. no new claims to deallocate, preemption: 0/3 nodes are available: 3 Preemption is not helpful for scheduling.&quot;, &quot;observedGeneration&quot;: 1, &quot;reason&quot;: &quot;Unschedulable&quot;, &quot;status&quot;: &quot;False&quot;, &quot;type&quot;: &quot;PodScheduled&quot;}], &quot;request_millicpu&quot;: 5000}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="480" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">Pod没有运行：先找到停在哪一层</text><text x="32" y="89" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">先看对象，再看绑定，最后看容器和业务；三种失败属于不同层。</text><rect x="32" y="125" width="205" height="100" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="50" y="162" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">API准入</text><text x="50" y="200" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">配额 / 校验</text><path d="M237 175L258 175" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="262" y="125" width="205" height="100" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="280" y="162" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">调度过滤</text><text x="280" y="200" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">资源 / 约束</text><path d="M467 175L488 175" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="492" y="125" width="205" height="100" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="510" y="162" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">节点执行</text><text x="510" y="200" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">镜像 / 网络 / 卷</text><path d="M697 175L718 175" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="722" y="125" width="205" height="100" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="740" y="162" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">应用可用</text><text x="740" y="200" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">探针 / 业务结果</text><path d="M134 225L134 278" stroke="#a34242" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="32" y="315" font-size="22" fill="#a34242" font-weight="600" text-anchor="start">350m &gt; 300m</text><text x="32" y="349" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">第二个Pod不存在</text><path d="M364 225L364 365" stroke="#946020" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="285" y="410" font-size="21" fill="#946020" font-weight="600" text-anchor="start">5 CPU &gt; 各节点4 CPU</text><text x="285" y="445" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">Pending，无nodeName</text><text x="545" y="300" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">绑定后仍可能启动失败</text><text x="545" y="337" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">Running也不等于业务就绪</text><text x="545" y="402" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">本例分开读取对象、条件和绑定。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">一条请求，把等待与占用分开</title><desc id="desc">同一请求的560毫秒由500毫秒池等待、30毫秒持连接外等、20毫秒SQL和10毫秒归还后处理构成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="960" height="480" fill="#f7f9fd" rx="12"/><text x="32" y="44" text-anchor="start" font-size="25" font-weight="650" fill="#273852">一条请求，把等待与占用分开</text><text x="32" y="83" text-anchor="start" font-size="18" font-weight="400" fill="#273852">第201号请求：2000ms到达，2560ms完成；时间为教学模型事件</text><rect x="56" y="152" width="740.0" height="62" rx="8" fill="#dbe4f8" stroke="#aab8cf"/><text x="426.0" y="190" text-anchor="middle" font-size="22" font-weight="600" fill="#273852">等连接 500ms</text><rect x="796.0" y="152" width="44.4" height="62" rx="8" fill="#f1ceac" stroke="#aab8cf"/><rect x="840.4" y="152" width="29.6" height="62" rx="8" fill="#b6dacb" stroke="#aab8cf"/><rect x="870.0" y="152" width="14.8" height="62" rx="8" fill="#d7ccf2" stroke="#aab8cf"/><text x="56" y="136" text-anchor="start" font-size="18" font-weight="400" fill="#273852">到达 2000</text><text x="796" y="253" text-anchor="end" font-size="18" font-weight="400" fill="#273852">获连接 2500</text><path d="M796 215L796 234" fill="none" stroke="#8c9ab2" stroke-width="2" /><text x="884" y="136" text-anchor="end" font-size="18" font-weight="400" fill="#273852">完成 2560</text><rect x="56" y="278" width="22" height="22" rx="8" fill="#f1ceac" stroke="#c3d0ea"/><text x="94" y="299" text-anchor="start" font-size="19" font-weight="600" fill="#273852">① 外部等待</text><text x="278" y="299" text-anchor="start" font-size="19" font-weight="400" fill="#273852">2500→2530：30ms，连接仍被占用</text><rect x="56" y="322" width="22" height="22" rx="8" fill="#b6dacb" stroke="#c3d0ea"/><text x="94" y="343" text-anchor="start" font-size="19" font-weight="600" fill="#273852">② SQL执行</text><text x="278" y="343" text-anchor="start" font-size="19" font-weight="400" fill="#273852">2530→2550：20ms，然后归还连接</text><rect x="56" y="366" width="22" height="22" rx="8" fill="#d7ccf2" stroke="#c3d0ea"/><text x="94" y="387" text-anchor="start" font-size="19" font-weight="600" fill="#273852">③ 应用处理</text><text x="278" y="387" text-anchor="start" font-size="19" font-weight="400" fill="#273852">2550→2560：10ms，连接已释放</text><text x="56" y="441" text-anchor="start" font-size="22" font-weight="600" fill="#273852">560 = 500 + 30 + 20 + 10；其中连接实际持有50ms</text></svg>
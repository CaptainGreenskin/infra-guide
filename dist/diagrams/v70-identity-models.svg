<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
 <title id="title">角色同名，身份与规则分别定位</title>
 <desc id="description">正常请求从工作负载主体取得凭据，经接收方认证与授权后产生业务效果。AWS IAM Role是可代入的身份，AssumeRole返回会话临时凭据；Kubernetes ServiceAccount是主体，TokenRequest提供token，RoleBinding关联主体与Role权限规则。两套模型并列展示，不代表存在角色互换或已执行AWS实验。</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs>
 <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
  <rect x="1" y="1" width="1118" height="758" rx="12" fill="#f7f9fd" stroke="#ccd8e8"/>
  <text x="36" y="48" font-size="28" font-weight="700" fill="#17263e">角色同名，身份与规则分别定位</text>
  <text x="36" y="84" font-size="18" fill="#56667d">先走通一条请求，再把每个平台的对象放回它负责的位置。</text>

  <g fill="#edf2ff" stroke="#9eb6e5">
   <rect x="36" y="113" width="184" height="96" rx="10"/>
   <rect x="252" y="113" width="184" height="96" rx="10"/>
   <rect x="468" y="113" width="184" height="96" rx="10"/>
   <rect x="684" y="113" width="184" height="96" rx="10"/>
   <rect x="900" y="113" width="184" height="96" rx="10"/>
  </g>
  <g font-size="21" font-weight="700" text-anchor="middle" fill="#315dce">
   <text x="128" y="151">工作负载主体</text><text x="344" y="151">适用凭据</text><text x="560" y="151">认证</text><text x="776" y="151">授权</text><text x="992" y="151">业务效果</text>
  </g>
  <g font-size="16" text-anchor="middle" fill="#17263e">
   <text x="128" y="182">程序代表谁</text><text x="344" y="182">身份或委托的证明</text><text x="560" y="182">接收方认出主体</text><text x="776" y="182">当前动作能否执行</text><text x="992" y="182">读取结果或修改记录</text>
  </g>
  <g stroke="#315dce" stroke-width="2" marker-end="url(#arrow)">
   <path d="M221 161H246"/><path d="M437 161H462"/><path d="M653 161H678"/><path d="M869 161H894"/>
  </g>

  <rect x="36" y="242" width="1048" height="170" rx="10" fill="#fff" stroke="#ccd8e8"/>
  <text x="56" y="275" font-size="22" font-weight="700" fill="#315dce">AWS：IAM Role 是可被代入的身份</text>
  <rect x="56" y="294" width="238" height="95" rx="8" fill="#edf2ff" stroke="#9eb6e5"/>
  <text x="74" y="330" font-size="22" font-weight="700" fill="#17263e">IAM Role</text>
  <text x="74" y="365" font-size="18" fill="#56667d">信任策略约束谁能代入</text>
  <path d="M296 341H328" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="338" y="294" width="270" height="95" rx="8" fill="#edf2ff" stroke="#9eb6e5"/>
  <text x="356" y="330" font-size="22" font-weight="700" fill="#17263e">AssumeRole → 角色会话</text>
  <text x="356" y="365" font-size="18" fill="#56667d">STS 临时凭据用于后续请求</text>
  <path d="M610 341H642" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="652" y="294" width="412" height="95" rx="8" fill="#edf6f3" stroke="#91b7a9"/>
  <text x="670" y="330" font-size="21" font-weight="700" fill="#17263e">资源服务认证后评估请求</text>
  <text x="670" y="365" font-size="18" fill="#56667d">按适用策略求值；可包含显式 Deny</text>

  <rect x="36" y="436" width="1048" height="182" rx="10" fill="#fff" stroke="#ccd8e8"/>
  <text x="56" y="469" font-size="22" font-weight="700" fill="#12725b">Kubernetes：ServiceAccount 是主体，Role 是权限规则</text>
  <rect x="56" y="490" width="238" height="102" rx="8" fill="#edf2ff" stroke="#9eb6e5"/>
  <text x="74" y="526" font-size="22" font-weight="700" fill="#17263e">ServiceAccount</text>
  <text x="74" y="561" font-size="16" fill="#56667d">例如 report-a/report-reader</text>
  <path d="M296 541H328" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="338" y="490" width="270" height="102" rx="8" fill="#edf2ff" stroke="#9eb6e5"/>
  <text x="356" y="526" font-size="22" font-weight="700" fill="#17263e">TokenRequest → token</text>
  <text x="356" y="558" font-size="18" fill="#56667d">本例由管理路径申请</text>
  <text x="356" y="582" font-size="16" fill="#56667d">受众、期限与对象绑定</text>
  <path d="M610 541H642" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="652" y="490" width="412" height="102" rx="8" fill="#edf6f3" stroke="#91b7a9"/>
  <text x="670" y="526" font-size="21" font-weight="700" fill="#17263e">API 认证主体，再按 RBAC 授权</text>
  <text x="670" y="561" font-size="18" fill="#56667d">RoleBinding 关联主体与 Role 规则</text>
  <text x="670" y="584" font-size="16" fill="#56667d">适用绑定累加允许；RBAC 没有 Deny 规则</text>

  <rect x="36" y="648" width="1048" height="76" rx="10" fill="#e7edf7"/>
  <text x="56" y="678" font-size="21" font-weight="700" fill="#17263e">身份、凭据和权限规则是三种对象；取得有效凭据后，具体请求仍需授权。</text>
  <text x="56" y="708" font-size="17" fill="#56667d">AWS 为模型说明；原生读取 37 的证据来自独立 Kubernetes API 夹具，不能互相替代执行结果。</text>
 </g>
</svg>

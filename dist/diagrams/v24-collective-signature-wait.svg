<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>集合操作：协议先一致，再解释等待</title><desc>形状相同还不够；操作、成员、顺序、dtype等都应符合约定。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">集合操作：协议先一致，再解释等待</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">形状相同还不够；操作、成员、顺序、dtype等都应符合约定。</text><text x="38" y="130" font-size="21" fill="#315dce" font-weight="700">同一进程组 / 同一调用序号</text><rect x="36" y="157" width="1048" height="67" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="55" y="197" font-size="18" fill="#17263e" font-weight="400">rank0: ALLREDUCE / shape [2]</text><text x="466" y="197" font-size="18" fill="#17263e" font-weight="400">rank1: ALLREDUCE / shape [2]</text><text x="896" y="197" font-size="18" fill="#12725b" font-weight="700">约定一致</text><rect x="36" y="242" width="1048" height="67" rx="10" fill="#fff1e6" stroke="#ccd8e8"/><text x="55" y="282" font-size="18" fill="#17263e" font-weight="400">rank0: ALLREDUCE / shape [2]</text><text x="466" y="282" font-size="18" fill="#17263e" font-weight="400">rank1: ALLREDUCE / shape [3]</text><text x="896" y="282" font-size="18" fill="#b53e3e" font-weight="700">形状不一致</text><rect x="36" y="327" width="1048" height="67" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="55" y="367" font-size="18" fill="#17263e" font-weight="400">rank0: ALLREDUCE / shape [2]</text><text x="466" y="367" font-size="18" fill="#17263e" font-weight="400">rank1: BROADCAST / shape [2]</text><text x="896" y="367" font-size="18" fill="#b53e3e" font-weight="700">操作不一致</text><text x="38" y="435" font-size="19" fill="#17263e" font-weight="400">后两行由DETAIL调试包装器在真正下发前拒绝；没有故意无限等待。</text><rect x="36" y="476" width="500" height="129" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="56" y="512" font-size="22" fill="#315dce" font-weight="700">rank0</text><text x="56" y="548" font-size="20" fill="#17263e" font-weight="400">没有注入睡眠</text><text x="56" y="582" font-size="20" fill="#17263e" font-weight="400">本次call + wait约81.821ms</text><rect x="584" y="476" width="500" height="129" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="604" y="512" font-size="22" fill="#315dce" font-weight="700">rank1</text><text x="604" y="548" font-size="20" fill="#17263e" font-weight="400">调用前故意睡80ms</text><text x="604" y="582" font-size="20" fill="#17263e" font-weight="400">本次call + wait约0.452ms</text><text x="38" y="657" font-size="18" fill="#56667d" font-weight="400">一端先到，等待里含另一端迟到。数字是各rank本地持续时间，每次不同，不是独立网络耗时。</text><text x="38" y="697" font-size="18" fill="#56667d" font-weight="400">本图来自实际CPU/Gloo；调试包装器增加同步，不作NCCL、RDMA或跨机性能结论。</text></g></svg>

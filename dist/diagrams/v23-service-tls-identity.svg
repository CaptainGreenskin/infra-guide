<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img"><title>一个请求，三组不能混用的标识</title><desc>Kubernetes路径为机制图；下方结论来自独立的回环TLS/HTTP实验。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="694" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">一个请求，三组不能混用的标识</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">Kubernetes路径为机制图；下方结论来自独立的回环TLS/HTTP实验。</text><rect x="36" y="128" width="310" height="178" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="56" y="164" font-size="23" fill="#315dce" font-weight="700">客户端</text><text x="56" y="205" font-size="18" fill="#17263e" font-weight="400">URL：reports.team.test</text><text x="56" y="238" font-size="18" fill="#17263e" font-weight="400">DNS → 10.96.0.20</text><text x="56" y="271" font-size="18" fill="#17263e" font-weight="400">TCP → 10.96.0.20:443</text><rect x="405" y="128" width="310" height="178" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="425" y="164" font-size="23" fill="#315dce" font-weight="700">Service 数据面</text><text x="425" y="205" font-size="18" fill="#17263e" font-weight="400">端口443 → targetPort 8443</text><text x="425" y="238" font-size="18" fill="#17263e" font-weight="400">选择当次可用后端</text><text x="425" y="271" font-size="18" fill="#17263e" font-weight="400">目的地址可变为Pod IP</text><rect x="774" y="128" width="310" height="178" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="794" y="164" font-size="23" fill="#315dce" font-weight="700">工作负载</text><text x="794" y="205" font-size="18" fill="#17263e" font-weight="400">10.42.2.8:8443</text><text x="794" y="238" font-size="18" fill="#17263e" font-weight="400">服务端证书验证身份</text><text x="794" y="271" font-size="18" fill="#17263e" font-weight="400">HTTP Host选择应用路由</text><path d="M350 216 L400 216" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M719 216 L769 216" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="345" width="1048" height="126" rx="12" fill="#edf2ff" stroke="#b5c8fa"/><text x="58" y="381" font-size="23" fill="#315dce" font-weight="700">传输地址会变化，逻辑身份仍由应用契约决定</text><text x="58" y="418" font-size="21" fill="#17263e" font-weight="400">TLS：server_hostname / SNI / 证书SAN   ·   HTTP：Host 或 :authority</text><text x="58" y="450" font-size="20" fill="#17263e" font-weight="400">不能把Service转发后的Pod IP，直接当作证书应该声明的名字。</text><rect x="36" y="504" width="1048" height="154" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="58" y="540" font-size="21" fill="#17263e" font-weight="700">本地真实实验：固定连接127.0.0.1，不执行DNS或Kubernetes转发</text><text x="58" y="578" font-size="20" fill="#17263e" font-weight="400">信任临时CA + 正确名字 → TLS成功   /   错名字或不信任CA → 校验失败</text><text x="58" y="614" font-size="20" fill="#b53e3e" font-weight="400">TLS名字正确 + HTTP Host错误 → TLS成功，HTTP返回421</text><text x="58" y="644" font-size="18" fill="#56667d" font-weight="400">网络路径、TLS身份、应用路由分别检查；全过程保持证书与主机名校验。</text></g></svg>

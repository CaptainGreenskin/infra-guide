<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" role="img" aria-labelledby="title desc"><title id="title">从保存了信息，到本轮真正可以使用</title><desc id="desc">权威状态、长期记忆与上下文各有职责，不能互相代写。</desc><metadata>{&quot;kind&quot;: &quot;information_flow&quot;, &quot;task&quot;: &quot;R17&quot;, &quot;task_version&quot;: 2, &quot;original_op&quot;: &quot;R17:publish&quot;, &quot;receipt&quot;: 13, &quot;llm_execution&quot;: false, &quot;kairo_execution&quot;: false, &quot;source_version_independent&quot;: true}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="818" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">从保存了信息，到本轮真正可以使用</text><text x="36" y="84" font-size="18" fill="#56667d" font-weight="400">权威状态、长期记忆与上下文各有职责，不能互相代写。</text><rect x="36" y="122" width="1048" height="108" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="58" y="161" font-size="24" fill="#12725b" font-weight="700">① 权威执行记录：先判断已经发生什么</text><text x="58" y="204" font-size="22" fill="#17263e" font-weight="400">R17 / 任务v2 / SUCCEEDED / 原操作R17:publish / 效果回执13</text><rect x="36" y="276" width="500" height="155" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="314" font-size="23" fill="#315dce" font-weight="700">② 资料与记忆：形成候选</text><text x="58" y="355" font-size="20" fill="#17263e" font-weight="400">本轮主体 → 当前读取资格 → 问题范围</text><text x="58" y="393" font-size="20" fill="#17263e" font-weight="400">来源版本、期限、撤回状态分别检查</text><rect x="568" y="276" width="516" height="155" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="590" y="314" font-size="23" fill="#315dce" font-weight="700">③ 本轮上下文：组装可见输入</text><text x="590" y="355" font-size="21" fill="#17263e" font-weight="400">规则 + 当前任务视图 + 选中材料</text><text x="590" y="393" font-size="20" fill="#17263e" font-weight="400">完整请求计数 + 输出预留 ≤ 窗口</text><path d="M536 354L562 354" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M827 235L827 270" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="477" width="1048" height="113" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="517" font-size="24" fill="#315dce" font-weight="700">④ 模型输出：回答或动作提议</text><text x="58" y="558" font-size="21" fill="#17263e" font-weight="400">交给执行层检查权限、参数与事实；不能直接改写上面的权威记录。</text><path d="M827 436L827 471" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="632" width="1048" height="109" rx="10" fill="#fff6e8" stroke="#cdd9e9"/><text x="58" y="671" font-size="23" fill="#936013" font-weight="700">旧摘要v1说RUNNING，不能覆盖当前任务v2的成功事实。</text><text x="58" y="712" font-size="21" fill="#17263e" font-weight="400">任务版本与资料版本各自计数；TTL未到也不证明资料当前有效。</text><text x="38" y="786" font-size="19" fill="#56667d" font-weight="400">信息职责示意。原实验验证本地SQLite选择与恢复，未调用LLM、云IAM或Kairo。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="914" viewBox="0 0 1120 914" role="img"><title>先同步序号，再分别结束两个发送方向</title><desc>题设序号仅用于解释协议。状态名采用RFC写法；没有宣称本次程序抓到了这些报文。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="912" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">先同步序号，再分别结束两个发送方向</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">题设序号仅用于解释协议。状态名采用RFC写法；没有宣称本次程序抓到了这些报文。</text><text x="239" y="132" font-size="25" fill="#315dce" font-weight="700">发起方A</text><text x="738" y="132" font-size="25" fill="#12725b" font-weight="700">接收方B</text><path d="M300 150V817M805 150V817" fill="none" stroke="#aab8cd" stroke-width="2" stroke-dasharray="6 5"/><path d="M300 191 L805 191" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="176" font-size="20" fill="#315dce" font-weight="700">SYN：seq=100</text><text x="37" y="198" font-size="18" fill="#17263e" font-weight="400">SYN-SENT</text><text x="838" y="198" font-size="16" fill="#17263e" font-weight="400">LISTEN → SYN-RECEIVED</text><path d="M805 269 L300 269" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="254" font-size="20" fill="#315dce" font-weight="700">SYN + ACK：seq=900，ack=101</text><text x="37" y="276" font-size="18" fill="#17263e" font-weight="400">确认B的序号</text><text x="838" y="276" font-size="16" fill="#17263e" font-weight="400">SYN-RECEIVED</text><path d="M300 347 L805 347" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="332" font-size="20" fill="#315dce" font-weight="700">ACK：seq=101，ack=901</text><text x="37" y="354" font-size="18" fill="#17263e" font-weight="400">ESTABLISHED</text><text x="838" y="354" font-size="16" fill="#17263e" font-weight="400">ESTABLISHED</text><path d="M300 491 L805 491" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="476" font-size="20" fill="#315dce" font-weight="700">FIN：A不再发送</text><text x="37" y="498" font-size="18" fill="#17263e" font-weight="400">FIN-WAIT-1</text><text x="838" y="498" font-size="16" fill="#17263e" font-weight="400">CLOSE-WAIT</text><path d="M805 569 L300 569" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="554" font-size="20" fill="#315dce" font-weight="700">ACK：确认A的FIN</text><text x="37" y="576" font-size="18" fill="#17263e" font-weight="400">FIN-WAIT-2</text><text x="838" y="576" font-size="16" fill="#17263e" font-weight="400">等待应用close</text><path d="M805 647 L300 647" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="632" font-size="20" fill="#315dce" font-weight="700">FIN：B也不再发送</text><text x="37" y="654" font-size="18" fill="#17263e" font-weight="400">收到B的结束</text><text x="838" y="654" font-size="16" fill="#17263e" font-weight="400">LAST-ACK</text><path d="M300 725 L805 725" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="710" font-size="20" fill="#315dce" font-weight="700">ACK：确认B的FIN</text><text x="37" y="732" font-size="18" fill="#17263e" font-weight="400">TIME-WAIT</text><text x="838" y="732" font-size="16" fill="#17263e" font-weight="400">CLOSED</text><rect x="36" y="397" width="1048" height="49" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="57" y="430" font-size="22" fill="#12725b" font-weight="700">数据阶段：按字节序号确认与重传；TCP确认不是应用落库回执。</text><text x="38" y="837" font-size="19" fill="#56667d" font-weight="400">常见顺序示意：ACK与FIN可合并，同时关闭也可能使双方进入TIME-WAIT。</text><text x="38" y="876" font-size="19" fill="#56667d" font-weight="400">SYN和FIN各占一个序号；TIME-WAIT并不固定属于客户端，也不等于应用连接泄漏。</text></g></svg>

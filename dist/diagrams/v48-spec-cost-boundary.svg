<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">接受率与速度之间，还隔着成本分子</title><desc id="desc">明确假设的成本模型，不把接受率或函数调用数换算成实测加速比。</desc><metadata>{&quot;kind&quot;: &quot;declared_cost_model&quot;, &quot;alpha&quot;: &quot;2/3&quot;, &quot;gamma&quot;: 2, &quot;expected_tokens&quot;: &quot;19/9&quot;, &quot;measured_speedup&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="470" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">接受率与速度之间，还隔着成本分子</text><text x="32" y="90" font-size="19" fill="#5f708a" font-weight="400" text-anchor="start">声明模型：各位置独立、接受概率α=2/3，k=2。不是测量。</text><text x="32" y="148" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">期望提交数</text><text x="300" y="148" font-size="26" fill="#24344d" font-weight="400" text-anchor="start">1 + 2/3 + 4/9 = 19/9</text><text x="32" y="210" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">一轮成本</text><rect x="300" y="178" width="170" height="50" rx="7" fill="#f5e7d2" stroke="#cbd6e8"/><text x="385" y="211" font-size="21" fill="#24344d" font-weight="400" text-anchor="middle">2 × 草稿c</text><text x="490" y="211" font-size="26" fill="#24344d" font-weight="400" text-anchor="start">+</text><rect x="540" y="178" width="330" height="50" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="705" y="211" font-size="21" fill="#24344d" font-weight="400" text-anchor="middle">验证与状态推进v</text><path d="M32 260L928 260" stroke="#dce3ee" stroke-width="2" fill="none"/><text x="32" y="315" font-size="23" fill="#24344d" font-weight="600" text-anchor="start">每提交词元成本</text><text x="360" y="315" font-size="26" fill="#24344d" font-weight="400" text-anchor="start">(2c + v) / (19/9)</text><text x="32" y="380" font-size="22" fill="#236e5e" font-weight="400" text-anchor="start">只有它小于普通目标每词元成本t，模型才预测更快。</text><text x="32" y="431" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">真实负载仍要测草稿、验证、显存、批次和排队；高接受率不保证加速。</text></g></svg>
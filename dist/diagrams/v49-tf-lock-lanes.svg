<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">状态锁：观察两个真实进程的并发边界</title><desc id="desc">第一个apply在受控钩子保持状态锁，第二个plan被拒绝，放行后第一个正常结束。</desc><metadata>{&quot;kind&quot;: &quot;actual_state_lock&quot;, &quot;execution&quot;: {&quot;second_exit&quot;: 1, &quot;first_still_running&quot;: true, &quot;lock_operation&quot;: &quot;OperationTypeApply&quot;, &quot;file_during_apply&quot;: &quot;alpha&quot;}, &quot;proportional_timing&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="520" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">状态锁：观察两个真实进程的并发边界</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">只表达先后；没有把条形长度当成真实执行耗时。</text><text x="32" y="183" font-size="22" fill="#24344d" font-weight="600" text-anchor="start">进程一apply</text><path d="M230 175L920 175" stroke="#bbc8da" stroke-width="2" fill="none"/><text x="32" y="323" font-size="22" fill="#24344d" font-weight="600" text-anchor="start">进程二plan</text><path d="M230 315L920 315" stroke="#bbc8da" stroke-width="2" fill="none"/><rect x="250" y="139" width="540" height="72" rx="7" fill="#dceae6" stroke="#cbd6e8"/><text x="270" y="183" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">取得状态锁 → 创建alpha → 等待屏障 → 放行</text><path d="M470 211L470 280" stroke="#a34242" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="420" y="280" width="315" height="72" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="438" y="323" font-size="19" fill="#a34242" font-weight="400" text-anchor="start">同一状态锁未取得，退出1</text><text x="32" y="420" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">第一个进程此时仍活着；随后正常结束并释放锁。</text><text x="32" y="478" font-size="21" fill="#60708b" font-weight="400" text-anchor="start">锁住的是这份状态，不是所有可能改动真实资源的主体。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 742" width="1120" height="742" role="img" aria-labelledby="title desc"><title id="title">提交返回、设备完成、用户拿到结果是三个时刻</title><desc id="desc">先定义起止边界，再解释秒表读数；本图没有真实GPU测量。</desc><metadata>{&quot;kind&quot;: &quot;symbolic_timeline&quot;, &quot;iterations&quot;: 100, &quot;numeric_durations&quot;: false, &quot;gpu_execution&quot;: false, &quot;same_stream_events&quot;: true}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="740" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">提交返回、设备完成、用户拿到结果是三个时刻</text><text x="36" y="84" font-size="18" fill="#56667d" font-weight="400">先定义起止边界，再解释秒表读数；本图没有真实GPU测量。</text><text x="36" y="147" font-size="23" fill="#315dce" font-weight="700">主机侧</text><text x="36" y="298" font-size="23" fill="#12725b" font-weight="700">设备流</text><rect x="166" y="116" width="190" height="78" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="184" y="163" font-size="21" fill="#17263e" font-weight="400">准备输入</text><rect x="382" y="116" width="220" height="78" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="400" y="163" font-size="21" fill="#17263e" font-weight="400">提交事件与工作</text><rect x="634" y="116" width="181" height="78" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="652" y="163" font-size="21" fill="#17263e" font-weight="400">等待结束事件</text><rect x="847" y="116" width="237" height="78" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="865" y="163" font-size="21" fill="#17263e" font-weight="400">消费结果</text><path d="M358 155L377 155" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M604 155L629 155" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M817 155L842 155" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="382" y="257" width="433" height="105" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="400" y="298" font-size="21" fill="#12725b" font-weight="700">起始事件 → 100次加法 → 结束事件</text><text x="400" y="337" font-size="20" fill="#17263e" font-weight="400">按同一流的顺序推进</text><path d="M480 199L480 250" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M744 368L744 405" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="411" width="1048" height="106" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="449" font-size="23" fill="#315dce" font-weight="700">事件计时</text><text x="58" y="489" font-size="22" fill="#17263e" font-weight="400">两个设备标记之间的时间；不自动包含输入准备和结果消费。</text><rect x="36" y="552" width="1048" height="106" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="590" font-size="23" fill="#17263e" font-weight="700">端到端计时</text><text x="58" y="630" font-size="21" fill="#17263e" font-weight="400">从准备输入到确认所需结果完成；明确包含复制、排队和同步中的哪些部分。</text><text x="38" y="705" font-size="19" fill="#56667d" font-weight="400">示意无比例、无耗时数值；其他流若有依赖，要另建同步与测量边界。</text></g></svg>

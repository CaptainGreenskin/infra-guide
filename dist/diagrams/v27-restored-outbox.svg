<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="712" viewBox="0 0 1120 712" role="img"><title>恢复旧任务状态，不能再发送一份已完成通知</title><desc>稳定业务身份跨备份与恢复；接收方在同一事务核对代际、意图和回执。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="710" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">恢复旧任务状态，不能再发送一份已完成通知</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">稳定业务身份跨备份与恢复；接收方在同一事务核对代际、意图和回执。</text><rect x="36" y="125" width="500" height="92" rx="10" fill="#fff" stroke="#ccd8e8"/><rect x="584" y="125" width="500" height="92" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="164" font-size="23" fill="#315dce" font-weight="700">应用旧备份：outbox=PENDING</text><text x="606" y="164" font-size="23" fill="#12725b" font-weight="700">独立接收方：通知37已提交</text><text x="58" y="199" font-size="20" fill="#17263e" font-weight="400">原业务ID notify-R27</text><text x="606" y="199" font-size="20" fill="#17263e" font-weight="400">曾在提交后注入HTTP 503</text><path d="M286 225L286 271" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M834 225L834 271" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="283" width="500" height="105" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><rect x="584" y="283" width="500" height="105" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="325" font-size="23" fill="#315dce" font-weight="700">恢复应用后，又看见PENDING</text><text x="58" y="365" font-size="21" fill="#17263e" font-weight="400">数据库倒回，外部通知没有倒回。</text><text x="606" y="325" font-size="22" fill="#12725b" font-weight="700">接收方代际1→2，保留原回执</text><text x="606" y="365" font-size="20" fill="#17263e" font-weight="400">旧代际新写409；同ID异参409</text><path d="M421 415L697 415" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="199" y="454" font-size="24" fill="#315dce" font-weight="700">当前代际 + 原业务ID → duplicate=true / 200</text><rect x="36" y="492" width="500" height="111" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="533" font-size="25" fill="#12725b" font-weight="700">正确恢复</text><text x="58" y="575" font-size="24" fill="#17263e" font-weight="400">outbox=DONE，仍1笔效果</text><rect x="584" y="492" width="500" height="111" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="606" y="533" font-size="24" fill="#b53e3e" font-weight="700">错换新ID的独立反例</text><text x="606" y="575" font-size="22" fill="#17263e" font-weight="400">接收方视为新动作，变2笔效果</text><text x="38" y="675" font-size="18" fill="#56667d" font-weight="400">真实本机HTTP/SQLite。代际号不是凭据；提升权限与真实认证未在本夹具实现。</text></g></svg>

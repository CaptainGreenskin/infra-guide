"111" height="51" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="793.5" y="294.5" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">K2 / V2</text><text x="793" y="339" font-size="15" fill="#506584" font-weight="500" text-anchor="middle">槽 4</text><path d="M794 224v15H662v20" fill="none" stroke="#087767" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="374" font-size="17" fill="#172743" font-weight="600" text-anchor="start">q₄ 用逻辑位置 4 旋转，读取合法的 0–4。图中槽位顺序仅作地址示意。</text>
</g>

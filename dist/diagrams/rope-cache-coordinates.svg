<svg xmlns="http://www.w3.org/2000/svg" width="920" height="398" viewBox="0 0 920 398" role="img" aria-labelledby="title desc">
<title id="title">缓存的逻辑位置和存放槽位分别记</title>
<desc id="desc">新输入的逻辑位置是四，示意存放在物理槽位三。五个逻辑位置按映射读取，掩码允许零到四。</desc>
<metadata>{"prefill":[0,1,2,3],"decode":4,"visible":[0,1,2,3,4],"example_logical_to_slot":[2,0,4,1,3]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="396" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">缓存的逻辑位置和存放槽位分别记</text>
<text x="32" y="78" font-size="17" fill="#506584" font-weight="500" text-anchor="start">无 padding 的四词元提示先缓存 0–3，下一次前向才处理位置 4。</text><text x="32" y="126" font-size="19" fill="#172743" font-weight="700" text-anchor="start">逻辑位置</text><text x="32" y="206" font-size="19" fill="#172743" font-weight="700" text-anchor="start">映射到槽位</text><text x="32" y="293" font-size="19" fill="#172743" font-weight="700" text-anchor="start">物理缓存</text><rect x="214" y="99" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="269.5" y="129.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">0</text><path d="M269 149v22" fill="none" stroke="#506584" stroke-width="2" marker-end="url(#arrow)"/><rect x="214" y="174" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="269.5" y="204.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">2</text><rect x="345" y="99" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="400.5" y="129.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">1</text><path d="M400 149v22" fill="none" stroke="#506584" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="174" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="400.5" y="204.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">0</text><rect x="476" y="99" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="531.5" y="129.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">2</text><path d="M531 149v22" fill="none" stroke="#506584" stroke-width="2" marker-end="url(#arrow)"/><rect x="476" y="174" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="531.5" y="204.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">4</text><rect x="607" y="99" width="111" height="48" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="662.5" y="129.0" font-size="19" fill="#172743" font-weight="
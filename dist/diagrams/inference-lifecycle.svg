<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="inference-lifecycle-title inference-lifecycle-desc">
<title id="inference-lifecycle-title">一次推理：等待、计算、输出与状态释放</title>
<desc id="inference-lifecycle-desc">请求先排队并完成输入 prefill，首 token 输出作为外部观测边界，随后 decode 后续 token，最终结束响应并清理请求占用。KV 前缀缓存可能按策略继续保留。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="610" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">一次推理：等待、计算、输出与状态释放</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">从用户可观测时间定义延迟，再解释调度与 KV 状态如何影响它。</text>
<text x="35" y="142" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">请求到达</text><rect x="35" y="173" width="180" height="100" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="125.0" y="204" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">排队</text><text x="125.0" y="232" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">等待准入 / 执行资源</text><rect x="270" y="173" width="180" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="360.0" y="204" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">Prefill</text><text x="360.0" y="232" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">处理输入上下文</text><text x="360.0" y="255" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">建立相关 KV 状态</text><rect x="505" y="173" width="220" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="615.0" y="204" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">Decode</text><text x="615.0" y="232" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">逐步生成后续 token</text><text x="615.0" y="255" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">调度策略影响等待</text><rect x="775" y="173" width="150" height="100" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="850.0" y="204" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">响应结束</text><text x="850.0" y="232" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">完成 / 取消 / 失败</text><path d="M215 223 L270 223" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 223 L505 223" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 223 L775 223" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><text x="477" y="140" font-size="14" fill="#315dce" text-anchor="middle" font-weight="600">首 token 输出观测点</text><path d="M477 149L477 265" fill="none" stroke="#315dce" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="270" y="329" width="455" height="112" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="288" y="358" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">KV 状态与请求生命周期</text><text x="288" y="384" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">按实现建立、复用和增长；容量与模型、序列有关</text><text x="288" y="407" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">请求结束后释放其占用，前缀缓存可按策略保留</text><path d="M360 273 L360 329" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M615 273 L615 329" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="775" y="329" width="150" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="850.0" y="360" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">清理请求状态</text><text x="850.0" y="388" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">归还可用额度</text><text x="850.0" y="411" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">缓存按策略保留</text><path d="M850 273 L850 329" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 385 L775 385" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="35" y="493" font-size="17" fill="#315dce" text-anchor="start" font-weight="600">TTFT = 首 token 输出时间 − 请求到达时间</text><text x="35" y="525" font-size="15" fill="#203553" text-anchor="start" font-weight="400">完成耗时 = 响应结束时间 − 请求到达时间；同时记录输入 / 输出 token 数。</text><text x="35" y="558" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">首 token 的内部生成步骤依实现而异；图中阶段宽度不表示延迟占比。</text>
<text x="30" y="588" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
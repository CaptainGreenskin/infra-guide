<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">镜像、实例、进程与内核：四层职责</title><desc id="desc">一份镜像创建两个容器实例，它们的资源视图与限制分开，普通容器仍共享宿主内核。</desc><metadata>{&quot;kind&quot;: &quot;conceptual_layers&quot;, &quot;shared_kernel&quot;: true, &quot;source_scope&quot;: &quot;real Linux Docker, cgroup v2; not a sandbox escape test&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="500" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">镜像、实例、进程与内核：四层职责</text><text x="32" y="87" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">同一镜像可以创建多个实例；线程才实际消费CPU时间。</text><rect x="32" y="115" width="896" height="75" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="60" y="147" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">分发内容：只读镜像层 + 启动配置</text><text x="60" y="176" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">按摘要核对内容；运行时还提供用户、挂载、网络与限制。</text><rect x="32" y="215" width="433" height="145" rx="7" fill="#f0f7f5" stroke="#bed9d2"/><text x="54" y="247" font-size="22" fill="#236e5e" font-weight="600" text-anchor="start">容器实例A</text><text x="54" y="282" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">进程 / 可写层 / 挂载</text><text x="54" y="318" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">namespace视图 + cgroup资源</text><rect x="495" y="215" width="433" height="145" rx="7" fill="#f0f7f5" stroke="#bed9d2"/><text x="517" y="247" font-size="22" fill="#236e5e" font-weight="600" text-anchor="start">容器实例B</text><text x="517" y="282" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">进程 / 可写层 / 挂载</text><text x="517" y="318" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">namespace视图 + cgroup资源</text><rect x="32" y="385" width="896" height="85" rx="7" fill="#f4f5f8" stroke="#cbd6e8"/><text x="60" y="420" font-size="22" fill="#24344d" font-weight="600" text-anchor="start">共同的宿主Linux内核</text><text x="60" y="451" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">调度、内存、设备与系统调用；不因PID视图独立而变成两份内核。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="345" viewBox="0 0 520 345" role="img" aria-labelledby="title description">
<title id="title">销售查询怎样从模型提议走到读取，再回到模型</title>
<desc id="description">模型选择销售查询和报告 A，给出模型调用号 M。宿主发出 MCP 请求 3，资源端核对 A 后读取正文，随响应 3 返回金额 42 和证据编号。宿主按模型调用号 M 回填结果。查询 B 的 MCP 请求 5 被资源端拒绝，没有读取正文。</desc>
<metadata>{"record":"labs/model-mcp-tool-choice/validation.json","tools":["read_sales_report","read_incident_report"],"rpc_ids":[3,4,5],"outcomes":["allowed","allowed","denied"],"body_reads":["A","A"]}</metadata>
<defs>
<marker id="model-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3a5a9e"/></marker>
<marker id="mcp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#337458"/></marker>
</defs>
<rect x="1" y="1" width="518" height="343" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#22324d">
<text x="20" y="31" font-size="19" font-weight="700">一次销售查询怎样来回走</text>
<path d="M72 80V264M260 80V264M448 80V264" stroke="#c4d0df" stroke-dasharray="5 4"/>
<g font-size="15" font-weight="650" text-anchor="middle">
<rect x="18" y="49" width="108" height="31" rx="7" fill="#e7eefb"/><text x="72" y="70">本机模型</text>
<rect x="172" y="49" width="176" height="31" rx="7" fill="#e7eefb"/><text x="260" y="70">宿主与 MCP 客户端</text>
<rect x="394" y="49" width="108" height="31" rx="7" fill="#e4f3eb"/><text x="448" y="70">资源服务</text>
</g>
<g font-size="14" text-anchor="middle">
<text x="166" y="103" fill="#3a5a9e">模型调用号 M，选销售查询</text>
<path d="M74 113H251" stroke="#3a5a9e" stroke-width="2" marker-end="url(#model-arrow)"/>
<text x="354" y="144" fill="#2b654c">MCP 请求 3，查报告 A</text>
<path d="M262 154H440" stroke="#337458" stroke-width="2" marker-end="url(#mcp-arrow)"/>
<text x="354" y="185" fill="#2b654c">MCP 响应 3，42 和证据编号</text>
<path d="M446 195H268" stroke="#337458" stroke-width="2" marker-end="url(#mcp-arrow)"/>
<text x="166" y="226" fill="#3a5a9e">按原模型调用号 M 回填</text>
<path d="M258 236H80" stroke="#3a5a9e" stroke-width="2" marker-end="url(#model-arrow)"/>
</g>
<circle cx="72" cy="264" r="4" fill="#3a5a9e"/>
<text x="86" y="269" font-size="14">模型答出 42 与 sales-v3-9f6a</text>
<rect x="18" y="286" width="484" height="41" rx="6" fill="#fff0dc"/>
<text x="29" y="312" font-size="15" fill="#874912">换成报告 B：请求 5 在读取正文前被资源服务拒绝。</text>
</g>
</svg>

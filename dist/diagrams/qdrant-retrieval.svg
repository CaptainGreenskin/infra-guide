<svg xmlns="http://www.w3.org/2000/svg" width="390" height="536" viewBox="0 0 390 536" role="img" aria-labelledby="qdrant-title qdrant-desc">
  <title id="qdrant-title">从向量候选到来源证据</title>
  <desc id="qdrant-desc">全局前两名均为租户 B。查询中限制租户 A 和可读标记后，再从来源库拒绝撤权的 102 和旧版 103，只交付 101 和 104。索引更新后交付 101 和第二版 103。</desc>
  <metadata>{"global":[701,702],"restricted_stale":[101,102,103,104],"body_reads_after_check":[101,104],"refreshed":[101,103],"refreshed_103_version":2}</metadata>
  <defs>
    <marker id="qdrant-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#54718a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;fill:#162e48}
      .title{font-size:23px;font-weight:720}
      .label{font-size:16px;font-weight:670}
      .detail{font-size:14px;fill:#37536c}
      .small{font-size:14px}
      .grid{fill:#e9f2ff;stroke:#9eb9dc;stroke-width:1}
      .denied{fill:#fff2e8;stroke:#e3b592;stroke-width:1}
      .pass{fill:#e8f5ee;stroke:#92c6aa;stroke-width:1}
      .line{stroke:#54718a;stroke-width:1.5;fill:none;marker-end:url(#qdrant-arrow)}
    </style>
  </defs>
  <rect x=".5" y=".5" width="389" height="535" rx="16" fill="#fbfcff" stroke="#cbd9e9"/>
  <text x="20" y="39" class="title">从向量候选到来源证据</text>
  <text x="20" y="62" class="detail">查询 [1, 0] · 点积取向量第一项</text>

  <rect x="18" y="79" width="354" height="96" rx="11" fill="#f0f4f9"/>
  <text x="31" y="104" class="label">全局前两名，再筛租户 A</text>
  <rect x="31" y="117" width="96" height="34" rx="6" fill="#e2e9f1"/>
  <text x="79" y="139" class="small" text-anchor="middle">B 701 · 0.99</text>
  <rect x="134" y="117" width="96" height="34" rx="6" fill="#e2e9f1"/>
  <text x="182" y="139" class="small" text-anchor="middle">B 702 · 0.97</text>
  <path class="line" d="M238 134h27"/>
  <text x="277" y="139" class="small">剩 0 项</text>

  <rect x="18" y="190" width="354" height="232" rx="11" fill="#f2f7ff"/>
  <text x="31" y="216" class="label">查询时限定 A 和可读标记</text>
  <text x="31" y="240" class="detail">来源已变动，索引仍旧，取前四名</text>
  <text x="31" y="264" class="detail">索引候选</text>
  <text x="178" y="264" class="detail">来源库复检</text>

  <rect x="31" y="275" width="110" height="29" rx="5" class="grid"/>
  <text x="45" y="295" class="small">101/v1 · 0.90</text>
  <path class="line" d="M145 289h25"/>
  <rect x="178" y="275" width="174" height="29" rx="5" class="pass"/>
  <text x="190" y="295" class="small">通过 · 读取金额 10</text>

  <rect x="31" y="310" width="110" height="29" rx="5" class="grid"/>
  <text x="45" y="330" class="small">102/v1 · 0.85</text>
  <path class="line" d="M145 324h25"/>
  <rect x="178" y="310" width="174" height="29" rx="5" class="denied"/>
  <text x="190" y="330" class="small">已撤权 · 无正文读取</text>

  <rect x="31" y="345" width="110" height="29" rx="5" class="grid"/>
  <text x="45" y="365" class="small">103/v1 · 0.80</text>
  <path class="line" d="M145 359h25"/>
  <rect x="178" y="345" width="174" height="29" rx="5" class="denied"/>
  <text x="190" y="365" class="small">来源 v2 · 无正文读取</text>

  <rect x="31" y="380" width="110" height="29" rx="5" class="grid"/>
  <text x="45" y="400" class="small">104/v1 · 0.70</text>
  <path class="line" d="M145 394h25"/>
  <rect x="178" y="380" width="174" height="29" rx="5" class="pass"/>
  <text x="190" y="400" class="small">通过 · 读取金额 7</text>

  <rect x="18" y="437" width="354" height="82" rx="11" fill="#eaf5ee"/>
  <text x="31" y="464" class="label">索引更新后，再取前两名</text>
  <text x="31" y="491" class="small">101/v1 与 103/v2</text>
  <path class="line" d="M164 487h25"/>
  <text x="201" y="491" class="small">读取金额 10、42</text>
</svg>

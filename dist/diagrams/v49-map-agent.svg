<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">Agent Infra：把提议、效果、历史与验收接成闭环</title><desc id="desc">模型提议经过可信检查才能执行，结果形成观察和历史，检索提供证据，独立评估核对用户目标，沙箱与授权分别限制。</desc><metadata>{&quot;kind&quot;: &quot;conceptual_system_map&quot;, &quot;track&quot;: &quot;agent&quot;, &quot;model_proposal_is_authorization&quot;: false, &quot;gpu_training_required&quot;: false, &quot;trace&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="575" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">Agent Infra：把提议、效果、历史与验收接成闭环</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">任务给出目标、允许范围与完成条件；模型输出只是提议。</text><rect x="32" y="145" width="278" height="93" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="181" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">模型提议</text><text x="52" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">选择下一步</text><path d="M312 190L336 190" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="145" width="278" height="93" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="360" y="181" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">运行时检查</text><text x="360" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">参数 / 当前权限</text><path d="M620 190L644 190" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="650" y="145" width="278" height="93" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="670" y="181" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">工具执行</text><text x="670" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">实际效果 / 回执</text><path d="M790 240L790 280" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M790 280L622 280" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="252" width="278" height="56" rx="7" fill="#e8f4ef" stroke="#bdd8cf"/><text x="479" y="287" font-size="19" fill="#236e5e" font-weight="400" text-anchor="middle">保存事实，组织上下文</text><path d="M337 280L165 280" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M165 280L165 242" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="330" width="278" height="98" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="367" font-size="23" fill="#24344d" font-weight="400" text-anchor="start">历史与恢复</text><text x="52" y="405" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">哪些动作已确认</text><rect x="340" y="330" width="278" height="98" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="360" y="367" font-size="23" fill="#24344d" font-weight="400" text-anchor="start">检索与证据</text><text x="360" y="405" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">可读、版本与预算</text><rect x="650" y="330" width="278" height="98" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="670" y="367" font-size="23" fill="#24344d" font-weight="400" text-anchor="start">观测与评估</text><text x="670" y="405" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">过程与真实结果</text><path d="M165 330L165 284" stroke="#315dce" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M480 330L480 284" stroke="#315dce" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M790 330L790 284" stroke="#315dce" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="32" y="485" font-size="20" fill="#60708b" font-weight="400" text-anchor="start">沙箱限制执行能力，资源端授权限制业务动作；它们各有边界。</text><text x="32" y="535" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">G1–G10沿同一任务展开；Kairo接入应兑现这套协议，无需先完成GPU训练。</text></g></svg>
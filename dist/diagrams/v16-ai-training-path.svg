<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="title desc"><title id="title">一次 DDP 更新怎样给每个有效 token 相同权重</title><desc id="desc">标量参数，默认 DDP 在两个 rank 间平均梯度。四个有效 token 的梯度为 2、4、6、8，全局均值为 5，平均两个局部均值会得到 4。</desc>
<rect width="960" height="710" rx="13" fill="#f7f9fa"/>
<text x="32" y="40" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#13716b">AI INFRA 01  /  训练更新</text>
<text x="32" y="85" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:30px;font-weight:700;fill:#18364e">先数有效目标，再同步梯度</text>
<text x="32" y="121" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">合成算例：同一参数起点，固定两个数据并行 rank。数字是每个有效目标的梯度，不是 loss 值。</text>
<rect x="30" y="152" width="900" height="69" rx="8" fill="#eaf2f3" stroke="#c1d0dc"/>
<text x="46" y="181" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#13716b">先在整个更新窗口计数</text>
<text x="46" y="208" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">标签移位、忽略无效位置后，跨两个 rank 求和：N = 1 + 3 = 4；DDP 组规模 W = 2。</text>
<rect x="30" y="259" width="425" height="98" rx="8" fill="#ffffff" stroke="#c1d0dc"/>
<text x="46" y="291" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:21px;font-weight:700;fill:#285f9c">rank 0</text>
<text x="147" y="291" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">有效 token 梯度 [2]</text>
<text x="46" y="332" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#18364e">本地反传后：2 × 2 / 4 = 1</text>
<line x1="461" y1="309" x2="581" y2="309" stroke="#13716b" stroke-width="2.4"/>
<polygon points="581,309 570.0,314.0 570.0,304.0" fill="#13716b"/>
<rect x="30" y="391" width="425" height="98" rx="8" fill="#ffffff" stroke="#c1d0dc"/>
<text x="46" y="423" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:21px;font-weight:700;fill:#285f9c">rank 1</text>
<text x="147" y="423" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">有效 token 梯度 [4,6,8]</text>
<text x="46" y="464" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#18364e">本地反传后：2 × 18 / 4 = 9</text>
<line x1="461" y1="441" x2="581" y2="441" stroke="#13716b" stroke-width="2.4"/>
<polygon points="581,441 570.0,446.0 570.0,436.0" fill="#13716b"/>
<rect x="593" y="265" width="332" height="218" rx="9" fill="#e8f1ee" stroke="#c1d0dc"/>
<text x="612" y="305" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:21px;font-weight:700;fill:#13716b">默认 DDP 梯度平均</text>
<text x="612" y="349" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:29px;font-weight:700;fill:#18364e">(1 + 9) / 2 = 5</text>
<text x="612" y="392" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">两个副本获得相同梯度。</text>
<text x="612" y="434" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#13716b">单进程参考：(2+4+6+8)/4=5</text>
<rect x="30" y="526" width="899" height="94" rx="7" fill="#fff5ed" stroke="#dec7b6"/>
<text x="46" y="558" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#a54e22">反例：先算两个 rank 的局部均值</text>
<text x="46" y="594" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">rank 0 得 2，rank 1 得 6，直接平均为 4。副本仍可一致，但每个 token 的权重错了。</text>
<text x="32" y="664" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#18364e">实际反传标量：W × 本地有效 loss 总和 / N。累积时 N 跨整个窗口，不能再除累积步数。</text>
</svg>
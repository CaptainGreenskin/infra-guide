<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="artifact-commit-title artifact-commit-desc">
<title id="artifact-commit-title">产物提交：让半成品保持不可见</title>
<desc id="artifact-commit-desc">草稿先通过清单和摘要校验，再发布指向完整版本的指针。中断或验证失败不会更新指针；读者按已发布版本恢复，并再次核对加载结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="580" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">产物提交：让半成品保持不可见</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">将文件存在、版本完整、对读者可见和可恢复四个状态分开。</text>
<text x="35" y="144" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">成功提交路径</text><rect x="35" y="163" width="190" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="130.0" y="194" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">草稿版本</text><text x="130.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">写文件 / 分片</text><text x="130.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">记录版本标识</text><rect x="265" y="163" width="190" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="360.0" y="194" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">完整性验证</text><text x="360.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">校验清单与摘要</text><text x="360.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">确认所需产物齐全</text><rect x="495" y="163" width="190" height="112" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="590.0" y="194" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">发布指针</text><text x="590.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">只指向已完成版本</text><text x="590.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">按存储语义提交</text><rect x="725" y="163" width="190" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="820.0" y="194" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">恢复与读取</text><text x="820.0" y="222" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">先读已发布版本</text><text x="820.0" y="245" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">再按清单加载 / 校验</text><path d="M225 219 L265 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 219 L495 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 219 L725 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 275 L360 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="245" y="330" width="265" height="112" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="263" y="359" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">写入中断 / 验证失败</text><text x="263" y="385" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">保留草稿，不更新发布指针</text><text x="263" y="408" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">读者继续使用上次完整版本</text><path d="M590 275 L590 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="330" width="370" height="112" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="563" y="359" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">发布是可见性的边界</text><text x="563" y="385" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">半成品不进入“当前可读版本”</text><text x="563" y="408" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">恢复还要验证格式、版本与加载结果</text><text x="35" y="492" font-size="15" fill="#203553" text-anchor="start" font-weight="400">本地文件原子替换、对象存储单 key 更新和多对象提交，必须分别设计。</text><text x="35" y="520" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">“保存完成”与“成功恢复”是两个独立的验收点。</text>
<text x="30" y="558" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
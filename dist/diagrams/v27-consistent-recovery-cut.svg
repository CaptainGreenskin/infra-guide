<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="727" viewBox="0 0 1120 727" role="img"><title>恢复点要能被业务完整读取</title><desc>实际SQLite备份/应用日志重放与对象摘要核对；不是数据库物理WAL恢复。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="725" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">恢复点要能被业务完整读取</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">实际SQLite备份/应用日志重放与对象摘要核对；不是数据库物理WAL恢复。</text><text x="38" y="131" font-size="21" fill="#315dce" font-weight="700">提交序号</text><text x="220" y="131" font-size="21" fill="#315dce" font-weight="700">题设时间</text><text x="426" y="131" font-size="21" fill="#315dce" font-weight="700">数据库报告</text><text x="758" y="131" font-size="21" fill="#315dce" font-weight="700">恢复侧对象</text><rect x="36" y="153" width="1048" height="66" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="195" font-size="25" fill="#315dce" font-weight="700">100</text><text x="220" y="195" font-size="25" fill="#17263e" font-weight="400">11:30</text><text x="426" y="195" font-size="24" fill="#17263e" font-weight="400">R1 → object-v1</text><text x="758" y="195" font-size="23" fill="#12725b" font-weight="700">存在且摘要匹配</text><rect x="36" y="236" width="1048" height="66" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="278" font-size="25" fill="#315dce" font-weight="700">101</text><text x="220" y="278" font-size="25" fill="#17263e" font-weight="400">11:42</text><text x="426" y="278" font-size="24" fill="#17263e" font-weight="400">R2 → object-v2</text><text x="758" y="278" font-size="23" fill="#12725b" font-weight="700">存在且摘要匹配</text><rect x="36" y="319" width="1048" height="66" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="58" y="361" font-size="25" fill="#315dce" font-weight="700">102</text><text x="220" y="361" font-size="25" fill="#17263e" font-weight="400">11:54</text><text x="426" y="361" font-size="24" fill="#17263e" font-weight="400">R3 → object-v3</text><text x="758" y="361" font-size="23" fill="#b53e3e" font-weight="700">缺失：R3无法读取</text><rect x="36" y="402" width="1048" height="66" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="444" font-size="25" fill="#315dce" font-weight="700">103</text><text x="220" y="444" font-size="25" fill="#17263e" font-weight="400">11:57</text><text x="426" y="444" font-size="24" fill="#17263e" font-weight="400">R4 → object-v4</text><text x="758" y="444" font-size="23" fill="#12725b" font-weight="700">存在且摘要匹配</text><rect x="36" y="526" width="1048" height="112" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="567" font-size="24" fill="#315dce" font-weight="700">数据库到103且integrity_check=ok；业务仍缺R3附件。</text><text x="58" y="611" font-size="23" fill="#b53e3e" font-weight="700">本题最后完整前缀101：12:00−11:42=18分钟，超过15分钟RPO。</text><text x="38" y="690" font-size="18" fill="#56667d" font-weight="400">v4在也不能跳过缺失的102；本题要求保留所有报告。分钟为声明输入，非恢复耗时实测。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 314" role="img" aria-labelledby="metal-queue-title metal-queue-desc">
  <title id="metal-queue-title">两条请求进入同一个 Metal 解码批</title>
  <desc id="metal-queue-desc">双槽实跑的第 5 个请求分批有两行。槽 0 的 A 把编号 9 放在位置 6，槽 1 的 B 把编号 11 放在位置 5。两行同批进入 Metal，各自用自己的历史，随后分别选出 10 和 12。</desc>
  <metadata>{"record":"labs/native-metal-queue/validation.json","slots":2,"batch_ordinal":5,"rows":[{"seq_id":0,"position":6,"token_id":9,"output":true},{"seq_id":1,"position":5,"token_id":11,"output":true}],"sampled":[{"slot":0,"token_id":10},{"slot":1,"token_id":12}]}</metadata>
  <defs>
    <marker id="metal-queue-arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4564ad"/>
    </marker>
    <marker id="metal-queue-arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#23776c"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="458" height="312" rx="12" fill="#f8faff" stroke="#cbd5e1"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" fill="#23314b">
    <text x="230" y="31" font-size="21" font-weight="700">第 5 个引擎分批同时处理 A 与 B</text>
    <rect x="25" y="48" width="194" height="61" rx="8" fill="#eef3ff" stroke="#a5b9e8"/>
    <rect x="241" y="48" width="194" height="61" rx="8" fill="#ebf8f5" stroke="#9acbc3"/>
    <text x="122" y="74" font-size="17" font-weight="700" fill="#2e4b8c">槽 0 · 请求 A</text>
    <text x="122" y="96" font-size="15">编号 9 · 位置 6</text>
    <text x="338" y="74" font-size="17" font-weight="700" fill="#21665d">槽 1 · 请求 B</text>
    <text x="338" y="96" font-size="15">编号 11 · 位置 5</text>
    <path d="M122 112v20" stroke="#4564ad" stroke-width="2" marker-end="url(#metal-queue-arrow-a)"/>
    <path d="M338 112v20" stroke="#23776c" stroke-width="2" marker-end="url(#metal-queue-arrow-b)"/>
    <rect x="25" y="137" width="410" height="71" rx="8" fill="#fff" stroke="#aebcd9"/>
    <text x="230" y="161" font-size="17" font-weight="700">同一个 Metal 解码批</text>
    <text x="230" y="181" font-size="14">匹配点积 → Softmax → 内容汇总 → 输出投影</text>
    <text x="230" y="199" font-size="14" fill="#566581">两行各自读取可见历史，各自取得候选分数</text>
    <path d="M122 211v19" stroke="#4564ad" stroke-width="2" marker-end="url(#metal-queue-arrow-a)"/>
    <path d="M338 211v19" stroke="#23776c" stroke-width="2" marker-end="url(#metal-queue-arrow-b)"/>
    <rect x="25" y="235" width="194" height="46" rx="8" fill="#eef3ff" stroke="#a5b9e8"/>
    <rect x="241" y="235" width="194" height="46" rx="8" fill="#ebf8f5" stroke="#9acbc3"/>
    <text x="122" y="264" font-size="17" font-weight="700" fill="#2e4b8c">A 的下一项是 10</text>
    <text x="338" y="264" font-size="17" font-weight="700" fill="#21665d">B 的下一项是 12</text>
    <text x="230" y="302" font-size="14" fill="#566581">两项各自回到对应的 HTTP 输出流</text>
  </g>

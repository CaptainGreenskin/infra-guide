<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">从张量算子到线程与存储</title><desc id="desc">CPU提交设备工作，GPU按线程块与warp执行，寄存器、shared memory与HBM承担不同角色。</desc><style>text{font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif}</style><rect x="1" y="1" width="958" height="578" rx="10" fill="#f7f9fe" stroke="#d8e1ed"/><text x="30" y="40" font-size="12" fill="#315dce">INFRAGUIDE / ORIGINAL TEACHING DIAGRAM</text><text x="30" y="77" font-size="27" fill="#1c283d" font-weight="700">从张量算子到线程与存储</text><rect x="35" y="115" width="240" height="125" rx="10" fill="#eef2ff" stroke="#d8e1ed"/><text x="53" y="150" font-size="23" fill="#1c283d" font-weight="700">CPU / Host</text><text x="53" y="185" font-size="18" fill="#1c283d">准备输入 · 选择实现</text><text x="53" y="218" font-size="18" fill="#1c283d">提交到流中的队列</text><text x="291" y="187" font-size="36" fill="#315dce">→</text><rect x="340" y="115" width="585" height="125" rx="10" fill="#e9efff" stroke="#d8e1ed"/><text x="360" y="150" font-size="23" fill="#1c283d" font-weight="700">GPU 执行资源 / SM</text><text x="360" y="187" font-size="18" fill="#1c283d">block 内含多个 warp；warp 内有 32 个线程</text><text x="360" y="220" font-size="18" fill="#1c283d">按可用寄存器、共享内存、线程容量安排驻留</text><rect x="35" y="310" width="245" height="130" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="50" y="349" font-size="21" fill="#1c283d" font-weight="700">寄存器</text><text x="50" y="389" font-size="17" fill="#1c283d">线程私有的工作变量</text><rect x="305" y="310" width="305" height="130" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="320" y="349" font-size="21" fill="#1c283d" font-weight="700">Shared memory</text><text x="320" y="389" font-size="17" fill="#1c283d">block 内显式共享与复用</text><rect x="635" y="310" width="290" height="130" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="650" y="349" font-size="21" fill="#1c283d" font-weight="700">设备内存 / HBM</text><text x="650" y="389" font-size="17" fill="#1c283d">大容量张量与缓冲</text><text x="165" y="286" font-size="30" fill="#315dce">↕</text><text x="448" y="286" font-size="30" fill="#315dce">↕</text><text x="770" y="286" font-size="30" fill="#315dce">↕</text><text x="40" y="485" font-size="21" fill="#1c283d" font-weight="700">缓存、访问布局与片上复用，改变真正需要移动的数据。</text><text x="40" y="520" font-size="17" fill="#58667e">示意省略 L1/L2、互联和架构差异；位置不代表统一容量或带宽比例。</text></svg>
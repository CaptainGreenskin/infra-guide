<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">只保留接受前缀，再消费修正词元</title><desc id="desc">前缀3行加草稿3行为6行，第二个拒绝后只保留4行，再追加修正得到5行。</desc><metadata>{&quot;kind&quot;: &quot;actual_cache_cut&quot;, &quot;execution&quot;: {&quot;prefix&quot;: [1, 2, 3], &quot;draft_fixture&quot;: [0, 5, 3], &quot;accepted&quot;: 1, &quot;output&quot;: [0, 4], &quot;serial_target_output&quot;: [0, 4], &quot;conditional_max_errors&quot;: [0.0, 0.0, 0.0, 0.0], &quot;verified_cache_length&quot;: 6, &quot;retained_before_correction&quot;: 4, &quot;committed_cache_length&quot;: 5, &quot;cache_max_errors&quot;: [0.0, 0.0], &quot;next_logit_max_error&quot;: 0.0, &quot;target_calls_after_prefill&quot;: {&quot;verify&quot;: 1, &quot;consume_correction_or_bonus&quot;: 1, &quot;serial_consuming_same_output&quot;: 2}, &quot;negative_keep_rejected_cache&quot;: {&quot;wrong_cache_length&quot;: 7, &quot;correct_cache_length&quot;: 5, &quot;next_logit_max_error&quot;: 0.45028527145972497}}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="515" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">只保留接受前缀，再消费修正词元</text><text x="32" y="88" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">实际CPU夹具；缓存格表示词元位置，不代表每格的完整向量。</text><text x="35" y="173" font-size="22" fill="#24344d" font-weight="600" text-anchor="start">验证后6行</text><rect x="225" y="140" width="75" height="56" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="262" y="176" font-size="24" fill="#24344d" font-weight="400" text-anchor="middle">1</text><rect x="320" y="140" width="75" height="56" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="357" y="176" font-size="24" fill="#24344d" font-weig
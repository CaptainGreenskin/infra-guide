</text><rect x="320" y="360" width="75" height="56" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="357" y="396" font-size="24" fill="#24344d" font-weight="400" text-anchor="middle">2</text><rect x="415" y="360" width="75" height="56" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="452" y="396" font-size="24" fill="#24344d" font-weight="400" text-anchor="middle">3</text><rect x="510" y="360" width="75" height="56" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="547" y="396" font-size="24" fill="#24344d" font-weight="400" text-anchor="middle">0</text><rect x="605" y="360" width="75" height="56" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="642" y="396" font-size="24" fill="#24344d" font-weight="400" text-anchor="middle">4</text><text x="35" y="480" font-size="19" fill="#a34242" font-weight="400" text-anchor="start">错误不裁剪：追加后7行；正确5行。下一步分数最大差≈0.450285。</text></g></svg>
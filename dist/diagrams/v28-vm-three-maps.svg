<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="715" viewBox="0 0 1120 715" role="img"><title>虚拟机分别虚拟化CPU、内存和设备</title><desc>以Linux/KVM为机制示意；具体云产品、架构与设备实现仍按目标环境核对。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="713" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">虚拟机分别虚拟化CPU、内存和设备</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">以Linux/KVM为机制示意；具体云产品、架构与设备实现仍按目标环境核对。</text><text x="36" y="135" font-size="23" fill="#315dce" font-weight="700">客户机里看见的对象</text><text x="407" y="135" font-size="23" fill="#315dce" font-weight="700">虚拟化机制</text><text x="807" y="135" font-size="23" fill="#315dce" font-weight="700">最终资源与限制</text><rect x="36" y="163" width="320" height="111" rx="10" fill="#fff" stroke="#ccd8e8"/><rect x="399" y="163" width="320" height="111" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><rect x="762" y="163" width="322" height="111" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="52" y="198" font-size="23" fill="#315dce" font-weight="700">CPU</text><text x="778" y="228" font-size="22" fill="#17263e" font-weight="400">物理逻辑CPU、调度与竞争</text><path d="M362 218 L391 218" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 218 L754 218" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="243" font-size="22" fill="#17263e" font-weight="400">vCPU、寄存器与中断状态</text><text x="415" y="228" font-size="22" fill="#17263e" font-weight="400">KVM/硬件辅助执行与退出</text><rect x="36" y="316" width="320" height="111" rx="10" fill="#fff" stroke="#ccd8e8"/><rect x="399" y="316" width="320" height="111" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><rect x="762" y="316" width="322" height="111" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="52" y="351" font-size="23" fill="#315dce" font-weight="700">内存</text><text x="778" y="381" font-size="22" fill="#17263e" font-weight="400">宿主物理页面、NUMA与带宽</text><path d="M362 371 L391 371" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 371 L754 371" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="382" font-size="22" fill="#17263e" font-weight="400">应用虚拟地址 →</text><text x="52" y="411" font-size="22" fill="#17263e" font-weight="400">客户机物理地址</text><text x="415" y="381" font-size="22" fill="#17263e" font-weight="400">二阶段/影子映射等机制</text><rect x="36" y="469" width="320" height="111" rx="10" fill="#fff" stroke="#ccd8e8"/><rect x="399" y="469" width="320" height="111" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><rect x="762" y="469" width="322" height="111" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="52" y="504" font-size="23" fill="#315dce" font-weight="700">I/O</text><text x="778" y="534" font-size="22" fill="#17263e" font-weight="400">后端、物理设备与服务配额</text><path d="M362 524 L391 524" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M725 524 L754 524" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="549" font-size="22" fill="#17263e" font-weight="400">客户机设备驱动与缓冲</text><text x="415" y="517" font-size="23" fill="#17263e" font-weight="400">virtio队列 / 模拟</text><text x="415" y="551" font-size="23" fill="#17263e" font-weight="400">或设备直通</text><text x="38" y="632" font-size="23" fill="#315dce" font-weight="700">规格约定接口与资源保证，不等于应用始终独占相同数量物理核。</text><text x="38" y="678" font-size="18" fill="#56667d" font-weight="400">容器可以运行在VM内：共享的是这台VM的客户机内核。此图为机制说明，不是本机VM测试。</text></g></svg>

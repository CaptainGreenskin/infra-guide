<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>中文检索先看切词，再谈相关性排序</title><desc>8条固定中文材料，实际运行SQLite FTS5、BM25和索引版本检查。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">中文检索先看切词，再谈相关性排序</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">8条固定中文材料，实际运行SQLite FTS5、BM25和索引版本检查。</text><rect x="36" y="128" width="1048" height="112" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="169" font-size="25" fill="#315dce" font-weight="700">原文：数据库备份支持恢复。恢复前校验日志链。</text><text x="58" y="211" font-size="21" fill="#17263e" font-weight="400">unicode61将连续汉字作为较长词；本语料查询“恢复”没有独立词命中。</text><path d="M559 250L559 290" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="304" width="1048" height="106" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="346" font-size="24" fill="#315dce" font-weight="700">教学二元切分：数据 / 据库 / 库备 / 备份 / … / 恢复</text><text x="58" y="386" font-size="22" fill="#17263e" font-weight="400">查询“数据库恢复” → 数据 OR 据库 OR 库恢 OR 恢复</text><path d="M559 420L559 460" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="474" width="1048" height="120" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="515" font-size="23" fill="#12725b" font-weight="700">MATCH → 合法租户/当前版本/索引版本 → BM25 → LIMIT</text><text x="58" y="557" font-size="21" fill="#17263e" font-weight="400">SQLite BM25分数越小越靠前；分词或索引版本不对，先修这一步。</text><text x="38" y="651" font-size="22" fill="#315dce" font-weight="700">另一路排名在实验中明确给定，再用RRF按名次融合；没有调用embedding模型。</text><text x="38" y="700" font-size="18" fill="#56667d" font-weight="400">实际FTS5。二元片段不是通用中文分词；共享索引的全语料统计也不等于租户统计隔离。</text></g></svg>

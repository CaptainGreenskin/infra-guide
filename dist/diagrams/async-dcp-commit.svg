<title id="title">同一次异步保存，可能写入不同训练步的状态</title>
<desc id="description">第 1 步完成后调用保存，后台暂停写入。前台第 2 步改动权重和动量，随后后台继续写。复制路径恢复步数 1、权重 0.75，直接交给后台的 CPU 张量路径恢复步数 1、权重 2.9375。rank 1 写入失败时发布指针不动。</desc>

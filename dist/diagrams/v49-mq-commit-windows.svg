<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">把崩溃放在提交与ACK两边</title><desc id="desc">先业务提交后ACK能遇到重投，按稳定业务回执恢复；先ACK后业务会遗漏任务。</desc><metadata>{&quot;kind&quot;: &quot;actual_crash_windows&quot;, &quot;effect_first&quot;: {&quot;kill_exit&quot;: -9, &quot;first_delivery&quot;: {&quot;message_id&quot;: &quot;transport-1&quot;, &quot;delivery_tag&quot;: 1}, &quot;redelivery&quot;: {&quot;message_id&quot;: &quot;transport-1&quot;, &quot;delivery_tag&quot;: 1, &quot;redelivered&quot;: true}, &quot;republished_message_id&quot;: &quot;new-transport-same-business&quot;, &quot;at_crash&quot;: {&quot;effects&quot;: 1, &quot;total&quot;: 37, &quot;operations&quot;: [[&quot;report-27&quot;, 37]], &quot;duplicate&quot;: null}, &quot;recovered&quot;: {&quot;effects&quot;: 1, &quot;total&quot;: 37, &quot;operations&quot;: [[&quot;report-27&quot;, 37]], &quot;duplicate&quot;: true}, &quot;after_republish&quot;: {&quot;effects&quot;: 1, &quot;total&quot;: 37, &quot;operations&quot;: [[&quot;report-27&quot;, 37]], &quot;duplicate&quot;: true}}, &quot;ack_first&quot;: {&quot;kill_exit&quot;: -9, &quot;ready_messages&quot;: 0, &quot;business&quot;: {&quot;effects&quot;: 0, &quot;total&quot;: 0, &quot;operations&quot;: [], &quot;duplicate&quot;: null}, &quot;business_oracle_passed&quot;: false}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="540" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">把崩溃放在提交与ACK两边</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">真实子进程SIGKILL；同一代理与独立SQLite业务记录。</text><text x="32" y="168" font-size="22" fill="#236e5e" font-weight="600" text-anchor="start">正确恢复</text><rect x="220" y="135" width="120" height="64" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="280" y="174" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">接收</text><path d="M340 167L351 167" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="355" y="135" width="120" height="64" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="415" y="174" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">提交37</text><path d="M475 167L486 167" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="490" y="135" width="120" height="64" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="550" y="174" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">退出</text><path d="M610 167L621 167" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="625" y="135" width="120" height="64" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="685" y="174" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">重投/查回执</text><path d="M745 167L756 167" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="760" y="135" width="120" height="64" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="820" y="174" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">ACK</text><text x="220" y="248" font-size="23" fill="#236e5e" font-weight="600" text-anchor="start">效果1次，合计37</text><text x="32" y="343" font-size="22" fill="#a34242" font-weight="600" text-anchor="start">过早ACK负例</text><rect x="220" y="310" width="120" height="64" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="280" y="349" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">接收</text><path d="M340 342L351 342" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="355" y="310" width="120" height="64" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="415" y="349" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">ACK</text><path d="M475 342L486 342" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="490" y="310" width="120" height="64" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="550" y="349" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">退出</text><path d="M610 342L621 342" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="625" y="310" width="120" height="64" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="685" y="349" font-size="17" fill="#24344d" font-weight="400" text-anchor="middle">业务尚未发生</text><text x="220" y="423" font-size="23" fill="#a34242" font-weight="600" text-anchor="start">队列0，效果0；任务遗漏</text><text x="32" y="500" font-size="21" fill="#60708b" font-weight="400" text-anchor="start">去重必须发生在效果接收方；队列清空不能替代业务验收。</text></g></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><title id="title">缓存失效成功，旧值仍可能回来</title><desc id="desc">按一到四的顺序：读者读出 v7，写者提交 v8，写者删除缓存，读者晚回填 v7。最终数据库是 v8，缓存是 v7。</desc><rect x="0" y="0" width="960" height="600" rx="14" fill="#f6f8fc" stroke="#f6f8fc" /><text x="32" y="33" fill="#315dce" font-size="12" font-weight="650">INFRAGUIDE  /  CLOUD FOUNDATIONS</text><text x="32" y="76" fill="#203553" font-size="27" font-weight="700">缓存失效成功，旧值仍可能回来</text><text x="32" y="110" fill="#526780" font-size="17" font-weight="400">从上到下读，每一行只发生一个事件。空缓存也可以被成功失效。</text><text x="52" y="164" fill="#315dce" font-size="17" font-weight="650">时序</text><text x="126" y="164" fill="#315dce" font-size="17" font-weight="650">发生的动作</text><text x="515" y="164" fill="#315dce" font-size="17" font-weight="650">数据库</text><text x="733" y="164" fill="#315dce" font-size="17" font-weight="650">缓存</text><rect x="32" y="180" width="896" height="54" rx="6" fill="#fff" stroke="#d1dce9" /><text x="52" y="214" fill="#315dce" font-size="17" font-weight="650">t1</text><text x="126" y="214" fill="#203553" font-size="17" font-weight="400">R 未命中，从库中读出 v7</text><text x="515" y="214" fill="#24766c" font-size="17" font-weight="400">v7 · 待发货</text><text x="733" y="214" fill="#526780" font-size="17" font-weight="600">空</text><rect x="32" y="242" width="896" height="54" rx="6" fill="#fff" stroke="#d1dce9" /><text x="52" y="276" fill="#315dce" font-size="17" font-weight="650">t2</text><text x="126" y="276" fill="#203553" font-size="17" font-weight="400">W 提交发货更新</text><text x="515" y="276" fill="#24766c" font-size="17" font-weight="400">v8 · 已发货</text><text x="733" y="276" fill="#526780" font-size="17" font-weight="600">空</text><rect x="32" y="304" width="896" height="54" rx="6" fill="#fff" stroke="#d1dce9" /><text x="52" y="338" fill="#315dce" font-size="17" font-weight="650">t3</text><text x="126" y="338" fill="#203553" font-size="17" font-weight="400">W 对该订单执行失效</text><text x="515" y="338" fill="#24766c" font-size="17" font-weight="400">v8 · 已发货</text><text x="733" y="338" fill="#526780" font-size="17" font-weight="600">空</text><rect x="32" y="366" width="896" height="54" rx="6" fill="#fff8ec" stroke="#ead4aa" /><text x="52" y="400" fill="#315dce" font-size="17" font-weight="650">t4</text><text x="126" y="400" fill="#203553" font-size="17" font-weight="400">R 恢复执行，回填早先的 v7</text><text x="515" y="400" fill="#24766c" font-size="17" font-weight="400">v8 · 已发货</text><text x="733" y="400" fill="#985b23" font-size="17" font-weight="600">v7 · 待发货</text><rect x="32" y="445" width="896" height="79" rx="8" fill="#edf2fe" stroke="#afc4f2" /><text x="52" y="474" fill="#315dce" font-size="16" font-weight="650">判断边界</text><text x="52" y="503" fill="#203553" font-size="16" font-weight="400">从 t4 开始，命中缓存的读者会看到 v7。若最低版本为 v8，应拒绝这次旧回填。</text><text x="32" y="564" fill="#526780" font-size="15" font-weight="400">教学时序。版本按同一订单单调递增，行距没有时间尺度。</text></svg>
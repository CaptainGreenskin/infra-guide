<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">同一权重，复用程度改变性能限制</title><desc id="desc">带宽上界随算术强度上升，与计算上界在150 FLOP每字节相交。图为概念示意，并非实测。</desc><style>text{font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif}</style><rect x="1" y="1" width="958" height="578" rx="10" fill="#f7f9fe" stroke="#d8e1ed"/><text x="30" y="40" font-size="12" fill="#315dce">INFRAGUIDE / ORIGINAL TEACHING DIAGRAM</text><text x="30" y="77" font-size="27" fill="#1c283d" font-weight="700">同一权重，复用程度改变性能限制</text><text x="45" y="115" font-size="17" fill="#58667e">纵轴：可达速率上界 / TFLOP/s</text><path d="M100 425 V150 M100 425 H880" fill="none" stroke="#6b768b" stroke-width="2"/><path d="M100 425 L500 190 L860 190" fill="none" stroke="#315dce" stroke-width="5"/><path d="M500 425 V190" fill="none" stroke="#a8b6d1" stroke-dasharray="6 6"/><text x="30" y="199" font-size="18" fill="#1c283d">300</text><text x="450" y="454" font-size="18" fill="#1c283d">150 FLOP/B</text><text x="130" y="355" font-size="20" fill="#315dce" font-weight="700">带宽上界 B × I</text><text x="575" y="170" font-size="20" fill="#315dce" font-weight="700">计算上界 C</text><text x="420" y="495" font-size="19" fill="#1c283d">横轴：算术强度 I / FLOP/字节</text><rect x="130" y="230" width="170" height="75" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="145" y="260" font-size="19" fill="#1c283d" font-weight="700">M=1：I≈1</text><text x="145" y="286" font-size="17" fill="#1c283d">理想偏带宽侧</text><rect x="610" y="270" width="235" height="75" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="625" y="300" font-size="19" fill="#1c283d" font-weight="700">M=256：I≈227.56</text><text x="625" y="326" font-size="17" fill="#1c283d">理想偏计算侧</text><text x="40" y="546" font-size="16" fill="#58667e">题设 C=300 TFLOP/s，B=2 TB/s。图为概念示意，坐标未按数值比例绘制。</text></svg>
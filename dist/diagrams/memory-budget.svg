<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="title desc"><title id="title">显存预算：参数只是其中一部分</title><desc id="desc">训练状态分为参数、梯度和优化器状态；在这个 FP32 Adam 示例中分别为 4、4 和 8 字节每参数。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#61748e}.title{font-size:22px;font-weight:700}.eyebrow{font-size:10px;fill:#315dce;letter-spacing:2px}</style><rect width="960" height="415" rx="14" fill="#f6f8fc"/><text x="30" y="30" class="eyebrow">CLOUDINFRA GUIDE / TRAINING SYSTEMS</text><text x="30" y="67" class="title">显存预算：参数只是其中一部分</text><text x="35" y="115" class="small">示例口径：FP32 参数 + FP32 梯度 + Adam 一阶与二阶状态；不含激活和临时缓冲。</text><rect x="35" y="155" width="190" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="130.0" y="185" text-anchor="middle" class="label">参数</text><text x="130.0" y="208" text-anchor="middle" class="small">4 bytes / parameter</text><rect x="240" y="155" width="190" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="335.0" y="185" text-anchor="middle" class="label">梯度</text><text x="335.0" y="208" text-anchor="middle" class="small">4 bytes / parameter</text><rect x="445" y="155" width="380" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="635.0" y="185" text-anchor="middle" class="label">Adam 状态</text><text x="635.0" y="208" text-anchor="middle" class="small">8 bytes / parameter</text><text x="35" y="300" class="label">训练状态近似：16 × 参数量（bytes）</text><text x="35" y="337" class="small">1B 参数 → 约 16 GB（十进制）训练状态；实际显存峰值还要加激活、通信与分配器开销。</text><text x="35" y="378" class="small">DDP 复制这些状态；分片策略按规则拆分部分状态。切换 BF16 不等于整体显存直接减半。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 565" role="img" aria-labelledby="title desc"><title id="title">两份状态可以争夺同一个实物</title><desc id="desc">blue与green状态lineage不同，但目标路径相同；green改beta后blue缓存计划仍可无变化。</desc><metadata>{&quot;kind&quot;: &quot;actual_workspace_collision&quot;, &quot;execution&quot;: {&quot;blue&quot;: {&quot;serial&quot;: 3, &quot;lineage&quot;: &quot;d330b779-d408-c70a-1d69-b562065023e0&quot;, &quot;resources&quot;: [{&quot;address&quot;: &quot;local_file.managed&quot;, &quot;content&quot;: &quot;alpha&quot;}, {&quot;address&quot;: &quot;terraform_data.gate&quot;, &quot;content&quot;: null}]}, &quot;green&quot;: {&quot;serial&quot;: 3, &quot;lineage&quot;: &quot;9051aaac-7ce7-131e-9d88-c5b30e83a00d&quot;, &quot;resources&quot;: [{&quot;address&quot;: &quot;local_file.managed&quot;, &quot;content&quot;: &quot;beta&quot;}, {&quot;address&quot;: &quot;terraform_data.gate&quot;, &quot;content&quot;: null}]}, &quot;same_target&quot;: &quot;ROOT/managed.txt&quot;, &quot;actual_file&quot;: &quot;beta&quot;, &quot;blue_cached_plan_exit&quot;: 0, &quot;blue_fresh_plan_exit&quot;: 2}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="565" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">两份状态可以争夺同一个实物</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">工作空间有各自状态身份，配置却仍指向同一个实际路径。</text><rect x="32" y="135" width="370" height="116" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="173" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">blue状态</text><text x="52" y="213" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">记住content=alpha</text><rect x="555" y="135" width="370" height="116" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="575" y="173" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">green状态</text><text x="575" y="213" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">记住content=beta</text><path d="M215 255L425 325" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M740 255L530 325" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="290" y="330" width="380" height="90" rx="7" fill="#fae9e6" stroke="#cbd6e8"/><text x="480" y="364" font-size="22" fill="#24344d" font-weight="400" text-anchor="middle">同一个ROOT/managed.txt</text><text x="480" y="398" font-size="20" fill="#a34242" font-weight="400" text-anchor="middle">green写入后实际为beta</text><text x="32" y="480" font-size="21" fill="#946020" font-weight="400" text-anchor="start">blue不刷新：计划退出0；blue重新观察：退出2，发现差异。</text><text x="32" y="525" font-size="20" fill="#60708b" font-weight="400" text-anchor="start">状态分开，不自动提供资源命名、权限或网络隔离。</text></g></svg>
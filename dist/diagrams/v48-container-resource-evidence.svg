<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">CPU、内存、线程：分别核对不同限制</title><desc id="desc">真实CPU计数增量、96MiB容器OOM和16个任务名额，不能用宿主利用率或单一退出码互相替代。</desc><metadata>{&quot;kind&quot;: &quot;actual_resource_observations&quot;, &quot;cases&quot;: [{&quot;checksum&quot;: 15164, &quot;cpu_max&quot;: &quot;50000 100000&quot;, &quot;cpu_stat_delta&quot;: {&quot;burst_usec&quot;: 0, &quot;core_sched.force_idle_usec&quot;: 0, &quot;nice_usec&quot;: 0, &quot;nr_bursts&quot;: 0, &quot;nr_periods&quot;: 25, &quot;nr_throttled&quot;: 25, &quot;system_usec&quot;: 515, &quot;throttled_usec&quot;: 1249294, &quot;usage_usec&quot;: 1247581, &quot;user_usec&quot;: 1247067}, &quot;memory_max&quot;: 100663296, &quot;mode&quot;: &quot;cpu&quot;, &quot;namespaces&quot;: {&quot;mnt&quot;: &quot;mnt:[4026532262]&quot;, &quot;net&quot;: &quot;net:[4026532267]&quot;, &quot;pid&quot;: &quot;pid:[4026532265]&quot;}, &quot;pid&quot;: 1, &quot;pids_max&quot;: 16, &quot;wall_seconds&quot;: 2.500285391000002}, {&quot;cpu_max&quot;: &quot;50000 100000&quot;, &quot;created_threads&quot;: 15, &quot;memory_max&quot;: 100663296, &quot;mode&quot;: &quot;pids&quot;, &quot;namespaces&quot;: {&quot;mnt&quot;: &quot;mnt:[4026532262]&quot;, &quot;net&quot;: &quot;net:[4026532268]&quot;, &quot;pid&quot;: &quot;pid:[4026532266]&quot;}, &quot;pid&quot;: 1, &quot;pids_current&quot;: 16, &quot;pids_max&quot;: 16, &quot;pids_max_events_delta&quot;: 1, &quot;refusal&quot;: &quot;can&#x27;t start new thread&quot;}, {&quot;mode&quot;: &quot;oom&quot;, &quot;exit_code&quot;: 137, &quot;oom_killed&quot;: true}], &quot;cpu_budget_fraction&quot;: [1, 2], &quot;fixed_performance_claim&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="490" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">CPU、内存、线程：分别核对不同限制</text><text x="32" y="87" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">本轮Linux CI读数；计数差值只属于这次负载和采样窗口。</text><text x="32" y="134" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">CPU带宽</text><text x="270" y="132" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">每100ms周期：预算50ms CPU时间</text><rect x="270" y="150" width="600" height="36" rx="7" fill="#f2f4f8" stroke="#cbd6e8"/><rect x="270" y="150" width="300" height="36" rx="7" fill="#9db5f0" stroke="#cbd6e8"/><text x="270" y="217" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">usage +1,247,581µs；throttled +25个周期</text><path d="M32 242L928 242" stroke="#dce3ee" stroke-width="2" fill="none"/><text x="32" y="282" font-size="23" fill="#946020" font-weight="600" text-anchor="start">内存边界</text><rect x="270" y="256" width="260" height="55" rx="7" fill="#fff2df" stroke="#dcc49f"/><text x="400" y="291" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">96MiB = 100,663,296B</text><path d="M540 284L610 284" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="630" y="277" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">触碰页面，继续申请</text><text x="630" y="307" font-size="19" fill="#a34242" font-weight="400" text-anchor="start">137 + OOMKilled=true</text><path d="M32 335L928 335" stroke="#dce3ee" stroke-width="2" fill="none"/><text x="32" y="378" font-size="23" fill="#236e5e" font-weight="600" text-anchor="start">任务名额</text><rect x="270" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="284" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">1</text><rect x="306" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="320" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">2</text><rect x="342" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="356" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">3</text><rect x="378" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="392" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">4</text><rect x="414" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="428" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">5</text><rect x="450" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="464" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">6</text><rect x="486" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="500" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">7</text><rect x="522" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="536" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">8</text><rect x="558" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="572" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">9</text><rect x="594" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="608" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">10</text><rect x="630" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="644" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">11</text><rect x="666" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="680" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">12</text><rect x="702" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="716" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">13</text><rect x="738" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="752" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">14</text><rect x="774" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="788" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">15</text><rect x="810" y="353" width="29" height="34" rx="7" fill="#b3dbcf" stroke="#cbd6e8"/><text x="824" y="376" font-size="13" fill="#24344d" font-weight="400" text-anchor="middle">16</text><text x="270" y="423" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">主线程1 + 等待线程15 = 16；再建线程被拒绝</text><text x="270" y="455" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">pids.events max增量=1；线程同样计入任务名额。</text></g></svg>
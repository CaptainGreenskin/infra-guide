<text x="36" y="48" font-size="29" fill="#202d41" font-weight="700" text-anchor="start">成员能返回37，不等于它能代表已提交的42</text>
<text x="36" y="83" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">把网络、成员存活、读取语义和多数提交分别核对。</text>
<text x="70" y="132" font-size="23" fill="#263448" font-weight="700" text-anchor="start">隔离侧：旧 leader n0</text><text x="664" y="132" font-size="23" fill="#263448" font-weight="700" text-anchor="start">多数侧：另外两个成员</text><path d="M558 154 L558 824" stroke="#c5cfe0" stroke-width="2" stroke-dasharray="8 8"/><text x="36" y="169" font-size="21" fill="#315dce" font-weight="700" text-anchor="start">① 分区前</text><rect x="36" y="189" width="500" height="77" rx="10" fill="#f0f4fd" stroke="#cbd6eb"/><rect x="584" y="189" width="500" height="77" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="54" y="233" font-size="18" fill="#263448" font-weight="400" text-anchor="start">limit=37；读状态 revision=6</text><text x="604" y="233" font-size="18" fill="#263448" font-weight="400" text-anchor="start">三个成员可共同提交</text><text x="36" y="295" font-size="21" fill="#315dce" font-weight="700" text-anchor="start">② 断开专用网络</text><rect x="36" y="315" width="500" height="77" rx="10" fill="#f0f4fd" stroke="#cbd6eb"/><rect x="584" y="315" width="500" height="77" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="54" y="359" font-size="18" fill="#263448" font-weight="400" text-anchor="start">进程仍存活；客户端 exec 访问本机127.0.0.1</text><text x="604" y="359" font-size="18" fill="#263448" font-weight="400" text-anchor="start">选出 n1；任期 2 → 3</text><text x="36" y="423" font-size="21" fill="#315dce" font-weight="700" text-anchor="start">③ 多数提交42</text><rect x="36" y="443" width="500" height="77" rx="10" fill="#f0f4fd" stroke="#cbd6eb"/><rect x="584" y="443" width="500" height="77" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="54" y="487" font-size="18" fill="#263448" font-weight="400" text-anchor="start">本地状态仍是37 / revision=6</text><text x="604" y="487" font-size="18" fill="#263448" font-weight="400" text-anchor="start">真实写入42 / revision=7</text><text x="36" y="551" font-size="21" fill="#315dce" font-weight="700" text-anchor="start">④ 按读语义观察</text><rect x="36" y="571" width="500" height="77" rx="10" fill="#fff4e4" stroke="#cbd6eb"/><rect x="584" y="571" width="500" height="77" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="54" y="615" font-size="18" fill="#263448" font-weight="400" text-anchor="start">可陈旧读：37；默认读与写：退出码1</text><text x="604" y="615" font-size="18" fill="#263448" font-weight="400" text-anchor="start">默认读：42；具备多数提交条件</text><text x="36" y="685" font-size="21" fill="#315dce" font-weight="700" text-anchor="start">⑤ 恢复原网络</text><rect x="36" y="705" width="500" height="77" rx="10" fill="#f0f4fd" stroke="#cbd6eb"/><rect x="584" y="705" width="500" height="77" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="54" y="749" font-size="18" fill="#263448" font-weight="400" text-anchor="start">追平，默认读取42 / revision=7</text><text x="604" y="749" font-size="18" fill="#263448" font-weight="400" text-anchor="start">当前历史继续有效</text><path d="M596 765 L526 765" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="846" font-size="19" fill="#46556a" font-weight="400" text-anchor="start">另行停机：3成员停掉2个 → 仅1个，无2票多数；恢复第二个原成员后写43成功。</text><text x="36" y="884" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">记录的是同一宿主中的实际网络隔离与进程停机；纵向先后不是墙钟比例。</text>
</g></svg>

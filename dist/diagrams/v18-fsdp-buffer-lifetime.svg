<svg xmlns="http://www.w3.org/2000/svg" width="960" height="682" viewBox="0 0 960 682" role="img" aria-labelledby="title desc" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<title id="title">分片常驻相同，为什么预取会越过显存上限？</title><desc id="desc">两条时间线都从4 GiB常驻状态开始，A的独立完整缓冲1 GiB，B的独立完整缓冲0.5 GiB。先释放A再聚合B时峰值5 GiB；A仍存活时预取B则到5.5 GiB，高于5.25 GiB容量线。</desc>
<rect x="1" y="1" width="958" height="680" rx="17" fill="#fbfdfe" stroke="#c0d2d9"/>
<text x="34" y="46" font-size="31" fill="#183546" font-weight="700" text-anchor="start">同一份分片，为什么预取会越过显存上限？</text>
<text x="35" y="80" font-size="20" fill="#45616e" font-weight="400" text-anchor="start">只改变 A、B 两组完整参数缓冲的存活时段。以下是独立教学题设。</text>
<rect x="32" y="99" width="896" height="72" rx="10" fill="#edf4f6" stroke="none"/>
<text x="50" y="128" font-size="19" fill="#183546" font-weight="400" text-anchor="start">常驻分片 4 GiB 已记入基线。新申请的 A、B 缓冲独立占用空间，均不与分片复用。</text>
<rect x="51" y="144" width="18" height="14" rx="0" fill="#216a9b" stroke="none"/>
<text x="78" y="157" font-size="18" fill="#183546" font-weight="400" text-anchor="start">A · 1 GiB</text>
<rect x="209" y="144" width="18" height="14" rx="0" fill="#d58833" stroke="none"/>
<text x="236" y="157" font-size="18" fill="#183546" font-weight="400" text-anchor="start">B · 0.5 GiB</text>
<line x1="390" y1="150" x2="432" y2="150" stroke="#974a0e" stroke-width="2" stroke-dasharray="6 4"/>
<text x="443" y="157" font-size="18" fill="#974a0e" font-weight="650" text-anchor="start">容量线 · 5.25 GiB</text>
<rect x="32" y="197" width="896" height="154" rx="9" fill="#f2f7f9" stroke="none"/>
<text x="49" y="245" font-size="23" fill="#183546" font-weight="700" text-anchor="start">顺序聚合</text>
<text x="49" y="278" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">释放 A 后申请 B</text>
<text x="49" y="319" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">基线 4 GiB</text>
<line x1="209" y1="201" x2="209" y2="313" stroke="#95a9b3" stroke-width="1"/>
<line x1="209" y1="313" x2="837" y2="313" stroke="#7b929b" stroke-width="1.5"/>
<line x1="209" y1="208" x2="209" y2="313" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="350" y1="208" x2="350" y2="313" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="515" y1="208" x2="515" y2="313" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="683" y1="208" x2="683" y2="313" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="837" y1="208" x2="837" y2="313" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="350" y="245" width="165" height="68" rx="0" fill="#216a9b" stroke="none"/>
<text x="432.5" y="285" font-size="20" fill="white" font-weight="700" text-anchor="middle">A · 5 GiB</text>
<rect x="515" y="279" width="168" height="34" rx="0" fill="#d58833" stroke="none"/>
<text x="599.0" y="303" font-size="20" fill="#2d2018" font-weight="700" text-anchor="middle">B</text>

<line x1="209" y1="228" x2="841" y2="228" stroke="#974a0e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="849" y="235" font-size="18" fill="#974a0e" font-weight="650" text-anchor="start">5.25</text>
<text x="279.5" y="340" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">起点</text>
<text x="432.5" y="340" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">聚合 A</text>
<text x="599.0" y="340" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">对比时刻</text>
<text x="760.0" y="340" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">收尾</text>
<rect x="32" y="379" width="896" height="154" rx="9" fill="#eff6f7" stroke="none"/>
<text x="49" y="427" font-size="23" fill="#183546" font-weight="700" text-anchor="start">提前预取</text>
<text x="49" y="460" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">A 在用时申请 B</text>
<text x="49" y="501" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">基线 4 GiB</text>
<line x1="209" y1="383" x2="209" y2="495" stroke="#95a9b3" stroke-width="1"/>
<line x1="209" y1="495" x2="837" y2="495" stroke="#7b929b" stroke-width="1.5"/>
<line x1="209" y1="390" x2="209" y2="495" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="350" y1="390" x2="350" y2="495" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="515" y1="390" x2="515" y2="495" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="683" y1="390" x2="683" y2="495" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="837" y1="390" x2="837" y2="495" stroke="#d0dce2" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="350" y="427" width="165" height="68" rx="0" fill="#216a9b" stroke="none"/>
<text x="432.5" y="467" font-size="22" fill="white" font-weight="700" text-anchor="middle">A</text>
<rect x="515" y="427" width="168" height="68" rx="0" fill="#216a9b" stroke="none"/>
<rect x="515" y="393" width="168" height="34" rx="0" fill="#d58833" stroke="none"/>
<text x="599.0" y="467" font-size="22" fill="white" font-weight="700" text-anchor="middle">A</text>
<rect x="683" y="461" width="154" height="34" rx="0" fill="#d58833" stroke="none"/>
<text x="760.0" y="485" font-size="20" fill="#2d2018" font-weight="700" text-anchor="middle">B</text>
<text x="599.0" y="389" font-size="18" fill="#974a0e" font-weight="700" text-anchor="middle">A＋B · 5.5 GiB</text>
<line x1="209" y1="410" x2="841" y2="410" stroke="#974a0e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="849" y="417" font-size="18" fill="#974a0e" font-weight="650" text-anchor="start">5.25</text>
<text x="279.5" y="522" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">起点</text>
<text x="432.5" y="522" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">聚合 A</text>
<text x="599.0" y="522" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">对比时刻</text>
<text x="760.0" y="522" font-size="18" fill="#45616e" font-weight="500" text-anchor="middle">收尾</text>
<rect x="32" y="552" width="896" height="66" rx="9" fill="#e4f2f0" stroke="none"/>
<text x="48" y="579" font-size="21" fill="#183546" font-weight="700" text-anchor="start">顺序峰值 5 GiB，低于容量线。预取峰值 5.5 GiB，超出 0.25 GiB。</text>
<text x="48" y="605" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">同一时刻，A 和 B 是否还活着，决定这笔新增开销能否相加。</text>
<text x="35" y="643" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">纵向从 4 GiB 起算，横向表示事件顺序，不表示真实时长。</text>
<text x="35" y="669" font-size="18" fill="#45616e" font-weight="400" text-anchor="start">暂不计激活、工作区及其他分配；图示为手算，不是 GPU 实测。</text>
</svg>

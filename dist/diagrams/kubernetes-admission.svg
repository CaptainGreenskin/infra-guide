<svg xmlns="http://www.w3.org/2000/svg" width="460" height="432" viewBox="0 0 460 432" role="img" aria-labelledby="admission-title admission-desc">
  <title id="admission-title">同一账号的 Kubernetes 授权与准入</title>
  <desc id="admission-desc">report-writer 在报表 A 和 B 有创建 Pod 的权限。A 的普通 Pod 和 B 的特权 Pod 创建成功。A 的特权 Pod 被准入规则拒绝。C 未授予创建权限。管理员只能读到两个创建成功的对象。</desc>
  <metadata>{"record":"labs/kubernetes-admission/validation.json","identity":"report-writer","namespaces":["report-a","report-a","report-b","report-c"],"authorized":[true,true,true,false],"create":[201,422,201,403],"admin_get":[200,404,200,404]}</metadata>

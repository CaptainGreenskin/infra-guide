<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">一次 DDP 更新：计算与通信如何配合</title><desc id="desc">两条 rank 流水线分别执行数据读取和前反向，通过 AllReduce 同步梯度，最后更新各自模型副本。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#61748e}.title{font-size:22px;font-weight:700}.eyebrow{font-size:10px;fill:#315dce;letter-spacing:2px}</style><rect width="960" height="450" rx="14" fill="#f6f8fc"/><text x="30" y="30" class="eyebrow">CLOUDINFRA GUIDE / TRAINING SYSTEMS</text><text x="30" y="67" class="title">一次 DDP 更新：计算与通信如何配合</text><text x="32" y="115" class="small">不同 rank 处理不同数据分片，但在同步点得到一致的平均梯度。</text><text x="35" y="190" class="label">RANK 0</text><rect x="145" y="155" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="227.5" y="185" text-anchor="middle" class="label">数据分片</text><text x="227.5" y="208" text-anchor="middle" class="small">batch 0</text><rect x="330" y="155" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="412.5" y="185" text-anchor="middle" class="label">前向 / 反向</text><text x="412.5" y="208" text-anchor="middle" class="small">本地梯度</text><rect x="535" y="155" width="165" height="80" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="617.5" y="185" text-anchor="middle" class="label">AllReduce</text><text x="617.5" y="208" text-anchor="middle" class="small">梯度归约</text><rect x="740" y="155" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="822.5" y="185" text-anchor="middle" class="label">Optimizer</text><text x="822.5" y="208" text-anchor="middle" class="small">更新副本</text><path d="M310 195 L330 195" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M495 195 L535 195" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M700 195 L740 195" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="330" class="label">RANK 1</text><rect x="145" y="295" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="227.5" y="325" text-anchor="middle" class="label">数据分片</text><text x="227.5" y="348" text-anchor="middle" class="small">batch 1</text><rect x="330" y="295" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="412.5" y="325" text-anchor="middle" class="label">前向 / 反向</text><text x="412.5" y="348" text-anchor="middle" class="small">本地梯度</text><rect x="535" y="295" width="165" height="80" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="617.5" y="325" text-anchor="middle" class="label">AllReduce</text><text x="617.5" y="348" text-anchor="middle" class="small">梯度归约</text><rect x="740" y="295" width="165" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="822.5" y="325" text-anchor="middle" class="label">Optimizer</text><text x="822.5" y="348" text-anchor="middle" class="small">更新副本</text><path d="M310 335 L330 335" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M495 335 L535 335" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M700 335 L740 335" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M617 235 L617 295" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="420" class="small">图示是逻辑依赖；实际 DDP 会按梯度桶发起通信，并可与反向计算重叠。</text></svg>
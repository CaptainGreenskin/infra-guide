<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img"><title>重计算少保存了什么？先观察对象，再测整步峰值</title><desc>activation checkpoint管理前向中间状态；持久化checkpoint管理故障后的训练恢复。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="728" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">重计算少保存了什么？先观察对象，再测整步峰值</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">activation checkpoint管理前向中间状态；持久化checkpoint管理故障后的训练恢复。</text><text x="38" y="130" font-size="22" fill="#315dce" font-weight="700">相同输入 → 三个相同Block → 相同损失；复制权重后对照</text><rect x="36" y="157" width="500" height="337" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="56" y="199" font-size="25" fill="#315dce" font-weight="700">普通反向</text><text x="56" y="251" font-size="22" fill="#17263e" font-weight="400">前向结束：保存供反向使用的</text><text x="56" y="289" font-size="22" fill="#17263e" font-weight="400">非参数底层存储，已去重</text><text x="56" y="348" font-size="37" fill="#315dce" font-weight="700">32768 字节</text><text x="56" y="406" font-size="22" fill="#17263e" font-weight="400">前向入口计数：[1, 1, 1]</text><text x="56" y="451" font-size="22" fill="#17263e" font-weight="400">反向后入口计数：[1, 1, 1]</text><rect x="584" y="157" width="500" height="337" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="604" y="199" font-size="25" fill="#315dce" font-weight="700">非重入重计算</text><text x="604" y="251" font-size="22" fill="#17263e" font-weight="400">前向结束：保存供反向使用的</text><text x="604" y="289" font-size="22" fill="#17263e" font-weight="400">非参数底层存储，已去重</text><text x="604" y="348" font-size="37" fill="#12725b" font-weight="700">8192 字节</text><text x="604" y="406" font-size="22" fill="#17263e" font-weight="400">前向入口计数：[1, 1, 1]</text><text x="604" y="451" font-size="22" fill="#17263e" font-weight="400">反向后入口计数：[2, 2, 2]</text><rect x="36" y="533" width="1048" height="104" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="572" font-size="25" fill="#315dce" font-weight="700">本次输出最大误差0；参数及输入梯度最大误差0。</text><text x="58" y="612" font-size="20" fill="#17263e" font-weight="400">入口多调用一次 ≠ 每块完整重跑两遍 ≠ 步耗时两倍。非重入重算可提前停止。</text><text x="38" y="692" font-size="18" fill="#56667d" font-weight="400">实际CPU saved-tensor hook观察；不是整步峰值或RSS。本例无dropout，未检验随机状态兼容。</text></g></svg>

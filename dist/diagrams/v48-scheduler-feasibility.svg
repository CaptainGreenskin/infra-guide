<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" role="img" aria-labelledby="title desc"><title id="title">集群总量足够，不等于存在可行节点</title><desc id="desc">资源形状先逐节点同时检查CPU与内存，再看约束；kind实测5CPU的单Pod不能放进任何4CPU节点。</desc><metadata>{&quot;kind&quot;: &quot;declared_shape_and_actual_cpu&quot;, &quot;declared&quot;: {&quot;A&quot;: [4, 4], &quot;B&quot;: [2, 8], &quot;request&quot;: [3, 6]}, &quot;allocatable&quot;: {&quot;infra-schedule-85c063dc8d-worker&quot;: {&quot;cpu&quot;: &quot;4&quot;, &quot;ephemeral-storage&quot;: &quot;151361008Ki&quot;, &quot;hugepages-1Gi&quot;: &quot;0&quot;, &quot;hugepages-2Mi&quot;: &quot;0&quot;, &quot;memory&quot;: &quot;16365628Ki&quot;, &quot;pods&quot;: &quot;110&quot;}, &quot;infra-schedule-85c063dc8d-worker2&quot;: {&quot;cpu&quot;: &quot;4&quot;, &quot;ephemeral-storage&quot;: &quot;151361008Ki&quot;, &quot;hugepages-1Gi&quot;: &quot;0&quot;, &quot;hugepages-2Mi&quot;: &quot;0&quot;, &quot;memory&quot;: &quot;16365628Ki&quot;, &quot;pods&quot;: &quot;110&quot;}}, &quot;actual_request_millicpu&quot;: 5000}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="465" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">集群总量足够，不等于存在可行节点</text><text x="32" y="88" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">左：声明手算，不是节点监控；右：本次kind API实际读数。</text><text x="40" y="135" font-size="19" fill="#24344d" font-weight="600" text-anchor="start">节点</text><text x="155" y="135" font-size="19" fill="#24344d" font-weight="600" text-anchor="start">剩CPU</text><text x="280" y="135" font-size="19" fill="#24344d" font-weight="600" text-anchor="start">剩内存</text><text x="415" y="135" font-size="19" fill="#24344d" font-weight="600" text-anchor="start">要3 CPU / 6Gi</text><text x="40" y="190" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">A</text><text x="155" y="190" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">4</text><text x="280" y="190" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">4Gi</text><text x="415" y="190" font-size="20" fill="#a34242" font-weight="400" text-anchor="start">内存不够</text><text x="40" y="245" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">B</text><text x="155" y="245" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">2</text><text x="280" y="245" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">8Gi</text><text x="415" y="245" font-size="20" fill="#a34242" font-weight="400" text-anchor="start">CPU不够</text><rect x="40" y="285" width="500" height="92" rx="7" fill="#fff2df" stroke="#dcc49f"/><text x="62" y="322" font-size="22" fill="#946020" font-weight="600" text-anchor="start">总量6 CPU / 12Gi</text><text x="62" y="354" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">同一节点不能同时满足 → 无可行解</text><path d="M570 120L570 435" stroke="#dce3ee" stroke-width="2" fill="none"/><text x="605" y="140" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">kind实际记录</text><text x="605" y="185" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">工作节点A：4 CPU</text><text x="605" y="227" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">工作节点B：4 CPU</text><text x="605" y="280" font-size="22" fill="#a34242" font-weight="600" text-anchor="start">单Pod请求：5 CPU</text><text x="605" y="325" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">PodScheduled=False</text><text x="605" y="360" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">nodeName为空</text><text x="32" y="430" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">kind节点共享一台宿主；报告容量不能相加当作独立物理供给。</text></g></svg>
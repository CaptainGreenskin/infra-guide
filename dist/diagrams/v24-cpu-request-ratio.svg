<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>CPU利用率：先对齐分子和分母</title><desc>本例m为千分之一核：两Pod都用90m，但request分别为100m与900m。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">CPU利用率：先对齐分子和分母</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">本例m为千分之一核：两Pod都用90m，但request分别为100m与900m。</text><text x="38" y="132" font-size="21" fill="#315dce" font-weight="700">同一把尺：每个像素宽度对应相同的CPU请求量</text><text x="38" y="204" font-size="22" fill="#17263e" font-weight="700">Pod A</text><rect x="197" y="173" width="70.0" height="48" rx="10" fill="#edf0f5" stroke="#ccd8e8"/><rect x="197" y="173" width="62.99999999999999" height="48" rx="5" fill="#315dce" stroke="#315dce"/><text x="197" y="250" font-size="20" fill="#17263e" font-weight="400">用量90m / request 100m = 90%</text><text x="38" y="297" font-size="22" fill="#17263e" font-weight="700">Pod B</text><rect x="197" y="266" width="630.0" height="48" rx="10" fill="#edf0f5" stroke="#ccd8e8"/><rect x="197" y="266" width="62.99999999999999" height="48" rx="5" fill="#315dce" stroke="#315dce"/><text x="197" y="343" font-size="20" fill="#17263e" font-weight="400">用量90m / request 900m = 10%</text><text x="38" y="390" font-size="22" fill="#17263e" font-weight="700">合计</text><rect x="197" y="359" width="700.0" height="48" rx="10" fill="#edf0f5" stroke="#ccd8e8"/><rect x="197" y="359" width="125.99999999999999" height="48" rx="5" fill="#315dce" stroke="#315dce"/><text x="197" y="436" font-size="20" fill="#17263e" font-weight="400">用量180m / request 1000m = 18%</text><rect x="36" y="479" width="1048" height="141" rx="10" fill="#edf2ff" stroke="#b4c6f0"/><text x="58" y="518" font-size="26" fill="#315dce" font-weight="700">按匹配request合并：180 / 1000 = 18%</text><text x="58" y="560" font-size="23" fill="#b53e3e" font-weight="700">先算各Pod百分比再平均：(90% + 10%) / 2 = 50%</text><text x="58" y="596" font-size="19" fill="#17263e" font-weight="400">request相同，两种算法可能刚好相同；分母不同就必须核对实际汇总口径。</text><text x="38" y="664" font-size="18" fill="#56667d" font-weight="400">资源利用率公式按Kubernetes v1.34.1实现核对；Prometheus固定输入也实际得到0.18与0.5。</text><text x="38" y="699" font-size="18" fill="#56667d" font-weight="400">图是题设账本，不是实时CPU采样；缺指标还要经过控制器保守计算，不能直接套此看板比值。</text></g></svg>

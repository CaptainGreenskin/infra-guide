<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 603" role="img" aria-labelledby="title desc"><title id="title">错误预算：累计用量与近期速率分开</title><desc id="desc">十格预算中六格已消耗；近期200个事件包含全部6个错误，因此近期消耗速率3倍，但累计消耗为60%。</desc><defs></defs><rect width="960" height="603" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="46" font-size="26" fill="#24344d" text-anchor="start" font-weight="700">错误预算：累计用量与近期速率分开</text><text x="30" y="92" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">同一组合成事件：1000 次里有 6 次坏事件，且都在最近 200 次中</text><text x="30" y="144" font-size="21" fill="#24344d" text-anchor="start" font-weight="600">全窗口 SLO = 99% → 允许坏事件 10 次</text><rect x="40" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="77" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">1</text><rect x="128" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="165" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">2</text><rect x="216" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="253" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">3</text><rect x="304" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="341" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">4</text><rect x="392" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="429" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">5</text><rect x="480" y="178" width="74" height="78" rx="6" fill="#efb476" stroke="none"/><text x="517" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">6</text><rect x="568" y="178" width="74" height="78" rx="6" fill="#b5dbd3" stroke="none"/><text x="605" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">7</text><rect x="656" y="178" width="74" height="78" rx="6" fill="#b5dbd3" stroke="none"/><text x="693" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">8</text><rect x="744" y="178" width="74" height="78" rx="6" fill="#b5dbd3" stroke="none"/><text x="781" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">9</text><rect x="832" y="178" width="74" height="78" rx="6" fill="#b5dbd3" stroke="none"/><text x="869" y="224" font-size="22" fill="#24344d" text-anchor="middle" font-weight="400">10</text><text x="40" y="292" font-size="20" fill="#9a5b26" text-anchor="start" font-weight="400">已消耗 6 / 10 = 60%</text><text x="555" y="292" font-size="20" fill="#236857" text-anchor="start" font-weight="400">剩余预算 4 次</text><path d="M30 328L930 328" stroke="#315dce" stroke-width="2" fill="none"/><text x="30" y="375" font-size="22" fill="#24344d" text-anchor="start" font-weight="600">最近窗口：6 / 200 = 3% 错误率</text><text x="30" y="417" font-size="20" fill="#24344d" text-anchor="start" font-weight="400">允许错误率 1% → 当前消耗速率 = 3% / 1% = 3×</text><text x="30" y="476" font-size="18" fill="#60708d" text-anchor="start" font-weight="400">全窗口：6 / 1000 = 0.6% → 同口径速率 0.6×</text><text x="30" y="531" font-size="19" fill="#24344d" text-anchor="start" font-weight="600">60% 是已用掉多少预算；3× 是近期按什么速度消耗。</text><text x="30" y="568" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">示意不含缺数与零流量；实际告警需定义事件、窗口及行动。</text></g></svg>
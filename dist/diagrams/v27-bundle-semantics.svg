<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>同样的张量形状，不同的词表含义</title><desc>输入先变成ID，ID再选择权重行；保存与加载成功只证明其中一层。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">同样的张量形状，不同的词表含义</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">输入先变成ID，ID再选择权重行；保存与加载成功只证明其中一层。</text><text x="38" y="131" font-size="22" fill="#315dce" font-weight="700">相同shape：embedding [3,1] / readout [1,1] / bias [1]</text><rect x="36" y="169" width="1048" height="102" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="57" y="212" font-size="28" fill="#315dce" font-weight="700">r17</text><text x="190" y="208" font-size="18" fill="#56667d" font-weight="400">词表ID</text><text x="190" y="246" font-size="22" fill="#17263e" font-weight="400">A→0 / B→1</text><text x="473" y="208" font-size="18" fill="#56667d" font-weight="400">权重三行</text><text x="473" y="246" font-size="24" fill="#17263e" font-weight="400">[1,2,0]</text><text x="749" y="208" font-size="18" fill="#56667d" font-weight="400">实际CPU输出</text><text x="749" y="246" font-size="25" fill="#12725b" font-weight="700">A=1 / B=2</text><rect x="36" y="297" width="1048" height="102" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="57" y="340" font-size="28" fill="#315dce" font-weight="700">r18</text><text x="190" y="336" font-size="18" fill="#56667d" font-weight="400">词表ID</text><text x="190" y="374" font-size="22" fill="#17263e" font-weight="400">A→1 / B→0</text><text x="473" y="336" font-size="18" fill="#56667d" font-weight="400">权重三行</text><text x="473" y="374" font-size="24" fill="#17263e" font-weight="400">[1,2,0]</text><text x="749" y="336" font-size="18" fill="#56667d" font-weight="400">实际CPU输出</text><text x="749" y="374" font-size="25" fill="#b53e3e" font-weight="700">A=2 / B=1</text><rect x="36" y="425" width="1048" height="102" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="57" y="468" font-size="28" fill="#315dce" font-weight="700">r19</text><text x="190" y="464" font-size="18" fill="#56667d" font-weight="400">词表ID</text><text x="190" y="502" font-size="22" fill="#17263e" font-weight="400">A→1 / B→0</text><text x="473" y="464" font-size="18" fill="#56667d" font-weight="400">权重三行</text><text x="473" y="502" font-size="24" fill="#17263e" font-weight="400">[2,1,0]</text><text x="749" y="464" font-size="18" fill="#56667d" font-weight="400">实际CPU输出</text><text x="749" y="502" font-size="25" fill="#12725b" font-weight="700">A=1 / B=2</text><rect x="36" y="590" width="1048" height="67" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="634" font-size="22" fill="#315dce" font-weight="700">r18摘要与形状均正确，输出仍不符合约定；r19配套更新后通过。</text><text x="38" y="704" font-size="18" fill="#56667d" font-weight="400">实际Safetensors/CPU小模型；固定A=1、B=2，不是LLM效果基准。混装r19权重+r17词表也失败。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-labelledby="title desc"><title id="title">预取窗口，要与实际使用的API一起读</title><desc id="desc">订阅先有一条未确认和一条ready，拉取则可以拿到两条未确认；均来自实际代理。</desc><metadata>{&quot;kind&quot;: &quot;actual_prefetch_comparison&quot;, &quot;push&quot;: {&quot;prefetch&quot;: 1, &quot;delivered_before_ack&quot;: 1, &quot;ready_before_ack&quot;: 1, &quot;delivered_after_ack&quot;: 2, &quot;ready_after_all_ack&quot;: 0}, &quot;pull&quot;: {&quot;prefetch&quot;: 1, &quot;unacked_get_deliveries&quot;: 2, &quot;ready_before_ack&quot;: 0}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="535" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">预取窗口，要与实际使用的API一起读</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">两条消息、同样prefetch=1；接口不同，限制不同。</text><text x="32" y="180" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">订阅basic.consume</text><text x="370" y="144" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">代理ready</text><text x="650" y="144" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">消费者未确认</text><rect x="370" y="162" width="72" height="52" rx="7" fill="#b4d8cd" stroke="#cbd6e8"/><text x="406" y="195" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">消息</text><rect x="650" y="162" width="72" height="52" rx="7" fill="#a6bcee" stroke="#cbd6e8"/><text x="686" y="195" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">消息</text><rect x="460" y="162" width="72" height="52" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="496" y="195" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">空</text><rect x="740" y="162" width="72" height="52" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="776" y="195" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">空</text><text x="370" y="254" font-size="20" fill="#236e5e" font-weight="400" text-anchor="start">确认首条后才推第二条</text><text x="32" y="340" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">拉取basic.get</text><text x="370" y="304" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">代理ready</text><text x="650" y="304" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">消费者未确认</text><rect x="370" y="322" width="72" height="52" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="406" y="355" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">空</text><rect x="650" y="322" width="72" height="52" rx="7" fill="#a6bcee" stroke="#cbd6e8"/><text x="686" y="355" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">消息</text><rect x="460" y="322" width="72" height="52" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="496" y="355" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">空</text><rect x="740" y="322" width="72" height="52" rx="7" fill="#a6bcee" stroke="#cbd6e8"/><text x="776" y="355" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">消息</text><text x="370" y="414" font-size="20" fill="#946020" font-weight="400" text-anchor="start">应用自己限制拉取的未完成数量</text><text x="32" y="495" font-size="21" fill="#60708b" font-weight="400" text-anchor="start">预取不是线程数；也不能把订阅窗口直接套到拉取循环。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="713" viewBox="0 0 1120 713" role="img"><title>工具失败要按层定位，成功也要逐层证明</title><desc>MCP消息形状用于解释错误边界；本地程序未实现完整MCP传输与会话协议。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="711" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">工具失败要按层定位，成功也要逐层证明</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">MCP消息形状用于解释错误边界；本地程序未实现完整MCP传输与会话协议。</text><rect x="36" y="131" width="1048" height="82" rx="12" fill="#eef2f8" stroke="#cdd9e9"/><text x="55" y="164" font-size="21" fill="#315dce" font-weight="700">传输层</text><text x="250" y="164" font-size="20" fill="#17263e" font-weight="700">HTTP 503或连接中断</text><text x="250" y="196" font-size="18" fill="#17263e" font-weight="400">先按动作语义判断可重试/结果未知</text><rect x="36" y="231" width="1048" height="82" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="55" y="264" font-size="21" fill="#315dce" font-weight="700">协议层</text><text x="250" y="264" font-size="20" fill="#17263e" font-weight="700">JSON-RPC error</text><text x="250" y="296" font-size="18" fill="#17263e" font-weight="400">方法、参数或协议错误；不能当工具正常输出</text><rect x="36" y="331" width="1048" height="82" rx="12" fill="#fff1e6" stroke="#cdd9e9"/><text x="55" y="364" font-size="21" fill="#315dce" font-weight="700">工具执行层</text><text x="250" y="364" font-size="20" fill="#17263e" font-weight="700">result.isError=true</text><text x="250" y="396" font-size="18" fill="#17263e" font-weight="400">业务拒绝、参数错误或执行失败；不进入成功路径</text><rect x="36" y="431" width="1048" height="82" rx="12" fill="#f9ecec" stroke="#cdd9e9"/><text x="55" y="464" font-size="21" fill="#315dce" font-weight="700">结果契约层</text><text x="250" y="464" font-size="20" fill="#17263e" font-weight="700">结构化结果类型不符</text><text x="250" y="496" font-size="18" fill="#17263e" font-weight="400">HTTP 200也拒绝观察，防止错误结构继续传播</text><rect x="36" y="531" width="1048" height="82" rx="12" fill="#edf6f3" stroke="#cdd9e9"/><text x="55" y="564" font-size="21" fill="#315dce" font-weight="700">任务验收层</text><text x="250" y="564" font-size="20" fill="#17263e" font-weight="700">回执成功但实际产物总数38</text><text x="250" y="596" font-size="18" fill="#17263e" font-weight="400">目标要求37；保留事实，任务状态仍INCOMPLETE</text><text x="38" y="674" font-size="19" fill="#56667d" font-weight="400">同一个失败只归入其实际发生层；不把HTTP成功、JSON合法、工具成功和任务完成混为一谈。</text></g></svg>

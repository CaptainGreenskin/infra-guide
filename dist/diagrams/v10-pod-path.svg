<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="title"><title id="title">从声明到进程，再到可用流量</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315dce"/></marker></defs><rect width="960" height="610" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="30" y="44" font-size="24" fill="#24344d" text-anchor="start" font-weight="700">从声明到进程，再到可用流量</text><text x="30" y="83" font-size="13" fill="#315dce" text-anchor="start" font-weight="400">控制对象链</text><rect x="30" y="105" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="125.0" y="137" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">kubectl apply</text><text x="125.0" y="164" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">提交期望状态</text><rect x="265" y="105" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="360.0" y="137" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">API Server</text><text x="360.0" y="164" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">认证 / 准入 / 存储</text><rect x="500" y="105" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="595.0" y="137" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">控制器</text><text x="595.0" y="164" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">Deployment → RS</text><rect x="735" y="105" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="830.0" y="137" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">Pod 对象</text><text x="830.0" y="164" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">等待节点绑定</text><path d="M220 146 L263 146" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M455 146 L498 146" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M690 146 L733 146" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M830 187 L830 260" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="845" y="230" font-size="13" fill="#24344d" text-anchor="start" font-weight="400">调度 / 绑定</text><rect x="715" y="265" width="210" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="820.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">scheduler</text><text x="820.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">过滤与评分</text><rect x="370" y="265" width="250" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="495.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">kubelet → CRI</text><text x="495.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">镜像 / 卷 / 网络 / 运行时</text><rect x="30" y="265" width="245" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="152.5" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">容器进程</text><text x="152.5" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">cgroup / namespace</text><path d="M715 306 L622 306" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M370 306 L277 306" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M150 347 L150 420" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="30" y="396" font-size="13" fill="#315dce" text-anchor="start" font-weight="400">流量资格链</text><rect x="30" y="425" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="125.0" y="457" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">探针 / Pod Ready</text><text x="125.0" y="484" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">进程在运行 ≠ 可接流量</text><rect x="265" y="425" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="360.0" y="457" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">EndpointSlice</text><text x="360.0" y="484" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">后端 IP / 端口 / 条件</text><rect x="500" y="425" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="595.0" y="457" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">服务数据面</text><text x="595.0" y="484" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">代理或兼容实现</text><rect x="735" y="425" width="190" height="82" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="830.0" y="457" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">新业务请求</text><text x="830.0" y="484" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">还需检查内容与时延</text><path d="M220 466 L263 466" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M455 466 L498 466" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M690 466 L733 466" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="30" y="561" font-size="16" fill="#24344d" text-anchor="start" font-weight="400">证据：对象版本 → Events → 容器状态与日志 → 端点条件 → 用户结果</text><text x="30" y="587" font-size="14" fill="#60708d" text-anchor="start" font-weight="400">各阶段异步推进；API 接受声明不保证最终业务成功。</text></g></svg>
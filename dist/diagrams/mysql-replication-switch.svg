;, &quot;delta&quot;: 10}, {&quot;id&quot;: &quot;NEW_WRITER&quot;, &quot;delta&quot;: 3}, {&quot;id&quot;: &quot;RC_UPDATE&quot;, &quot;delta&quot;: 5}, {&quot;id&quot;: &quot;RECEIVED_NOT_APPLIED&quot;, &quot;delta&quot;: 7}], &quot;server_uuid&quot;: &quot;598464d5-db5f-11f1-afcb-266fc1f14a54&quot;}, &quot;oracle&quot;: {&quot;balance&quot;: 145, &quot;receipt_ids&quot;: [&quot;AFTER_FIRST_READ&quot;, &quot;BEFORE_FIRST_READ&quot;, &quot;NEW_WRITER&quot;, &quot;RC_UPDATE&quot;, &quot;RECEIVED_NOT_APPLIED&quot;], &quot;ledger_difference&quot;: 0}}</metadata>

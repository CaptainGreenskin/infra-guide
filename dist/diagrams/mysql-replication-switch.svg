<rect width="1120" height="880" fill="#f9fbff"/>
<text x="32" y="48" class="title">从能读到数据，走到只有新实例继续接收写入</text>
<text x="32" y="82" class="small muted">计划切换按准入条件推进；任一步不成立，就不开放本题的新写。</text>
<rect x="65" y="128" width="990" height="98" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="87" y="165" class="head">1 收回旧写</text><text x="87" y="203" class="body">撤销业务写；super_read_only；两类写入实际被拒绝</text><path d="M560 226 L560 251" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="560,251 565.0,237.0 555.0,237.0" fill="#60718b"/><rect x="65" y="253" width="990" height="98" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="87" y="290" class="head">2 固定交接目标</text><text x="87" y="328" class="body">旧源冻结后取得G₂；此后不再接收本题的新写</text><path d="M560 351 L560 376" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="560,376 565.0,362.0 555.0,362.0" fill="#60718b"/><rect x="65" y="378" width="990" height="98" rx="10" fill="#eaf5ef" stroke="#d4dff3"/><text x="87" y="415" class="head">3 候选追齐与核对</text><text x="87" y="453" class="body">等待返回0；仅含G₂与先验B；两边142、四笔旧回执相同</text><path d="M560 476 L560 501" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="560,501 565.0,487.0 555.0,487.0" fill="#60718b"/><rect x="65" y="503" width="990" height="98" rx="10" fill="#fff0e9" stroke="#d4dff3"/><text x="87" y="540" class="head">4 停止旧实例</text><text x="87" y="578" class="body">旧容器Running = false；旧端实际写入失败</text><path d="M560 601 L560 626" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="560,626 565.0,612.0 555.0,612.0" fill="#60718b"/><rect x="65" y="628" width="990" height="98" rx="10" fill="#eaf5ef" stroke="#d4dff3"/><text x="87" y="665" class="head">5 开放新端写入</text><text x="87" y="703" class="body">新server UUID；NEW_WRITER +3；账本结果145</text><text x="32" y="800" class="head good">最终：100 + 10 + 20 + 5 + 7 + 3 = 145；账本差额 = 0</text><text x="32" y="846" class="small muted">本地停止旧容器兑现本题隔离；没有模拟失联旧主、跨机房或生产入口切流。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="756" viewBox="0 0 1120 756" role="img" aria-labelledby="title desc"><title id="title">新增副本可用，不等于原有积压已清空</title><desc id="desc">同一组输入180/s、原能力120/s、新能力200/s，分两段计算。</desc><metadata>{&quot;kind&quot;: &quot;piecewise_backlog&quot;, &quot;arrival_per_second&quot;: 180, &quot;old_capacity&quot;: 120, &quot;new_capacity&quot;: 200, &quot;capacity_arrives_at&quot;: 120, &quot;points&quot;: [[0, 0], [120, 7200], [480, 0]], &quot;real_autoscaler&quot;: false}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="754" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">新增副本可用，不等于原有积压已清空</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">同一组输入180/s、原能力120/s、新能力200/s，分两段计算。</text><text x="38" y="132" font-size="20" fill="#315dce" font-weight="700">未完成工作量 / 请求</text><path d="M110 160L110 450" fill="none" stroke="#56667d" stroke-width="2"/><path d="M110 450L1040 450" fill="none" stroke="#56667d" stroke-width="2"/><path d="M110 190L1040 190" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="5 5"/><path d="M342.5 160L342.5 450" fill="none" stroke="#12725b" stroke-width="2" stroke-dasharray="6 5"/><path d="M110 450L342.5 190L1040 450Z" fill="#dbe6ff"/><path d="M110 450L342.5 190L1040 450" fill="none" stroke="#315dce" stroke-width="4"/><text x="38" y="197" font-size="22" fill="#17263e" font-weight="400">7200</text><text x="73" y="457" font-size="20" fill="#17263e" font-weight="400">0</text><text x="107" y="485" font-size="20" fill="#17263e" font-weight="400">0s</text><text x="317.5" y="485" font-size="20" fill="#12725b" font-weight="700">120s</text><text x="1005" y="485" font-size="20" fill="#17263e" font-weight="400">480s</text><text x="360.5" y="171" font-size="20" fill="#12725b" font-weight="700">新增能力统一在此时有效</text><text x="400" y="345" font-size="24" fill="#315dce" font-weight="700">净余量决定排空速度</text><text x="400" y="385" font-size="22" fill="#17263e" font-weight="400">200 − 180 = 20/s</text><text x="400" y="425" font-size="22" fill="#17263e" font-weight="400">7200 ÷ 20 = 360秒</text><rect x="36" y="523" width="500" height="115" rx="10" fill="#fff" stroke="#cdd9e9"/><rect x="564" y="523" width="520" height="115" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="58" y="561" font-size="23" fill="#315dce" font-weight="700">0—120秒：积压增长</text><text x="58" y="601" font-size="22" fill="#17263e" font-weight="400">(180 − 120) × 120 = 7200</text><text x="586" y="561" font-size="23" fill="#12725b" font-weight="700">120—480秒：积压下降</text><text x="586" y="601" font-size="21" fill="#17263e" font-weight="400">输入180/s，旧积压另用20/s排空</text><text x="38" y="685" font-size="20" fill="#56667d" font-weight="400">排空以后，若仍只有180/s输入，实际完成不能按200/s能力继续虚增。</text><text x="38" y="721" font-size="18" fill="#56667d" font-weight="400">固定流体模型，无拒绝、无过期、工作等价；不代表实际伸缩耗时或逐请求p99。</text></g></svg>

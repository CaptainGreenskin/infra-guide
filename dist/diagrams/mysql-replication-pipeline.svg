<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc">
<title id="title">两实例：源已提交，副本也可能只接收未应用</title><desc id="desc">单机真实异步复制；暂停SQL应用线程，I/O接收线程继续工作。</desc>
<metadata>{&quot;source_target&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d:1-17&quot;, &quot;status&quot;: {&quot;Replica_IO_Running&quot;: &quot;Yes&quot;, &quot;Replica_SQL_Running&quot;: &quot;No&quot;, &quot;Retrieved_Gtid_Set&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d:1-17&quot;, &quot;Executed_Gtid_Set&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d:1-16,\n598464d5-db5f-11f1-afcb-266fc1f14a54:1-5&quot;, &quot;Seconds_Behind_Source&quot;: &quot;NULL&quot;, &quot;Last_IO_Errno&quot;: &quot;0&quot;, &quot;Last_SQL_Errno&quot;: &quot;0&quot;, &quot;Auto_Position&quot;: &quot;1&quot;}, &quot;received_contains_target&quot;: 1, &quot;executed_contains_target&quot;: 0, &quot;wait_before_apply&quot;: 1, &quot;source&quot;: {&quot;balance&quot;: 142, &quot;executed&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d:1-17&quot;, &quot;receipts&quot;: [{&quot;id&quot;: &quot;AFTER_FIRST_READ&quot;, &quot;delta&quot;: 20}, {&quot;id&quot;: &quot;BEFORE_FIRST_READ&quot;, &quot;delta&quot;: 10}, {&quot;id&quot;: &quot;RC_UPDATE&quot;, &quot;delta&quot;: 5}, {&quot;id&quot;: &quot;RECEIVED_NOT_APPLIED&quot;, &quot;delta&quot;: 7}], &quot;server_uuid&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d&quot;}, &quot;replica&quot;: {&quot;balance&quot;: 135, &quot;executed&quot;: &quot;596f9dc7-db5f-11f1-91ca-96a73a22a90d:1-16,\n598464d5-db5f-11f1-afcb-266fc1f14a54:1-5&quot;, &quot;receipts&quot;: [{&quot;id&quot;: &quot;AFTER_FIRST_READ&quot;, &quot;delta&quot;: 20}, {&quot;id&quot;: &quot;BEFORE_FIRST_READ&quot;, &quot;delta&quot;: 10}, {&quot;id&quot;: &quot;RC_UPDATE&quot;, &quot;delta&quot;: 5}], &quot;server_uuid&quot;: &quot;598464d5-db5f-11f1-afcb-266fc1f14a54&quot;}, &quot;promote_allowed&quot;: false}</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60718b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px}.muted{fill:#60718b}.blue{fill:#315dce}.bad{fill:#a44328}.good{fill:#28664d}</style>
<rect width="1120" height="840" fill="#f9fbff"/>
<text x="32" y="48" class="title">两实例：源已提交，副本也可能只接收未应用</text>
<text x="32" y="82" class="small muted">单机真实异步复制；暂停SQL应用线程，I/O接收线程继续工作。</text>
<rect x="32" y="140" width="202" height="128" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="48" y="182" class="head">源提交</text><text x="48" y="222" class="small">账户142 / 四笔回执</text><path d="M234 204 L254 204" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="254,204 240.0,199.0 240.0,209.0" fill="#60718b"/><rect x="260" y="140" width="202" height="128" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="276" y="182" class="head">binlog发送</text><text x="276" y="222" class="small">本次目标G₁</text><path d="M462 204 L482 204" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="482,204 468.0,199.0 468.0,209.0" fill="#60718b"/><rect x="488" y="140" width="202" height="128" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="504" y="182" class="head">副本接收</text><text x="504" y="222" class="small">已收到G₁</text><path d="M690 204 L710 204" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="710,204 696.0,199.0 696.0,209.0" fill="#60718b"/><rect x="716" y="140" width="202" height="128" rx="10" fill="#edf2ff" stroke="#d4dff3"/><text x="732" y="182" class="head">relay log</text><text x="732" y="222" class="small">等应用继续</text><path d="M918 204 L1052 204" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="1052,204 1038.0,199.0 1038.0,209.0" fill="#60718b"/><path d="M1052 204 L1052 370" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="1052,370 1057.0,356.0 1047.0,356.0" fill="#60718b"/><path d="M1052 370 L950 370" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="950,370 964.0,375.0 964.0,365.0" fill="#60718b"/><rect x="700" y="316" width="250" height="128" rx="10" fill="#fff0e9" stroke="#e4bdac"/><text x="720" y="357" class="head bad">应用线程已暂停</text><text x="720" y="400" class="small bad">SQL_Running = No</text><path d="M700 380 L500 380" stroke="#60718b" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><rect x="210" y="316" width="280" height="128" rx="10" fill="#edf7f0" stroke="#d4dff3"/><text x="230" y="357" class="head good">副本新查询仍135</text><text x="230" y="400" class="small">不是旧事务造成的旧读</text><rect x="32" y="490" width="1056" height="144" rx="10" fill="#fff6dc" stroke="#e5d39b"/><text x="52" y="530" class="head">接收集合包含G₁：1</text><text x="52" y="570" class="head bad">执行集合包含G₁：0；限时等待返回1</text><text x="52" y="609" class="body">本题准入：拒绝提前开放新写入；恢复应用后再等G₁并核对实际业务。</text><text x="32" y="689" class="small muted">G₁ = 本次源提交+7后取得的完整GTID集合，原值保存在执行记录。</text><text x="32" y="728" class="body">接收运行：Yes；应用运行：No；源 142 / 副本 135</text><text x="32" y="800" class="small muted">图中各阶段表达职责；接收集合不是断电持久化或生产时延验收。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">四份事实：绿灯为什么仍可能返回旧版</title><desc id="desc">只改ConfigMap没有替换进程，控制器Synced和Healthy时HTTP仍v1。</desc><metadata>{&quot;kind&quot;: &quot;actual_gitops_business_counterexample&quot;, &quot;execution&quot;: {&quot;status&quot;: {&quot;sync&quot;: &quot;Synced&quot;, &quot;revision&quot;: &quot;872b300361e5a4ad9339d775c9e3310e60466fe1&quot;, &quot;health&quot;: &quot;Healthy&quot;, &quot;operation&quot;: &quot;Succeeded&quot;, &quot;conditions&quot;: []}, &quot;http&quot;: {&quot;version&quot;: &quot;v1&quot;, &quot;pod&quot;: &quot;guide-web-6b94f6999-8z822&quot;}, &quot;pod&quot;: {&quot;name&quot;: &quot;guide-web-6b94f6999-8z822&quot;, &quot;uid&quot;: &quot;726eabfd-cb7c-4deb-a51d-ac98a015049f&quot;}, &quot;desired_config&quot;: &quot;v2&quot;, &quot;retired_exists&quot;: false, &quot;unmanaged_exists&quot;: true, &quot;business_oracle_passed&quot;: false}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="580" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">四份事实：绿灯为什么仍可能返回旧版</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">同一服务，在“只改配置v2”的提交已同步之后实际观察。</text><rect x="32" y="125" width="896" height="72" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="55" y="169" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">Git期望</text><text x="280" y="169" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">version=v2</text><text x="610" y="169" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">固定提交872b300</text><rect x="32" y="217" width="896" height="72" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="55" y="261" font-size="23" fill="#236e5e" font-weight="600" text-anchor="start">集群对象</text><text x="280" y="261" font-size="24" fill="#236e5e" font-weight="600" text-anchor="start">ConfigMap=v2</text><text x="610" y="261" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">Synced / Healthy</text><rect x="32" y="309" width="896" height="72" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="55" y="353" font-size="23" fill="#946020" font-weight="600" text-anchor="start">进程环境</text><text x="280" y="353" font-size="24" fill="#946020" font-weight="600" text-anchor="start">仍为v1</text><text x="610" y="353" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">Pod UID没有变化</text><rect x="32" y="401" width="896" height="72" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="55" y="445" font-size="23" fill="#a34242" font-weight="600" text-anchor="start">HTTP结果</text><text x="280" y="445" font-size="24" fill="#a34242" font-weight="600" text-anchor="start">version=v1</text><text x="610" y="445" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">独立v2判据失败</text><text x="32" y="540" font-size="21" fill="#60708b" font-weight="400" text-anchor="start">控制面一致、资源健康，不替代进程配置与真实用户结果。</text></g></svg>
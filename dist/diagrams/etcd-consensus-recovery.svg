<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#5275b9"/></marker></defs>
<rect width="1120" height="880" fill="#fbfcff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="36" y="48" font-size="29" fill="#202d41" font-weight="700" text-anchor="start">恢复不是让旧数据自动变成最新</text>
<text x="36" y="83" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">全局revision、新集群身份、键的历史与观察者缓存，需要分别核对。</text>
<rect x="38" y="130" width="320" height="119" rx="10" fill="#eef3ff" stroke="#cbd6eb"/><text x="58" y="168" font-size="25" fill="#263448" font-weight="700" text-anchor="start">快照：limit=37</text><text x="58" y="204" font-size="23" fill="#263448" font-weight="400" text-anchor="start">revision=6</text><text x="58" y="234" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">这是恢复的数据基线</text><path d="M369 190 L445 190" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="458" y="130" width="280" height="119" rx="10" fill="#eaf4ee" stroke="#cbd6eb"/><text x="479" y="168" font-size="24" fill="#263448" font-weight="700" text-anchor="start">原集群继续写</text><text x="479" y="206" font-size="24" fill="#263448" font-weight="400" text-anchor="start">42 → 43</text><text x="479" y="234" font-size="18" fill="#263448" font-weight="400" text-anchor="start">最后读 revision=8</text><rect x="801" y="130" width="280" height="119" rx="10" fill="#fff1d3" stroke="#cbd6eb"/><text x="823" y="168" font-size="24" fill="#263448" font-weight="700" text-anchor="start">观察者记得</text><text x="823" y="206" font-size="23" fill="#263448" font-weight="400" text-anchor="start">旧 revision=8</text><text x="823" y="234" font-size="18" fill="#263448" font-weight="400" text-anchor="start">下一次想从9接续</text><path d="M197 257 L197 337" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="350" width="700" height="153" rx="10" fill="#f0ecfa" stroke="#cbd6eb"/><text x="60" y="389" font-size="26" fill="#263448" font-weight="700" text-anchor="start">独立新集群恢复：数据37，revision=1006</text><text x="60" y="431" font-size="22" fill="#263448" font-weight="400" text-anchor="start">本例声明 bump=1000，并标记 mark-compacted</text><text x="60" y="473" font-size="19" fill="#65748a" font-weight="400" text-anchor="start">旧数据没有因此变成43；键 mod_revision=2，version=1</text><path d="M941 260 L941 352" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="368" width="280" height="135" rx="10" fill="#fff0ee" stroke="#cbd6eb"/><text x="820" y="405" font-size="22" fill="#263448" font-weight="700" text-anchor="start">旧观察起点被拒绝</text><text x="820" y="446" font-size="19" fill="#263448" font-weight="400" text-anchor="start">compact_revision=1006</text><text x="820" y="481" font-size="20" fill="#263448" font-weight="400" text-anchor="start">缓存必须重新建立</text><path d="M940 511 L940 575" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="626" y="590" width="454" height="150" rx="10" fill="#edf4ff" stroke="#cbd6eb"/><text x="648" y="630" font-size="23" fill="#263448" font-weight="700" text-anchor="start">重新列举：当前真实状态37</text><text x="648" y="671" font-size="21" fill="#263448" font-weight="400" text-anchor="start">取得新R=1006</text><text x="648" y="706" font-size="21" fill="#263448" font-weight="400" text-anchor="start">请求从R+1接续观察</text><path d="M620 647 L551 647" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="590" width="500" height="150" rx="10" fill="#e9f4ed" stroke="#cbd6eb"/><text x="60" y="630" font-size="24" fill="#263448" font-weight="700" text-anchor="start">新写47，事件更新缓存</text><text x="60" y="671" font-size="22" fill="#263448" font-weight="400" text-anchor="start">revision=1007 &gt; 1006</text><text x="60" y="706" font-size="21" fill="#263448" font-weight="400" text-anchor="start">缓存47 = 独立全量读取</text><text x="38" y="778" font-size="21" fill="#46556a" font-weight="400" text-anchor="start">新集群身份不同，revision提升和缓存失效解决观察者接续问题。</text><text x="38" y="818" font-size="21" fill="#46556a" font-weight="400" text-anchor="start">快照之后的42/43属于原历史；不会由“恢复成功”自动补回。</text><text x="38" y="856" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">真实记录：独立单成员教学恢复；不是 Kubernetes 全套或生产高可用验收。</text>
</g></svg>

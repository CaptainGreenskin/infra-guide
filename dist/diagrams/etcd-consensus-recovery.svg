5&quot;,&quot;member_id&quot;:&quot;12266717027811571892&quot;,&quot;rows&quot;:{&quot;/lesson/config/limit&quot;:{&quot;value&quot;:&quot;37&quot;,&quot;create_revision&quot;:2,&quot;mod_revision&quot;:2,&quot;version&quot;:1,&quot;lease&quot;:&quot;0&quot;},&quot;/lesson/config/release&quot;:{&quot;value&quot;:&quot;v2&quot;,&quot;create_revision&quot;:3,&quot;mod_revision&quot;:4,&quot;version&quot;:2,&quot;lease&quot;:&quot;0&quot;},&quot;/lesson/config/route&quot;:{&quot;value&quot;:&quot;A&quot;,&quot;create_revision&quot;:4,&quot;mod_revision&quot;:4,&quot;version&quot;:1,&quot;lease&quot;:&quot;0&quot;}}},&quot;restarted_watch&quot;:{&quot;response_revision&quot;:1007,&quot;canceled&quot;:false,&quot;compact_revision&quot;:0,&quot;events&quot;:[{&quot;key&quot;:&quot;/lesson/config/limit&quot;,&quot;value&quot;:&quot;47&quot;,&quot;mod_revision&quot;:1007}],&quot;raw_response&quot;:&quot;{\&quot;Header\&quot;:{\&quot;cluster_id\&quot;:16859121579132816125,\&quot;member_id\&quot;:12266717027811571892,\&quot;revision\&quot;:1007,\&quot;raft_term\&quot;:2},\&quot;Events\&quot;:[{\&quot;kv\&quot;:{\&quot;key\&quot;:\&quot;L2xlc3Nvbi9jb25maWcvbGltaXQ=\&quot;,\&quot;create_revision\&quot;:2,\&quot;mod_revision\&quot;:1007,\&quot;version\&quot;:2,\&quot;value\&quot;:\&quot;NDc=\&quot;}}],\&quot;CompactRevision\&quot;:0,\&quot;Canceled\&quot;:false,\&quot;Created\&quot;:false}&quot;},&quot;rebuilt_cache&quot;:{&quot;/lesson/config/limit&quot;:&quot;47&quot;,&quot;/lesson/config/release&quot;:&quot;v2&quot;,&quot;/lesson/config/route&quot;:&quot;A&quot;},&quot;full_range_after&quot;:{&quot;revision&quot;:1007,&quot;cluster_id&quot;:&quot;16859121579132816125&quot;,&quot;member_id&quot;:&quot;12266717027811571892&quot;,&quot;rows&quot;:{&quot;/lesson/config/limit&quot;:{&quot;value&quot;:&quot;47&quot;,&quot;create_revision&quot;:2,&quot;mod_revision&quot;:1007,&quot;version&quot;:2,&quot;lease&quot;:&quot;0&quot;},&quot;/lesson/config/release&quot;:{&quot;value&quot;
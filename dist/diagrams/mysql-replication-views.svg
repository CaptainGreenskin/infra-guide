<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">同一实例：读视图决定这条查询能看见什么</title><desc id="desc">从实际MySQL读数与连接ID生成。开始事务和首次普通读分别标出。</desc>
<metadata>{&quot;rr&quot;: {&quot;begin_before_update&quot;: true, &quot;first&quot;: {&quot;balance&quot;: 110, &quot;isolation&quot;: &quot;REPEATABLE-READ&quot;, &quot;connection&quot;: 16}, &quot;same_transaction&quot;: {&quot;balance&quot;: 110, &quot;isolation&quot;: &quot;REPEATABLE-READ&quot;, &quot;connection&quot;: 16}, &quot;after_commit&quot;: {&quot;balance&quot;: 130, &quot;isolation&quot;: &quot;REPEATABLE-READ&quot;, &quot;connection&quot;: 16}}, &quot;rc&quot;: {&quot;first&quot;: {&quot;balance&quot;: 130, &quot;isolation&quot;: &quot;READ-COMMITTED&quot;, &quot;connection&quot;: 19}, &quot;same_transaction&quot;: {&quot;balance&quot;: 135, &quot;isolation&quot;: &quot;READ-COMMITTED&quot;, &quot;connection&quot;: 19}}}</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#60718b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203047}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px}.muted{fill:#60718b}.blue{fill:#315dce}.bad{fill:#a44328}.good{fill:#28664d}</style>
<rect width="1120" height="820" fill="#f9fbff"/>
<text x="32" y="48" class="title">同一实例：读视图决定这条查询能看见什么</text>
<text x="32" y="82" class="small muted">从实际MySQL读数与连接ID生成。开始事务和首次普通读分别标出。</text>
<text x="32" y="124" class="small muted">同一账户，RR与RC顺序运行；横向只表示事件先后，不表示耗时比例。</text><text x="32" y="155" class="small muted">蓝点是读连接动作，橙点是另一写连接提交；数字是该事件对应的账户值。</text><text x="32" y="198" class="head">RR：开始事务后，首次读表才取得本例视图</text><path d="M70 278 L1070 278" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="1070,278 1056.0,273.0 1056.0,283.0" fill="#60718b"/><circle cx="70.0" cy="278" r="7" fill="#315dce"/><text x="70.0" y="240" class="small" text-anchor="middle">开始RR</text><circle cx="233.33333333333334" cy="278" r="7" fill="#b76a2e"/><text x="233.33333333333334" y="240" class="small" text-anchor="middle">写方提交+10</text><text x="233.33333333333334" y="326" class="head blue" text-anchor="middle">110</text><circle cx="396.6666666666667" cy="278" r="7" fill="#315dce"/><text x="396.6666666666667" y="240" class="small" text-anchor="middle">首次读110</text><text x="396.6666666666667" y="326" class="head blue" text-anchor="middle">110</text><circle cx="560.0" cy="278" r="7" fill="#b76a2e"/><text x="560.0" y="240" class="small" text-anchor="middle">写方提交+20</text><text x="560.0" y="326" class="head blue" text-anchor="middle">130</text><circle cx="723.3333333333334" cy="278" r="7" fill="#315dce"/><text x="723.3333333333334" y="240" class="small" text-anchor="middle">仍读110</text><text x="723.3333333333334" y="326" class="head blue" text-anchor="middle">110</text><circle cx="886.6666666666667" cy="278" r="7" fill="#315dce"/><text x="886.6666666666667" y="240" class="small" text-anchor="middle">提交读事务</text><circle cx="1050.0" cy="278" r="7" fill="#315dce"/><text x="1050.0" y="240" class="small" text-anchor="middle">新读130</text><text x="1050.0" y="326" class="head blue" text-anchor="middle">130</text><text x="32" y="470" class="head">RC：同一事务，每条普通一致读取得新视图</text><path d="M70 550 L1070 550" stroke="#60718b" stroke-width="2.5" fill="none"/><polygon points="1070,550 1056.0,545.0 1056.0,555.0" fill="#60718b"/><circle cx="70.0" cy="550" r="7" fill="#315dce"/><text x="70.0" y="512" class="small" text-anchor="middle">开始RC</text><circle cx="315.0" cy="550" r="7" fill="#315dce"/><text x="315.0" y="512" class="small" text-anchor="middle">首次读130</text><text x="315.0" y="598" class="head blue" text-anchor="middle">130</text><circle cx="560.0" cy="550" r="7" fill="#b76a2e"/><text x="560.0" y="512" class="small" text-anchor="middle">写方提交+5</text><text x="560.0" y="598" class="head blue" text-anchor="middle">135</text><circle cx="805.0" cy="550" r="7" fill="#315dce"/><text x="805.0" y="512" class="small" text-anchor="middle">再次读135</text><text x="805.0" y="598" class="head blue" text-anchor="middle">135</text><circle cx="1050.0" cy="550" r="7" fill="#315dce"/><text x="1050.0" y="512" class="small" text-anchor="middle">提交读事务</text><rect x="32" y="660" width="1056" height="98" rx="10" fill="#eaf5ef" stroke="#d4dff3"/><text x="52" y="697" class="body good">RR真实连接 16：110 → 110；结束读事务后130</text><text x="52" y="732" class="body good">RC真实连接 19：130 → 135；两次仍在同一事务</text><text x="32" y="795" class="small muted">只对照普通SELECT；自身写入、锁定读和DDL有各自规则。</text></svg>

    .lane{stroke:#a1b1ca;stroke-width:1.2;stroke-dasharray:5 4}.send{stroke:#315dce;stroke-width:2;marker-end:url(#blue)}.receive{stroke:#16745d;stroke-width:2;marker-end:url(#green)}
  </style>

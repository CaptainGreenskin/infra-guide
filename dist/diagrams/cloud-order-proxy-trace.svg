<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 348" role="img" aria-labelledby="title desc">
  <title id="title">订单 O-104 的实际代理往返</title>
  <desc id="desc">请求 reuse-1 从客户端到入口 P，再从入口到应用 A。P-c1 和 A-c1 是两条连接。应用向入口返回 200，客户端也收到 200，订单 O-104 状态为已支付。</desc>
  <metadata>{"request":"reuse-1","path":"/orders/O-104","front":"P-c1","backend":"A-c1","events":["front_request","backend_request","upstream_response","client_received"],"status":200,"order_status":"paid","total":37}</metadata>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>扩容晚到75秒，净余量再决定能否排空</title><desc>新容量刚好追平输入，只能止住增长；排空旧积压还需要额外容量。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">扩容晚到75秒，净余量再决定能否排空</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">新容量刚好追平输入，只能止住增长；排空旧积压还需要额外容量。</text><text x="38" y="126" font-size="20" fill="#17263e" font-weight="700">容量（次/秒）</text><path d="M90 136 L90 310 L1050 310" stroke="#ccd8e8" stroke-width="2" fill="none"/><text x="43" y="248.8" font-size="16" fill="#56667d" font-weight="400">120</text><text x="43" y="215.2" font-size="16" fill="#56667d" font-weight="400">180</text><text x="43" y="181.6" font-size="16" fill="#56667d" font-weight="400">240</text><path d="M90.0 209.2 L1050.0 209.2" stroke="#b53e3e" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M90.0 242.8 L570.0 242.8 L570.0 175.6 L1050.0 175.6" stroke="#315dce" stroke-width="3" fill="none"/><text x="121" y="198" font-size="18" fill="#b53e3e" font-weight="400">输入180/s</text><text x="614" y="154" font-size="20" fill="#315dce" font-weight="700">新容量240/s</text><text x="190" y="267" font-size="19" fill="#17263e" font-weight="400">旧容量120/s</text><text x="570" y="295" font-size="18" fill="#315dce" font-weight="400">75秒：新容量到达</text><text x="38" y="362" font-size="20" fill="#17263e" font-weight="700">积压（项）</text><path d="M90 391 L90 640 L1050 640" stroke="#ccd8e8" stroke-width="2" fill="none"/><text x="33" y="646.0" font-size="16" fill="#56667d" font-weight="400">0</text><text x="33" y="623.5" font-size="16" fill="#56667d" font-weight="400">500</text><text x="33" y="443.5" font-size="16" fill="#56667d" font-weight="400">4500</text><path d="M90.0 640.0 L570.0 437.5 L1050.0 437.5" stroke="#b53e3e" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M90.0 640.0 L570.0 437.5 L1050.0 640.0" stroke="#315dce" stroke-width="3" fill="none"/><path d="M90.0 640.0 L143.33333333333334 617.5 L570.0 617.5 L627.6 640.0 L1050.0 640.0" stroke="#12725b" stroke-width="3" fill="none"/><text x="606" y="421" font-size="18" fill="#b53e3e" font-weight="400">若新容量仅180/s，4500项不再下降</text><text x="820" y="473" font-size="18" fill="#315dce" font-weight="400">新容量240/s</text><text x="820" y="503" font-size="18" fill="#315dce" font-weight="400">净余量60/s</text><text x="820" y="533" font-size="18" fill="#315dce" font-weight="400">第150秒排空</text><text x="184" y="600" font-size="18" fill="#12725b" font-weight="400">上限500：拒绝4000项，离散模型第84秒排空</text><text x="81.0" y="668" font-size="17" fill="#56667d" font-weight="400">0</text><text x="561.0" y="668" font-size="17" fill="#56667d" font-weight="400">75</text><text x="1041.0" y="668" font-size="17" fill="#56667d" font-weight="400">150</text><text x="1007" y="696" font-size="18" fill="#56667d" font-weight="400">秒</text><text x="38" y="710" font-size="18" fill="#56667d" font-weight="400">固定流体模型、每秒一步；非逐请求时延实测。限流改变了接纳量，须另核对业务目标。</text></g></svg>

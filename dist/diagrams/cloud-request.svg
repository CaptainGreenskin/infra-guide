<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="cloud-request-title cloud-request-desc">
<title id="cloud-request-title">一条请求：解析、连接、授权与观测</title>
<desc id="cloud-request-desc">DNS 是独立的地址解析步骤。随后客户端访问入口、业务服务和持久化存储，入口身份和数据授权边界分别校验，观测信息覆盖各跳。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="600" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">一条请求：解析、连接、授权与观测</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">先区分名称解析与业务流量，再逐跳检查路径、权限和结果。</text>
<text x="35" y="139" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">① 名称解析</text><rect x="35" y="155" width="235" height="84" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="152.5" y="186" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">客户端查询 DNS</text><text x="152.5" y="214" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">获得入口地址，不转发 HTTP</text><path d="M270 197 L330 197" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="155" width="235" height="84" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="447.5" y="186" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">返回地址 / 缓存</text><text x="447.5" y="214" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">解析结果、TTL 与来源可观测</text><text x="600" y="185" font-size="15" fill="#61748e" text-anchor="start" font-weight="400">解析完成后，建立实际连接。</text><text x="600" y="212" font-size="15" fill="#61748e" text-anchor="start" font-weight="400">DNS 成功不代表服务可达。</text><text x="35" y="278" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">② 请求与数据路径</text><rect x="35" y="295" width="160" height="88" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="115.0" y="326" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">客户端</text><text x="115.0" y="354" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">发起连接 / 请求</text><rect x="275" y="295" width="170" height="88" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="360.0" y="326" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">入口 / 网关</text><text x="360.0" y="354" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">TLS / 用户身份</text><rect x="525" y="295" width="170" height="88" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="610.0" y="326" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">业务服务</text><text x="610.0" y="354" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">业务权限 / 请求处理</text><rect x="775" y="295" width="150" height="88" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="850.0" y="326" font-size="16" fill="#203553" text-anchor="middle" font-weight="600">持久化存储</text><text x="850.0" y="354" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">服务身份 / 数据授权</text><path d="M195 339 L275 339" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 339 L525 339" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M695 339 L775 339" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="424" width="890" height="122" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="53" y="453" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">身份校验分层，观测贯穿每一跳</text><text x="53" y="479" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">入口认证与数据授权是不同边界；网络连通不能替代权限检查。</text><text x="53" y="502" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">关联请求 ID / trace ID，记录时间、状态和依赖；不要把凭据写进日志。</text><path d="M360 383 L360 424" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M610 383 L610 424" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M850 383 L850 424" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="30" y="578" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
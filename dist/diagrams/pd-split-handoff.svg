<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc">
  <title id="title">同一批请求，分池怎样改变解码等待</title>
  <desc id="desc">A 先产生首个词元，协调器再提交长提示 B。共置的单进程先处理 B，A 的后续生成在同一进程等待。分池时，在 B 的预填充处理窗口内，解码进程收到并验收 A 的 K/V 帧后可继续生成。协调器记录请求到达，工作进程记录首项产出，两者之差是本机 TTFT。A 的首项到第二项间隔包含交接和等待。两进程共置的对照中，A 与 B 的处理窗口也重叠，K/V 留在各自的进程。箭头表示观察顺序。</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#315dce"/></marker>
    <marker id="handoff-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#14755f"/></marker>
  </defs>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17263e">
    <rect x="1" y="1" width="958" height="702" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/>
    <text x="34" y="50" font-size="34" font-weight="700">同一批请求，分池怎样改变解码等待</text>
    <text x="34" y="89" font-size="23" fill="#4c5e78">A 先产生首项，协调器再提交长提示 B。箭头表示观察顺序。</text>

    <rect x="34" y="109" width="892" height="172" rx="12" fill="#fff" stroke="#b8c8e0"/>
    <text x="54" y="145" font-size="27" font-weight="700">共置 · 一个工作进程</text>
    <g stroke="#a8bce4" fill="#ebf1ff">
      <rect x="54" y="163" width="220" height="64" rx="9"/>
      <rect x="344" y="163" width="245" height="64" rx="9" stroke="#d8b37e" fill="#fff4e2"/>
      <rect x="659" y="163" width="245" height="64" rx="9"/>
    </g>
    <g fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#flow-arrow)">
      <path d="M286 195h44"/><path d="M601 195h44"/>
    </g>
    <g text-anchor="middle">
      <g font-size="24" font-weight="700">
        <text x="164" y="188">A 预填充</text><text x="466" y="188">B 长提示</text><text x="781" y="188">A 继续生成</text>
      </g>
      <g font-size="19" fill="#4c5e78">
        <text x="164" y="218">产生首项</text><text x="466" y="218">先占用共用进程</text><text x="781" y="218">排到 B 之后</text>
      </g>
    </g>
    <text x="54" y="256" font-size="22" fill="#4c5e78">A 的历史 K/V 留在同一进程。</text>

    <rect x="34" y="299" width="892" height="249" rx="12" fill="#fff" stroke="#b8c8e0"/>
    <text x="54" y="335" font-size="27" font-weight="700">分池 · 预填充与解码各用一个进程</text>
    <g font-size="23" font-weight="700">
      <text x="54" y="385">预填充 P</text><text x="54" y="482">解码 D</text>
    </g>
    <g stroke="#a8bce4" fill="#ebf1ff">
      <rect x="200" y="350" width="220" height="64" rx="9"/>
      <rect x="552" y="350" width="352" height="64" rx="9" stroke="#d8b37e" fill="#fff4e2"/>
    </g>
    <g stroke="#9bcabc" fill="#e9f5ef">
      <rect x="448" y="447" width="202" height="64" rx="9"/>
      <rect x="704" y="447" width="200" height="64" rx="9"/>
    </g>
    <g fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#flow-arrow)">
      <path d="M435 379h101"/>
    </g>
    <g fill="none" stroke="#14755f" stroke-width="3" marker-end="url(#handoff-arrow)">
      <path d="M309 415v62h122" stroke-dasharray="7 5"/><path d="M661 477h28"/>
    </g>
    <text x="326" y="438" font-size="21" font-weight="700" fill="#14755f">发送 A 的 K/V 帧</text>
    <g text-anchor="middle">
      <g font-size="23" font-weight="700">
        <text x="310" y="375">A 预填充</text><text x="728" y="375">B 长提示</text>
        <text x="549" y="472">收包与验收</text><text x="804" y="472">A 继续生成</text>
      </g>
      <g font-size="19" fill="#4c5e78">
        <text x="310" y="405">产生首项</text><text x="728" y="405">A 可在 B 的处理窗口内解码</text>
        <text x="549" y="502">校验身份与完整性</text><text x="804" y="502">用收到的 K/V 续算</text>
      </g>
    </g>
    <text x="54" y="536" font-size="20" fill="#4c5e78">虚线是本机套接字上的交接。验收失败时，A 停在首项。</text>

    <rect x="34" y="566" width="892" height="115" rx="12" fill="#e9effa"/>
    <text x="54" y="599" font-size="22"><tspan font-weight="700">本机计时</tspan><tspan>　请求到达 → 首项产出是 TTFT，首项 → 第二项含交接与等待。</tspan></text>
    <path d="M54 617h850" stroke="#b8c8e0"/>
    <text x="54" y="651" font-size="22"><tspan font-weight="700">等进程数对照</tspan><tspan>　两个共置进程的处理窗口也重叠，K/V 留在各自进程。</tspan></text>
  </g>
</svg>

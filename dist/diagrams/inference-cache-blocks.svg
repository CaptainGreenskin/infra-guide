<text x="703" y="395" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="759" y="395" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="815" y="395" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="871" y="395" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="954" y="395" text-anchor="start" fill="#20314e" font-size="20" font-weight="400">引用 0</text>
<text x="40" y="530" text-anchor="start" fill="#234d9f" font-size="23" font-weight="600">② C从A分叉，追加9前复制尾块</text>
<text x="55" y="584" text-anchor="start" fill="#20314e" font-size="22" font-weight="600">A [1,2,3,4 | 5,6]</text>
<text x="85" y="615" text-anchor="start" fill="#536783" font-size="19" font-weight="400">逻辑块表 → [P0, P1]</text>
<text x="55" y="668" text-anchor="start" fill="#20314e" font-size="22" font-weight="600">B [1,2,3,4 | 7,8]</text>
<text x="85" y="699" text-anchor="start" fill="#536783" font-size="19" font-weight="400">逻辑块表 → [P0, P2]</text>

<text x="55" y="268" text-anchor="start" fill="#20314e" font-size="22" font-weight="600">B [1,2,3,4 | 7,8]</text>
<text x="85" y="299" text-anchor="start" fill="#536783" font-size="19" font-weight="400">逻辑块表 → [P0, P2]</text>

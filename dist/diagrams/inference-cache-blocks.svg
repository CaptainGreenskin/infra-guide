<rect x="610" y="760" width="455" height="55" rx="7" fill="#fff0d5" stroke="#c2cce0"/>
<text x="624" y="795" text-anchor="start" fill="#234d9f" font-size="22" font-weight="600">P3</text>
<text x="703" y="795" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">5</text>
<text x="759" y="795" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">6</text>
<text x="815" y="795" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">9</text>
<text x="871" y="795" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="954" y="795" text-anchor="start" fill="#20314e" font-size="20" font-weight="400">引用 1</text>
<text x="40" y="879" text-anchor="start" fill="#20314e" font-size="20" font-weight="400">完整前缀缓存只登记满块；fork共享未满尾块，是需要写时复制的另一条路径。</text>
<text x="40" y="918" text-anchor="start" fill="#536783" font-size="18" font-weight="400">第二幅：19个逻辑位置，11份已计算位置值，4块共16槽；本图不换算Python对象内存。</text>
</g></svg>

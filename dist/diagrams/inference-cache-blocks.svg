<text x="624" y="727" text-anchor="start" fill="#234d9f" font-size="22" font-weight="600">P2</text>
<text x="703" y="727" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">7</text>
<text x="759" y="727" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">8</text>
<text x="815" y="727" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>
<text x="871" y="727" text-anchor="middle" fill="#20314e" font-size="22" font-weight="400">·</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 762" width="1120" height="762" role="img" aria-labelledby="title desc"><title id="title">先分清软件怎样分工，再问硬件怎样执行</title><desc id="desc">一维数组2500个FP32元素，每块256线程，尾部必须保护。</desc><metadata>{&quot;kind&quot;: &quot;execution_hierarchy&quot;, &quot;elements&quot;: 2500, &quot;threads_per_block&quot;: 256, &quot;blocks&quot;: 10, &quot;warp_size&quot;: 32, &quot;valid_last_block&quot;: 196, &quot;protected_last_block&quot;: 60, &quot;gpu_execution&quot;: false}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="760" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">先分清软件怎样分工，再问硬件怎样执行</text><text x="36" y="84" font-size="18" fill="#56667d" font-weight="400">一维数组2500个FP32元素，每块256线程，尾部必须保护。</text><rect x="36" y="122" width="1048" height="218" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="159" font-size="24" fill="#315dce" font-weight="700">一次内核启动的网格：10个线程块</text><rect x="58" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="70" y="218" font-size="20" fill="#17263e" font-weight="700">块 0</text><text x="70" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="70" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="159" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="171" y="218" font-size="20" fill="#17263e" font-weight="700">块 1</text><text x="171" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="171" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="260" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="272" y="218" font-size="20" fill="#17263e" font-weight="700">块 2</text><text x="272" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="272" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="361" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="373" y="218" font-size="20" fill="#17263e" font-weight="700">块 3</text><text x="373" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="373" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="462" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="474" y="218" font-size="20" fill="#17263e" font-weight="700">块 4</text><text x="474" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="474" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="563" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="575" y="218" font-size="20" fill="#17263e" font-weight="700">块 5</text><text x="575" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="575" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="664" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="676" y="218" font-size="20" fill="#17263e" font-weight="700">块 6</text><text x="676" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="676" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="765" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="777" y="218" font-size="20" fill="#17263e" font-weight="700">块 7</text><text x="777" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="777" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="866" y="185" width="90" height="108" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="878" y="218" font-size="20" fill="#17263e" font-weight="700">块 8</text><text x="878" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="878" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><rect x="967" y="185" width="90" height="108" rx="10" fill="#fff6e8" stroke="#cdd9e9"/><text x="979" y="218" font-size="20" fill="#17263e" font-weight="700">块 9</text><text x="979" y="251" font-size="17" fill="#17263e" font-weight="400">256线程</text><text x="979" y="280" font-size="16" fill="#56667d" font-weight="400">8个warp</text><text x="58" y="323" font-size="20" fill="#17263e" font-weight="400">第0—8块：2304个有效编号；第9块：196个有效编号 + 60个保护编号。</text><rect x="36" y="383" width="660" height="147" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="422" font-size="24" fill="#315dce" font-weight="700">一个元素的编号从哪里来</text><text x="58" y="464" font-size="25" fill="#17263e" font-weight="400">i = 块号 × 256 + 块内线程号</text><text x="58" y="502" font-size="20" fill="#17263e" font-weight="400">块9、线程196 → i=2500；不小于n，不能访问。</text><rect x="728" y="383" width="356" height="147" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="750" y="422" font-size="23" fill="#12725b" font-weight="700">一组warp = 32线程</text><text x="750" y="464" font-size="21" fill="#17263e" font-weight="400">定义指令执行分组</text><text x="750" y="502" font-size="20" fill="#17263e" font-weight="400">不等于32个CPU核心</text><path d="M365 344L365 378" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="577" width="1048" height="106" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="615" font-size="24" fill="#315dce" font-weight="700">硬件SM负责执行块；驻留数量还受资源限制</text><text x="58" y="653" font-size="21" fill="#17263e" font-weight="400">软件块编号不指定物理SM编号；10块不表示10个SM或全部同时运行。</text><text x="38" y="727" font-size="19" fill="#56667d" font-weight="400">固定索引示意 + Python覆盖复算；没有运行CUDA内核或测量真实GPU。</text></g></svg>

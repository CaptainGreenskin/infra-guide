<svg xmlns="http://www.w3.org/2000/svg" width="960" height="659" viewBox="0 0 960 659" role="img" aria-labelledby="title desc"><title id="title">从一条 HTTPS 请求的累计时刻，拆出各阶段等待</title><desc id="desc">不复用连接的合成例子，累计 DNS 20、TCP 50、TLS 90、首字节 210、全部完成 250 毫秒。首字节前的 120 毫秒并非单纯的服务端处理时间。</desc>
<defs>
 <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#225da8" /></marker>
 <marker id="teal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#12716c" /></marker>
 <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#ae5022" /></marker>
 </defs>
 <style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:18px}.title{font-size:29px;font-weight:700}.tag{font-size:16px;font-weight:650;letter-spacing:.7px}.small{font-size:16px}.strong{font-weight:650}.mono{font-family:"SFMono-Regular",Consolas,"PingFang SC",monospace;font-size:16px}</style>
<rect width="960" height="659" rx="12" fill="#f7f9fb" />
<text x="32" y="37" class="tag" text-anchor="start" style="fill:#12716c;font-size:16px;font-weight:650">NETWORK 03  /  延迟分解</text>
<text x="32" y="82" class="title" text-anchor="start" style="font-size:29px;font-weight:700">同一只秒表上的五个累计时刻</text>
<text x="32" y="116" class="small" text-anchor="start" style="font-size:16px;font-weight:400">合成示例：新连接、无重定向/代理/重试、未复用连接，忽略阶段间额外空隙。</text>
<text x="32" y="162" class="tag" text-anchor="start" style="fill:#12716c;font-size:16px;font-weight:650">阶段 / 耗时</text>
<text x="229" y="162" class="tag" text-anchor="start" style="fill:#12716c;font-size:16px;font-weight:650">从请求起点开始（ms）</text>
<text x="914" y="162" class="tag" text-anchor="end" style="fill:#12716c;font-size:16px;font-weight:650">累计</text>
<line x1="229.0" y1="198" x2="229.0" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="229.0" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">0</text>
<line x1="341.5" y1="198" x2="341.5" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="341.5" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">50</text>
<line x1="454.0" y1="198" x2="454.0" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="454.0" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">100</text>
<line x1="566.5" y1="198" x2="566.5" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="566.5" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">150</text>
<line x1="679.0" y1="198" x2="679.0" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="679.0" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">200</text>
<line x1="791.5" y1="198" x2="791.5" y2="448" stroke="#d4dfe7" stroke-width="1" stroke-dasharray="3 5" />
<text x="791.5" y="190" class="mono" text-anchor="middle" style="font-size:16px;font-weight:400">250</text>
<text x="32" y="231" class="strong" text-anchor="start" style="font-size:18px;font-weight:700">DNS</text>
<text x="210" y="231" class="small" text-anchor="end" style="font-size:16px;font-weight:400">20 ms</text>
<rect x="229.0" y="213" width="45.000000000000014" height="25" rx="3" fill="#12716c" stroke="none" />
<circle cx="274.0" cy="225.5" r="3.5" fill="#12716c" stroke="none" />
<text x="914" y="231" class="mono" text-anchor="end" style="fill:#12716c;font-size:16px;font-weight:400">20 ms</text>
<text x="32" y="283" class="strong" text-anchor="start" style="font-size:18px;font-weight:700">TCP 连接</text>
<text x="210" y="283" class="small" text-anchor="end" style="font-size:16px;font-weight:400">30 ms</text>
<rect x="274.0" y="265" width="67.5" height="25" rx="3" fill="#225da8" stroke="none" />
<circle cx="341.5" cy="277.5" r="3.5" fill="#225da8" stroke="none" />
<text x="914" y="283" class="mono" text-anchor="end" style="fill:#225da8;font-size:16px;font-weight:400">50 ms</text>
<text x="32" y="335" class="strong" text-anchor="start" style="font-size:18px;font-weight:700">TLS 握手</text>
<text x="210" y="335" class="small" text-anchor="end" style="font-size:16px;font-weight:400">40 ms</text>
<rect x="341.5" y="317" width="90.00000000000003" height="25" rx="3" fill="#327d9c" stroke="none" />
<circle cx="431.5" cy="329.5" r="3.5" fill="#327d9c" stroke="none" />
<text x="914" y="335" class="mono" text-anchor="end" style="fill:#327d9c;font-size:16px;font-weight:400">90 ms</text>
<text x="32" y="387" class="strong" text-anchor="start" style="font-size:18px;font-weight:700">请求至首字节</text>
<text x="210" y="387" class="small" text-anchor="end" style="font-size:16px;font-weight:400">120 ms</text>
<rect x="431.5" y="369" width="270.0" height="25" rx="3" fill="#ae5022" stroke="none" />
<circle cx="701.5" cy="381.5" r="3.5" fill="#ae5022" stroke="none" />
<text x="914" y="387" class="mono" text-anchor="end" style="fill:#ae5022;font-size:16px;font-weight:400">210 ms</text>
<text x="32" y="439" class="strong" text-anchor="start" style="font-size:18px;font-weight:700">正文与收尾</text>
<text x="210" y="439" class="small" text-anchor="end" style="font-size:16px;font-weight:400">40 ms</text>
<rect x="701.5" y="421" width="90.00000000000003" height="25" rx="3" fill="#12716c" stroke="none" />
<circle cx="791.5" cy="433.5" r="3.5" fill="#12716c" stroke="none" />
<text x="914" y="439" class="mono" text-anchor="end" style="fill:#12716c;font-size:16px;font-weight:400">250 ms</text>
<rect x="28" y="486" width="904" height="133" rx="8" fill="#ffffff" stroke="#c4d3df" />
<text x="45" y="517" class="tag" text-anchor="start" style="fill:#ae5022;font-size:16px;font-weight:650">读图：TTFB 是起点到首字节的 210 ms</text>
<text x="45" y="551" class="small" text-anchor="start" style="font-size:16px;font-weight:400">握手结束到首字节为 210 − 90 = 120 ms，可能含请求发送、网络往返和服务处理。</text>
<text x="45" y="583" class="small" text-anchor="start" style="font-size:16px;font-weight:400">完整事务为 250 ms；250 − 210 = 40 ms 是首字节后至完成的区间。</text>
<text x="32" y="643" class="small" text-anchor="start" style="font-size:16px;font-weight:400">真实 curl 需核对是否复用连接、使用代理或发生重定向，不能直接把累计值当作单段耗时。</text>
</svg>
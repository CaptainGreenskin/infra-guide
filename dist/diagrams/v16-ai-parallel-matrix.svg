<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" role="img" aria-labelledby="title desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">并行策略：每个 rank 存什么、计算什么、交换什么？</title>
  <desc id="desc">矩阵对比普通 DDP、FSDP 全分片、张量并行与流水线并行。DP 复制模型以处理不同数据；FSDP 主要分摊训练状态；TP 切分同一层的计算；PP 将层分到不同阶段。通信随策略变化。</desc>
  <rect x="0" y="0" width="960" height="668" fill="#f6f8fc" />
  <text x="28" y="34" fill="#295aaa" font-size="18" font-weight="650">AI INFRA   /   并行策略</text>
  <text x="28" y="82" fill="#20374d" font-size="29" font-weight="650">并行训练：每个 rank 实际负责哪一部分？</text>
  <text x="28" y="118" fill="#20374d" font-size="18" font-weight="400">以典型同步训练为例；先找状态与计算的切分方式，再判断等待哪一类通信。</text>
  <text x="35" y="167" fill="#295aaa" font-size="19" font-weight="650">策略</text>
  <text x="161" y="167" fill="#295aaa" font-size="19" font-weight="650">保留的状态</text>
  <text x="415" y="167" fill="#295aaa" font-size="19" font-weight="650">负责的计算</text>
  <text x="657" y="167" fill="#295aaa" font-size="19" font-weight="650">典型通信</text>
  <line x1="28" y1="184" x2="932" y2="184" stroke="#295aaa" stroke-width="1.4" />
  <rect x="28" y="191" width="904" height="88" fill="#ffffff" />
  <text x="35" y="218" fill="#106a65" font-size="19" font-weight="650">DP / DDP</text>
  <text x="35" y="245" fill="#20374d" font-size="18" font-weight="400">数据并行</text>
  <text x="161" y="218" fill="#20374d" font-size="18" font-weight="400">普通 DDP 每 rank</text>
  <text x="161" y="243" fill="#20374d" font-size="18" font-weight="400">保存完整模型与梯度；</text>
  <text x="161" y="268" fill="#20374d" font-size="18" font-weight="400">常规优化器状态也复制。</text>
  <text x="415" y="218" fill="#20374d" font-size="18" font-weight="400">各 rank 运行同一模型，</text>
  <text x="415" y="243" fill="#20374d" font-size="18" font-weight="400">处理不同输入分片。</text>
  <text x="657" y="218" fill="#20374d" font-size="18" font-weight="400">反向同步梯度，常见</text>
  <text x="657" y="243" fill="#20374d" font-size="18" font-weight="400">实现使用 AllReduce。</text>
  <line x1="28" y1="279" x2="932" y2="279" stroke="#c6d4df" stroke-width="1.4" />
  <text x="35" y="311" fill="#106a65" font-size="19" font-weight="650">FSDP</text>
  <text x="35" y="338" fill="#20374d" font-size="18" font-weight="400">全分片</text>
  <text x="161" y="311" fill="#20374d" font-size="18" font-weight="400">参数、梯度与优化器</text>
  <text x="161" y="336" fill="#20374d" font-size="18" font-weight="400">状态分片；计算期间</text>
  <text x="161" y="361" fill="#20374d" font-size="18" font-weight="400">按分组聚合所需参数。</text>
  <text x="415" y="311" fill="#20374d" font-size="18" font-weight="400">聚合所需参数，执行</text>
  <text x="415" y="336" fill="#20374d" font-size="18" font-weight="400">本地 batch 的层计算。</text>
  <text x="657" y="311" fill="#20374d" font-size="18" font-weight="400">参数 AllGather；</text>
  <text x="657" y="336" fill="#20374d" font-size="18" font-weight="400">梯度 ReduceScatter。</text>
  <line x1="28" y1="372" x2="932" y2="372" stroke="#c6d4df" stroke-width="1.4" />
  <rect x="28" y="377" width="904" height="88" fill="#ffffff" />
  <text x="35" y="404" fill="#106a65" font-size="19" font-weight="650">TP</text>
  <text x="35" y="431" fill="#20374d" font-size="18" font-weight="400">张量并行</text>
  <text x="161" y="404" fill="#20374d" font-size="18" font-weight="400">同一层的部分权重切分；</text>
  <text x="161" y="429" fill="#20374d" font-size="18" font-weight="400">另一些状态可以复制。</text>
  <text x="415" y="404" fill="#20374d" font-size="18" font-weight="400">在同一批输入上，</text>
  <text x="415" y="429" fill="#20374d" font-size="18" font-weight="400">各 rank 算该层的一部分。</text>
  <text x="657" y="404" fill="#20374d" font-size="18" font-weight="400">按布局归约或汇集，</text>
  <text x="657" y="429" fill="#20374d" font-size="18" font-weight="400">例：行切分后求和。</text>
  <line x1="28" y1="465" x2="932" y2="465" stroke="#c6d4df" stroke-width="1.4" />
  <text x="35" y="497" fill="#106a65" font-size="19" font-weight="650">PP</text>
  <text x="35" y="524" fill="#20374d" font-size="18" font-weight="400">流水线并行</text>
  <text x="161" y="497" fill="#20374d" font-size="18" font-weight="400">每个 stage 保存所属层</text>
  <text x="161" y="522" fill="#20374d" font-size="18" font-weight="400">以及在途微批的状态。</text>
  <text x="415" y="497" fill="#20374d" font-size="18" font-weight="400">不同 stage 处理不同层；</text>
  <text x="415" y="522" fill="#20374d" font-size="18" font-weight="400">用微批交错推进。</text>
  <text x="657" y="497" fill="#20374d" font-size="18" font-weight="400">相邻 stage 传前向激活</text>
  <text x="657" y="522" fill="#20374d" font-size="18" font-weight="400">并反向传对应梯度。</text>
  <line x1="28" y1="558" x2="932" y2="558" stroke="#c6d4df" stroke-width="1.4" />
  <line x1="146" y1="185" x2="146" y2="560" stroke="#c6d4df" stroke-width="1.4" />
  <line x1="398" y1="185" x2="398" y2="560" stroke="#c6d4df" stroke-width="1.4" />
  <line x1="643" y1="185" x2="643" y2="560" stroke="#c6d4df" stroke-width="1.4" />
  <text x="29" y="593" fill="#96501f" font-size="18" font-weight="650">选型前检查：单 rank 峰值能否容纳？通信能否被计算覆盖？微批是否足以填满流水线？</text>
  <text x="29" y="628" fill="#20374d" font-size="18" font-weight="400">这些策略可以组合；阶段、分片组、精度与拓扑都会改变实际峰值、通信次数和吞吐。</text>
</svg>
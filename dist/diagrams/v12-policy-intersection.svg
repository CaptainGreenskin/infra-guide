<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="title desc"><title id="title">授权是约束交集：身份与参数均不能代替许可</title><desc id="desc">三个必要约束的交集，叠加主体、租户、条件与显式拒绝。</desc><defs><clipPath id="ca"><circle cx="365" cy="290" r="150"/></clipPath><clipPath id="cb"><circle cx="565" cy="290" r="150"/></clipPath></defs><rect width="960" height="700" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="46" font-size="26" fill="#24344d" text-anchor="start" font-weight="700">授权是约束交集：身份与参数均不能代替许可</text><text x="30" y="89" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">简化教学模型：各必要条件同时成立，显式拒绝不能被允许覆盖</text><circle cx="365" cy="290" r="150" fill="#e7eefb" stroke="#315dce" stroke-width="2"/><circle cx="565" cy="290" r="150" fill="#e4f2ee" stroke="#258b80" stroke-width="2" fill-opacity=".65"/><circle cx="465" cy="415" r="150" fill="#fff0df" stroke="#c98843" stroke-width="2" fill-opacity=".6"/><g clip-path="url(#ca)"><g clip-path="url(#cb)"><circle cx="465" cy="415" r="150" fill="#8cc7bc"/></g></g><text x="300" y="237" font-size="21" fill="#24344d" text-anchor="middle" font-weight="600">动作允许</text><text x="640" y="237" font-size="21" fill="#24344d" text-anchor="middle" font-weight="600">资源允许</text><text x="465" y="511" font-size="21" fill="#24344d" text-anchor="middle" font-weight="600">可信委托范围</text><rect x="394" y="326" width="142" height="52" rx="6" fill="#fff" stroke="none"/><text x="465" y="359" font-size="20" fill="#24344d" text-anchor="middle" font-weight="600">有效交集</text><text x="30" y="630" font-size="18" fill="#24344d" text-anchor="start" font-weight="400">还需：可信主体、租户与条件满足，并且没有有效显式拒绝。</text><text x="30" y="666" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">参数 schema 合法只是形状检查；此图不是某个云厂商完整的策略求值器。</text></g></svg>
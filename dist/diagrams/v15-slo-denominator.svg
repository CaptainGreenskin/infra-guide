<path d="M76 235 V469" fill="none" stroke="#c7d4df" stroke-width="2" />
<text x="56" y="503" fill="#50647a" font-size="18" font-weight="400" text-anchor="start">蓝：A 好　青：B 好　橙：B 坏</text>
<text x="448" y="185" fill="#20324a" font-size="23" font-weight="700" text-anchor="start">分子、分母先各自相加</text>
<text x="448" y="234" fill="#2759a5" font-size="20" font-weight="700" text-anchor="start">实例 A</text>
<text x="584" y="234" fill="#20324a" font-size="20" font-weight="400" text-anchor="start">100 好 / 100 总 = 100%</text>
<text x="448" y="289" fill="#08776d" font-size="20" font-weight="700" text-anchor="start">实例 B</text>
<text x="584" y="289" fill="#20324a" font-size="20" font-weight="400" text-anchor="start">810 好 / 900 总 = 90%</text>
<path d="M448 318 H924" fill="none" stroke="#c7d4df" stroke-width="2" />
<text x="448" y="366" fill="#20324a" font-size="21" font-weight="700" text-anchor="start">全局</text>
<text x="584" y="366" fill="#20324a" font-size="21" font-weight="700" text-anchor="start">910 好 / 1,000 总 = 91%</text>
<text x="448" y="426" fill="#9e4a16" font-size="19" font-weight="400" text-anchor="start">错误算法： (100% + 90%) / 2 = 95%</text>
<text x="448" y="466" fill="#50647a" font-size="18" font-weight="400" text-anchor="start">它给两个实例相同权重。B 实际承载 9 倍流量。</text>
<rect x="36" y="548" width="888" height="137" rx="12" fill="#ffefdd" stroke="none"/>
<text x="54" y="582" fill="#9e4a16" font-size="22" font-weight="700" text-anchor="start">目标 99%：这个窗口允许多少坏请求？</text>
<text x="54" y="621" fill="#20324a" font-size="20" font-weight="400" text-anchor="start">允许 1,000 × 1% = 10；实际 90，预算余额为 10 − 90 = −80。</text>
<text x="54" y="659" fill="#50647a" font-size="18" font-weight="400" text-anchor="start">坏率 9% ÷ 允许坏率 1% = 9 倍消耗速率。它不是整个周期已经耗尽 9 倍的证明。</text>
</svg>

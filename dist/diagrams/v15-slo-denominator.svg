<text x="36" y="84" fill="#20324a" font-size="30" font-weight="700" text-anchor="start">两个实例的成功率，为什么不能直接平均？</text>
<text x="36" y="117" fill="#50647a" font-size="19" font-weight="400" text-anchor="start">同一观察窗、同一查询口径。每格代表 10 次请求，共 100 格；按发生请求数加权。</text>

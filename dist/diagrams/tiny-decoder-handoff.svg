<svg xmlns="http://www.w3.org/2000/svg" width="780" height="475" viewBox="0 0 780 475" role="img" aria-labelledby="title desc">
  <title id="title">同一个 664 参数模型从双进程训练到恢复和推理</title>
  <desc id="desc">两个进程完成第一步，有效目标分别为 1 和 3。检查点保存参数、动量和游标。新训练进程组从第二步继续，有效目标分别为 3 和 1。推理新进程加载第二步的导出权重，对同一提示分别运行完整前缀和带缓存的前向，选出相同的 1、1、1，缓存长度为 2、3、4。</desc>
  <metadata>{"record":"labs/tiny-decoder-handoff/validation.json","parameters":664,"valid_targets":[[1,3],[3,1]],"saved_step":1,"exported_step":2,"generated":[1,1,1],"cache":[2,3,4]}</metadata>
  <rect width="780" height="475" rx="18" fill="#f4f8fc"/>
  <g fill="#17304a" font-family="system-ui,sans-serif">
    <text x="28" y="43" font-size="26" font-weight="700">同一份参数怎样走到推理进程？</text>
    <text x="28" y="79" font-size="20">664 参数 TinyDecoder · 两个 CPU/Gloo 训练进程</text>
    <rect x="28" y="104" width="724" height="91" rx="11" fill="#dceafb"/>
    <text x="48" y="139" font-size="21" font-weight="700">第一步　按 1 + 3 个有效目标合并梯度</text>
    <text x="48" y="171" font-size="19">写检查点，保存参数、优化器动量和已完成步数 1。</text>
    <rect x="28" y="206" width="724" height="91" rx="11" fill="#dbeee9"/>
    <text x="48" y="241" font-size="21" font-weight="700">第二步　新训练进程按检查点继续</text>
    <text x="48" y="273" font-size="19">这一步的有效目标改为 3 + 1，完成后导出权重。</text>
    <rect x="28" y="308" width="724" height="103" rx="11" fill="#fae8d5"/>
    <text x="48" y="343" font-size="21" font-weight="700">新推理进程　核对权重摘要并加载</text>
    <text x="48" y="373" font-size="19">同一个提示选出 [1,1,1]，缓存长度为 [2,3,4]。</text>
    <text x="48" y="397" font-size="19">完整前缀与增量路径逐项比较候选分数。</text>
    <text x="28" y="449" font-size="18">读回训练状态保证继续更新，推理只读取导出权重。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="460" height="450" viewBox="0 0 460 450" role="img" aria-labelledby="promotion-title promotion-desc">
  <title id="promotion-title">Redis 副本提升后的订单值</title>
  <desc id="promotion-desc">两组起点均为 v7。主节点写入 v8 都返回 OK。复制在线时 WAIT 返回 1，副本提升后读到 v8。复制断开时 WAIT 返回 0，副本提升后仍读到 v7。</desc>
  <metadata>{"record":"labs/redis-replica-promotion/validation.json","before":"v7/pending","after":"v8/shipped","wait":{"healthy":1,"disconnected":0},"promoted":{"healthy":"v8/shipped","disconnected":"v7/pending"}}</metadata>
  <rect width="460" height="450" rx="14" fill="#f2f6fb"/>
  <g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#132b46">
    <text x="24" y="38" font-size="24" font-weight="700">Redis 切换后读到哪一版</text>
    <text x="24" y="66" font-size="17" fill="#435b76">两组起点相同，旧主与副本都是 v7</text>
    <g data-case="healthy">
      <rect x="18" y="89" width="424" height="141" rx="12" fill="#fff" stroke="#9bafc7"/>
      <text x="35" y="123" font-size="20" font-weight="700">复制在线</text>
      <text x="35" y="155" font-size="16" fill="#435b76">主节点写 v8</text>
      <text x="173" y="155" font-size="16" fill="#435b76">副本确认数</text>
      <text x="320" y="155" font-size="16" fill="#435b76">提升后读取</text>
      <text x="35" y="191" font-size="21" font-weight="700" fill="#234a92">SET → OK</text>
      <text x="173" y="191" font-size="21" font-weight="700" fill="#146348">WAIT → 1</text>
      <text x="320" y="191" font-size="19" font-weight="700" fill="#146348">v8/shipped</text>
      <path d="M144 184h14m-5-5 5 5-5 5M292 184h14m-5-5 5 5-5 5" stroke="#657f9c" stroke-width="2" fill="none"/>
    </g>
    <g data-case="disconnected">
      <rect x="18" y="247" width="424" height="141" rx="12" fill="#fff" stroke="#9bafc7"/>
      <text x="35" y="281" font-size="20" font-weight="700">写入前断开复制</text>
      <text x="35" y="313" font-size="16" fill="#435b76">主节点写 v8</text>
      <text x="173" y="313" font-size="16" fill="#435b76">副本确认数</text>
      <text x="320" y="313" font-size="16" fill="#435b76">提升后读取</text>
      <text x="35" y="349" font-size="21" font-weight="700" fill="#234a92">SET → OK</text>
      <text x="173" y="349" font-size="21" font-weight="700" fill="#96491a">WAIT → 0</text>
      <text x="320" y="349" font-size="19" font-weight="700" fill="#96491a">v7/pending</text>
      <path d="M144 342h14m-5-5 5 5-5 5M292 342h14m-5-5 5 5-5 5" stroke="#657f9c" stroke-width="2" fill="none"/>
    </g>
    <text x="24" y="426" font-size="17" fill="#435b76">读旧主上的 v8 → 停止旧主 → 提升副本</text>
  </g>
</svg>

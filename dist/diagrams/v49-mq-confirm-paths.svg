<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">谁向谁确认，决定这份确认能证明什么</title><desc id="desc">发布确认、消费者ACK与业务回执属于三个不同边界。</desc><metadata>{&quot;kind&quot;: &quot;confirmation_boundaries&quot;, &quot;mandatory&quot;: {&quot;unroutable_detected&quot;: true}, &quot;no_route&quot;: {&quot;publish_returned_normally&quot;: true, &quot;queue_exists&quot;: false}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="550" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">谁向谁确认，决定这份确认能证明什么</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">同一业务report-27；运输接收、运输处理与业务提交分开确认。</text><rect x="32" y="140" width="265" height="105" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="180" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">生产者</text><text x="52" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">发送运输消息</text><rect x="345" y="140" width="265" height="105" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="365" y="180" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">消息代理</text><text x="365" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">路由 / 排队 / 重投</text><rect x="660" y="140" width="265" height="105" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="680" y="180" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">消费者</text><text x="680" y="218" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">执行并写业务库</text><path d="M298 163L339 163" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M345 220L304 220" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="205" y="300" font-size="21" fill="#315dce" font-weight="600" text-anchor="start">① 发布确认：代理 → 生产者</text><path d="M610 163L654 163" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M660 220L616 220" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="550" y="345" font-size="21" fill="#236e5e" font-weight="600" text-anchor="start">② ACK：消费者 → 代理</text><rect x="345" y="385" width="580" height="74" rx="7" fill="#e8f4ef" stroke="#bdd8cf"/><text x="370" y="430" font-size="24" fill="#236e5e" font-weight="600" text-anchor="start">③ 业务事务：效果37 + 稳定回执</text><path d="M790 245L790 378" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="32" y="510" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">发布被确认但不可路由、ACK过早却没效果，都在真实实验中单独核对。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="687" viewBox="0 0 1120 687" role="img"><title>NetworkPolicy：先看缩进，再看方向</title><desc>下面讨论Pod流量的选择与允许语义；节点、hostNetwork及具体数据面行为另核对。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="685" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">NetworkPolicy：先看缩进，再看方向</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">下面讨论Pod流量的选择与允许语义；节点、hostNetwork及具体数据面行为另核对。</text><rect x="36" y="124" width="500" height="235" rx="12" fill="#fff" stroke="#cdd9e9"/><rect x="564" y="124" width="520" height="235" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="58" y="161" font-size="23" fill="#315dce" font-weight="700">同一个from条目：选择条件相交</text><text x="58" y="202" font-size="19" fill="#17263e" font-weight="400">namespaceSelector: team=analytics</text><text x="58" y="238" font-size="19" fill="#17263e" font-weight="400">podSelector: role=reader</text><text x="58" y="287" font-size="20" fill="#12725b" font-weight="700">选中analytics命名空间里的reader Pod</text><text x="58" y="325" font-size="20" fill="#17263e" font-weight="400">两个选择器必须同时满足：AND</text><text x="586" y="161" font-size="23" fill="#315dce" font-weight="700">两个from条目：允许来源合并</text><text x="586" y="202" font-size="19" fill="#17263e" font-weight="400">条目1：team=analytics中的全部Pod</text><text x="586" y="238" font-size="19" fill="#17263e" font-weight="400">条目2：策略所在命名空间的reader Pod</text><text x="586" y="287" font-size="20" fill="#b53e3e" font-weight="700">满足任意一项即可，范围可能扩大</text><text x="586" y="325" font-size="20" fill="#17263e" font-weight="400">不同条目满足其一：OR</text><rect x="36" y="401" width="1048" height="166" rx="12" fill="#edf6f3" stroke="#abd2c4"/><text x="58" y="438" font-size="23" fill="#12725b" font-weight="700">方向判定还要再做一次AND</text><text x="58" y="479" font-size="21" fill="#17263e" font-weight="400">源端egress允许     +     目的端ingress允许     →     本次连接可被策略放行</text><text x="58" y="518" font-size="20" fill="#17263e" font-weight="400">某方向未隔离时采用该方向的默认允许；已隔离则匹配允许规则。</text><text x="58" y="549" font-size="18" fill="#56667d" font-weight="400">同一端、同一方向的多条允许策略取并集；不是“后写规则覆盖前写规则”。</text><text x="38" y="612" font-size="18" fill="#56667d" font-weight="400">前提：网络插件实际实施NetworkPolicy。Service NAT前后按哪组地址匹配，需核对具体实现。</text><text x="38" y="647" font-size="20" fill="#17263e" font-weight="700">网络可达仍不替代应用认证、租户隔离或资源授权。</text></g></svg>

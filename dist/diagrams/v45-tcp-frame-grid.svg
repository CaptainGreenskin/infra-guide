<text x="32" y="48" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">“4个汉字”与“12个字节”是不同的长度</text>
<text x="32" y="92" font-size="25" fill="#315dce" font-weight="550" text-anchor="start">每帧：4B长度头 + 12B正文 = 16B；两帧共32B。</text>

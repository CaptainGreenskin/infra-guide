<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" role="img" aria-labelledby="resource-control-title resource-control-desc">
<title id="resource-control-title">资源控制：调度请求、运行限制与实际用量</title>
<desc id="resource-control-desc">三个并列框区分 requests、limits 和观测用量。CPU 配额不是绑核，CPU 节流与内存 OOM 不相同，所有数字为教学示例。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="610" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">资源控制：调度请求、运行限制与实际用量</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">requests / limits / usage 分别解释，不能用其中一个代替另外两个。</text>
<text x="35" y="147" font-size="17" fill="#315dce" text-anchor="start" font-weight="600">同一工作负载，三种不同的量</text><rect x="35" y="174" width="270" height="260" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="170.0" y="205" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">调度前：requests</text><text x="170.0" y="233" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">教学配置：CPU 500m / 内存 256Mi</text><text x="170.0" y="256" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">调度器据此评估节点可容纳性</text><text x="170.0" y="279" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">CPU 争用时还影响相对份额</text><text x="170.0" y="302" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400"></text><text x="170.0" y="325" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">它不是当前实际用量</text><text x="170.0" y="348" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">也不是一组专属 CPU 核</text><rect x="345" y="174" width="270" height="260" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="480.0" y="205" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">运行时：limits</text><text x="480.0" y="233" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">教学配置：CPU 1 / 内存 512Mi</text><text x="480.0" y="256" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">CPU：限制可消费的 CPU 时间</text><text x="480.0" y="279" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">内存：超限可能触发 OOM</text><text x="480.0" y="302" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400"></text><text x="480.0" y="325" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">CPU 节流与内存 OOM</text><text x="480.0" y="348" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">是不同的执行机制</text><rect x="655" y="174" width="270" height="260" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="790.0" y="205" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">观测：实际用量</text><text x="790.0" y="233" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">示例读数：CPU 80m / 内存 180Mi</text><text x="790.0" y="256" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">由指标、采样窗口和范围决定</text><text x="790.0" y="279" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">保留容器 / 节点等维度</text><text x="790.0" y="302" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400"></text><text x="790.0" y="325" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">低用量不抹去已有调度请求</text><text x="790.0" y="348" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">单个瞬时值不能代表容量需求</text><rect x="35" y="469" width="890" height="90" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="53" y="498" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">三个量分别回答：能放在哪里？运行受什么约束？现在消耗多少？</text><text x="53" y="524" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">数字仅用于解释关系；默认值、准入策略、运行时和资源类型会影响具体行为。</text>
<text x="30" y="588" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 742" width="1120" height="742" role="img" aria-labelledby="title desc"><title id="title">从一笔用户结果，走到总体指标与预算</title><desc id="desc">分母、好事件与目标各有职责；机器数量不参与请求权重。</desc><metadata>{&quot;kind&quot;: &quot;fixed_count_ledger&quot;, &quot;total&quot;: 1000, &quot;good&quot;: 989, &quot;bad&quot;: 11, &quot;target&quot;: &quot;99/100&quot;, &quot;allowed_bad&quot;: 10, &quot;remaining&quot;: -1, &quot;production_measurement&quot;: false}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="740" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">从一笔用户结果，走到总体指标与预算</text><text x="36" y="84" font-size="18" fill="#56667d" font-weight="400">分母、好事件与目标各有职责；机器数量不参与请求权重。</text><rect x="36" y="121" width="1048" height="90" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="155" font-size="23" fill="#315dce" font-weight="700">同一个用户事件：归属正确 + 版本正确 + 端到端 ≤ 500毫秒</text><text x="58" y="189" font-size="20" fill="#17263e" font-weight="400">先分类、等待结果成熟，再合并；超时不能因缺少结束日志而消失。</text><rect x="36" y="244" width="1048" height="64" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="284" font-size="23" fill="#17263e" font-weight="700">甲</text><text x="215" y="284" font-size="24" fill="#17263e" font-weight="400">总 900</text><text x="492" y="284" font-size="24" fill="#17263e" font-weight="400">好 899</text><text x="788" y="284" font-size="24" fill="#17263e" font-weight="400">坏 1</text><rect x="36" y="324" width="1048" height="64" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="364" font-size="23" fill="#17263e" font-weight="700">乙</text><text x="215" y="364" font-size="24" fill="#17263e" font-weight="400">总 100</text><text x="492" y="364" font-size="24" fill="#17263e" font-weight="400">好 90</text><text x="788" y="364" font-size="24" fill="#17263e" font-weight="400">坏 10</text><rect x="36" y="418" width="1048" height="64" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="58" y="458" font-size="23" fill="#12725b" font-weight="700">合并</text><text x="215" y="458" font-size="24" fill="#17263e" font-weight="400">总 1000</text><text x="492" y="458" font-size="24" fill="#17263e" font-weight="400">好 989</text><text x="788" y="458" font-size="24" fill="#17263e" font-weight="400">坏 11</text><path d="M558 391L558 413" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="518" width="504" height="145" rx="10" fill="#fff" stroke="#cdd9e9"/><rect x="564" y="518" width="520" height="145" rx="10" fill="#fff6e8" stroke="#cdd9e9"/><text x="58" y="555" font-size="23" fill="#315dce" font-weight="700">SLI：已经发生的好率</text><text x="58" y="599" font-size="27" fill="#17263e" font-weight="400">989 ÷ 1000 = 98.9%</text><text x="58" y="642" font-size="20" fill="#56667d" font-weight="400">先加计数，再求比率</text><text x="586" y="555" font-size="23" fill="#936013" font-weight="700">SLO 99% → 允许坏事件10</text><text x="586" y="599" font-size="25" fill="#17263e" font-weight="400">剩余预算：10 − 11 = −1</text><text x="586" y="642" font-size="20" fill="#17263e" font-weight="400">燃烧倍数：1.1% ÷ 1% = 1.1</text><text x="38" y="707" font-size="19" fill="#56667d" font-weight="400">固定教学计数；不是生产采集。99.9%的双窗口告警属于后面的独立题设。</text></g></svg>

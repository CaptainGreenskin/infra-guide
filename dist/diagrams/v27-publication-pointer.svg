<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735" role="img"><title>生产别名可以变，模型版本束与请求引用要固定</title><desc>先验证不可变成员，再条件切换指针；指针更新与所有副本生效分别观察。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="733" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">生产别名可以变，模型版本束与请求引用要固定</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">先验证不可变成员，再条件切换指针；指针更新与所有副本生效分别观察。</text><rect x="36" y="153" width="312" height="123" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="56" y="197" font-size="31" fill="#315dce" font-weight="700">r17</text><text x="56" y="239" font-size="24" fill="#17263e" font-weight="400">发布代际 1</text><rect x="404" y="153" width="312" height="123" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="424" y="197" font-size="31" fill="#12725b" font-weight="700">r19</text><text x="424" y="239" font-size="24" fill="#17263e" font-weight="400">发布代际 2</text><rect x="772" y="153" width="312" height="123" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="792" y="197" font-size="31" fill="#315dce" font-weight="700">r17</text><text x="792" y="239" font-size="24" fill="#17263e" font-weight="400">发布代际 3</text><path d="M354 215L394 215" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M722 215L762 215" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><text x="341" y="310" font-size="21" fill="#12725b" font-weight="700">验证候选后切换</text><text x="711" y="350" font-size="21" fill="#315dce" font-weight="700">完整旧束可用才回退</text><rect x="36" y="390" width="500" height="165" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="58" y="432" font-size="25" fill="#b53e3e" font-weight="700">拒绝r18</text><text x="58" y="473" font-size="22" fill="#17263e" font-weight="400">摘要/形状过，语义门禁不过</text><text x="58" y="516" font-size="23" fill="#17263e" font-weight="400">路由保持r17/1</text><rect x="584" y="390" width="500" height="165" rx="10" fill="#fff1e6" stroke="#ccd8e8"/><text x="606" y="432" font-size="23" fill="#b53e3e" font-weight="700">拒绝迟到发布者与残缺回退</text><text x="606" y="473" font-size="21" fill="#17263e" font-weight="400">旧期望r17/1不能覆盖r19/2</text><text x="606" y="516" font-size="22" fill="#17263e" font-weight="400">缺tokenizer时不切指针</text><text x="38" y="619" font-size="22" fill="#315dce" font-weight="700">条件更新同时核对：旧版本 + 旧代际 + 旧清单摘要。回到r17，代际仍向前走。</text><text x="38" y="695" font-size="18" fill="#56667d" font-weight="400">实际SQLite指针与CPU对象；未实现分布式路由/灰度排空。正在处理的请求固定完整r17对象。</text></g></svg>

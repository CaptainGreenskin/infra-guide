<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">AI Infra：训练与推理共享什么，又分开什么</title><desc id="desc">模型计算形成训练更新闭环，检查点支持继续，完整产物经过验证和发布进入推理，执行资源支撑两条路径。</desc><metadata>{&quot;kind&quot;: &quot;conceptual_system_map&quot;, &quot;track&quot;: &quot;ai&quot;, &quot;domains&quot;: [&quot;A1&quot;, &quot;A2&quot;, &quot;A3&quot;], &quot;training_updates_parameters&quot;: true, &quot;inference_uses_parameters&quot;: true, &quot;trace&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="590" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">AI Infra：训练与推理共享什么，又分开什么</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">训练改变参数，推理使用参数；共同计算骨架不代表相同执行目标。</text><rect x="32" y="135" width="278" height="80" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="182" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">输入与目标</text><path d="M312 175L336 175" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="340" y="135" width="278" height="80" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="360" y="182" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">模型计算</text><path d="M620 175L644 175" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="650" y="135" width="278" height="80" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="670" y="182" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">损失、梯度与更新</text><path d="M790 218L790 260" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M790 260L475 260" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M475 260L475 219" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="535" y="251" font-size="18" fill="#236e5e" font-weight="400" text-anchor="start">训练：新参数回到模型</text><rect x="32" y="310" width="420" height="88" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="347" font-size="23" fill="#24344d" font-weight="400" text-anchor="start">检查点与训练进度（A2）</text><text x="52" y="378" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">继续同一更新过程</text><rect x="510" y="310" width="420" height="88" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="530" y="347" font-size="23" fill="#24344d" font-weight="400" text-anchor="start">完整产物与推理（A3）</text><text x="530" y="378" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">使用参数，处理输入并继续生成</text><path d="M385 218L245 306" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="130" y="268" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">保存状态</text><path d="M455 355L506 355" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="480" y="426" font-size="18" fill="#24344d" font-weight="400" text-anchor="middle">导出 / 验证 / 发布</text><rect x="32" y="445" width="896" height="63" rx="7" fill="#e8f4ef" stroke="#bdd8cf"/><text x="52" y="485" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">GPU、数据、通信与资源平台支撑两条路径；正确性、质量与速度分开验收。</text><text x="32" y="553" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">A1建立模型与执行原理，A2组织训练，A3组织作业与对外服务。</text></g></svg>
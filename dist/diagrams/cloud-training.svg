<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">云上训练：控制、计算与数据三个平面</title><desc id="desc">调度器控制两台训练节点，各节点读取数据，节点间双向 NCCL 通信，节点 A 的 rank 0 提交检查点。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#61748e}.title{font-size:22px;font-weight:700}.eyebrow{font-size:10px;fill:#315dce;letter-spacing:2px}</style><rect width="960" height="490" rx="14" fill="#f6f8fc"/><text x="30" y="30" class="eyebrow">CLOUDINFRA GUIDE / TRAINING SYSTEMS</text><text x="30" y="67" class="title">云上训练：控制、计算与数据三个平面</text><rect x="35" y="100" width="230" height="70" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="150.0" y="130" text-anchor="middle" class="label">任务声明</text><text x="150.0" y="153" text-anchor="middle" class="small">镜像 / 数据版本 / 超参数</text><rect x="360" y="100" width="230" height="70" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="475.0" y="130" text-anchor="middle" class="label">调度与作业控制</text><text x="475.0" y="153" text-anchor="middle" class="small">配额 / 拓扑 / 失败策略</text><rect x="685" y="100" width="230" height="70" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="800.0" y="130" text-anchor="middle" class="label">可观测性</text><text x="800.0" y="153" text-anchor="middle" class="small">指标 / 日志 / 运行记录</text><path d="M265 135 L360 135" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M590 135 L685 135" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="205" y="225" width="240" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="325.0" y="255" text-anchor="middle" class="label">训练节点 A</text><text x="325.0" y="278" text-anchor="middle" class="small">GPU 0 / 1 · RANK 0 / 1</text><rect x="520" y="225" width="240" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="640.0" y="255" text-anchor="middle" class="label">训练节点 B</text><text x="640.0" y="278" text-anchor="middle" class="small">GPU 0 / 1 · RANK 2 / 3</text><path d="M445 268 L520 268" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M520 288 L445 288" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="451" y="255" class="small">NCCL</text><path d="M475 170 L325 225" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><path d="M475 170 L640 225" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="70" y="390" width="280" height="70" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="210.0" y="420" text-anchor="middle" class="label">版本化数据集 / 缓存</text><text x="210.0" y="443" text-anchor="middle" class="small">读取 → 解码 → 批处理</text><rect x="610" y="390" width="280" height="70" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="750.0" y="420" text-anchor="middle" class="label">持久化检查点</text><text x="750.0" y="443" text-anchor="middle" class="small">模型 / 优化器 / 进度 / RNG</text><path d="M160 390 L250 325" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M330 390 L570 325" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M440 325 L750 390" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="365" y="417" class="small">所有 rank 读取输入</text><text x="365" y="440" class="small">本实验由 rank 0 提交检查点</text><text x="365" y="465" class="small">实线：数据 / 虚线：控制</text></svg>
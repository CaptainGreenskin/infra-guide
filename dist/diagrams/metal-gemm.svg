<svg xmlns="http://www.w3.org/2000/svg" width="520" height="331" viewBox="0 0 520 331" role="img" aria-labelledby="title description">
<title id="title">35×67×19 矩阵乘法的输出块与尾部</title>
<desc id="description">A 为 35 行 19 列，B 为 19 行 67 列，输出 C 分为三行五列的线程组。右下输出块只有前三行三列有效。每个线程组先计算 K 轴的前 16 项，再计算 3 项并补 13 个零。每轮同步后读取两份组内共享的小块。</desc>

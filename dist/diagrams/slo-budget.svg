<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="slo-budget-title slo-budget-desc">
<title id="slo-budget-title">SLO：从有效事件到可执行的可靠性决策</title>
<desc id="slo-budget-desc">先确定事件范围与窗口，汇总成功和总数，再根据 SLO 算错误预算并选择行动。零事件表示无数据。例子中的1000次请求、998次成功为教学输入，并非实测。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="630" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">SLO：从有效事件到可执行的可靠性决策</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">指标口径、预算与处置动作必须连在一起；没有请求不等于服务已被验证。</text>
<text x="35" y="143" font-size="15" fill="#315dce" text-anchor="start" font-weight="600">以请求成功率为例</text><rect x="35" y="164" width="190" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="130.0" y="195" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">有效事件</text><text x="130.0" y="223" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">先定范围与时间窗口</text><text x="130.0" y="246" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">按约定排除无效事件</text><rect x="265" y="164" width="190" height="112" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="360.0" y="195" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">good / total</text><text x="360.0" y="223" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">汇总计数后再相除</text><text x="360.0" y="246" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">不能平均实例成功率</text><rect x="495" y="164" width="190" height="112" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="590.0" y="195" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">SLO 与错误预算</text><text x="590.0" y="223" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">允许失败 = N × (1 − SLO)</text><text x="590.0" y="246" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">保留已用与剩余预算</text><rect x="725" y="164" width="190" height="112" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="820.0" y="195" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">行动与复查</text><text x="820.0" y="223" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">结合燃烧率与用户影响</text><text x="820.0" y="246" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">告警 / 变更 / 改进</text><path d="M225 219 L265 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 219 L495 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 219 L725 219" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 276 L360 322" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="245" y="322" width="325" height="112" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="263" y="351" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">total = 0 → 无数据</text><text x="263" y="377" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">不做除法，也不擅自填成 100%</text><text x="263" y="400" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">结合流量、探测与采集状态判断</text><rect x="35" y="470" width="890" height="112" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="53" y="499" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">教学算例：N = 1,000，成功 = 998，SLO = 99.9%</text><text x="53" y="525" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">允许失败 1 次；实际失败 2 次；预算已用 200%，剩余 −1 次。</text><text x="53" y="548" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">请求型预算不能直接换算成固定停机分钟数。</text>
<text x="30" y="608" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
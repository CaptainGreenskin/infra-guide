<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 775" width="1120" height="775" role="img" aria-labelledby="title desc">
<title id="title">数据页、redo、binlog与业务回执的分工</title><desc id="desc">一次事务同时更新账户和插入回执。引擎页恢复材料与服务器事务事件分层记录；数据页可后续写回。图不表达固定fsync次数。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="775" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce" stroke-width="1.5"/></marker></defs>
<text x="32" y="48" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">同一笔事务，留下不同层次的恢复材料</text>
<rect x="32" y="98" width="1056" height="80" rx="5" fill="#edf2ff" stroke="#dbe2ed"/>
<text x="560" y="148" font-size="28" fill="#315dce" font-weight="600" text-anchor="middle">事务：账户加20，并插入回执T102</text>
<line x1="194" y1="183" x2="194" y2="220" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="232" width="324" height="188" rx="5" fill="#f4f7fb" stroke="#dbe2ed"/>
<text x="50" y="277" font-size="26" fill="#315dce" font-weight="600" text-anchor="start">页、版本与undo</text>
<text x="50" y="331" font-size="21" fill="#1c283d" font-weight="400" text-anchor="start">内存中的账户变为130</text>
<text x="50" y="384" font-size="22" fill="#287b69" font-weight="400" text-anchor="start">回滚与历史可见性</text>
<line x1="560" y1="183" x2="560" y2="220" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="398" y="232" width="324" height="188" rx="5" fill="#f4f7fb" stroke="#dbe2ed"/>
<text x="416" y="277" font-size="26" fill="#315dce" font-weight="600" text-anchor="start">redo日志</text>
<text x="416" y="331" font-size="21" fill="#1c283d" font-weight="400" text-anchor="start">恢复相关页修改的记录</text>
<text x="416" y="384" font-size="22" fill="#287b69" font-weight="400" text-anchor="start">引擎崩溃恢复</text>
<line x1="926" y1="183" x2="926" y2="220" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="764" y="232" width="324" height="188" rx="5" fill="#f4f7fb" stroke="#dbe2ed"/>
<text x="782" y="277" font-size="26" fill="#315dce" font-weight="600" text-anchor="start">binlog行事件</text>
<text x="782" y="331" font-size="21" fill="#1c283d" font-weight="400" text-anchor="start">账户的新值130 + 回执行</text>
<text x="782" y="384" font-size="22" fill="#287b69" font-weight="400" text-anchor="start">复制 / 备份后的重放</text>
<text x="32" y="471" font-size="25" fill="#1c283d" font-weight="550" text-anchor="start">提交协调引擎状态与服务器日志；必要的持久化顺序必须满足。</text>
<line x1="52" y1="505" x2="1060" y2="505" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<text x="52" y="548" font-size="24" fill="#315dce" font-weight="550" text-anchor="start">引擎准备</text>
<text x="400" y="548" font-size="24" fill="#315dce" font-weight="550" text-anchor="start">相应日志保证</text>
<text x="840" y="548" font-size="24" fill="#315dce" font-weight="550" text-anchor="start">完成提交</text>
<rect x="32" y="588" width="1056" height="112" rx="5" fill="#edf7f3" stroke="#dbe2ed"/>
<text x="54" y="631" font-size="24" fill="#287b69" font-weight="550" text-anchor="start">脏数据页可以随后写回：崩溃时依靠对应日志恢复一致状态。</text>
<text x="54" y="675" font-size="23" fill="#1c283d" font-weight="400" text-anchor="start">业务回执与账户同事务，但仍需独立核对它们是否完整恢复。</text>
<text x="32" y="744" font-size="21" fill="#66738a" font-weight="400" text-anchor="start">顺序示意；组提交可以合并物理工作，不按图中阶段数计算fsync。</text>
<metadata>{&quot;kind&quot;: &quot;layer_and_commit_responsibilities&quot;, &quot;statement&quot;: &quot;UPDATE balance+20; INSERT T102&quot;, &quot;declared_before&quot;: 110, &quot;declared_after&quot;: 130, &quot;fixed_fsync_count&quot;: false}</metadata>
</svg>
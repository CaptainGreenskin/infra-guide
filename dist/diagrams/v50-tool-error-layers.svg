<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc"><title id="title">从连接到任务：逐层解释失败与成功</title><desc id="desc">区分连接结果、HTTP响应、工具协议、执行、输出结构和业务任务；503是HTTP响应。</desc><metadata>{&quot;kind&quot;: &quot;conceptual_error_boundaries&quot;, &quot;uses_existing_cases&quot;: true, &quot;http_503_is_application_response&quot;: true, &quot;connection_loss_does_not_prove_no_effect&quot;: true, &quot;business_expected&quot;: 37, &quot;business_wrong&quot;: 38, &quot;new_experiment_claimed&quot;: false}</metadata><rect width="1120" height="820" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="24" y="46" font-size="29" font-weight="650" fill="#24344d">从连接到任务：逐层解释失败与成功</text><text x="24" y="88" font-size="19" fill="#60708b">每一层只支持相应结论；重试还要结合动作语义与预算。</text><rect x="24" y="120" width="1072" height="88" rx="7" fill="#edf2fc" stroke="#ccd6e6"/><text x="43" y="155" font-size="22" fill="#315dce">连接结果</text><text x="260" y="155" font-size="22" fill="#24344d">未建立连接，或写入后断连</text><text x="260" y="188" font-size="18" fill="#556783">连接未建立与结果未知分开；没有响应不证明业务未发生。</text><rect x="24" y="225" width="1072" height="88" rx="7" fill="#f6f8fc" stroke="#ccd6e6"/><text x="43" y="260" font-size="22" fill="#315dce">HTTP响应</text><text x="260" y="260" font-size="22" fill="#24344d">503：响应方暂时无法处理</text><text x="260" y="293" font-size="18" fill="#556783">已经得到应用层响应；本例只读调用可以按预算受限重试。</text><rect x="24" y="330" width="1072" height="88" rx="7" fill="#edf2fc" stroke="#ccd6e6"/><text x="43" y="365" font-size="22" fill="#315dce">工具协议</text><text x="260" y="365" font-size="22" fill="#24344d">JSON-RPC error</text><text x="260" y="398" font-size="18" fill="#556783">方法与参数错误不应伪装成可供模型使用的正常工具资料。</text><rect x="24" y="435" width="1072" height="88" rx="7" fill="#f6f8fc" stroke="#ccd6e6"/><text x="43" y="470" font-size="22" fill="#315dce">工具执行</text><text x="260" y="470" font-size="22" fill="#24344d">result.isError=true</text><text x="260" y="503" font-size="18" fill="#556783">业务拒绝或执行失败，不因为HTTP 200而进入成功路径。</text><rect x="24" y="540" width="1072" height="88" rx="7" fill="#edf2fc" stroke="#ccd6e6"/><text x="43" y="575" font-size="22" fill="#315dce">输出契约</text><text x="260" y="575" font-size="22" fill="#24344d">结构化结果的类型不符</text><text x="260" y="608" font-size="18" fill="#556783">拒绝将错误结构加入成功观察，再定位服务或版本失配。</text><rect x="24" y="645" width="1072" height="88" rx="7" fill="#f6f8fc" stroke="#ccd6e6"/><text x="43" y="680" font-size="22" fill="#315dce">任务验收</text><text x="260" y="680" font-size="22" fill="#24344d">已写入38，任务目标却是37</text><text x="260" y="713" font-size="18" fill="#556783">保留已经发生的事实，按独立目标判定尚未完成。</text><text x="24" y="795" font-size="18" fill="#60708b">使用既有本地HTTP工具实验的观察；没有据此宣称完整MCP会话或Kairo接入。</text></g></svg>
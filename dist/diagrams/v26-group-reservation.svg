<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>整组预留要守住不变量，不是先占一点再说</title><desc>快照只是一份观察；提交时必须重新校验，失败必须收回已做的局部修改。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">整组预留要守住不变量，不是先占一点再说</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">快照只是一份观察；提交时必须重新校验，失败必须收回已做的局部修改。</text><rect x="36" y="126" width="1048" height="81" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="164" font-size="24" fill="#315dce" font-weight="700">共同快照：node-1/2各空8，版本均0，额度已用0。</text><text x="58" y="194" font-size="19" fill="#17263e" font-weight="400">两进程都从这份快照出发；本次先成功者为job-Y。</text><rect x="36" y="247" width="500" height="234" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="56" y="287" font-size="25" fill="#315dce" font-weight="700">先获得事务锁者</text><rect x="584" y="247" width="500" height="234" rx="10" fill="#fff1e6" stroke="#ccd8e8"/><text x="604" y="287" font-size="25" fill="#315dce" font-weight="700">后获得事务锁者</text><text x="58" y="334" font-size="21" fill="#17263e" font-weight="400">BEGIN IMMEDIATE → 核对版本0</text><text x="58" y="379" font-size="19" fill="#17263e" font-weight="400">两节点各扣8 + 写整组分配 + 记额度16</text><text x="58" y="430" font-size="22" fill="#12725b" font-weight="700">COMMIT：两节点版本都变1</text><text x="606" y="334" font-size="22" fill="#17263e" font-weight="400">等待前一事务释放写锁</text><text x="606" y="379" font-size="22" fill="#17263e" font-weight="400">读到版本1，与快照0不符</text><text x="606" y="430" font-size="22" fill="#b53e3e" font-weight="700">stale_snapshot；没有部分扣减</text><rect x="36" y="527" width="1048" height="120" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="568" font-size="24" fill="#315dce" font-weight="700">另一次注入：刚扣第一节点就失败 → 事务整体回滚。</text><text x="58" y="612" font-size="22" fill="#17263e" font-weight="400">两节点仍各空8、版本0、额度0、分配表为空；不留下半组预留。</text><text x="38" y="704" font-size="18" fill="#56667d" font-weight="400">真实本机两进程与单库事务；箭头是协议顺序，非耗时。不能当作Kubernetes多对象原子提交。</text></g></svg>

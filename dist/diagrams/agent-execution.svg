<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc">
<title id="title">Agent 执行链路与权限来源</title>
<desc id="desc">执行顺序是任务、模型提议、策略校验、工具执行、业务验证、状态更新。模型外的身份、用户委托和管理策略提供权限依据；检索内容和记忆只提供信息，不能授予权限。未完成且预算允许时进入下一步。策略拒绝时不执行工具。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs>
<style>
text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}
.title{font-size:23px;font-weight:700}
.label{font-size:17px;font-weight:600}
.body{font-size:15px}
.small{font-size:14px;fill:#61748e}
.eyebrow{font-size:11px;fill:#315dce;letter-spacing:2px}
.accent{font-size:15px;fill:#315dce;font-weight:600}
</style>
<rect width="960" height="630" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" class="eyebrow" text-anchor="start">INFRAGUIDE / AGENT SYSTEMS</text>
<text x="30" y="67" class="title" text-anchor="start">Agent 执行链路：提议、授权、验证分别负责</text>
<text x="30" y="95" class="small" text-anchor="start">模型提出下一步；运行时决定能否执行，并依据实际结果推进任务。</text>
<rect x="45" y="135" width="235" height="85" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="162.5" y="165" class="label" text-anchor="middle">检索内容 / 记忆</text>
<text x="162.5" y="190" class="small" text-anchor="middle">任务数据，不是权限来源</text>
<rect x="315" y="135" width="230" height="85" rx="10" fill="#edf2fe" stroke="#7e9ee5"/>
<text x="430.0" y="165" class="label" text-anchor="middle">授权来源（模型之外）</text>
<text x="430.0" y="190" class="small" text-anchor="middle">身份 · 用户委托 · 管理策略</text>
<path d="M245 220 L245 275" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="258" y="251" class="small" text-anchor="start">提供信息</text>
<path d="M402 220 L402 275" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="415" y="251" class="small" text-anchor="start">提供权限依据</text>
<rect x="28" y="280" width="124" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="90.0" y="310" class="label" text-anchor="middle">任务</text>
<text x="90.0" y="335" class="small" text-anchor="middle">目标与约束</text>
<text x="90.0" y="355" class="small" text-anchor="middle">预算 / 截止时间</text>
<path d="M157 330 L179 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="184" y="280" width="124" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="246.0" y="310" class="label" text-anchor="middle">模型提议</text>
<text x="246.0" y="335" class="small" text-anchor="middle">生成工具提议</text>
<text x="246.0" y="355" class="small" text-anchor="middle">尚未获授权</text>
<path d="M313 330 L335 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="340" y="280" width="124" height="100" rx="10" fill="#edf2fe" stroke="#7e9ee5"/>
<text x="402.0" y="310" class="label" text-anchor="middle">策略校验</text>
<text x="402.0" y="335" class="small" text-anchor="middle">参数 + 作用域</text>
<text x="402.0" y="355" class="small" text-anchor="middle">允许 / 拒绝</text>
<path d="M469 330 L491 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="496" y="280" width="124" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="558.0" y="310" class="label" text-anchor="middle">工具执行</text>
<text x="558.0" y="335" class="small" text-anchor="middle">在隔离边界内</text>
<text x="558.0" y="355" class="small" text-anchor="middle">返回结构化结果</text>
<path d="M625 330 L647 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="652" y="280" width="124" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="714.0" y="310" class="label" text-anchor="middle">业务验证</text>
<text x="714.0" y="335" class="small" text-anchor="middle">检查实际结果</text>
<text x="714.0" y="355" class="small" text-anchor="middle">是否满足目标</text>
<path d="M781 330 L803 330" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="808" y="280" width="124" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="870.0" y="310" class="label" text-anchor="middle">状态更新</text>
<text x="870.0" y="335" class="small" text-anchor="middle">记录结果 / 事件</text>
<text x="870.0" y="355" class="small" text-anchor="middle">完成或继续</text>
<path d="M870 380 L870 421 L246 421 L246 385" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="558" y="411" class="small" text-anchor="middle">未完成且仍有预算：进入下一步</text>
<rect x="28" y="457" width="904" height="118" rx="10" fill="#ffffff" stroke="#d7e1ef"/>
<text x="50" y="487" class="label" text-anchor="start">运行时落实执行边界</text>
<text x="50" y="514" class="body" text-anchor="start">策略拒绝或参数不合法时，不进入工具执行；取消与超时另行记录。</text>
<text x="50" y="543" class="body" text-anchor="start">检索文本和工具返回不能扩展权限；工具调用成功仍需业务结果验证。</text>
<text x="30" y="605" class="small" text-anchor="start">实线：执行路径　虚线：信息 / 策略输入与下一步控制</text>
</svg>

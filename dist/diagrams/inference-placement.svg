<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">同样八张卡的一组张量并行与两组张量并行</title>
  <desc id="desc">TP8 时八张卡组成一个副本。两组 TP4 时，路由器选一个完整副本。此例 A 已缓存请求的前缀但只剩 96 块，需要 128 块。B 需 512 块并有 640 块，因此选 B。</desc>
  <metadata>{"record":"labs/inference-placement/validation.json","cards":8,"routing_case":"cold_only","a_free":96,"a_new":128,"b_free":640,"b_new":512,"selected":"B"}</metadata>
  <rect width="720" height="438" rx="16" fill="#f5f8ff"/>
  <g font-family="system-ui, sans-serif" fill="#172943" font-size="22">
    <text x="24" y="42" font-weight="700">同样八张卡，怎样接一条请求？</text>
    <rect x="24" y="60" width="672" height="112" rx="12" fill="#e4eeff" stroke="#a2bde7"/>
    <text x="46" y="98" font-weight="700">方案一 · TP8</text>
    <text x="46" y="137">请求进唯一副本</text>
    <rect x="282" y="76" width="392" height="80" rx="9" fill="#fff"/>
    <text x="478" y="109" text-anchor="middle" font-weight="700">8 卡共同计算</text>
    <text x="478" y="138" text-anchor="middle" fill="#395581">0 · 1 · 2 · 3 · 4 · 5 · 6 · 7</text>
    <text x="24" y="211" font-weight="700">方案二 · 两个 TP4 副本</text>
    <rect x="244" y="229" width="232" height="46" rx="8" fill="#e4eeff" stroke="#a2bde7"/>
    <text x="360" y="259" text-anchor="middle">按副本剩余块接单</text>
    <path d="M360 275v15H180v24" stroke="#9b6544" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
    <path d="M360 275v15H540v24" stroke="#227162" stroke-width="3" fill="none"/>
    <path d="M532 305l8 9 8-9" stroke="#227162" stroke-width="3" fill="none"/>
    <rect x="24" y="314" width="312" height="100" rx="12" fill="#fff2e6" stroke="#cf9e77"/>
    <text x="44" y="348" font-weight="700">A · 卡 0–3 · 有前缀</text>
    <text x="44" y="385">剩 96 块，需要 128 块</text>
    <rect x="384" y="314" width="312" height="100" rx="12" fill="#e2f5ef" stroke="#7db9a9"/>
    <text x="404" y="348" font-weight="700">B · 卡 4–7 · 被选中</text>
    <text x="404" y="385">剩 640 块，需要 512 块</text>
  </g>
</svg>

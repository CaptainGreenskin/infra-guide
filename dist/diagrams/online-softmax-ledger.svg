<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">跨块 softmax：要合并概率质量</title><desc id="desc">两块局部输出不能直接平均，旧分母与分子必须按新的最大值共同缩放。</desc><style>text{font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif}</style><rect x="1" y="1" width="958" height="578" rx="10" fill="#f7f9fe" stroke="#d8e1ed"/><text x="30" y="40" font-size="12" fill="#315dce">INFRAGUIDE / ORIGINAL TEACHING DIAGRAM</text><text x="30" y="77" font-size="27" fill="#1c283d" font-weight="700">跨块 softmax：要合并概率质量</text><rect x="35" y="115" width="415" height="200" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="55" y="154" font-size="23" fill="#1c283d" font-weight="700">第一块</text><text x="55" y="192" font-size="20" fill="#1c283d">scores=[0,0]，V=[0,0]</text><text x="55" y="235" font-size="23" fill="#315dce" font-weight="700">m=0，l=2，u=0</text><text x="55" y="280" font-size="18" fill="#1c283d">暂不除以分母</text><text x="465" y="224" font-size="36" fill="#315dce">→</text><rect x="515" y="115" width="410" height="200" rx="10" fill="#eef2ff" stroke="#d8e1ed"/><text x="535" y="154" font-size="23" fill="#1c283d" font-weight="700">第二块</text><text x="535" y="192" font-size="19" fill="#1c283d">scores=[ln3,ln3]，V=[10,10]</text><text x="535" y="235" font-size="23" fill="#315dce" font-weight="700">m_new=ln3，α=1/3</text><text x="535" y="280" font-size="18" fill="#1c283d">新块指数权重为 [1,1]</text><rect x="35" y="355" width="890" height="130" rx="10" fill="#fff" stroke="#d8e1ed"/><text x="55" y="391" font-size="22" fill="#1c283d" font-weight="700">先缩放旧统计，再加入新贡献</text><text x="55" y="430" font-size="22" fill="#1c283d">l_new = 2/3 + 2 = 8/3；u_new = 0/3 + 20 = 20</text><text x="55" y="468" font-size="22" fill="#315dce" font-weight="700">最终 O = 20 ÷ (8/3) = 7.5</text><text x="40" y="534" font-size="20" fill="#58667e">错误反例：把两个块内结果直接平均，得到 (0+10)/2=5。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="746" viewBox="0 0 960 746" role="img" aria-labelledby="title desc">
  <title id="title">RTX PRO 6000 单卡八组 KV 缓存对照</title>
  <desc id="desc">横向刻度是缓存解码吞吐除以重算解码吞吐，竖线标记一倍。按批量和提示词元数列出重算到缓存的每秒词元数。一乘三十二从 286 到 265，一乘一百二十八从 285 到 266，八乘三十二从 2268 到 2020，八乘一百二十八从 2301 到 2011，一乘三百二十从 287 到 267，八乘三百二十从 2276 到 1968，三十二乘一百二十八从 8993 到 8129，三十二乘三百二十从 4354 到 8366。八组中七组低于一倍，最后一组为一点九二倍。该组峰值已分配显存从 457 增至 803 MiB，预填充从 6.65 增至 7.77 毫秒。实验固定单卡和静态批量，比较三十二个同步解码步，每种路径用五次的中位数。</desc>
  <metadata>{"commit":"6e96479924f90e4b0ccd22dba858c51b8516d3ce","experiment":"009-training-to-serving","pairs":[[1,32,286,265],[1,128,285,266],[8,32,2268,2020],[8,128,2301,2011],[1,320,287,267],[8,320,2276,1968],[32,128,8993,8129],[32,320,4354,8366]],"final_case":{"batch":32,"prompt":320,"allocated_mib":[457,803],"prefill_ms":[6.65,7.77]}}</metadata>

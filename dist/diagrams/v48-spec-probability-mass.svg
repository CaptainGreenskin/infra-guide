<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">留下共同质量，再补目标缺少的部分</title><desc id="desc">三词元的接受质量与残差重建目标分布，错误直接用目标作为残差会改变边际概率。</desc><metadata>{&quot;kind&quot;: &quot;exact_probability&quot;, &quot;p&quot;: [&quot;1/2&quot;, &quot;1/3&quot;, &quot;1/6&quot;], &quot;q&quot;: [&quot;1/6&quot;, &quot;1/3&quot;, &quot;1/2&quot;], &quot;accepted_mass&quot;: [&quot;1/6&quot;, &quot;1/3&quot;, &quot;1/6&quot;], &quot;residual&quot;: [&quot;1&quot;, &quot;0&quot;, &quot;0&quot;], &quot;correct_marginal&quot;: [&quot;1/2&quot;, &quot;1/3&quot;, &quot;1/6&quot;], &quot;wrong_using_p_as_residual&quot;: [&quot;1/3&quot;, &quot;4/9&quot;, &quot;2/9&quot;]}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="510" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">留下共同质量，再补目标缺少的部分</text><text x="32" y="88" font-size="19" fill="#5f708a" font-weight="400" text-anchor="start">目标p=[1/2,1/3,1/6]；草稿q=[1/6,1/3,1/2]。</text><text x="65" y="175" font-size="20" fill="#315dce" font-weight="400" text-anchor="start">p</text><text x="65" y="215" font-size="20" fill="#946020" font-weight="400" text-anchor="start">q</text><text x="110" y="133" font-size="23" fill="#24344d" font-weight="600" text-anchor="start">A</text><rect x="110" y="155" width="195.0" height="26" rx="7" fill="#9bb5f0" stroke="#cbd6e8"/><text x="313.0" y="175" font-size="18" fill="#315dce" font-weight="400" text-anchor="start">1/2</text><rect x="110" y="195" width="65.0" height="26" rx="7" fill="#dbc4a0" stroke="#cbd6e8"/><text x="183.0" y="215" font-size="18" fill="#946020" font-weight="400" text-anchor="start">1/6</text><text x="110" y="257" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">接受质量 1/6</text><text x="390" y="133" font-size="23" fill="#24344d" font-weight="600" text-anchor="start">B</text><rect x="390" y="155" width="130.0" height="26" rx="7" fill="#9bb5f0" stroke="#cbd6e8"/><text x="528.0" y="175" font-size="18" fill="#315dce" font-weight="400" text-anchor="start">1/3</text><rect x="390" y="195" width="130.0" height="26" rx="7" fill="#dbc4a0" stroke="#cbd6e8"/><text x="528.0" y="215" font-size="18" fill="#946020" font-weight="400" text-anchor="start">1/3</text><text x="390" y="257" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">接受质量 1/3</text><text x="670" y="133" font-size="23" fill="#24344d" font-weight="600" text-anchor="start">C</text><rect x="670" y="155" width="65.0" height="26" rx="7" fill="#9bb5f0" stroke="#cbd6e8"/><text x="743.0" y="175" font-size="18" fill="#315dce" font-weight="400" text-anchor="start">1/6</text><rect x="670" y="195" width="195.0" height="26" rx="7" fill="#dbc4a0" stroke="#cbd6e8"/><text x="873.0" y="215" font-size="18" fill="#946020" font-weight="400" text-anchor="start">1/2</text><text x="670" y="257" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">接受质量 1/6</text><path d="M32 285L928 285" stroke="#dce3ee" stroke-width="2" fill="none"/><text x="32" y="329" font-size="22" fill="#236e5e" font-weight="600" text-anchor="start">保留：min(p,q)</text><text x="360" y="329" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">[1/6, 1/3, 1/6]，共2/3</text><text x="32" y="378" font-size="22" fill="#315dce" font-weight="600" text-anchor="start">拒绝后补回</text><text x="360" y="378" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">[1/3, 0, 0]，共1/3</text><text x="32" y="427" font-size="22" fill="#24344d" font-weight="600" text-anchor="start">合计正好是p</text><text x="360" y="427" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">[1/2, 1/3, 1/6]</text><text x="32" y="477" font-size="19" fill="#a34242" font-weight="400" text-anchor="start">拒绝后若再按p抽：得到[1/3,4/9,2/9]，已经改变分布。</text></g></svg>
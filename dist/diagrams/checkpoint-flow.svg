<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">保存成功之后，还必须能恢复</title><desc id="desc">所有 rank 在 epoch 边界提交状态，rank 零原子替换共享检查点，新作业读取同一版本并恢复各 rank 随机数状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#61748e}.title{font-size:22px;font-weight:700}.eyebrow{font-size:10px;fill:#315dce;letter-spacing:2px}</style><rect width="960" height="450" rx="14" fill="#f6f8fc"/><text x="30" y="30" class="eyebrow">INFRAGUIDE / TRAINING SYSTEMS</text><text x="30" y="67" class="title">保存成功之后，还必须能恢复</text><rect x="35" y="125" width="200" height="80" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="135.0" y="155" text-anchor="middle" class="label">完成 epoch N</text><text x="135.0" y="178" text-anchor="middle" class="small">所有 rank 到达保存点</text><rect x="285" y="125" width="200" height="80" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="385.0" y="155" text-anchor="middle" class="label">提交检查点</text><text x="385.0" y="178" text-anchor="middle" class="small">临时文件 → 原子替换</text><rect x="535" y="125" width="180" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="625.0" y="155" text-anchor="middle" class="label">重新启动作业</text><text x="625.0" y="178" text-anchor="middle" class="small">同一配置 / world size</text><rect x="765" y="125" width="160" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="845.0" y="155" text-anchor="middle" class="label">恢复并继续</text><text x="845.0" y="178" text-anchor="middle" class="small">从 epoch N+1 开始</text><path d="M235 165 L285 165" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M485 165 L535 165" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M715 165 L765 165" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="125" y="285" width="710" height="80" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="480.0" y="315" text-anchor="middle" class="label">持久化内容</text><text x="480.0" y="338" text-anchor="middle" class="small">模型 + 优化器 + scaler + epoch + 各 rank RNG + 配置签名</text><path d="M385 205 L385 285" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M835 325 L845 205" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="420" class="small">本实验仅保证固定 world size 的 epoch 边界恢复；中途故障会重做最后一个未提交的 epoch。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>一项任务，尝试、效果和成本三份账</title><desc>把重试归到原操作，再按唯一合格任务核算；保留失败和后台开销。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">一项任务，尝试、效果和成本三份账</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">把重试归到原操作，再按唯一合格任务核算；保留失败和后台开销。</text><rect x="36" y="128" width="500" height="367" rx="10" fill="#fff" stroke="#ccd8e8"/><rect x="564" y="128" width="520" height="367" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="169" font-size="24" fill="#315dce" font-weight="700">实际计数，分母分别定义</text><text x="58" y="222" font-size="23" fill="#17263e" font-weight="400">工具尝试</text><text x="427" y="222" font-size="31" fill="#315dce" font-weight="700">2</text><text x="58" y="285" font-size="23" fill="#17263e" font-weight="400">业务效果</text><text x="427" y="285" font-size="31" fill="#315dce" font-weight="700">1</text><text x="58" y="348" font-size="23" fill="#17263e" font-weight="400">合格任务</text><text x="427" y="348" font-size="31" fill="#315dce" font-weight="700">1</text><text x="58" y="411" font-size="19" fill="#17263e" font-weight="400">指标标签：tool / outcome / task_type</text><text x="58" y="452" font-size="19" fill="#56667d" font-weight="400">任务与操作ID放受控trace或日志。</text><text x="586" y="169" font-size="23" fill="#315dce" font-weight="700">教学成本账本，不是实际账单</text><text x="586" y="223" font-size="21" fill="#17263e" font-weight="400">第一次尝试（503）</text><text x="1018" y="223" font-size="27" fill="#17263e" font-weight="700">2</text><text x="586" y="286" font-size="21" fill="#17263e" font-weight="400">同操作重试（200）</text><text x="1018" y="286" font-size="27" fill="#17263e" font-weight="700">2</text><text x="586" y="349" font-size="21" fill="#17263e" font-weight="400">产物验收</text><text x="1018" y="349" font-size="27" fill="#17263e" font-weight="700">1</text><path d="M586 378 L1058 378" stroke="#ccd8e8" stroke-width="2" fill="none"/><text x="586" y="425" font-size="22" fill="#315dce" font-weight="700">总成本 / 唯一合格任务 = 5 / 1</text><text x="586" y="464" font-size="18" fill="#b53e3e" font-weight="400">只取成功HTTP的2点，会丢掉其他开销。</text><rect x="36" y="544" width="1048" height="121" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="585" font-size="25" fill="#315dce" font-weight="700">Trace解释路径；指标看总体；账本确认业务结果。</text><text x="58" y="626" font-size="19" fill="#17263e" font-weight="400">采样轨迹缺一条，不等于那次任务或费用没有发生。高基数ID不作为无限扩张的指标标签。</text><text x="38" y="709" font-size="18" fill="#56667d" font-weight="400">计数由本地SDK实际导出；成本单价由固定夹具定义，未调用计费API、模型或云服务。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">旧摘要停在v1，恢复器应读取v2的事实</title><desc id="desc">R17任务原操作已产生效果13并提交v2成功状态；旧摘要仍说未保存。正确恢复查原回执，错误恢复信旧文并创建新操作会重复效果。</desc>
<rect width="1120" height="660" fill="#f8fafd"/>
<g font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif">
<text x="40" y="46" font-size="25" font-weight="700" fill="#1c283d">旧摘要停在v1，恢复器应读取v2的事实</text>
<text x="40" y="80" font-size="16" fill="#617086">固定SQLite场景：同一库提交任务与效果，专门隔离“信聊天文本”这一错误，不模拟远端事务。</text>
<text x="40" y="151" font-size="19" font-weight="600" fill="#1c283d">权威账本</text>
<rect x="220" y="115" width="290" height="93" rx="8" fill="#edf2fe" stroke="#cdd9f4"/>
<text x="241" y="151" font-size="19" fill="#315dce">v1 / RUNNING</text><text x="241" y="184" font-size="17" fill="#617086">原操作R17:publish已登记</text>
<path d="M510 161H598" stroke="#71819b" stroke-width="2"/>
<rect x="600" y="115" width="480" height="93" rx="8" fill="#e8f5f1" stroke="#beddd4"/>
<text x="621" y="151" font-size="19" fill="#176e5a">提交效果13与回执 → v2 / SUCCEEDED</text><text x="621" y="184" font-size="17" fill="#617086">真实效果数量1；任务已完成</text>
<text x="40" y="289" font-size="19" font-weight="600" fill="#1c283d">旧上下文</text>
<rect x="220" y="247" width="860" height="93" rx="8" fill="#fff1d8" stroke="#e6cea2"/>
<text x="241" y="284" font-size="19" fill="#8c6115">仍保存v1摘要：“报告尚未保存”</text>
<text x="241" y="319" font-size="17" fill="#617086">摘要没有自动追随提交更新；它不是任务状态机的所有者</text>
<rect x="40" y="389" width="510" height="190" rx="8" fill="#fff" stroke="#dbe3ee"/>
<rect x="570" y="389" width="510" height="190" rx="8" fill="#fff" stroke="#dbe3ee"/>
<text x="62" y="426" font-size="20" font-weight="600" fill="#176e5a">正确恢复</text><text x="592" y="426" font-size="20" font-weight="600" fill="#9f4148">独立错误对照</text>
<text x="62" y="465" font-size="18" fill="#617086">查任务v2与原操作回执，效果保持1</text><text x="592" y="465" font-size="18" fill="#617086">信旧摘要，再生成一个新op_id</text>
<text x="62" y="505" font-size="18" fill="#617086">v1条件写回影响0行，重新加载状态</text><text x="592" y="505" font-size="18" fill="#617086">接收方看到新逻辑动作，效果变2</text>
<text x="62" y="547" font-size="16" fill="#617086">版本检查不替代状态迁移校验与权限</text><text x="592" y="547" font-size="16" fill="#617086">不是“多记住一点”就能解决的问题</text>
<text x="40" y="623" font-size="17" fill="#617086">恢复事实 → 选择本轮证据 → 生成新上下文；顺序反过来，就把摘要遗漏变成了业务决策。</text>
</g></svg>

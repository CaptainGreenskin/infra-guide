<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">一次训练：把张量形状连到系统职责</title><desc id="desc">从token、embedding和Transformer层，到logits、loss、反向和分布式更新的逻辑路径。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="960" height="560" rx="12" fill="#f6f8fc"/><text x="30" y="30" font-size="11" fill="#315dce" font-weight="400">INFRAGUIDE / FOLLOW ONE TRAINING STEP</text><text x="30" y="68" font-size="23" fill="#203553" font-weight="600">一次训练：把张量形状连到系统职责</text><rect x="30" y="105" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="48" y="135" font-size="17" fill="#203553" font-weight="600">① 输入与右移标签</text><text x="48" y="161" font-size="14" fill="#61748e" font-weight="400">tokens [B, T] → targets [B, T]</text><rect x="510" y="105" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="528" y="135" font-size="17" fill="#203553" font-weight="600">② Embedding + 位置信息</text><text x="528" y="161" font-size="14" fill="#61748e" font-weight="400">隐藏状态 X：[B, T, d_model]</text><path d="M450 146L510 146" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><rect x="510" y="235" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="528" y="265" font-size="17" fill="#203553" font-weight="600">③ Attention / FFN / 残差与归一化</text><text x="528" y="291" font-size="14" fill="#61748e" font-weight="400">堆叠多层；隐藏状态仍为 [B, T, d_model]</text><path d="M720 187L720 235" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="235" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="48" y="265" font-size="17" fill="#203553" font-weight="600">④ 输出投影 → logits</text><text x="48" y="291" font-size="14" fill="#61748e" font-weight="400">[B, T, vocab_size]；每个位置预测下一 token</text><path d="M510 276L450 276" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="365" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="48" y="395" font-size="17" fill="#203553" font-weight="600">⑤ 有效位置的 loss</text><text x="48" y="421" font-size="14" fill="#61748e" font-weight="400">忽略 padding；明确总 token 分母</text><rect x="510" y="365" width="420" height="82" rx="8" fill="white" stroke="#ccd8eb"/><text x="528" y="395" font-size="17" fill="#203553" font-weight="600">⑥ 反向 → 梯度同步 → 参数更新</text><text x="528" y="421" font-size="14" fill="#61748e" font-weight="400">梯度与优化器状态也占显存</text><path d="M240 317L240 365" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M450 406L510 406" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="32" y="497" font-size="16" fill="#203553" font-weight="400">工程对应：CPU与存储负责供给；GPU执行算子；网络同步梯度；检查点保存可恢复状态。</text><text x="32" y="531" font-size="14" fill="#61748e" font-weight="400">图示为常见 decoder-only 自回归训练路径；并非所有模型都采用相同结构。</text></svg>
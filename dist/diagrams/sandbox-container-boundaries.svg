<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="sandbox-title sandbox-description">
  <title id="sandbox-title">只改输入挂载，报告为何都能是 37</title>
  <desc id="sandbox-description">同一合成输入 10 和 27 交给 UID 65534 的进程。进程读输入，在独立可写输出目录保存报告 37，再试图修改输入。只读挂载时内核返回 EROFS 且宿主文件不变。可写对照中追加成功，宿主文件改变，独立验收拒绝。</desc>

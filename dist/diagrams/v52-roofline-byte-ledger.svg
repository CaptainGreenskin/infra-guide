<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="816" viewBox="0 0 1120 816" role="img" aria-labelledby="title desc"><title id="title">同一份权重，为什么能服务更多输入行</title><desc id="desc">先把三笔读写列全，再算浮点工作与字节的比例。</desc><metadata>{&quot;kind&quot;: &quot;byte_composition&quot;, &quot;weights_bytes&quot;: 33554432, &quot;cases&quot;: [{&quot;M&quot;: 1, &quot;input&quot;: 8192, &quot;output&quot;: 8192, &quot;total&quot;: 33570816}, {&quot;M&quot;: 256, &quot;input&quot;: 2097152, &quot;output&quot;: 2097152, &quot;total&quot;: 37748736}], &quot;unit&quot;: &quot;MiB=2^20B&quot;, &quot;gpu_measurement&quot;: false}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="814" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">同一份权重，为什么能服务更多输入行</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">先把三笔读写列全，再算浮点工作与字节的比例。</text><text x="38" y="132" font-size="21" fill="#17263e" font-weight="400">K=N=4096，BF16每元素2字节；同一横轴，条形长度按MiB比较。</text><text x="38" y="223" font-size="25" fill="#315dce" font-weight="700">M=1</text><rect x="224" y="188" width="728.8888888888889" height="48" fill="#315dce"/><rect x="952.8888888888889" y="188" width="0.1779513888888889" height="48" fill="#79b9a4"/><rect x="953.0668402777778" y="188" width="0.1779513888888889" height="48" fill="#d8b16d"/><text x="224" y="276" font-size="20" fill="#17263e" font-weight="400">权重 33554432 B  +  输入 8192 B  +  输出 8192 B</text><text x="224" y="310" font-size="22" fill="#17263e" font-weight="700">合计 33570816 B</text><text x="38" y="395" font-size="25" fill="#315dce" font-weight="700">M=256</text><rect x="224" y="360" width="728.8888888888889" height="48" fill="#315dce"/><rect x="952.8888888888889" y="360" width="45.55555555555556" height="48" fill="#79b9a4"/><rect x="998.4444444444445" y="360" width="45.55555555555556" height="48" fill="#d8b16d"/><text x="224" y="448" font-size="20" fill="#17263e" font-weight="400">权重 33554432 B  +  输入 2097152 B  +  输出 2097152 B</text><text x="224" y="482" font-size="22" fill="#17263e" font-weight="700">合计 37748736 B</text><text x="38" y="544" font-size="20" fill="#17263e" font-weight="400">蓝：权重      绿：输入      金：输出</text><text x="38" y="582" font-size="19" fill="#56667d" font-weight="400">M=1的输入与输出很细，按数字核对；图中没有将它们单独放大。</text><rect x="36" y="617" width="1048" height="120" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="656" font-size="24" fill="#315dce" font-weight="700">输入行数扩大256倍，权重仍只读一份</text><text x="58" y="699" font-size="21" fill="#17263e" font-weight="400">计算量增256倍；算法字节量约增12.4%。M是词元行，不是用户请求数。</text><text x="38" y="781" font-size="18" fill="#56667d" font-weight="400">只读X、读W、写Y；不读旧输出、不含额外转换。这是算法账本，不是硬件流量测量。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">核对候选时，分数要与前缀对齐</title><desc id="desc">因果掩码矩阵使用绝对位置；已有前缀末行预测第一个候选，候选的输出行预测后一个位置。</desc><metadata>{&quot;kind&quot;: &quot;causal_position_matrix&quot;, &quot;prefix_length&quot;: 3, &quot;draft_length&quot;: 3, &quot;allowed&quot;: [[true, true, true, true, false, false], [true, true, true, true, true, false], [true, true, true, true, true, true]]}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="510" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">核对候选时，分数要与前缀对齐</text><text x="32" y="88" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">已有P长3；一次送入d₁、d₂、d₃。当前位置不能看到未来候选。</text><text x="190" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">P₁</text><text x="254" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">P₂</text><text x="318" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">P₃</text><text x="382" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">d₁</text><text x="446" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">d₂</text><text x="510" y="135" font-size="19" fill="#24344d" font-weight="400" text-anchor="middle">d₃</text><text x="44" y="190" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">核对行d1</text><rect x="165" y="160" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="190" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="229" y="160" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="254" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="293" y="160" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="318" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="357" y="160" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="382" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="421" y="160" width="50" height="42" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="446" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">遮住</text><rect x="485" y="160" width="50" height="42" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="510" y="188" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">遮住</text><text x="615" y="189" font-size="19" fill="#315dce" font-weight="400" text-anchor="start">输出预测下一位置：p2</text><text x="44" y="248" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">核对行d2</text><rect x="165" y="218" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="190" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="229" y="218" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="254" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="293" y="218" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="318" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="357" y="218" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="382" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="421" y="218" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="446" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="485" y="218" width="50" height="42" rx="7" fill="#f1f3f7" stroke="#cbd6e8"/><text x="510" y="246" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">遮住</text><text x="615" y="247" font-size="19" fill="#315dce" font-weight="400" text-anchor="start">输出预测下一位置：p3</text><text x="44" y="306" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">核对行d3</text><rect x="165" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="190" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="229" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="254" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="293" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="318" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="357" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="382" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="421" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="446" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><rect x="485" y="276" width="50" height="42" rx="7" fill="#b9d9d0" stroke="#cbd6e8"/><text x="510" y="304" font-size="15" fill="#24344d" font-weight="400" text-anchor="middle">可见</text><text x="615" y="305" font-size="19" fill="#315dce" font-weight="400" text-anchor="start">输出预测下一位置：p4</text><rect x="40" y="365" width="875" height="65" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="60" y="405" font-size="21" fill="#315dce" font-weight="600" text-anchor="start">p₁来自已有前缀最后一行；d₁那一行输出的是p₂。</text><text x="40" y="475" font-size="18" fill="#5f708a" font-weight="400" text-anchor="start">并行计算条件分数；接受仍从左到右，第一处拒绝后丢弃后续分支。</text></g></svg>
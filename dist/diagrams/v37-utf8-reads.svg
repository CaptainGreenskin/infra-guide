<text x="850" y="535" font-size="21" fill="#6b768b" font-weight="400" text-anchor="start">单块独立 decode</text>
<text x="850" y="571" font-size="28" fill="#287b69" font-weight="600" text-anchor="start">可行</text>
<text x="240" y="620" font-size="25" fill="#287b69" font-weight="600" text-anchor="start">增量输出：报；待补字节：无</text>
<text x="32" y="734" font-size="23" fill="#1c283d" font-weight="600" text-anchor="start">正常流 287 B、41 次读取；独立逐块解码实际失败 2 次，增量方式保留字符状态。</text>
<text x="32" y="778" font-size="22" fill="#6b768b" font-weight="400" text-anchor="start">可解码只解决字符边界；完整 SSE 事件、完整工具参数与调用授权仍须分别判断。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">实际七字节读取如何切开中文UTF-8</title><desc id="desc">正常流的第28至30次读取，字节偏移189至209；前两块独立解码失败，增量输出依次为中、国区日、报。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b768b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="800" fill="white"/>
<text x="32" y="46" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">读了 7 字节，不保证刚好读完一个汉字</text>
<text x="32" y="85" font-size="22" fill="#6b768b" font-weight="400" text-anchor="start">“中”是 E4 B8 AD，“国”是 E5 9B BD；按实际响应体字节排列，偏移从 0 起算。</text>

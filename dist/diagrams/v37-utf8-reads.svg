<text x="768" y="186" font-size="28" fill="#287b69" font-weight="600" text-anchor="middle">9B</text>
<text x="850" y="173" font-size="21" fill="#6b768b" font-weight="400" text-anchor="start">单块独立 decode</text>
<text x="850" y="209" font-size="28" fill="#a84444" font-weight="600" text-anchor="start">失败</text>
<text x="240" y="258" font-size="25" fill="#287b69" font-weight="600" text-anchor="start">增量输出：中；待补字节：E5 9B</text>

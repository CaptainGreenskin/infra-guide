<rect x="650" y="506" width="72" height="62" rx="8" fill="#f2f5fa" stroke="#e4e9f0" stroke-width="2"/>
<text x="686" y="548" font-size="28" fill="#6b768b" font-weight="600" text-anchor="middle">2C</text>

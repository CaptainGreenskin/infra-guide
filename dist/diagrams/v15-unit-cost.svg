<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc"><title id="title">从总成本到每个唯一成功的业务结果</title><desc id="desc">同范围的原成本由一百、二十、十组成，共一百三十；一千个唯一成功结果，每成功成本零点一三。优化后总成本一百一十七，同产出下为零点一一七。</desc>
<rect width="960" height="670" rx="14" fill="#f6f8fa"/>
<text x="32" y="38" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#146e69">CAPACITY 03  /  单位经济</text>
<text x="32" y="83" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:30px;font-weight:700;fill:#19364d">花得少了，还是做成的事情少了？</text>
<text x="32" y="120" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">对照使用同一成本范围与统计规则，质量和服务目标一致；成本单位为题设，不是云报价。</text>
<text x="32" y="166" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#146e69">成本范围：含分摊的共享费用，不漏算失败与重试消耗</text>
<rect x="169" y="212" width="530" height="48" rx="2" fill="#285e9c" stroke="none"/>
<text x="434.0" y="243" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#ffffff">计算 100</text>
<rect x="699" y="212" width="106" height="48" rx="2" fill="#146e69" stroke="none"/>
<text x="752.0" y="243" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#ffffff">存储 20</text>
<rect x="805" y="212" width="53" height="48" rx="2" fill="#a84d21" stroke="none"/>
<text x="32" y="244" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:21px;font-weight:700;fill:#19364d">原方案</text>
<text x="885" y="244" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:23px;font-weight:700;fill:#19364d">130</text>
<text x="831" y="195" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a84d21">传输 10</text>
<text x="32" y="327" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:21px;font-weight:700;fill:#19364d">优化后</text>
<rect x="169" y="295" width="620" height="48" rx="2" fill="#466b82" stroke="none"/>
<text x="480" y="325" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#ffffff">仅给出合计，不假设分项同比下降</text>
<text x="810" y="326" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:23px;font-weight:700;fill:#19364d">117</text>
<rect x="28" y="377" width="904" height="161" rx="8" fill="#ffffff" stroke="#bdcedb"/>
<text x="46" y="410" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#146e69">每个唯一成功结果的成本</text>
<text x="48" y="454" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:22px;font-weight:700;fill:#19364d">(100 + 20 + 10) / 1000</text>
<text x="493" y="454" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:22px;font-weight:700;fill:#285e9c">= 0.130 成本单位 / 成功</text>
<text x="48" y="501" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:22px;font-weight:700;fill:#19364d">117 / 1000</text>
<text x="493" y="501" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:22px;font-weight:700;fill:#146e69">= 0.117 成本单位 / 成功</text>
<text x="32" y="584" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:19px;font-weight:400;fill:#19364d">同样交付 1000 个唯一成功，单位成本下降 (0.130 − 0.117) / 0.130 = 10%。</text>
<text x="32" y="622" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">按业务 ID 去重。一次成功之前的多次尝试会增加成本，不能各自再记一份成功。</text>
</svg>
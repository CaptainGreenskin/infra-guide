<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" role="img" aria-labelledby="title desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">50 ms 的 CPU 预算，多久会花完？</title>
  <desc id="desc">在新的 100 毫秒周期开始时，工作组可以累计使用 50 毫秒 CPU 时间。一个可运行线程理想用到墙钟 50 毫秒；两个可并行线程各运行 25 毫秒就在墙钟 25 毫秒用完整组额度。后续节流直到下个周期是本理想模型的结果。</desc>
  <rect x="0" y="0" width="960" height="694" rx="12" fill="#f6f8fc" />
  <text x="32" y="36" fill="#2758a6" font-size="16" font-weight="650" text-anchor="start">CLOUD INFRA  /  03  CPU 时间带</text>
  <text x="32" y="84" fill="#1d324c" font-size="30" font-weight="650" text-anchor="start">50 ms 的 CPU 预算，多久会花完？</text>
  <text x="32" y="118" fill="#51677c" font-size="17" font-weight="400" text-anchor="start">Linux cgroup v2 示例：cpu.max = 50000 100000，单位为微秒。</text>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12" height="12" rx="0" fill="#fceddf" />
      <path d="M -2 2 L 2 -2 M 0 12 L 12 0 M 10 14 L 14 10" stroke="#d8ae8c" stroke-width="2" fill="none" />
    </pattern>
  </defs>
  <text x="34" y="176" fill="#1d324c" font-size="17" font-weight="650" text-anchor="start">墙钟时间</text>
  <line x1="179.0" y1="197" x2="179.0" y2="457" stroke="#c7d4e1" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="179.0" y="176" fill="#51677c" font-size="16" font-weight="400" text-anchor="middle">0 ms</text>
  <line x1="362.0" y1="197" x2="362.0" y2="457" stroke="#c7d4e1" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="362.0" y="176" fill="#51677c" font-size="16" font-weight="400" text-anchor="middle">25 ms</text>
  <line x1="545.0" y1="197" x2="545.0" y2="457" stroke="#c7d4e1" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="545.0" y="176" fill="#51677c" font-size="16" font-weight="400" text-anchor="middle">50 ms</text>
  <line x1="728.0" y1="197" x2="728.0" y2="457" stroke="#c7d4e1" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="728.0" y="176" fill="#51677c" font-size="16" font-weight="400" text-anchor="middle">75 ms</text>
  <line x1="911.0" y1="197" x2="911.0" y2="457" stroke="#c7d4e1" stroke-width="1.5" stroke-dasharray="3 5" />
  <text x="911.0" y="176" fill="#51677c" font-size="16" font-weight="400" text-anchor="middle">100 ms</text>
  <line x1="179" y1="190" x2="911" y2="190" stroke="#c7d4e1" stroke-width="1.5" />
  <text x="32" y="216" fill="#2758a6" font-size="17" font-weight="650" text-anchor="start">A  一个线程</text>
  <text x="39" y="262" fill="#1d324c" font-size="17" font-weight="400" text-anchor="start">线程 1</text>
  <rect x="179" y="234" width="366.0" height="39" rx="0" fill="#cbdcf8" />
  <rect x="545.0" y="234" width="366.0" height="39" rx="0" fill="url(#hatch)" />
  <text x="362.0" y="260" fill="#2758a6" font-size="17" font-weight="650" text-anchor="middle">执行 50 ms</text>
  <text x="728.0" y="260" fill="#9d4d18" font-size="16" font-weight="400" text-anchor="middle">已耗尽组预算，等待补充</text>
  <text x="179" y="304" fill="#51677c" font-size="16" font-weight="400" text-anchor="start">总计 1 × 50 = 50 ms CPU 时间；在墙钟 50 ms 处达到配额。</text>
  <text x="32" y="351" fill="#116d68" font-size="17" font-weight="650" text-anchor="start">B  两个线程</text>
  <text x="39" y="393" fill="#1d324c" font-size="17" font-weight="400" text-anchor="start">线程 1</text>
  <rect x="179" y="365" width="183.0" height="39" rx="0" fill="#bce3dc" />
  <rect x="362.0" y="365" width="549.0" height="39" rx="0" fill="url(#hatch)" />
  <text x="270.5" y="391" fill="#116d68" font-size="17" font-weight="650" text-anchor="middle">执行 25 ms</text>
  <text x="636.5" y="391" fill="#9d4d18" font-size="16" font-weight="400" text-anchor="middle">已耗尽组预算，等待补充</text>
  <text x="39" y="446" fill="#1d324c" font-size="17" font-weight="400" text-anchor="start">线程 2</text>
  <rect x="179" y="418" width="183.0" height="39" rx="0" fill="#bce3dc" />
  <rect x="362.0" y="418" width="549.0" height="39" rx="0" fill="url(#hatch)" />
  <text x="270.5" y="444" fill="#116d68" font-size="17" font-weight="650" text-anchor="middle">执行 25 ms</text>
  <text x="636.5" y="444" fill="#9d4d18" font-size="16" font-weight="400" text-anchor="middle">已耗尽组预算，等待补充</text>
  <text x="179" y="489" fill="#51677c" font-size="16" font-weight="400" text-anchor="start">总计 2 × 25 = 50 ms CPU 时间；在墙钟 25 ms 处达到配额。</text>
  <rect x="32" y="518" width="896" height="146" rx="8" fill="#ffffff" stroke="#c7d4e1" stroke-width="1.5" />
  <text x="51" y="549" fill="#9d4d18" font-size="17" font-weight="650" text-anchor="start">本图成立的条件</text>
  <text x="51" y="577" fill="#1d324c" font-size="16" font-weight="400" text-anchor="start">两个线程同属一个 cgroup；各自持续可运行，且可以同时在两个逻辑 CPU 上执行。</text>
  <text x="51" y="603" fill="#1d324c" font-size="16" font-weight="400" text-anchor="start">从新周期起算，初始预算完整；忽略调度粒度、竞争、父组额度以及额外 burst。</text>
  <text x="51" y="629" fill="#1d324c" font-size="16" font-weight="400" text-anchor="start">若两个线程只能用同一个逻辑 CPU，它们无法并行在 25 ms 内花掉 50 ms CPU 时间。</text>
  <text x="51" y="652" fill="#51677c" font-size="16" font-weight="400" text-anchor="start">教学时间带，不是调度器实测；配额限制总运行时间，不代表固定绑定半个核心。</text>
</svg>
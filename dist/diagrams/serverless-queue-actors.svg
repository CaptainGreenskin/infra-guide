<svg xmlns="http://www.w3.org/2000/svg" width="460" height="660" viewBox="0 0 460 660" role="img" aria-labelledby="queue-actors-title queue-actors-desc">
  <title id="queue-actors-title">日报任务从受理到业务提交和队列确认</title>
  <desc id="queue-actors-desc">用户请求生成日报，日报服务写入 SQS 并返回受理。Lambda 轮询器接收消息，调用处理函数并等待。函数提交报告 37 和回执，再返回成功，Lambda 最后删除消息。提交后返回前退出会留下报告和待重投消息。</desc>
  <metadata>{"kind":"documented-success-path","source":"https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html#sqs-polling-behavior","task":"report-27","report_total":37,"actors":["user","producer","sqs","lambda-poller","handler","business-store"],"ordered_steps":["submit","enqueue","receive","invoke","commit","delete"],"commit_before_return":true,"return_before_delete":true,"cloud_execution":false}</metadata>
  <defs>
    <marker id="queue-actor-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#355da9" stroke-width="1.3"/></marker>
  </defs>
  <rect width="460" height="660" rx="14" fill="#f2f6fb"/>
  <g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#132b46">
    <text x="20" y="33" font-size="23" font-weight="700">一份日报经过谁的手</text>
    <text x="20" y="58" font-size="16" fill="#405976">正常路径 · 从上到下读</text>
    <g fill="#fff" stroke="#a1b5cc">
      <rect x="5" y="77" width="62" height="51" rx="7"/><rect x="83" y="77" width="62" height="51" rx="7"/>
      <rect x="161" y="77" width="62" height="51" rx="7"/><rect x="239" y="77" width="62" height="51" rx="7"/>
      <rect x="317" y="77" width="62" height="51" rx="7"/><rect x="395" y="77" width="62" height="51" rx="7"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="650">
      <text x="36" y="107">用户</text>
      <text x="114" y="99">日报<tspan x="114" dy="19">服务</tspan></text>
      <text x="192" y="99">SQS<tspan x="192" dy="19">队列</tspan></text>
      <text x="270" y="99">Lambda<tspan x="270" dy="19">轮询器</tspan></text>
      <text x="348" y="99">处理<tspan x="348" dy="19">函数</tspan></text>
      <text x="426" y="99">报告与<tspan x="426" dy="19">回执库</tspan></text>
    </g>
    <g stroke="#a4b6cc" stroke-dasharray="4 5"><path d="M36 130V597M114 130V597M192 130V597M270 130V597M348 130V597M426 130V597"/></g>
    <g stroke="#355da9" stroke-width="1.7" fill="none" marker-end="url(#queue-actor-arrow)">
      <path d="M36 166H114"/><path d="M114 216H192"/><path d="M114 264H36" stroke-dasharray="4 3"/>
      <path d="M270 314H192"/><path d="M270 371H348"/><path d="M348 425H426"/>
      <path d="M426 474H348" stroke-dasharray="4 3"/><path d="M348 524H270" stroke-dasharray="4 3"/>
      <path d="M270 579H192"/>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="550">
      <text x="75" y="154">① 提交任务</text><text x="153" y="204">② 写消息</text><text x="75" y="252">已受理</text>
      <text x="231" y="302">③ 接收</text><text x="309" y="359">④ 调用</text><text x="387" y="413">⑤ 提交</text>
      <text x="387" y="462">已提交</text><text x="309" y="512">成功返回</text><text x="231" y="567">⑥ 删除</text>
    </g>
    <g font-size="14" fill="#405976">
      <text x="165" y="337">消息暂时隐藏</text><text x="313" y="447">报告 37 + 回执</text>
      <text x="18" y="619">先提交业务，再返回成功，最后删除消息。</text>
      <text x="18" y="641">删除前退出，报告可能已在，消息还可重投。</text>
    </g>
  </g>
</svg>

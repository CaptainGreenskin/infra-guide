<svg xmlns="http://www.w3.org/2000/svg" width="920" height="415" viewBox="0 0 920 415" role="img" aria-labelledby="title desc">
<title id="title">RoPE 把一对特征作为二维向量旋转</title>
<desc id="desc">q 从一、二旋转半圈到负一、负二。k 从三、二旋转四分之一圈到负二、三。每个向量旋转前后长度相同。</desc>
<metadata>{"omega":"pi/2","query":{"position":2,"before":[1,2],"after":[-1,-2]},"key":{"position":1,"before":[3,2],"after":[-2,3]}}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="413" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">RoPE 把一对特征作为二维向量旋转</text>
<text x="32" y="78" font-size="16" fill="#506584" font-weight="500" text-anchor="start">虚线是原向量，实线是按逻辑位置逆时针旋转后的向量。</text><text x="240" y="113" font-size="20" fill="#172743" font-weight="700" text-anchor="middle">查询 q</text><circle cx="240" cy="245" r="58.14" fill="none" stroke="#ccdaed" stroke-dasharray="4 5"/><path d="M128 245H352" fill="none" stroke="#506584" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M240 350V136" fill="none" stroke="#506584" stroke-width="1.3" marker-end="url(#arrow)"/><text x="357" y="251" font-size="15" fill="#506584" font-weight="500" text-anchor="start">x</text><text x="247" y="137" font-size="15" fill="#506584" font-weight="500" text-anchor="start">y</text><path d="M240 245L266 193" fill="none" stroke="#506584" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="289" y="166" font-size="18" fill="#506584" font-weight="600" text-anchor="start">[1, 2]</text><path d="M240 245L214 297" fill="none" stroke="#315fb5" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="325" font-size="18" fill="#315fb5" font-weight="600" text-anchor="start">[−1, −2]</text><circle cx="240" cy="245" r="4" fill="#172743"/><text x="240" y="387" font-size="18" fill="#315fb5" font-weight="650" text-anchor="middle">m = 2，旋转 π</text><text x="685" y="113" font-size="20" fill="#172743" font-weight="700" text-anchor="middle">键 k</text><circle cx="685" cy="245" r="93.74" fill="none" stroke="#ccdaed" stroke-dasharray="4 5"/><path d="M573 245H797" fill="none" stroke="#506584" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M685 350V136" fill="none" stroke="#506584" stroke-width="1.3" marker-end="url(#arrow)"/><text x="802" y="251" font-size="15" fill="#506584" font-weight="500" text-anchor="start">x</text><text x="692" y="137" font-size="15" fill="#506584" font-weight="500" text-anchor="start">y</text><path d="M685 245L763 193" fill="none" stroke="#506584" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="782" y="188" font-size="18" fill="#506584" font-weight="600" text-anchor="start">[3, 2]</text><path d="M685 245L633 167" fill="none" stroke="#087767" stroke-width="3" marker-end="url(#arrow)"/><text x="562" y="158" font-size="18" fill="#087767" font-weight="600" text-anchor="start">[−2, 3]</text><circle cx="685" cy="245" r="4" fill="#172743"/><text x="685" y="387" font-size="18" fill="#087767" font-weight="650" text-anchor="middle">n = 1，旋转 π/2</text>
</g>
</svg>

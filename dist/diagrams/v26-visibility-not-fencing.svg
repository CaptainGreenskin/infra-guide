<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>可见性超时只影响重投，不会停止旧执行者</title><desc>按事件排布，间距不表示秒数比例；第二次截止61秒在图外。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">可见性超时只影响重投，不会停止旧执行者</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">按事件排布，间距不表示秒数比例；第二次截止61秒在图外。</text><text x="38" y="136" font-size="20" fill="#315dce" font-weight="700">控制时钟（秒）</text><path d="M250 156L250 535" fill="none" stroke="#ccd8e8" stroke-width="1" stroke-dasharray="8 6"/><text x="240" y="143" font-size="20" fill="#56667d" font-weight="400">0</text><path d="M610 156L610 535" fill="none" stroke="#ccd8e8" stroke-width="1" stroke-dasharray="8 6"/><text x="600" y="143" font-size="20" fill="#56667d" font-weight="400">30</text><path d="M710 156L710 535" fill="none" stroke="#ccd8e8" stroke-width="1" stroke-dasharray="8 6"/><text x="700" y="143" font-size="20" fill="#56667d" font-weight="400">31</text><path d="M810 156L810 535" fill="none" stroke="#ccd8e8" stroke-width="1" stroke-dasharray="8 6"/><text x="800" y="143" font-size="20" fill="#56667d" font-weight="400">32</text><path d="M980 156L980 535" fill="none" stroke="#ccd8e8" stroke-width="1" stroke-dasharray="8 6"/><text x="970" y="143" font-size="20" fill="#56667d" font-weight="400">33</text><text x="38" y="205" font-size="22" fill="#17263e" font-weight="400">队列可见性</text><rect x="250" y="174" width="360" height="56" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="266" y="211" font-size="20" fill="#315dce" font-weight="700">第1次接收：隐藏到30</text><rect x="710" y="239" width="352" height="56" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="726" y="276" font-size="20" fill="#12725b" font-weight="700">第2次接收：新句柄，到61</text><text x="38" y="358" font-size="22" fill="#17263e" font-weight="400">旧执行者</text><path d="M250 348L810 348" fill="none" stroke="#b53e3e" stroke-width="9"/><text x="275" y="330" font-size="21" fill="#b53e3e" font-weight="700">可见性已到期，代码仍在运行</text><circle cx="810" cy="348" r="9" fill="#b53e3e"/><text x="738" y="391" font-size="20" fill="#b53e3e" font-weight="700">仍能提交37</text><text x="38" y="447" font-size="22" fill="#17263e" font-weight="400">新执行者</text><path d="M710 436L980 436" fill="none" stroke="#12725b" stroke-width="9"/><text x="705" y="481" font-size="21" fill="#12725b" font-weight="700">查业务inbox，复用37</text><text x="705" y="521" font-size="21" fill="#17263e" font-weight="400">第2次句柄确认成功</text><rect x="36" y="563" width="1048" height="101" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="603" font-size="24" fill="#315dce" font-weight="700">运输消息ID / 每次接收句柄 / 业务动作ID，是三层身份。</text><text x="58" y="642" font-size="20" fill="#17263e" font-weight="400">业务效果与inbox同事务：重复执行只确认旧结果；队列确认仍是另一次提交。</text><text x="38" y="707" font-size="18" fill="#56667d" font-weight="400">本地SQLite参考，非云端时间线。此例严格拒绝旧句柄；SQS旧句柄删除可成功却未删。</text></g></svg>

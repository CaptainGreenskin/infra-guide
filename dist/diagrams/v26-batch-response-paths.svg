<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img"><title>同样B失败，正常返回与抛异常可能走不同路径</title><desc>先核对映射选项，再看handler是否正常返回，最后解释每条消息的确认。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="748" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">同样B失败，正常返回与抛异常可能走不同路径</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">先核对映射选项，再看handler是否正常返回，最后解释每条消息的确认。</text><rect x="36" y="126" width="1048" height="72" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="169" font-size="23" fill="#315dce" font-weight="700">固定输入：A成功、B失败；C在标准批中成功，在FIFO首错后不处理。</text><rect x="36" y="226" width="1048" height="84" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="55" y="260" font-size="21" fill="#315dce" font-weight="700">标准队列，部分响应已启用</text><text x="55" y="292" font-size="19" fill="#17263e" font-weight="400">正常返回[B]</text><text x="565" y="276" font-size="22" fill="#12725b" font-weight="700">只重投B；A/C确认</text><rect x="36" y="326" width="1048" height="84" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="55" y="360" font-size="21" fill="#315dce" font-weight="700">未启用部分响应，吞掉异常</text><text x="55" y="392" font-size="19" fill="#17263e" font-weight="400">正常返回[B]</text><text x="565" y="376" font-size="22" fill="#b53e3e" font-weight="700">被当整次成功；B可能丢工作</text><rect x="36" y="426" width="1048" height="84" rx="10" fill="#fff1e6" stroke="#ccd8e8"/><text x="55" y="460" font-size="21" fill="#315dce" font-weight="700">已启用，但handler最终抛异常</text><text x="55" y="492" font-size="19" fill="#17263e" font-weight="400">没有正常响应</text><text x="565" y="476" font-size="22" fill="#b53e3e" font-weight="700">整批失败；A/B/C都须防重</text><rect x="36" y="526" width="1048" height="84" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="55" y="560" font-size="21" fill="#315dce" font-weight="700">FIFO，遇到B失败立即停止</text><text x="55" y="592" font-size="19" fill="#17263e" font-weight="400">正常返回[B,C]</text><text x="565" y="576" font-size="22" fill="#12725b" font-weight="700">B与未处理C重投；只确认A</text><text x="38" y="678" font-size="21" fill="#315dce" font-weight="700">部分响应由事件源映射解释；返回一个同名JSON字段，本身不会改变平台配置。</text><text x="38" y="716" font-size="18" fill="#56667d" font-weight="400">本图来自固定策略参考，不是实际Lambda调用；已有SQLite跨进程批次实验在正文实战末尾。</text></g></svg>

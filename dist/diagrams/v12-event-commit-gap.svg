<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 705" role="img" aria-labelledby="title desc"><title id="title">提交成功但回应丢失：重投查回原结果</title><desc id="desc">工作者在业务和inbox同库原子提交后退出，重投同一事件返回原回执；单库教学边界。</desc><defs></defs><rect width="960" height="705" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="46" font-size="26" fill="#24344d" text-anchor="start" font-weight="700">提交成功但回应丢失：重投查回原结果</text><text x="30" y="88" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">单数据库事务中的业务效果 + inbox 回执；不包含任意远端 API</text><text x="175" y="139" font-size="20" fill="#24344d" text-anchor="middle" font-weight="600">队列 / 调用方</text><path d="M175 160L175 580" stroke="#9caecc" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="480" y="139" font-size="20" fill="#24344d" text-anchor="middle" font-weight="600">工作者</text><path d="M480 160L480 580" stroke="#9caecc" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="790" y="139" font-size="20" fill="#24344d" text-anchor="middle" font-weight="600">业务库 + inbox</text><path d="M790 160L790 580" stroke="#9caecc" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M175 207L480 237" stroke="#315dce" stroke-width="2" fill="none"/><path d="M472 232L480 237L472 242" stroke="#315dce" fill="none"/><text x="327.5" y="212.0" font-size="17" fill="#24344d" text-anchor="middle" font-weight="400">事件 E / 意图 H</text><path d="M480 282L790 312" stroke="#315dce" stroke-width="2" fill="none"/><path d="M782 307L790 312L782 317" stroke="#315dce" fill="none"/><text x="635.0" y="287.0" font-size="17" fill="#24344d" text-anchor="middle" font-weight="400">原子写效果与回执</text><text x="790" y="352" font-size="18" fill="#236857" text-anchor="middle" font-weight="600">COMMIT</text><path d="M458 370L502 414" stroke="#b76c22" stroke-width="2" fill="none"/><path d="M502 370L458 414" stroke="#b76c22" stroke-width="2" fill="none"/><text x="510" y="397" font-size="17" fill="#9a5b26" text-anchor="start" font-weight="400">退出，尚未 ACK</text><path d="M175 450L480 480" stroke="#315dce" stroke-width="2" fill="none"/><path d="M472 475L480 480L472 485" stroke="#315dce" fill="none"/><text x="327.5" y="455.0" font-size="17" fill="#24344d" text-anchor="middle" font-weight="400">仍为 E / H，再投递</text><path d="M480 522L790 552" stroke="#315dce" stroke-width="2" fill="none"/><path d="M782 547L790 552L782 557" stroke="#315dce" fill="none"/><text x="635.0" y="527.0" font-size="17" fill="#24344d" text-anchor="middle" font-weight="400">查到原回执，返回旧结果</text><text x="30" y="635" font-size="18" fill="#24344d" text-anchor="start" font-weight="400">身份稳定 + 参数绑定 + 同一原子提交边界，才封住本例重复窗口。</text><text x="30" y="671" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">换成外部付款服务时，本地 inbox 不能自动覆盖远端提交；需额外协议。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="title desc"><title id="title">两机四卡：节点、进程与 GPU 的映射</title><desc id="desc">节点 A 的全局 rank 为 0 和 1，节点 B 为 2 和 3，每台机器的 local rank 都从零开始。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#203553}.label{font-size:16px;font-weight:600}.small{font-size:12px;fill:#61748e}.title{font-size:22px;font-weight:700}.eyebrow{font-size:10px;fill:#315dce;letter-spacing:2px}</style><rect width="960" height="455" rx="14" fill="#f6f8fc"/><text x="30" y="30" class="eyebrow">CLOUDINFRA GUIDE / TRAINING SYSTEMS</text><text x="30" y="67" class="title">两机四卡：节点、进程与 GPU 的映射</text><rect x="35" y="110" width="405" height="240" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="237.5" y="140" text-anchor="middle" class="label">NODE A · 10.0.1.10</text><text x="237.5" y="163" text-anchor="middle" class="small">NODE_RANK = 0</text><rect x="520" y="110" width="405" height="240" rx="10" fill="#edf2fe" stroke="#7e9ee5"/><text x="722.5" y="140" text-anchor="middle" class="label">NODE B · 10.0.1.11</text><text x="722.5" y="163" text-anchor="middle" class="small">NODE_RANK = 1</text><rect x="55" y="205" width="175" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="142.5" y="235" text-anchor="middle" class="label">GPU 0 / 进程</text><text x="142.5" y="258" text-anchor="middle" class="small">LOCAL_RANK=0 · RANK=0</text><rect x="250" y="205" width="175" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="337.5" y="235" text-anchor="middle" class="label">GPU 1 / 进程</text><text x="337.5" y="258" text-anchor="middle" class="small">LOCAL_RANK=1 · RANK=1</text><rect x="540" y="205" width="175" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="627.5" y="235" text-anchor="middle" class="label">GPU 0 / 进程</text><text x="627.5" y="258" text-anchor="middle" class="small">LOCAL_RANK=0 · RANK=2</text><rect x="735" y="205" width="175" height="100" rx="10" fill="#ffffff" stroke="#d7e1ef"/><text x="822.5" y="235" text-anchor="middle" class="label">GPU 1 / 进程</text><text x="822.5" y="258" text-anchor="middle" class="small">LOCAL_RANK=1 · RANK=3</text><path d="M440 245 L520 245" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M520 265 L440 265" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="448" y="230" class="small">NCCL</text><text x="35" y="390" class="label">WORLD_SIZE = 4     ·     每进程 1 张 GPU     ·     LOCAL_RANK 只在当前节点内唯一</text><text x="35" y="425" class="small">两端以同一 MASTER_ADDR:MASTER_PORT 加入同一作业；训练张量并不都经过此端口。</text></svg>
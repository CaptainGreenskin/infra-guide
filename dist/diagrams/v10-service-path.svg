<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">把名称、后端发现和包转发分开</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315dce"/></marker></defs><rect width="960" height="560" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="30" y="44" font-size="24" fill="#24344d" text-anchor="start" font-weight="700">把名称、后端发现和包转发分开</text><text x="30" y="86" font-size="13" fill="#315dce" text-anchor="start" font-weight="400">控制面：根据标签与就绪维护后端</text><rect x="30" y="108" width="250" height="85" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="155.0" y="140" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">Service selector</text><text x="155.0" y="167" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">app = reports</text><rect x="355" y="108" width="250" height="85" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="480.0" y="140" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">EndpointSlice</text><text x="480.0" y="167" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">Pod IP + port + conditions</text><rect x="680" y="108" width="250" height="85" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="805.0" y="140" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">Pod 状态</text><text x="805.0" y="167" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">Ready / terminating</text><path d="M280 150 L353 150" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M680 150 L607 150" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="30" y="239" font-size="13" fill="#315dce" text-anchor="start" font-weight="400">请求路径：普通 ClusterIP 示例</text><rect x="30" y="265" width="180" height="84" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="120.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">客户端 Pod</text><text x="120.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">先解析服务名</text><rect x="270" y="265" width="180" height="84" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="360.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">Service 入口</text><text x="360.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">80 / ClusterIP</text><rect x="510" y="265" width="180" height="84" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="600.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">服务数据面</text><text x="600.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">选择后端 / 转发</text><rect x="750" y="265" width="180" height="84" rx="8" fill="#eef3ff" stroke="#b9c8e7"/><text x="840.0" y="297" font-size="18" fill="#24344d" text-anchor="middle" font-weight="600">目标 Pod</text><text x="840.0" y="324" font-size="13" fill="#60708d" text-anchor="middle" font-weight="400">8080 / 应用监听</text><path d="M210 307 L268 307" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M450 307 L508 307" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M690 307 L748 307" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><path d="M480 193 L600 262" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#a)"/><text x="460" y="226" font-size="12" fill="#24344d" text-anchor="start" font-weight="400">观察后端</text><path d="M840 349 V410 H120 V351" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="480" y="400" font-size="15" fill="#24344d" text-anchor="middle" font-weight="400">返回方向：路由、策略与连接状态同样要成立</text><text x="30" y="465" font-size="17" fill="#24344d" text-anchor="start" font-weight="600">DNS 返回地址 ≠ 有后端；有端点 ≠ 已监听；Pod 可直连 ≠ Service 正常。</text><text x="30" y="505" font-size="14" fill="#60708d" text-anchor="start" font-weight="400">具体路径依 CNI、代理、NAT 和服务类型而变；NetworkPolicy 要同时核对两端方向。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
<title id="title">从文本到预测，再到参数更新</title><desc id="desc">推理用当前参数得到预测；训练还要用目标计算损失、梯度，再由优化器更新参数。GPU承担数值执行。</desc>
<defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#315dce"/></marker><marker id="dependency" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#65728a"/></marker><marker id="update" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#287b69"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="810" fill="#fff"/>
<text x="32" y="48" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">推理先走一遍计算，训练还要走更新路径</text>
<text x="32" y="87" font-size="22" fill="#65728a" font-weight="400" text-anchor="start">蓝色：输入到预测　　绿色：训练新增的误差与更新路径</text>
<rect x="25" y="150" width="190" height="132" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="120.0" y="188" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">文本</text>
<text x="120.0" y="223" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">原始输入</text>
<rect x="245" y="150" width="190" height="132" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="340.0" y="188" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">词元编号</text>
<text x="340.0" y="223" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">分词后的离散单位</text>
<rect x="465" y="150" width="190" height="132" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="560.0" y="188" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">向量表示</text>
<text x="560.0" y="223" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">编号查表得到数字</text>
<rect x="685" y="150" width="190" height="132" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="780.0" y="188" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">模型计算</text>
<text x="780.0" y="223" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">使用当前参数</text>
<rect x="905" y="150" width="190" height="132" rx="8" fill="#f2f5fb" stroke="#d6dfef" stroke-width="2"/>
<text x="1000.0" y="188" font-size="26" fill="#315dce" font-weight="600" text-anchor="middle">候选得分</text>
<text x="1000.0" y="223" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">决定后续输出</text>
<polyline points="215,216 245,216" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="435,216 465,216" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="655,216 685,216" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<polyline points="875,216 905,216" fill="none" stroke="#315dce" stroke-width="2.5" marker-end="url(#flow)"/>
<text x="32" y="332" font-size="24" fill="#315dce" font-weight="550" text-anchor="start">只读取当前参数、产生预测：推理。下面这条回路：训练。</text>
<rect x="30" y="402" width="235" height="122" rx="8" fill="#edf7f3" stroke="#a5cabb" stroke-width="2"/>
<text x="147.5" y="440" font-size="26" fill="#287b69" font-weight="600" text-anchor="middle">训练目标</text>
<text x="147.5" y="475" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">已知的正确答案</text>
<rect x="425" y="402" width="230" height="122" rx="8" fill="#edf7f3" stroke="#a5cabb" stroke-width="2"/>
<text x="540.0" y="440" font-size="26" fill="#287b69" font-weight="600" text-anchor="middle">损失</text>
<text x="540.0" y="475" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">衡量预测与目标差异</text>
<rect x="830" y="402" width="260" height="122" rx="8" fill="#edf7f3" stroke="#a5cabb" stroke-width="2"/>
<text x="960.0" y="440" font-size="26" fill="#287b69" font-weight="600" text-anchor="middle">梯度与优化器</text>
<text x="960.0" y="475" font-size="21" fill="#65728a" font-weight="400" text-anchor="middle">计算影响，再调整参数</text>
<polyline points="265,462 425,462" fill="none" stroke="#287b69" stroke-width="2.5" marker-end="url(#update)"/>
<polyline points="1000,282 1000,358 540,358 540,402" fill="none" stroke="#287b69" stroke-width="2.5" marker-end="url(#update)"/>
<polyline points="655,462 830,462" fill="none" stroke="#287b69" stroke-width="2.5" marker-end="url(#update)"/>
<polyline points="960,524 960,606 1107,606 1107,123 780,123 780,150" fill="none" stroke="#287b69" stroke-width="2.5" marker-end="url(#update)"/>
<text x="538" y="387" font-size="19" fill="#287b69" font-weight="400" text-anchor="middle">预测</text>
<text x="955" y="640" font-size="23" fill="#287b69" font-weight="600" text-anchor="middle">更新模型参数</text>
<rect x="30" y="663" width="1060" height="106" rx="8" fill="#f6f7f9" stroke="#d8dee8"/>
<text x="54" y="704" font-size="23" fill="#1c283d" font-weight="550" text-anchor="start">GPU是执行这些数值计算的硬件；模型、训练和推理分别描述不同对象与过程。</text>
<text x="54" y="741" font-size="21" fill="#65728a" font-weight="400" text-anchor="start">本图只画概念关系；具体模型还需要位置处理、输出规则及相应运行依赖。</text>
<metadata>{&quot;kind&quot;: &quot;conceptual_relationships&quot;, &quot;relationships&quot;: [&quot;text→token_ids→vectors→model→scores&quot;, &quot;scores+target→loss→gradients_and_optimizer→parameters&quot;, &quot;hardware_executes_computation&quot;], &quot;measured&quot;: false, &quot;author&quot;: &quot;InfraGuide&quot;}</metadata>
</svg>
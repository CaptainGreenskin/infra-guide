<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">CPU配额与并行线程的时间预算</title><desc id="desc">一个线程使用50毫秒CPU时间，或两个线程各使用25毫秒，都耗尽100毫秒周期内的50毫秒总预算。这是教学算例，不是实际调度轨迹。</desc><style>text{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}</style><rect width="960" height="630" rx="12" fill="#f6f8fc"/><text x="30" y="31" font-size="11" fill="#315dce" font-weight="600">INFRAGUIDE / CPU TIME IS A SHARED BUDGET</text><text x="30" y="70" font-size="25" fill="#203553" font-weight="700">0.5核配额：线程更多，总预算仍然相同</text><text x="30" y="105" font-size="15" fill="#61748e" font-weight="400">理想示意：cpu.max = 50000 100000；每100ms周期，共享50ms的CPU时间。</text><text x="152.0" y="150" font-size="13" fill="#61748e" font-weight="400">0ms</text><text x="332.0" y="150" font-size="13" fill="#61748e" font-weight="400">25ms</text><text x="512.0" y="150" font-size="13" fill="#61748e" font-weight="400">50ms</text><text x="692.0" y="150" font-size="13" fill="#61748e" font-weight="400">75ms</text><text x="872.0" y="150" font-size="13" fill="#61748e" font-weight="400">100ms</text><text x="30" y="200" font-size="17" fill="#203553" font-weight="600">一个线程</text><rect x="160" y="173" width="720" height="46" rx="6" fill="#e5eaf2"/><rect x="160" y="173" width="360" height="46" rx="6" fill="#315dce"/><text x="177" y="202" font-size="14" fill="#fff" font-weight="400">1 × 50ms = 50ms CPU</text><text x="535" y="202" font-size="14" fill="#61748e" font-weight="400">预算已耗尽：示意等待</text><text x="30" y="305" font-size="17" fill="#203553" font-weight="600">两个线程</text><rect x="160" y="278" width="720" height="46" rx="6" fill="#e5eaf2"/><rect x="160" y="278" width="180" height="46" rx="6" fill="#315dce"/><text x="177" y="307" font-size="14" fill="#fff" font-weight="400">线程A：25ms</text><text x="355" y="307" font-size="14" fill="#61748e" font-weight="400">预算已耗尽：示意等待</text><rect x="160" y="338" width="720" height="46" rx="6" fill="#e5eaf2"/><rect x="160" y="338" width="180" height="46" rx="6" fill="#315dce"/><text x="177" y="367" font-size="14" fill="#fff" font-weight="400">线程B：25ms</text><text x="355" y="367" font-size="14" fill="#61748e" font-weight="400">预算已耗尽：示意等待</text><text x="160" y="416" font-size="17" fill="#315dce" font-weight="600">两个线程各执行25ms，合计已经使用50ms CPU时间。</text><rect x="30" y="455" width="900" height="110" rx="8" fill="#edf2fe"/><text x="48" y="484" font-size="15" fill="#203553" font-weight="400">图中假设：线程一直可运行，可在不同CPU并行；无额外burst和更紧父级限制。</text><text x="48" y="514" font-size="15" fill="#203553" font-weight="400">实际调度有粒度、分配和竞争差异，图中等待长度不是内核行为的精确预测。</text><text x="48" y="544" font-size="15" fill="#203553" font-weight="400">0.5 / 16 = 3.125%：主机总量很低与目标容器用满配额可以同时成立。</text><text x="30" y="601" font-size="13" fill="#61748e" font-weight="400">原创教学示意 · 未执行真实Linux容器节流实验 · 蓝色表示执行，灰色表示理想化剩余周期</text></svg>
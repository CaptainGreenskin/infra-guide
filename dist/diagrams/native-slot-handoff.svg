<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310" role="img" aria-labelledby="title description">
<title id="title">交接四个已处理位置，词元 7 从位置 4 开始</title>
<desc id="description">源进程处理位置 0 到 3，选出词元 7，保存 396 字节并退出。新进程恢复四个位置，以 7 为位置 4 的输入，继续得到 8 和 9。截断文件返回 400 并清空六个位置。同样输入不再复用，输出仍为 8 和 9。</desc>

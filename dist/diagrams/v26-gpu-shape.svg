<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img"><title>GPU总数够，整组形状仍可能放不下</title><desc>额度回答能否占用；放置回答这些节点是否同时满足约束。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="718" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">GPU总数够，整组形状仍可能放不下</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">额度回答能否占用；放置回答这些节点是否同时满足约束。</text><text x="38" y="131" font-size="22" fill="#315dce" font-weight="700">32个题设槽位：蓝色空闲，灰色已用；空闲总数16。</text><rect x="36" y="159" width="250" height="162" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="53" y="192" font-size="22" fill="#315dce" font-weight="700">节点1 / 空闲8</text><rect x="53" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="107" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="161" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="215" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="53" y="255" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="107" y="255" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="161" y="255" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="215" y="255" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="310" y="159" width="250" height="162" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="327" y="192" font-size="22" fill="#315dce" font-weight="700">节点2 / 空闲4</text><rect x="327" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="381" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="435" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="489" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="327" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="381" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="435" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="489" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="584" y="159" width="250" height="162" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="601" y="192" font-size="22" fill="#315dce" font-weight="700">节点3 / 空闲4</text><rect x="601" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="655" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="709" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="763" y="210" width="42" height="34" rx="4" fill="#315dce" stroke="#315dce"/><rect x="601" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="655" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="709" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="763" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="858" y="159" width="250" height="162" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="875" y="192" font-size="22" fill="#315dce" font-weight="700">节点4 / 空闲0</text><rect x="875" y="210" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="929" y="210" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="983" y="210" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="1037" y="210" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="875" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="929" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="983" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="1037" y="255" width="42" height="34" rx="4" fill="#dbe1ea" stroke="#ccd8e8"/><rect x="36" y="366" width="1048" height="91" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="58" y="404" font-size="25" fill="#b53e3e" font-weight="700">[8,8]：需要两处各8槽；第二处不存在。</text><text x="58" y="439" font-size="21" fill="#17263e" font-weight="400">借到12份额度，也不会把节点2与3的4+4物理拼成一台。</text><rect x="36" y="481" width="1048" height="88" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="519" font-size="25" fill="#12725b" font-weight="700">[8,4,4]：可分别放到节点1、2、3。</text><text x="58" y="553" font-size="21" fill="#17263e" font-weight="400">形状变了，通信/程序结构也可能变；不能只改GPU总数。</text><text x="38" y="625" font-size="21" fill="#17263e" font-weight="400">另例[8,4]放任务[4,8]：先贪心占第一台会失败；回溯可把4放第二台。</text><text x="38" y="681" font-size="18" fill="#56667d" font-weight="400">有限参考还检查CPU、内存、硬件flavor与同rack硬约束；不是读取真实GPU或运行Kueue。</text></g></svg>

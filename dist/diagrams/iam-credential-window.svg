<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" role="img" aria-labelledby="title desc">
  <title id="title">停止签发以后，原凭据还剩多久</title>
  <desc id="desc">10 点签发原凭据，10 点 30 分停止签发新凭据，原凭据的到期时间仍是 10 点 45 分。现有请求是否提前被拒绝，需要独立核对接收方规则。</desc>
  <metadata>{"issued":"10:00","issuance_stops":"10:30","expires":"10:45","remaining_minutes_at_stop":15,"existing_permission_changed":false,"measured":false}</metadata>
  <rect width="720" height="264" rx="12" fill="#f3f6fc"/>
  <g font-family="system-ui, sans-serif" fill="#203553">
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="96" y="35">10:00</text>
      <text x="448" y="35">10:30</text>
      <text x="624" y="35">10:45</text>
    </g>
    <g font-size="17" text-anchor="middle" fill="#475b79">
      <text x="96" y="61">原凭据签发</text>
      <text x="448" y="61">停止签发新凭据</text>
      <text x="624" y="61">原凭据到期</text>
    </g>
    <path d="M96 70V194 M448 70V194 M624 70V194" fill="none" stroke="#bdcbe2" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="96" y="88" width="352" height="34" rx="6" fill="#3156b2"/>
    <rect x="96" y="143" width="352" height="34" rx="6" fill="#147172"/>
    <rect x="448" y="143" width="176" height="34" rx="6" fill="#d6eeee" stroke="#83baba"/>
    <g font-size="18" font-weight="600">
      <text x="114" y="111" fill="#fff">仍可签发新凭据</text>
      <text x="114" y="166" fill="#fff">原凭据的时间有效期</text>
      <text x="536" y="166" text-anchor="middle" fill="#175b5c">还剩 15 分钟</text>
    </g>
    <rect x="24" y="207" width="672" height="36" rx="6" fill="#fff" stroke="#c1cce2"/>
    <text x="39" y="230" font-size="16">现有请求能否提前被拒绝，另查接收方当前权限或撤销规则。</text>
  </g>
</svg>

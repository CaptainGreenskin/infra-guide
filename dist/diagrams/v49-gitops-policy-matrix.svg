<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">同步、自愈与清理：不同策略改变不同事实</title><desc id="desc">真实自愈与清理对照，原受管旧配置删除，而未受管配置始终保留。</desc><metadata>{&quot;kind&quot;: &quot;actual_policy_comparison&quot;, &quot;off&quot;: {&quot;status&quot;: {&quot;sync&quot;: &quot;OutOfSync&quot;, &quot;revision&quot;: &quot;fb18c80ebda55f22180f7cd9a19360cb9e739202&quot;, &quot;health&quot;: &quot;Healthy&quot;, &quot;operation&quot;: &quot;Succeeded&quot;, &quot;conditions&quot;: []}, &quot;live_replicas&quot;: 2}, &quot;on&quot;: {&quot;status&quot;: {&quot;sync&quot;: &quot;Synced&quot;, &quot;revision&quot;: &quot;fb18c80ebda55f22180f7cd9a19360cb9e739202&quot;, &quot;health&quot;: &quot;Healthy&quot;, &quot;operation&quot;: &quot;Succeeded&quot;, &quot;conditions&quot;: []}, &quot;live_replicas&quot;: 1, &quot;http&quot;: {&quot;version&quot;: &quot;v1&quot;, &quot;pod&quot;: &quot;guide-web-6b94f6999-8z822&quot;}, &quot;pod&quot;: {&quot;name&quot;: &quot;guide-web-6b94f6999-8z822&quot;, &quot;uid&quot;: &quot;726eabfd-cb7c-4deb-a51d-ac98a015049f&quot;}, &quot;desired_config&quot;: &quot;v1&quot;}, &quot;prune_off&quot;: {&quot;status&quot;: {&quot;sync&quot;: &quot;OutOfSync&quot;, &quot;revision&quot;: &quot;872b300361e5a4ad9339d775c9e3310e60466fe1&quot;, &quot;health&quot;: &quot;Healthy&quot;, &quot;operation&quot;: &quot;Succeeded&quot;, &quot;conditions&quot;: []}, &quot;retired_exists&quot;: true, &quot;unmanaged_exists&quot;: true}, &quot;prune_on&quot;: {&quot;status&quot;: {&quot;sync&quot;: &quot;Synced&quot;, &quot;revision&quot;: &quot;872b300361e5a4ad9339d775c9e3310e60466fe1&quot;, &quot;health&quot;: &quot;Healthy&quot;, &quot;operation&quot;: &quot;Succeeded&quot;, &quot;conditions&quot;: []}, &quot;http&quot;: {&quot;version&quot;: &quot;v1&quot;, &quot;pod&quot;: &quot;guide-web-6b94f6999-8z822&quot;}, &quot;pod&quot;: {&quot;name&quot;: &quot;guide-web-6b94f6999-8z822&quot;, &quot;uid&quot;: &quot;726eabfd-cb7c-4deb-a51d-ac98a015049f&quot;}, &quot;desired_config&quot;: &quot;v2&quot;, &quot;retired_exists&quot;: false, &quot;unmanaged_exists&quot;: true, &quot;business_oracle_passed&quot;: false}}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="530" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">同步、自愈与清理：不同策略改变不同事实</text><text x="32" y="90" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">在自己的Application和命名空间中分别改变一个策略。</text><rect x="24" y="120" width="910" height="57" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="32" y="155" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">手工把副本1改2</text><text x="350" y="155" font-size="20" fill="#315dce" font-weight="400" text-anchor="start">selfHeal=false</text><text x="610" y="155" font-size="19" fill="#946020" font-weight="400" text-anchor="start">2，OutOfSync</text><rect x="24" y="196" width="910" height="57" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="32" y="231" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">同一Git修订</text><text x="350" y="231" font-size="20" fill="#315dce" font-weight="400" text-anchor="start">selfHeal=true</text><text x="610" y="231" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">恢复1，Synced</text><rect x="24" y="272" width="910" height="57" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="32" y="307" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">从Git移除受管旧配置</text><text x="350" y="307" font-size="20" fill="#315dce" font-weight="400" text-anchor="start">prune=false</text><text x="610" y="307" font-size="19" fill="#946020" font-weight="400" text-anchor="start">旧对象保留</text><rect x="24" y="348" width="910" height="57" rx="7" fill="#f6f8fc" stroke="#cbd6e8"/><text x="32" y="383" font-size="20" fill="#24344d" font-weight="400" text-anchor="start">继续允许清理</text><text x="350" y="383" font-size="20" fill="#315dce" font-weight="400" text-anchor="start">prune=true</text><text x="610" y="383" font-size="19" fill="#236e5e" font-weight="400" text-anchor="start">旧对象删除，未受管保留</text><text x="32" y="490" font-size="20" fill="#60708b" font-weight="400" text-anchor="start">清理依据受管关系；不是删除命名空间里所有不在Git的对象。</text></g></svg>
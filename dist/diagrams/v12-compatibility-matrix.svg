<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" aria-labelledby="title desc"><title id="title">回退能否成立：先检查版本兼容矩阵</title><desc id="desc">用假设的三版应用和三种数据库契约画出兼容关系；镜像回退不能自动恢复数据库。</desc><defs></defs><rect width="960" height="672" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="46" font-size="26" fill="#24344d" text-anchor="start" font-weight="700">回退能否成立：先检查版本兼容矩阵</text><text x="30" y="89" font-size="17" fill="#60708d" text-anchor="start" font-weight="400">假设版本能力；绿色为本例兼容，橙色为本例不兼容</text><text x="410" y="150" font-size="19" fill="#24344d" text-anchor="middle" font-weight="600">只有旧列</text><text x="620" y="150" font-size="19" fill="#24344d" text-anchor="middle" font-weight="600">新旧列共存</text><text x="830" y="150" font-size="19" fill="#24344d" text-anchor="middle" font-weight="600">只有新列</text><text x="30" y="234" font-size="19" fill="#24344d" text-anchor="start" font-weight="400">应用 v1：只读写旧列</text><rect x="325" y="185" width="170" height="82" rx="6" fill="#d7eee9" stroke="none"/><text x="410" y="234" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">兼容</text><rect x="535" y="185" width="170" height="82" rx="6" fill="#d7eee9" stroke="none"/><text x="620" y="234" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">兼容</text><rect x="745" y="185" width="170" height="82" rx="6" fill="#ffebd7" stroke="none"/><text x="830" y="234" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">不兼容</text><text x="30" y="342" font-size="19" fill="#24344d" text-anchor="start" font-weight="400">应用 v2：过渡双写</text><rect x="325" y="293" width="170" height="82" rx="6" fill="#ffebd7" stroke="none"/><text x="410" y="342" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">不兼容</text><rect x="535" y="293" width="170" height="82" rx="6" fill="#d7eee9" stroke="none"/><text x="620" y="342" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">兼容</text><rect x="745" y="293" width="170" height="82" rx="6" fill="#ffebd7" stroke="none"/><text x="830" y="342" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">不兼容</text><text x="30" y="450" font-size="19" fill="#24344d" text-anchor="start" font-weight="400">应用 v3：只读写新列</text><rect x="325" y="401" width="170" height="82" rx="6" fill="#ffebd7" stroke="none"/><text x="410" y="450" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">不兼容</text><rect x="535" y="401" width="170" height="82" rx="6" fill="#d7eee9" stroke="none"/><text x="620" y="450" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">兼容</text><rect x="745" y="401" width="170" height="82" rx="6" fill="#d7eee9" stroke="none"/><text x="830" y="450" font-size="20" fill="#24344d" text-anchor="middle" font-weight="400">兼容</text><text x="30" y="557" font-size="22" fill="#24344d" text-anchor="start" font-weight="600">保留旧版本入口不等于保留旧数据契约。</text><text x="30" y="599" font-size="19" fill="#315dce" text-anchor="start" font-weight="400">先扩展 → 兼容过渡与回填 → 核实消费者 → 再收缩</text><text x="30" y="640" font-size="16" fill="#60708d" text-anchor="start" font-weight="400">撤回镜像不会自动撤回迁移和已发生的写入；矩阵需按真实版本验证。</text></g></svg>
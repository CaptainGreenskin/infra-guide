<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 394" role="img" aria-labelledby="title desc">
<title id="title">一批跨过四个 KV 槽的边界</title>
<desc id="desc">第二批是逻辑位置 3 和 4。查询 3 可读 0、1、2、3，查询 4 可读 1、2、3、4。算完才把位置 4 写进槽 0。若先写再算，查询 3 就读不到位置 0。位置 4 的 RoPE 仍使用逻辑序号 4。</desc>

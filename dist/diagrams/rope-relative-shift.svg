<svg xmlns="http://www.w3.org/2000/svg" width="920" height="356" viewBox="0 0 920 356" role="img" aria-labelledby="title desc">
<title id="title">位置一起平移，点积为什么不变</title>
<desc id="desc">原始位置差和共同平移后都是负一，缩放前点积都是负四。只重置查询后位置差变为正一，点积为正四。</desc>
<metadata>{"q":[1,2],"k":[3,2],"omega":"pi/2","cases":[[2,1,-1,-4],[4,3,-1,-4],[0,1,1,4]]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="354" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">位置一起平移，点积为什么不变</text>
<text x="32" y="78" font-size="17" fill="#506584" font-weight="500" text-anchor="start">固定 q = [1, 2]、k = [3, 2] 和每格转角 π/2，只改变位置。</text><rect x="32" y="109" width="276" height="180" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="50" y="144" font-size="19" fill="#315fb5" font-weight="700" text-anchor="start">原位置</text><text x="50" y="183" font-size="19" fill="#172743" font-weight="500" text-anchor="start">m = 2，n = 1</text><text x="50" y="216" font-size="18" fill="#506584" font-weight="500" text-anchor="start">n − m = −1</text><text x="50" y="257" font-size="15" fill="#506584" font-weight="500" text-anchor="start">缩放前点积</text><text x="282" y="259" font-size="28" fill="#315fb5" font-weight="700" text-anchor="end">−4</text><rect x="322" y="109" width="276" height="180" rx="9" fill="#e4f5ef" stroke="#ccdaed"/><text x="340" y="144" font-size="19" fill="#087767" font-weight="700" text-anchor="start">两者一起加 2</text><text x="340" y="183" font-size="19" fill="#172743" font-weight="500" text-anchor="start">m = 4，n = 3</text><text x="340" y="216" font-size="18" fill="#506584" font-weight="500" text-anchor="start">n − m = −1</text><text x="340" y="257" font-size="15" fill="#506584" font-weight="500" text-anchor="start">缩放前点积</text><text x="572" y="259" font-size="28" fill="#087767" font-weight="700" text-anchor="end">−4</text><rect x="612" y="109" width="276" height="180" rx="9" fill="#fff0d5" stroke="#ccdaed"/><text x="630" y="144" font-size="19" fill="#955a14" font-weight="700" text-anchor="start">只把查询重置为 0</text><text x="630" y="183" font-size="19" fill="#172743" font-weight="500" text-anchor="start">m = 0，n = 1</text><text x="630" y="216" font-size="18" fill="#506584" font-weight="500" text-anchor="start">n − m = +1</text><text x="630" y="257" font-size="15" fill="#506584" font-weight="500" text-anchor="start">缩放前点积</text><text x="862" y="259" font-size="28" fill="#955a14" font-weight="700" text-anchor="end">+4</text><text x="32" y="330" font-size="18" fill="#172743" font-weight="600" text-anchor="start">共同平移保留位置差。单独重置查询会改变位置差和点积。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="375" viewBox="0 0 920 375" role="img" aria-labelledby="title desc">
<title id="title">SwiGLU 先逐项相乘，再投影回输出</title>
<desc id="desc">up 向量五、二与激活后的门控向量逐项相乘，得到零和三倍自然对数三除以二，再乘下投影矩阵得到约三点二九六和一点六四八。</desc>
<metadata>{"up":[5,2],"gate":[0,"ln(3)"],"activated":[0,"3*ln(3)/4"],"product":[0,"3*ln(3)/2"],"down":[[1,-1],[2,1]],"output":["3*ln(3)","3*ln(3)/2"]}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="373" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">SwiGLU 先逐项相乘，再投影回输出</text>
<text x="32" y="78" font-size="17" fill="#506584" font-weight="500" text-anchor="start">固定两路投影结果，每个坐标只与同坐标相乘，再用下投影合并。</text><text x="32" y="122" font-size="19" fill="#172743" font-weight="700" text-anchor="start">up 向量 u</text><text x="257" y="122" font-size="19" fill="#172743" font-weight="700" text-anchor="start">gate 向量 g</text><text x="482" y="122" font-size="19" fill="#172743" font-weight="700" text-anchor="start">SiLU(g)</text><text x="707" y="122" font-size="19" fill="#172743" font-weight="700" text-anchor="start">逐项乘积 h</text><rect x="32" y="140" width="179" height="58" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="121.5" y="175.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">[5, 2]</text><rect x="257" y="140" width="179" height="58" rx="9" fill="#eaf1fc" stroke="#ccdaed"/><text x="346.5" y="175.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">[0, ln 3]</text><rect x="482" y="140" width="179" height="58" rx="9" fill="#e4f5ef" stroke="#ccdaed"/><text x="571.5" y="175.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">[0, 3 ln 3/4]</text><rect x="707" y="140" width="179" height="58" rx="9" fill="#e4f5ef" stroke="#ccdaed"/><text x="796.5" y="175.0" font-size="19" fill="#172743" font-weight="500" text-anchor="middle">[0, 3 ln 3/2]</text><path d="M438 169H479" fill="none" stroke="#315fb5" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M663 169H704" fill="none" stroke="#087767" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M122 199v34h612v-31" fill="none" stroke="#315fb5" stroke-width="2.6" marker-end="url(#arrow)"/><text x="488" y="223" font-size="16" fill="#506584" font-weight="500" text-anchor="middle">与 u 的对应项相乘</text><path d="M887 177h14v75H795v13" fill="none" stroke="#087767" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="264" y="267" width="622" height="83" rx="9" fill="#ffffff" stroke="#ccdaed"/><text x="284" y="298" font-size="18" fill="#172743" font-weight="650" text-anchor="start">下投影 Wdown 的两行 [1, −1]、[2, 1]</text><text x="284" y="328" font-size="20" fill="#087767" font-weight="700" text-anchor="start">输出 [3 ln 3, 3 ln 3/2] ≈ [3.296, 1.648]</text>
</g>
</svg>

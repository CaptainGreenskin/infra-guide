<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">训练提交要先判断意图，再检查实际输入</title>
  <desc id="desc">租户与提交键指向已有作业时，规范化清单相同则重用原作业，清单变更则拒绝。新键依次核对代码、数据与权重摘要，通过后启动真实子进程，读取校验过的字节并记录一次更新。实跑只启动了两个子进程。</desc>
  <metadata>{"record":"labs/training-submission-preflight/validation.json","keys":["train-daily","next-key"],"run_ids":["run-001","run-002"],"worker_starts":2,"updated_weights":["13/8","31/16"]}</metadata>

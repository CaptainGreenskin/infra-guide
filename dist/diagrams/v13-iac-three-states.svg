<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
<title id="title">Terraform 配置、状态身份与实际资源</title><desc id="desc">配置代表目标容量二，state 绑定身份且旧记录为二，现场实例池已被改为五。刷新模式可以更新状态记录；正常计划和应用才能把资源容量改回二。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2759a5"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="960" height="750" rx="16" fill="#f6f9fb" stroke="none"/>
<text x="36" y="40" fill="#2759a5" font-size="18" font-weight="700" text-anchor="start">IaC  /  TERRAFORM</text>
<text x="36" y="84" fill="#20324a" font-size="30" font-weight="700" text-anchor="start">三份记录，只有一份是正在运行的资源</text>
<text x="36" y="117" fill="#50647a" font-size="19" font-weight="400" text-anchor="start">同一个受管实例池。值班人员临时把期望容量从 2 改为 5，配置仓库仍写 2。</text>
<rect x="36" y="151" width="268" height="166" rx="12" fill="#ffffff" stroke="#c7d4df"/>
<rect x="36" y="151" width="268" height="48" rx="12" fill="#e8f0fc" stroke="none"/>
<text x="50" y="182" fill="#2759a5" font-size="19" font-weight="700" text-anchor="start">配置｜管理者的目标</text>
<text x="50" y="231" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">声明期望容量 = 2</text>
<text x="50" y="262" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">资源地址：reports</text>
<text x="50" y="293" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">由版本库维护</text>
<rect x="346" y="151" width="268" height="166" rx="12" fill="#ffffff" stroke="#c7d4df"/>
<rect x="346" y="151" width="268" height="48" rx="12" fill="#e1f2ec" stroke="none"/>
<text x="360" y="182" fill="#08776d" font-size="19" font-weight="700" text-anchor="start">state｜身份与记录</text>
<text x="360" y="231" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">地址 → 实例池 ID</text>
<text x="360" y="262" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">上次记录容量 = 2</text>
<text x="360" y="293" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">记录有可能滞后</text>
<rect x="656" y="151" width="268" height="166" rx="12" fill="#ffffff" stroke="#c7d4df"/>
<rect x="656" y="151" width="268" height="48" rx="12" fill="#ffefdd" stroke="none"/>
<text x="670" y="182" fill="#9e4a16" font-size="19" font-weight="700" text-anchor="start">实际资源｜提供方 API</text>
<text x="670" y="231" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">同一实例池 ID</text>
<text x="670" y="262" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">当前期望容量 = 5</text>
<text x="670" y="293" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">由 provider 读取</text>
<path d="M306 238 H339" fill="none" stroke="#2759a5" stroke-width="2" marker-end="url(#arrow)" />
<path d="M616 238 H649" fill="none" stroke="#2759a5" stroke-width="2" marker-end="url(#arrow)" />
<text x="36" y="362" fill="#08776d" font-size="22" font-weight="700" text-anchor="start">路径 A｜记录现场变化</text>
<rect x="36" y="383" width="888" height="105" rx="12" fill="#e1f2ec" stroke="none"/>
<text x="54" y="417" fill="#08776d" font-size="20" font-weight="700" text-anchor="start">plan -refresh-only</text>
<text x="278" y="417" fill="#20324a" font-size="19" font-weight="400" text-anchor="start">预览把状态记录从 2 更新为 5，远端资源仍为 5。</text>
<text x="54" y="458" fill="#20324a" font-size="18" font-weight="400" text-anchor="start">应用该刷新计划后，state 记为 5。配置仍为 2，后续正常计划仍会看到差异。</text>
<text x="36" y="537" fill="#2759a5" font-size="22" font-weight="700" text-anchor="start">路径 B｜让实际资源符合配置</text>
<rect x="36" y="558" width="888" height="117" rx="12" fill="#e8f0fc" stroke="none"/>
<text x="54" y="593" fill="#2759a5" font-size="20" font-weight="700" text-anchor="start">正常 plan</text>
<text x="223" y="593" fill="#20324a" font-size="19" font-weight="400" text-anchor="start">读取同一对象的现场值 5，与配置 2 比较，计划 5 → 2。</text>
<text x="54" y="634" fill="#2759a5" font-size="20" font-weight="700" text-anchor="start">apply</text>
<text x="223" y="634" fill="#20324a" font-size="19" font-weight="400" text-anchor="start">执行已审阅计划，再核对资源值和 state；操作可能失败。</text>
<text x="36" y="720" fill="#50647a" font-size="18" font-weight="400" text-anchor="start">示意省略真实资源地址和提供方字段。远端 state 后端与保存实例池的云 API 是不同持久化域。</text>
</svg>

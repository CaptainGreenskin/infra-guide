<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-labelledby="title desc"><title id="title">Cloud：请求路径与控制路径怎样相连</title><desc id="desc">Cloud的资源、网络、数据、编排、事件交付、身份、容量和可靠性，共同围绕用户请求与故障恢复组织。</desc><metadata>{&quot;kind&quot;: &quot;conceptual_system_map&quot;, &quot;track&quot;: &quot;cloud&quot;, &quot;request_fields&quot;: [&quot;C2&quot;, &quot;C1&quot;, &quot;C4&quot;, &quot;C3&quot;], &quot;crosscut_fields&quot;: [&quot;C5&quot;, &quot;C6&quot;, &quot;C7&quot;, &quot;C8&quot;, &quot;C9&quot;], &quot;trace&quot;: false}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="535" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="46" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">Cloud：请求路径与控制路径怎样相连</text><text x="32" y="90" font-size="18" fill="#60708b" font-weight="400" text-anchor="start">实线是请求或执行；虚线是控制与观测。编号对应领域，不表示全都串行。</text><rect x="32" y="145" width="195" height="90" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="50" y="183" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">客户端</text><text x="50" y="215" font-size="18" fill="#24344d" font-weight="400" text-anchor="start"></text><path d="M229 190L261 190" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="265" y="145" width="195" height="90" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="283" y="183" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">网络路径</text><text x="283" y="215" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">C2</text><path d="M462 190L494 190" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="498" y="145" width="195" height="90" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="516" y="183" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">计算与容器</text><text x="516" y="215" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">C1 / C4</text><path d="M695 190L727 190" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="731" y="145" width="195" height="90" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="749" y="183" font-size="23" fill="#315dce" font-weight="600" text-anchor="start">数据读写</text><text x="749" y="215" font-size="18" fill="#24344d" font-weight="400" text-anchor="start">C3</text><text x="32" y="277" font-size="21" fill="#236e5e" font-weight="400" text-anchor="start">身份与允许范围贯穿每次资源访问（C7）</text><path d="M35 295L925 295" stroke="#236e5e" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="32" y="345" width="420" height="87" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="52" y="381" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">声明、事件与交付（C5 / C6）</text><text x="52" y="412" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">决定期望，确认动作与版本</text><rect x="505" y="345" width="420" height="87" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="525" y="381" font-size="22" fill="#24344d" font-weight="400" text-anchor="start">容量、目标与恢复（C8 / C9）</text><text x="525" y="412" font-size="19" fill="#24344d" font-weight="400" text-anchor="start">观察结果，调整资源与故障应对</text><path d="M350 344L570 240" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="350" y="319" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">调谐 / 放置</text><path d="M800 239L800 339" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="815" y="323" font-size="17" fill="#24344d" font-weight="400" text-anchor="start">观测</text><text x="32" y="492" font-size="19" fill="#60708b" font-weight="400" text-anchor="start">P0解释进程、内存、并发与未知结果；这些机制支撑上面每条路径。</text></g></svg>
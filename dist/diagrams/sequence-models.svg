<svg xmlns="http://www.w3.org/2000/svg" width="400" height="390" viewBox="0 0 400 390" role="img" aria-labelledby="sequence-title sequence-description">
  <title id="sequence-title">第 4 格怎样取得前文</title>
  <desc id="sequence-description">四格输入是红牌、蓝牌、绿牌、找红。循环状态依次从 1 传到 4。一层宽度为二的因果卷积只读取 3、4。全范围因果注意力将四格内容直接传向第 4 格，图中权重依次为 0.6、0.1、0.1、0.2。箭头指向接收信息的位置。</desc>

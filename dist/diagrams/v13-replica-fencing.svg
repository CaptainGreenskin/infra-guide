<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" role="img" aria-labelledby="title desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">候选副本 B 能不能接管写流量？</title>
  <desc id="desc">教学采样时点在 T103 确认后，T104 之前。基线余额 100 元。客户端已确认至 T103；Q 已复制 T103、已应用至 T102；B 已复制至 T102、仅已应用 T101。切主前需既隔离旧主又追回已确认日志。</desc>
  <defs>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" viewBox="0 0 6 6">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#2758a4" stroke-width="1.2" />
    </marker>
    <marker id="arr-teal" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" viewBox="0 0 6 6">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#106a65" stroke-width="1.2" />
    </marker>
    <marker id="arr-orange" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" viewBox="0 0 6 6">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#944919" stroke-width="1.2" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="772" fill="#f5f8fc" />
  <text x="30" y="36" font-size="18" fill="#2758a4" font-weight="650" text-anchor="start">CLOUD INFRA   /   02   切主账本</text>
  <text x="30" y="83" font-size="30" fill="#1c324a" font-weight="650" text-anchor="start">候选副本 B 能不能接管写流量？</text>
  <text x="30" y="119" font-size="19" fill="#4c6279" font-weight="400" text-anchor="start">T101 加 10，T102 加 20，T103 减 5；本例单源、顺序提交、无洞。</text>
  <text x="34" y="174" font-size="18" fill="#1c324a" font-weight="650" text-anchor="start">证据的持有者</text>
  <text x="416" y="174" font-size="18" fill="#2758a4" font-weight="650" text-anchor="middle">T101  /  +10</text>
  <text x="619" y="174" font-size="18" fill="#2758a4" font-weight="650" text-anchor="middle">T102  /  +20</text>
  <text x="821" y="174" font-size="18" fill="#2758a4" font-weight="650" text-anchor="middle">T103  /  −5</text>
  <line x1="31" y1="194" x2="927" y2="194" stroke="#2758a4" stroke-width="2" />
  <text x="35" y="226" font-size="19" fill="#1c324a" font-weight="650" text-anchor="start">客户端收到成功</text>
  <circle cx="374" cy="220" r="6" fill="#2758a4" />
  <text x="394" y="226" font-size="18" fill="#2758a4" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="577" cy="220" r="6" fill="#2758a4" />
  <text x="597" y="226" font-size="18" fill="#2758a4" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="779" cy="220" r="6" fill="#2758a4" />
  <text x="799" y="226" font-size="18" fill="#2758a4" font-weight="650" text-anchor="start">已证实</text>
  <line x1="31" y1="245" x2="928" y2="245" stroke="#c4d3df" stroke-width="1.6" />
  <text x="35" y="281" font-size="19" fill="#1c324a" font-weight="400" text-anchor="start">Q  中继日志已持久</text>
  <circle cx="374" cy="275" r="6" fill="#106a65" />
  <text x="394" y="281" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="577" cy="275" r="6" fill="#106a65" />
  <text x="597" y="281" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="779" cy="275" r="6" fill="#106a65" />
  <text x="799" y="281" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <line x1="31" y1="300" x2="928" y2="300" stroke="#c4d3df" stroke-width="1.6" />
  <text x="35" y="336" font-size="19" fill="#1c324a" font-weight="400" text-anchor="start">Q  引擎已应用</text>
  <circle cx="374" cy="330" r="6" fill="#106a65" />
  <text x="394" y="336" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="577" cy="330" r="6" fill="#106a65" />
  <text x="597" y="336" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <text x="821" y="336" font-size="18" fill="#944919" font-weight="400" text-anchor="middle">尚无</text>
  <line x1="31" y1="355" x2="928" y2="355" stroke="#c4d3df" stroke-width="1.6" />
  <text x="35" y="391" font-size="19" fill="#1c324a" font-weight="400" text-anchor="start">B  中继日志已持久</text>
  <circle cx="374" cy="385" r="6" fill="#106a65" />
  <text x="394" y="391" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <circle cx="577" cy="385" r="6" fill="#106a65" />
  <text x="597" y="391" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <text x="821" y="391" font-size="18" fill="#944919" font-weight="400" text-anchor="middle">尚无</text>
  <line x1="31" y1="410" x2="928" y2="410" stroke="#c4d3df" stroke-width="1.6" />
  <text x="35" y="446" font-size="19" fill="#1c324a" font-weight="400" text-anchor="start">B  引擎已应用</text>
  <circle cx="374" cy="440" r="6" fill="#106a65" />
  <text x="394" y="446" font-size="18" fill="#106a65" font-weight="650" text-anchor="start">已证实</text>
  <text x="619" y="446" font-size="18" fill="#944919" font-weight="400" text-anchor="middle">尚无</text>
  <text x="821" y="446" font-size="18" fill="#944919" font-weight="400" text-anchor="middle">尚无</text>
  <line x1="31" y1="465" x2="928" y2="465" stroke="#c4d3df" stroke-width="1.6" />
  <text x="34" y="513" font-size="21" fill="#2758a4" font-weight="650" text-anchor="start">可兑现的恢复上限</text>
  <text x="34" y="549" font-size="19" fill="#1c324a" font-weight="400" text-anchor="start">B 现在可读 110；只重放 B 自己的中继日志，可到 130，仍缺 T103。</text>
  <text x="34" y="579" font-size="18" fill="#1c324a" font-weight="400" text-anchor="start">Q 持有 T103。若该事件可安全取回、重放并验证，候选才能达到已确认余额 125。</text>
  <line x1="31" y1="605" x2="928" y2="605" stroke="#944919" stroke-width="2" />
  <text x="34" y="642" font-size="21" fill="#944919" font-weight="650" text-anchor="start">放开新主写入前，必须同时拿到两份证据</text>
  <text x="34" y="678" font-size="18" fill="#1c324a" font-weight="400" text-anchor="start">① 隔离旧主的写路径，确认旧连接、后台任务和重启节点都不能继续作为主节点写入。</text>
  <text x="34" y="710" font-size="18" fill="#1c324a" font-weight="400" text-anchor="start">② 核对候选的日志集合并补齐、应用，再用业务读证明结果。改 DNS 本身没有隔离旧主。</text>
  <text x="34" y="744" font-size="18" fill="#4c6279" font-weight="400" text-anchor="start">本图是可区分状态的快照；日志持久副本不可用时，不能宣称零数据丢失。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>归约散片，再收齐：数值怎样回到每个rank</title><desc>AllReduce交付全量和；ReduceScatter交付各自一片；AllGather只有收集，没有再求和。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="16" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">归约散片，再收齐：数值怎样回到每个rank</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">AllReduce交付全量和；ReduceScatter交付各自一片；AllGather只有收集，没有再求和。</text><rect x="36" y="124" width="1048" height="87" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="159" font-size="24" fill="#315dce" font-weight="700">rank0输入 [1,2,3,4]     rank1输入 [10,20,30,40]</text><text x="58" y="191" font-size="19" fill="#17263e" font-weight="400">归约约定：逐元素求和；分片顺序：按rank排列。</text><path d="M559 216 L559 254" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="250" y="264" width="620" height="79" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="275" y="297" font-size="25" fill="#315dce" font-weight="700">数学结果：[11,22 | 33,44]</text><text x="275" y="328" font-size="18" fill="#56667d" font-weight="400">这是一份数值表示，不代表先集中到rank0。</text><path d="M440 349 L296 396" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M681 349 L825 396" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="406" width="500" height="96" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="56" y="441" font-size="22" fill="#12725b" font-weight="700">ReduceScatter后 rank0</text><text x="56" y="482" font-size="27" fill="#17263e" font-weight="400">[11,22]</text><rect x="584" y="406" width="500" height="96" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="604" y="441" font-size="22" fill="#12725b" font-weight="700">ReduceScatter后 rank1</text><text x="604" y="482" font-size="27" fill="#17263e" font-weight="400">[33,44]</text><path d="M286 508 L286 553" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M834 508 L834 553" stroke="#315dce" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="36" y="563" width="500" height="91" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="56" y="596" font-size="22" fill="#315dce" font-weight="700">AllGather后 rank0</text><text x="56" y="636" font-size="26" fill="#17263e" font-weight="400">[11,22,33,44]</text><rect x="584" y="563" width="500" height="91" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="604" y="596" font-size="22" fill="#315dce" font-weight="700">AllGather后 rank1</text><text x="604" y="636" font-size="26" fill="#17263e" font-weight="400">[11,22,33,44]</text><text x="38" y="704" font-size="18" fill="#56667d" font-weight="400">本次CPU/Gloo实际验证这两步可重建AllReduce SUM的结果；不声称所有后端/版本支持相同变体。</text></g></svg>

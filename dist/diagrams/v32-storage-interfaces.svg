<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">对象、文件、块：接口把哪些责任交给应用</title><desc id="desc">三列责任示意；不是性能排序。具体一致性、锁和共享以产品协议为准。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#6b768b"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1120" height="650" fill="white"/>
<text x="32" y="46" font-size="32" fill="#1c283d" font-weight="650" text-anchor="start">对象、文件、块：先分责任，再选产品</text>
<text x="32" y="84" font-size="22" fill="#6b768b" font-weight="400" text-anchor="start">同一批训练输入，可以组合权威对象、节点缓存与共享工程文件。</text>
<rect x="32" y="124" width="330" height="445" rx="9" fill="white" stroke="#e4e9f0" stroke-width="2"/>
<text x="50" y="163" font-size="27" fill="#315dce" font-weight="650" text-anchor="start">对象接口</text>
<rect x="49" y="186" width="296" height="94" rx="9" fill="#f2f5fa" stroke="#e4e9f0" stroke-width="2"/>
<text x="62" y="222" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">应用：键、版本与清单</text>
<text x="62" y="254" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">自己定位样本与切片</text>
<line x1="197" y1="286" x2="197" y2="310" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="49" y="320" width="296" height="84" rx="9" fill="#edf2fe" stroke="#e4e9f0" stroke-width="2"/>
<text x="62" y="354" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">HTTP GET / Range</text>
<text x="62" y="384" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">取完整对象或范围</text>
<line x1="197" y1="410" x2="197" y2="434" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="61" y="468" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">服务：对象命名与字节</text>
<text x="61" y="499" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">应用：跨对象发布</text>
<text x="61" y="530" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">清单、版本与校验</text>
<rect x="395" y="124" width="330" height="445" rx="9" fill="white" stroke="#e4e9f0" stroke-width="2"/>
<text x="413" y="163" font-size="27" fill="#315dce" font-weight="650" text-anchor="start">文件接口</text>
<rect x="412" y="186" width="296" height="94" rx="9" fill="#f2f5fa" stroke="#e4e9f0" stroke-width="2"/>
<text x="425" y="222" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">应用：路径与文件操作</text>
<text x="425" y="254" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">读、写、目录与锁</text>
<line x1="560" y1="286" x2="560" y2="310" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="412" y="320" width="296" height="84" rx="9" fill="#edf2fe" stroke="#e4e9f0" stroke-width="2"/>
<text x="425" y="354" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">文件系统客户端</text>
<text x="425" y="384" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">例如共享 NFS 协议</text>
<line x1="560" y1="410" x2="560" y2="434" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="424" y="468" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">服务：目录与文件</text>
<text x="424" y="499" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">共享、锁和缓存行为</text>
<text x="424" y="530" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">逐项核对目标协议</text>
<rect x="758" y="124" width="330" height="445" rx="9" fill="white" stroke="#e4e9f0" stroke-width="2"/>
<text x="776" y="163" font-size="27" fill="#315dce" font-weight="650" text-anchor="start">块接口</text>
<rect x="775" y="186" width="296" height="94" rx="9" fill="#f2f5fa" stroke="#e4e9f0" stroke-width="2"/>
<text x="788" y="222" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">应用 / 文件系统 / 数据库</text>
<text x="788" y="254" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">自己安排数据布局</text>
<line x1="923" y1="286" x2="923" y2="310" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="775" y="320" width="296" height="84" rx="9" fill="#edf2fe" stroke="#e4e9f0" stroke-width="2"/>
<text x="788" y="354" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">块设备读写</text>
<text x="788" y="384" font-size="22" fill="#315dce" font-weight="400" text-anchor="start">应用负责上层文件语义</text>
<line x1="923" y1="410" x2="923" y2="434" stroke="#6b768b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="787" y="468" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">服务：可寻址块设备</text>
<text x="787" y="499" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">上层协调文件系统</text>
<text x="787" y="530" font-size="22" fill="#1c283d" font-weight="400" text-anchor="start">挂载与多写者</text>
<text x="32" y="610" font-size="22" fill="#6b768b" font-weight="400" text-anchor="start">接口责任示意；一致性、性能、故障域与恢复方式须核对具体产品。</text>
<metadata>{&quot;kind&quot;: &quot;responsibility_diagram&quot;, &quot;performance_order&quot;: false}</metadata>
</svg>
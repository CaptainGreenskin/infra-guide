<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" role="img" aria-labelledby="k8s-reconcile-title k8s-reconcile-desc">
<title id="k8s-reconcile-title">Kubernetes：持续协调与健康判断</title>
<desc id="k8s-reconcile-desc">声明进入 API Server。控制器、调度器与节点围绕 API 资源对象协作。startup 控制启动阶段，readiness 决定可用后端资格，liveness 失败按策略触发重启。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#315dce" stroke-width="1.3"/></marker></defs>
<style>text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<rect width="960" height="655" rx="14" fill="#f6f8fc"/>
<text x="30" y="30" font-size="11" fill="#315dce" text-anchor="start" font-weight="600">INFRAGUIDE / SYSTEMS FIELD NOTES</text>
<text x="30" y="69" font-size="25" fill="#203553" text-anchor="start" font-weight="700">Kubernetes：持续协调与健康判断</text>
<text x="30" y="101" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">声明已被接受、Pod 已启动和应用能够服务，是三个不同结论。</text>
<rect x="35" y="137" width="230" height="85" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="150.0" y="168" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">声明期望状态</text><text x="150.0" y="196" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">Deployment / Job 等资源</text><path d="M265 179 L365 179" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="137" width="250" height="85" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="490.0" y="168" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">API Server / 资源对象</text><text x="490.0" y="196" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">期望、实际状态与协调结果</text><text x="655" y="166" font-size="15" fill="#61748e" text-anchor="start" font-weight="400">持续读取状态、执行协调，</text><text x="655" y="192" font-size="15" fill="#61748e" text-anchor="start" font-weight="400">再写回结果并进入下一轮。</text><rect x="35" y="291" width="270" height="110" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="170.0" y="322" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">控制器</text><text x="170.0" y="350" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">比较期望与实际状态</text><text x="170.0" y="373" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">创建 / 调整受管资源</text><rect x="345" y="291" width="270" height="110" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="480.0" y="322" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">调度器</text><text x="480.0" y="350" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">为尚未绑定的 Pod</text><text x="480.0" y="373" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">选择满足条件的节点</text><rect x="655" y="291" width="270" height="110" rx="10" fill="#edf2fe" stroke="#7e9ee5" stroke-width="1.5"/><text x="790.0" y="322" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">节点 / kubelet</text><text x="790.0" y="350" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">通过运行时执行容器</text><text x="790.0" y="373" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">上报状态并执行探针</text><path d="M400 222 L210 291" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 291 L440 222" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M490 222 L490 291" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 222 L790 291" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="452" width="355" height="111" rx="10" fill="#edf2fe" stroke="#b6c9ef" stroke-width="1.5"/><text x="53" y="481" font-size="16" fill="#315dce" text-anchor="start" font-weight="600">startup 保护启动阶段</text><text x="53" y="507" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">startup 成功前不执行</text><text x="53" y="530" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">readiness 与 liveness</text><rect x="440" y="452" width="235" height="111" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="557.5" y="483" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">readiness</text><text x="557.5" y="511" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">是否属于常规服务可用后端</text><text x="557.5" y="534" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">失败：NotReady，不因此重启</text><rect x="705" y="452" width="220" height="111" rx="10" fill="#fff" stroke="#d7e1ef" stroke-width="1.5"/><text x="815.0" y="483" font-size="18" fill="#203553" text-anchor="middle" font-weight="600">liveness</text><text x="815.0" y="511" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">是否需要重启容器</text><text x="815.0" y="534" font-size="14" fill="#61748e" text-anchor="middle" font-weight="400">失败：按重启策略处理</text><path d="M790 401 L790 425 L557 425 L557 452" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 425 L815 425 L815 452" fill="none" stroke="#315dce" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="603" font-size="14" fill="#61748e" text-anchor="start" font-weight="400">箭头表达信息依赖；组件通过 API 对象协作，并非依次直接调用。</text>
<text x="30" y="633" font-size="13" fill="#61748e" text-anchor="start" font-weight="400">原创教学示意 · 非真实压测 · 图中阶段与尺寸不表示耗时比例</text>
</svg>
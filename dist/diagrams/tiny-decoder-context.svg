<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 434" role="img" aria-labelledby="title desc">
  <title id="title">只换前一个词元，下一项预测随之改变</title>
  <desc id="desc">同一个小模型分别读取编号 0、1 和 4、1。位置 1 的词嵌入与位置向量之和完全相同，但注意力会同时读取位置 0 和位置 1。投影后的注意力输出第一个数分别约为 0.3166 和 0.2672，最终候选分数最高的编号从 1 变为 7。</desc>
  <metadata>{"record":"labs/tiny-decoder-forward/validation.json","prompts":[[0,1],[4,1]],"selected":[1,7],"query_position":1}</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4860a7"/>
    </marker>
  </defs>
  <rect width="440" height="434" rx="12" fill="#f8faff"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#23314b">
    <text x="220" y="34" font-size="21" font-weight="650">只换前一个词元，预测也变了</text>

    <g fill="#fff" stroke="#b9c9ed">
      <rect x="20" y="54" width="192" height="52" rx="7"/>
      <rect x="228" y="54" width="192" height="52" rx="7"/>
      <rect x="20" y="210" width="192" height="87" rx="7"/>
      <rect x="228" y="210" width="192" height="87" rx="7"/>
    </g>
    <rect x="20" y="129" width="400" height="54" rx="7" fill="#eaf0ff" stroke="#b9c9ed"/>
    <g fill="#eaf0ff" stroke="#879fdf">
      <rect x="20" y="340" width="192" height="58" rx="7"/>
      <rect x="228" y="340" width="192" height="58" rx="7"/>
    </g>
    <g fill="none" stroke="#4860a7" stroke-width="2" marker-end="url(#arrow)">
      <path d="M116 108v16"/>
      <path d="M324 108v16"/>
      <path d="M116 185v20"/>
      <path d="M324 185v20"/>
      <path d="M54 299v36"/>
      <path d="M386 299v36"/>
    </g>

    <g font-size="18" font-weight="650">
      <text x="116" y="85">输入 [0, 1]</text>
      <text x="324" y="85">输入 [4, 1]</text>
      <text x="220" y="151">位置 1 放的都是编号 1</text>
    </g>
    <text x="220" y="173" font-size="15" fill="#445775">这一格的词嵌入和位置向量完全相同</text>
    <g font-size="16">
      <text x="116" y="235">注意力读取编号 0、1</text>
      <text x="324" y="235">注意力读取编号 4、1</text>
      <text x="116" y="264" fill="#445775">分支输出的第一个数</text>
      <text x="324" y="264" fill="#445775">分支输出的第一个数</text>
      <text x="116" y="286" font-weight="650">0.3166</text>
      <text x="324" y="286" font-weight="650">0.2672</text>
    </g>
    <text x="220" y="321" font-size="16" fill="#445775">接着过前馈与词表投影</text>
    <g font-size="17" font-weight="650" fill="#2449b6">
      <text x="116" y="365">下一项选 1</text>
      <text x="324" y="365">下一项选 7</text>
    </g>
    <g font-size="15" fill="#445775">
      <text x="116" y="387">最高分约 3.7804</text>
      <text x="324" y="387">最高分约 3.5940</text>
      <text x="220" y="418">两次使用相同参数，分数均取最后一行</text>
    </g>
  </g>
</svg>

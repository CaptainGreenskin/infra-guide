<svg xmlns="http://www.w3.org/2000/svg" width="960" height="684" viewBox="0 0 960 684" role="img" aria-labelledby="title desc">
<title id="title">同一个 Deployment 的期望、观察与实际状态</title>
<desc id="desc">示例期望三副本，第七代已被控制器观察，目前两个副本可用，第三个等待调度。图下方展示观察、计算差异、写入、执行回报的闭环。资源版本与代际承担不同含义。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2357a3"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="960" height="684" rx="15" fill="#f5f8fa" stroke="none" />
<text x="36" y="42" font-size="16" fill="#2357a3" font-weight="600" text-anchor="start">KUBERNETES  /  状态与调谐</text>
<text x="36" y="85" font-size="30" fill="#192d47" font-weight="700" text-anchor="start">同一个 Deployment，有三种状态视图</text>
<text x="36" y="118" font-size="18" fill="#4f637a" font-weight="400" text-anchor="start">三副本报表服务刚更新到第 7 代。下面是可同时出现的一组观测，不是原子快照。</text>
<rect x="36" y="151" width="276" height="178" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<rect x="36" y="151" width="276" height="48" rx="12" fill="#e8f0fc" stroke="none" />
<text x="51" y="182" font-size="20" fill="#2357a3" font-weight="700" text-anchor="start">期望｜API 对象</text>
<text x="51" y="220" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">管理者声明要运行什么</text>
<text x="51" y="251" font-size="17" fill="#192d47" font-weight="650" text-anchor="start">spec.replicas = 3</text>
<text x="51" y="278" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">generation = 7</text>
<text x="51" y="305" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">模板已改为 v2</text>
<rect x="342" y="151" width="276" height="178" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<rect x="342" y="151" width="276" height="48" rx="12" fill="#e2f4ef" stroke="none" />
<text x="357" y="182" font-size="20" fill="#08766e" font-weight="700" text-anchor="start">观察｜控制器回报</text>
<text x="357" y="220" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">Deployment 状态字段</text>
<text x="357" y="251" font-size="17" fill="#192d47" font-weight="650" text-anchor="start">observedGeneration = 7</text>
<text x="357" y="278" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">availableReplicas = 2</text>
<text x="357" y="305" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">已观察新代，仍未全部可用</text>
<rect x="648" y="151" width="276" height="178" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<rect x="648" y="151" width="276" height="48" rx="12" fill="#fff0df" stroke="none" />
<text x="663" y="182" font-size="20" fill="#a34f16" font-weight="700" text-anchor="start">实际｜现场取证</text>
<text x="663" y="220" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">Pod、节点与用户请求</text>
<text x="663" y="251" font-size="17" fill="#192d47" font-weight="650" text-anchor="start">2 个 Pod 已可用</text>
<text x="663" y="278" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">第 3 个 Pod 等待调度</text>
<text x="663" y="305" font-size="17" fill="#192d47" font-weight="400" text-anchor="start">业务质量需再查用户请求</text>
<text x="36" y="375" font-size="22" fill="#192d47" font-weight="700" text-anchor="start">调谐怎样闭环</text>
<rect x="36" y="398" width="186" height="79" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<text x="129" y="430" font-size="19" fill="#192d47" font-weight="670" text-anchor="middle">读当前对象</text>
<text x="129" y="457" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">spec、status、子对象</text>
<path d="M226 438 H263" fill="none" stroke="#2357a3" stroke-width="2" marker-end="url(#arrow)" />
<rect x="270" y="398" width="186" height="79" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<text x="363" y="430" font-size="19" fill="#192d47" font-weight="670" text-anchor="middle">计算差异</text>
<text x="363" y="457" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">需要哪些下游动作？</text>
<path d="M460 438 H497" fill="none" stroke="#2357a3" stroke-width="2" marker-end="url(#arrow)" />
<rect x="504" y="398" width="186" height="79" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<text x="597" y="430" font-size="19" fill="#192d47" font-weight="670" text-anchor="middle">写入 API</text>
<text x="597" y="457" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">例如调整 ReplicaSet</text>
<path d="M694 438 H731" fill="none" stroke="#2357a3" stroke-width="2" marker-end="url(#arrow)" />
<rect x="738" y="398" width="186" height="79" rx="12" fill="#ffffff" stroke="#c9d6e1" />
<text x="831" y="430" font-size="19" fill="#192d47" font-weight="670" text-anchor="middle">执行并回报</text>
<text x="831" y="457" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">绑定、启动与状态更新</text>
<path d="M831 477 V507 H129 V483" fill="none" stroke="#2357a3" stroke-width="2" marker-end="url(#arrow)" />
<text x="480" y="539" font-size="17" fill="#2357a3" font-weight="400" text-anchor="middle">子对象变化、观察事件或重试，触发下一轮核对。</text>
<rect x="36" y="564" width="888" height="90" rx="12" fill="#e8f0fc" stroke="none" />
<text x="54" y="595" font-size="19" fill="#2357a3" font-weight="700" text-anchor="start">resourceVersion</text>
<text x="240" y="595" font-size="18" fill="#192d47" font-weight="400" text-anchor="start">标识存储版本，按原值用于 watch 或并发控制。</text>
<text x="54" y="627" font-size="17" fill="#4f637a" font-weight="400" text-anchor="start">它与期望代际含义不同；跨资源类型不能用它推断发布顺序。</text>
</svg>

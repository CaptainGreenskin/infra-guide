<svg xmlns="http://www.w3.org/2000/svg" width="960" height="735" viewBox="0 0 960 735" role="img" aria-labelledby="title desc"><title id="title">SQS 部分批次失败与可见性超时</title><desc id="desc">标准 SQS 队列的事件源映射收到三个记录。A、C 成功，B 失败。在映射已开启部分响应时，成功记录被删除，B 的可见性到期后可再次投递。</desc>
<rect width="960" height="735" fill="#f6f8f9" rx="14"/>
<text x="32" y="39" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#126d69">SERVERLESS 02  /  批次重试</text>
<text x="32" y="85" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:31px;font-weight:700;fill:#183650">A、B、C 同批到达，本轮为什么只报告 B 失败？</text>
<text x="32" y="120" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#183650">SQS 标准队列；已配置 ReportBatchItemFailures，批窗口为 0，使用自动删除路径。</text>
<rect x="28" y="148" width="904" height="63" rx="7" fill="#e9f0f7" stroke="#bdcfdc"/>
<text x="46" y="187" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#183650">题设：函数超时 10 s，可见性 60 s；t=0 接收，t=4 s 函数正常返回部分响应。</text>
<text x="232" y="252" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#183650">t = 0  接收</text>
<line x1="232" y1="264" x2="232" y2="468" stroke="#bdcfdc" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="528" y="252" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#183650">t = 4 s  返回</text>
<line x1="528" y1="264" x2="528" y2="468" stroke="#bdcfdc" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="813" y="252" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#183650">t = 60 s  到期</text>
<line x1="813" y1="264" x2="813" y2="468" stroke="#bdcfdc" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="44" y="288" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#126d69">本次批次</text>
<text x="52" y="324" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#183650">msg-A</text>
<circle cx="232" cy="318" r="6" fill="#24639a"/>
<line x1="239" y1="318" x2="449" y2="318" stroke="#126d69" stroke-width="2.5"/>
<polygon points="449,318 438.0,323.0 438.0,313.0" fill="#126d69"/>
<text x="528" y="324" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#126d69">成功 → 删除 A</text>
<line x1="610" y1="318" x2="746" y2="318" stroke="#bdcfdc" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="813" y="324" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#126d69">本轮结束</text>
<text x="52" y="385" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#183650">msg-B</text>
<circle cx="232" cy="379" r="6" fill="#24639a"/>
<line x1="239" y1="379" x2="449" y2="379" stroke="#a94d24" stroke-width="2.5"/>
<polygon points="449,379 438.0,384.0 438.0,374.0" fill="#a94d24"/>
<text x="528" y="385" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a94d24">失败 → 报告 B</text>
<line x1="617" y1="379" x2="739" y2="379" stroke="#a94d24" stroke-width="2.5"/>
<polygon points="739,379 728.0,384.0 728.0,374.0" fill="#a94d24"/>
<text x="813" y="385" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a94d24">B 再次可见</text>
<text x="52" y="446" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:20px;font-weight:700;fill:#183650">msg-C</text>
<circle cx="232" cy="440" r="6" fill="#24639a"/>
<line x1="239" y1="440" x2="449" y2="440" stroke="#126d69" stroke-width="2.5"/>
<polygon points="449,440 438.0,445.0 438.0,435.0" fill="#126d69"/>
<text x="528" y="446" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#126d69">成功 → 删除 C</text>
<line x1="610" y1="440" x2="746" y2="440" stroke="#bdcfdc" stroke-width="1.4" stroke-dasharray="5 6"/>
<text x="813" y="446" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#126d69">本轮结束</text>
<rect x="28" y="491" width="904" height="84" rx="7" fill="#ffffff" stroke="#bdcfdc"/>
<text x="46" y="520" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#126d69">handler 返回（msg-B 为示意 messageId）</text>
<text x="46" y="553" text-anchor="start" style="font-family:SFMono-Regular,Consolas,PingFang SC,monospace;font-size:20px;font-weight:400;fill:#183650">{&quot;batchItemFailures&quot;:[{&quot;itemIdentifier&quot;:&quot;msg-B&quot;}]}</text>
<text x="34" y="618" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#183650">到期表示可以再被收到，不表示必在第 60 秒立刻执行。时间轴未按比例绘制。</text>
<text x="34" y="659" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#183650">若回调抛异常，整批算失败。标准队列仍是至少一次投递；按业务操作 ID 防重。</text>
<text x="34" y="700" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#183650">FIFO 有顺序约束，本图不适用其“首错停止、上报失败及未处理项”的规则。</text>
</svg>
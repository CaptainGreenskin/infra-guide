<svg xmlns="http://www.w3.org/2000/svg" width="940" height="388" viewBox="0 0 940 388" role="img" aria-labelledby="title desc">
  <title id="title">同一份四进程探针区分本机通信与两机四卡就绪</title>
  <desc id="desc">四个 rank 分别提交 1 至 4，每个读回排序向量和总和 10。本机两个启动器共享同一内核并使用 CPU Gloo，目标检查拒绝。真机还要求两个内核身份、四张独立可见整卡、匹配 CUDA NCCL 运行时与实际读回，本轮真机未执行。</desc>

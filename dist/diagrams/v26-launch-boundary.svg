<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img"><title>启动参数更干净，不等于创建了安全沙箱</title><desc>实际子进程证明继承权限减少了什么，也证明同用户路径访问仍然存在。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="738" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">启动参数更干净，不等于创建了安全沙箱</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">实际子进程证明继承权限减少了什么，也证明同用户路径访问仍然存在。</text><rect x="36" y="128" width="1048" height="473" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="58" y="171" font-size="24" fill="#315dce" font-weight="700">同一宿主、同一用户权限</text><rect x="60" y="204" width="455" height="158" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="80" y="246" font-size="24" fill="#315dce" font-weight="700">刻意保留继承的反例</text><text x="80" y="292" font-size="22" fill="#17263e" font-weight="400">假环境项：可见</text><text x="80" y="333" font-size="22" fill="#17263e" font-weight="400">假文件FD：可读</text><rect x="603" y="204" width="455" height="158" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="623" y="246" font-size="24" fill="#315dce" font-weight="700">最小启动参数</text><text x="623" y="292" font-size="22" fill="#17263e" font-weight="400">假环境项：不可见</text><text x="623" y="333" font-size="22" fill="#17263e" font-weight="400">非必需FD：不可读</text><path d="M286 374L430 432" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><path d="M831 374L681 432" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="299" y="446" width="520" height="90" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="320" y="483" font-size="25" fill="#b53e3e" font-weight="700">按路径打开同一假文件</text><text x="320" y="520" font-size="24" fill="#b53e3e" font-weight="700">两种子进程都能读取</text><text x="58" y="575" font-size="21" fill="#17263e" font-weight="400">关FD、减环境是启动卫生；它们没有改变用户、挂载视图或网络能力。</text><text x="38" y="651" font-size="23" fill="#315dce" font-weight="700">真实隔离还要控制：身份 / 文件与挂载 / 系统调用 / 资源 / 网络 / 生命周期。</text><text x="38" y="704" font-size="18" fill="#56667d" font-weight="400">本例只用合成canary。Python本来默认关闭继承；反例显式设置可继承与close_fds=False。</text></g></svg>

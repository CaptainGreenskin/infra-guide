<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" role="img" aria-labelledby="title desc">
<title id="title">三副本 Deployment 的滚动更新格点</title>
<desc id="desc">四个快照展示旧版和新版 Pod 的可用状态。最大额外数向上取整为一，最大不可用数向下取整为零。t2 有两个旧版可用、一个新版可用、一个新版启动中；若另一个旧版仍在终止，总对象可达五。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2357a3"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="960" height="692" rx="15" fill="#f5f8fa" stroke="none" />
<text x="36" y="42" font-size="16" fill="#2357a3" font-weight="600" text-anchor="start">KUBERNETES  /  滚动更新</text>
<text x="36" y="85" font-size="30" fill="#192d47" font-weight="700" text-anchor="start">三副本发布，先加一格再退一格</text>
<text x="36" y="118" font-size="18" fill="#4f637a" font-weight="400" text-anchor="start">假设初始 3 个旧副本均可用，资源充足、无额外故障。t0–t3 是选取的快照，并非固定时限。</text>
<rect x="36" y="145" width="888" height="68" rx="12" fill="#e8f0fc" stroke="none" />
<text x="54" y="174" font-size="20" fill="#2357a3" font-weight="650" text-anchor="start">surge：ceil(3 × 25%) = 1</text>
<text x="494" y="174" font-size="20" fill="#08766e" font-weight="650" text-anchor="start">unavailable：floor(3 × 25%) = 0</text>
<text x="54" y="200" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">更新时可增加 1 个，计划中不主动牺牲 3 个可用副本；故障仍可能导致实际可用数下降。</text>
<text x="36" y="317" font-size="19" fill="#2357a3" font-weight="700" text-anchor="start">旧版本</text>
<text x="36" y="388" font-size="19" fill="#08766e" font-weight="700" text-anchor="start">新版本</text>
<text x="36" y="454" font-size="17" fill="#192d47" font-weight="600" text-anchor="start">未终止 / 可用</text>
<text x="265" y="251" font-size="22" fill="#192d47" font-weight="700" text-anchor="middle">t0</text>
<text x="265" y="278" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">更新之前</text>
<path d="M355 231 V469" fill="none" stroke="#c9d6e1" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="207" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="228.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O1</text>
<rect x="254" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="275.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O2</text>
<rect x="301" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="322.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O3</text>
<text x="265" y="395" font-size="20" fill="#4f637a" font-weight="400" text-anchor="middle">—</text>
<text x="265" y="455" font-size="21" fill="#192d47" font-weight="700" text-anchor="middle">3 / 3</text>
<text x="449" y="251" font-size="22" fill="#192d47" font-weight="700" text-anchor="middle">t1</text>
<text x="449" y="278" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">首个新 Pod 启动</text>
<path d="M539 231 V469" fill="none" stroke="#c9d6e1" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="391" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="412.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O1</text>
<rect x="438" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="459.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O2</text>
<rect x="485" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="506.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O3</text>
<rect x="391" y="366" width="43" height="41" rx="7" fill="#ffffff" stroke="#08766e" stroke-dasharray="5 3" stroke-width="2"/><text x="412.5" y="393" font-size="16" fill="#08766e" font-weight="650" text-anchor="middle">N1</text>
<text x="449" y="455" font-size="21" fill="#192d47" font-weight="700" text-anchor="middle">4 / 3</text>
<text x="633" y="251" font-size="22" fill="#192d47" font-weight="700" text-anchor="middle">t2</text>
<text x="633" y="278" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">已有一个新 Pod 可用</text>
<path d="M723 231 V469" fill="none" stroke="#c9d6e1" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="575" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="596.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O1</text>
<rect x="622" y="295" width="43" height="41" rx="7" fill="#2357a3" stroke="none" /><text x="643.5" y="322" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">O2</text>
<rect x="575" y="366" width="43" height="41" rx="7" fill="#08766e" stroke="none" /><text x="596.5" y="393" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">N1</text>
<rect x="622" y="366" width="43" height="41" rx="7" fill="#ffffff" stroke="#08766e" stroke-dasharray="5 3" stroke-width="2"/><text x="643.5" y="393" font-size="16" fill="#08766e" font-weight="650" text-anchor="middle">N2</text>
<text x="633" y="455" font-size="21" fill="#192d47" font-weight="700" text-anchor="middle">4 / 3</text>
<text x="817" y="251" font-size="22" fill="#192d47" font-weight="700" text-anchor="middle">t3</text>
<text x="817" y="278" font-size="16" fill="#4f637a" font-weight="400" text-anchor="middle">后续换批完成</text>
<text x="817" y="324" font-size="20" fill="#4f637a" font-weight="400" text-anchor="middle">—</text>
<rect x="759" y="366" width="43" height="41" rx="7" fill="#08766e" stroke="none" /><text x="780.5" y="393" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">N1</text>
<rect x="806" y="366" width="43" height="41" rx="7" fill="#08766e" stroke="none" /><text x="827.5" y="393" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">N2</text>
<rect x="853" y="366" width="43" height="41" rx="7" fill="#08766e" stroke="none" /><text x="874.5" y="393" font-size="16" fill="#ffffff" font-weight="650" text-anchor="middle">N3</text>
<text x="817" y="455" font-size="21" fill="#192d47" font-weight="700" text-anchor="middle">3 / 3</text>
<path d="M36 479 H924" fill="none" stroke="#c9d6e1" stroke-width="2" />
<text x="36" y="509" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">每格 = 1 个 Pod。实色＝已可用；虚框＝启动中、尚未可用。</text>
<rect x="36" y="533" width="888" height="131" rx="12" fill="#fff0df" stroke="none" />
<text x="54" y="566" font-size="21" fill="#a34f16" font-weight="700" text-anchor="start">另计：正在终止的旧 Pod</text>
<rect x="56" y="583" width="47" height="38" rx="7" fill="#ffffff" stroke="#a34f16" stroke-dasharray="5 3" stroke-width="2"/>
<text x="79" y="609" font-size="16" fill="#a34f16" font-weight="650" text-anchor="middle">O3</text>
<text x="120" y="607" font-size="18" fill="#192d47" font-weight="400" text-anchor="start">t2 若 O3 仍在宽限期，4 个未终止 Pod 加 1 个终止中对象，共 5 个。</text>
<text x="55" y="642" font-size="16" fill="#4f637a" font-weight="400" text-anchor="start">终止中的 Pod 可能继续消耗节点资源。replicas + maxSurge 不是实际对象数或资源的硬上限。</text>
</svg>

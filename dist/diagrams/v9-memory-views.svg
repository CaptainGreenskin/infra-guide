<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif"><title id="title">同一份内存，三个观察范围</title><desc id="desc">上半部说明地址范围与触页。下半部是独立算例，比较两个进程共享页时的 RSS、PSS 与 cgroup 记账边界。</desc><rect x="0" y="0" width="960" height="640" rx="14" fill="#f6f8fc" stroke="#f6f8fc" /><text x="32" y="33" fill="#315dce" font-size="12" font-weight="650">INFRAGUIDE  /  CLOUD FOUNDATIONS</text><text x="32" y="76" fill="#203553" font-size="27" font-weight="700">同一份内存，三个观察范围</text><text x="32" y="109" fill="#526780" font-size="17" font-weight="400">把单位、所有者和统计范围一起写下来，再比较数值。</text><rect x="32" y="139" width="896" height="164" rx="10" fill="#ffffff" stroke="#d1dce9" /><text x="52" y="170" fill="#315dce" font-size="18" font-weight="650">① 地址映射与触页</text><text x="52" y="199" fill="#203553" font-size="16" font-weight="400">预留 64 MiB 的匿名映射。以下每格表示 4 MiB 所覆盖的页范围。</text><rect x="54" y="222" width="48" height="31" rx="4" fill="#537adb" stroke="#b8c8de" /><rect x="108" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="162" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="216" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="270" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="324" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="378" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="432" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="486" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="540" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="594" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="648" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="702" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="756" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="810" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><rect x="864" y="222" width="48" height="31" rx="4" fill="#eef2f7" stroke="#b8c8de" /><text x="52" y="281" fill="#526780" font-size="16" font-weight="400">蓝色区间的每个虚拟页都被写过，覆盖 4 MiB。余下 60 MiB 尚未访问。</text><rect x="32" y="326" width="515" height="231" rx="10" fill="#ffffff" stroke="#d1dce9" /><text x="52" y="358" fill="#24766c" font-size="18" font-weight="650">② 两进程的驻留页</text><text x="52" y="387" fill="#526780" font-size="15" font-weight="400">独立算例，简化到三个互不重叠的物理区间。</text><rect x="52" y="406" width="153" height="38" rx="3" fill="#d1ebe7" stroke="#ffffff" /><text x="64" y="431" fill="#203553" font-size="16" font-weight="550">甲私有 30 MiB</text><rect x="205" y="406" width="150" height="38" rx="3" fill="#d9e4ff" stroke="#ffffff" /><text x="217" y="431" fill="#203553" font-size="16" font-weight="550">共同 20 MiB</text><rect x="355" y="406" width="170" height="38" rx="3" fill="#d1ebe7" stroke="#ffffff" /><text x="367" y="431" fill="#203553" font-size="16" font-weight="550">乙私有 30 MiB</text><text x="52" y="475" fill="#203553" font-size="16" font-weight="400">每个进程 RSS = 30 + 20 = 50 MiB。</text><text x="52" y="504" fill="#203553" font-size="16" font-weight="400">每个进程 PSS = 30 + 20÷2 = 40 MiB。</text><text x="52" y="534" fill="#24766c" font-size="16" font-weight="600">实际数据页合计 80 MiB。</text><rect x="567" y="326" width="361" height="231" rx="10" fill="#ffffff" stroke="#d1dce9" /><text x="587" y="358" fill="#315dce" font-size="18" font-weight="650">③ cgroup 的总账</text><text x="587" y="397" fill="#203553" font-size="16" font-weight="400">观察该组及子组被计入的用量。</text><text x="587" y="429" fill="#203553" font-size="16" font-weight="400">匿名页、文件缓存、内核开销等</text><text x="587" y="456" fill="#203553" font-size="16" font-weight="400">都可能影响 memory.current。</text><text x="587" y="501" fill="#203553" font-size="16" font-weight="400">两个进程的 RSS 相加，得不到</text><text x="587" y="528" fill="#203553" font-size="16" font-weight="400">这个组的实际总账。</text><text x="32" y="605" fill="#526780" font-size="15" font-weight="400">普通 Linux / cgroup v2 教学示意。两组数字是不同算例，非系统实测。</text></svg>
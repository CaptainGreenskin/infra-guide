<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img"><title>相同25题：别只对比72%和80%</title><desc>同一道题必须配对；边际区间是否重叠，不能替代成对检验。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="728" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">相同25题：别只对比72%和80%</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">同一道题必须配对；边际区间是否重叠，不能替代成对检验。</text><text x="383" y="132" font-size="25" fill="#315dce" font-weight="700">B通过</text><text x="753" y="132" font-size="25" fill="#315dce" font-weight="700">B失败</text><text x="40" y="228" font-size="25" fill="#315dce" font-weight="700">A通过</text><text x="40" y="365" font-size="25" fill="#315dce" font-weight="700">A失败</text><rect x="270" y="159" width="328" height="112" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="293" y="207" font-size="38" fill="#315dce" font-weight="700">16</text><text x="357" y="207" font-size="23" fill="#17263e" font-weight="400">两者都通过</text><rect x="640" y="159" width="328" height="112" rx="10" fill="#fff1e6" stroke="#ccd8e8"/><text x="663" y="207" font-size="38" fill="#315dce" font-weight="700">2</text><text x="727" y="207" font-size="23" fill="#17263e" font-weight="400">仅A通过</text><rect x="270" y="296" width="328" height="112" rx="10" fill="#edf2ff" stroke="#ccd8e8"/><text x="293" y="344" font-size="38" fill="#315dce" font-weight="700">4</text><text x="357" y="344" font-size="23" fill="#17263e" font-weight="400">仅B通过</text><rect x="640" y="296" width="328" height="112" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="663" y="344" font-size="38" fill="#315dce" font-weight="700">3</text><text x="727" y="344" font-size="23" fill="#17263e" font-weight="400">两者都失败</text><text x="38" y="469" font-size="25" fill="#315dce" font-weight="700">A=18/25=72%；B=20/25=80%；差8个百分点。</text><text x="38" y="516" font-size="24" fill="#17263e" font-weight="400">成对信息在2与4这两格：6个变化中，B方向占4个。</text><text x="38" y="563" font-size="24" fill="#17263e" font-weight="400">双侧精确二项检验：2×(1+6+15)/64 = 0.6875。</text><text x="38" y="616" font-size="23" fill="#b53e3e" font-weight="700">尚不足以据此宣布普遍改进；p大也不证明两版本等价。</text><text x="38" y="685" font-size="18" fill="#56667d" font-weight="400">固定CSV标签，不是模型运行。独立题对与零假设下方向可交换，是此示例的统计条件。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="765" viewBox="0 0 960 765" role="img" aria-labelledby="title desc"><title id="title">给定两段完成能力后的积压增长与清空</title><desc id="desc">到达恒定每秒一百次，前十秒完成能力每秒八十次，之后每秒一百二十次。积压从零增长到二百，再于二十秒清空；之后实际完成仅每秒一百次。</desc>
<rect width="960" height="765" rx="14" fill="#f6f8fa"/>
<text x="32" y="38" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#146e69">CAPACITY 02  /  队列账本</text>
<text x="32" y="83" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:30px;font-weight:700;fill:#19364d">扩容后还有积压，要多久才能清空？</text>
<text x="32" y="120" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">流体近似：初始积压 0，全部接纳，无取消、重试或丢弃；“10 秒生效”仅为题设。</text>
<text x="32" y="169" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#146e69">速率 / 次每秒</text>
<text x="118" y="208" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">120</text>
<line x1="148" x2="877" y1="202" y2="202" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<text x="118" y="254" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">100</text>
<line x1="148" x2="877" y1="248" y2="248" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<text x="118" y="300" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">80</text>
<line x1="148" x2="877" y1="294" y2="294" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<line x1="148" x2="877" y1="248" y2="248" stroke="#285e9c" stroke-width="3" stroke-dasharray="9 5"/>
<text x="308" y="241" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#285e9c">到达 100</text>
<line x1="148" x2="451.75" y1="294" y2="294" stroke="#146e69" stroke-width="4"/>
<line x1="451.75" x2="451.75" y1="294" y2="202" stroke="#146e69" stroke-width="4"/>
<line x1="451.75" x2="877" y1="202" y2="202" stroke="#146e69" stroke-width="4"/>
<text x="158" y="321" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#146e69">完成能力 80</text>
<text x="466.75" y="195" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#146e69">完成能力 120</text>
<line x1="148.0" x2="148.0" y1="327" y2="591" stroke="#bdcedb" stroke-width="1.3" stroke-dasharray="5 6"/>
<line x1="451.75" x2="451.75" y1="327" y2="591" stroke="#bdcedb" stroke-width="1.3" stroke-dasharray="5 6"/>
<line x1="755.5" x2="755.5" y1="327" y2="591" stroke="#bdcedb" stroke-width="1.3" stroke-dasharray="5 6"/>
<line x1="877.0" x2="877.0" y1="327" y2="591" stroke="#bdcedb" stroke-width="1.3" stroke-dasharray="5 6"/>
<text x="32" y="370" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a84d21">积压 / 个</text>
<text x="118" y="588.0" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">0</text>
<line x1="148" x2="877" y1="581.0" y2="581.0" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<text x="118" y="495.5" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">100</text>
<line x1="148" x2="877" y1="488.5" y2="488.5" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<text x="118" y="403.0" text-anchor="end" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">200</text>
<line x1="148" x2="877" y1="396.0" y2="396.0" stroke="#bdcedb" stroke-width="1" stroke-dasharray="4 6"/>
<path d="M148,581 L451.75,396 L755.5,581 Z" fill="#f8e8db"/>
<line x1="148" x2="451.75" y1="581" y2="396" stroke="#a84d21" stroke-width="4"/>
<line x1="451.75" x2="755.5" y1="396" y2="581" stroke="#a84d21" stroke-width="4"/>
<line x1="755.5" x2="877" y1="581" y2="581" stroke="#a84d21" stroke-width="3"/>
<circle cx="148.0" cy="581.0" r="4" fill="#a84d21"/>
<circle cx="451.75" cy="396.0" r="4" fill="#a84d21"/>
<circle cx="755.5" cy="581.0" r="4" fill="#a84d21"/>
<circle cx="877.0" cy="581.0" r="4" fill="#a84d21"/>
<text x="463.75" y="386" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a84d21">(10 s，200)</text>
<text x="747.5" y="561" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:700;fill:#a84d21">(20 s，0)</text>
<text x="148.0" y="615" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">0 s</text>
<text x="451.75" y="615" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">10 s</text>
<text x="755.5" y="615" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">20 s</text>
<text x="877.0" y="615" text-anchor="middle" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">24 s</text>
<rect x="28" y="644" width="904" height="89" rx="8" fill="#ffffff" stroke="#bdcedb"/>
<text x="46" y="678" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">0–10 s：每秒净增 20；10–20 s：每秒净减 20；20 s 后：有余量，积压保持 0。</text>
<text x="46" y="711" text-anchor="start" style="font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:18px;font-weight:400;fill:#19364d">空队列时实际完成率回到 100/s。曲线没有模拟 HPA 采样、Pod 启动或就绪时限。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="712" viewBox="0 0 1120 712" role="img"><title>样本打包：EOS、注意力、位置和标签不是同一件事</title><desc>图中橙色是错误对照会额外读到的位置；正确文档内因果mask应将其屏蔽。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="710" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">样本打包：EOS、注意力、位置和标签不是同一件事</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">图中橙色是错误对照会额外读到的位置；正确文档内因果mask应将其屏蔽。</text><text x="38" y="135" font-size="20" fill="#315dce" font-weight="700">查询行 / 可见列</text><text x="218" y="173" font-size="17" fill="#56667d" font-weight="400">A0</text><text x="46" y="217" font-size="19" fill="#17263e" font-weight="400">A0</text><rect x="199" y="188" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="229" y="223" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="290" y="188" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="320" y="223" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="381" y="188" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="411" y="223" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="472" y="188" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="502" y="223" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="563" y="188" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="593" y="223" font-size="22" fill="#56667d" font-weight="400">·</text><text x="309" y="173" font-size="17" fill="#56667d" font-weight="400">A1</text><text x="46" y="283" font-size="19" fill="#17263e" font-weight="400">A1</text><rect x="199" y="254" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="229" y="289" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="290" y="254" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="320" y="289" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="381" y="254" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="411" y="289" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="472" y="254" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="502" y="289" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="563" y="254" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="593" y="289" font-size="22" fill="#56667d" font-weight="400">·</text><text x="400" y="173" font-size="17" fill="#56667d" font-weight="400">A_EOS</text><text x="46" y="349" font-size="19" fill="#17263e" font-weight="400">A_EOS</text><rect x="199" y="320" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="229" y="355" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="290" y="320" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="320" y="355" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="381" y="320" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="411" y="355" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="472" y="320" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="502" y="355" font-size="22" fill="#56667d" font-weight="400">·</text><rect x="563" y="320" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="593" y="355" font-size="22" fill="#56667d" font-weight="400">·</text><text x="491" y="173" font-size="17" fill="#56667d" font-weight="400">B0</text><text x="46" y="415" font-size="19" fill="#17263e" font-weight="400">B0</text><rect x="199" y="386" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="229" y="421" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="290" y="386" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="320" y="421" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="381" y="386" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="411" y="421" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="472" y="386" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="502" y="421" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="563" y="386" width="77" height="55" rx="5" fill="#fff" stroke="#cdd9e9"/><text x="593" y="421" font-size="22" fill="#56667d" font-weight="400">·</text><text x="582" y="173" font-size="17" fill="#56667d" font-weight="400">B_EOS</text><text x="46" y="481" font-size="19" fill="#17263e" font-weight="400">B_EOS</text><rect x="199" y="452" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="229" y="487" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="290" y="452" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="320" y="487" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="381" y="452" width="77" height="55" rx="5" fill="#fff1e6" stroke="#cdd9e9"/><text x="411" y="487" font-size="22" fill="#b53e3e" font-weight="400">×</text><rect x="472" y="452" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="502" y="487" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="563" y="452" width="77" height="55" rx="5" fill="#e4eee9" stroke="#cdd9e9"/><text x="593" y="487" font-size="22" fill="#12725b" font-weight="400">✓</text><rect x="714" y="147" width="370" height="205" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="735" y="185" font-size="23" fill="#315dce" font-weight="700">三种边界分别声明</text><text x="735" y="225" font-size="19" fill="#17263e" font-weight="400">注意力：因果 + 文档相同</text><text x="735" y="263" font-size="19" fill="#17263e" font-weight="400">位置：按本例契约每文档归零</text><text x="735" y="301" font-size="19" fill="#17263e" font-weight="400">标签：跨文档预测位置忽略</text><text x="735" y="334" font-size="18" fill="#b53e3e" font-weight="400">EOS只是词元，不会自动设边界。</text><rect x="714" y="382" width="370" height="138" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="735" y="420" font-size="21" fill="#17263e" font-weight="700">颜色说明</text><text x="735" y="458" font-size="19" fill="#12725b" font-weight="400">绿色：同文档已出现位置</text><text x="735" y="493" font-size="18" fill="#b53e3e" font-weight="400">橙色：普通因果mask的跨文档可见</text><rect x="36" y="560" width="1048" height="117" rx="12" fill="#edf2ff" stroke="#b5c8fa"/><text x="58" y="596" font-size="22" fill="#315dce" font-weight="700">A0 → A1    A1 → A_EOS    A_EOS → 忽略    B0 → B_EOS</text><text x="58" y="635" font-size="20" fill="#17263e" font-weight="400">本例有效目标3个；直接拼接会多出A_EOS预测B0，任务已改变。</text><text x="58" y="663" font-size="18" fill="#56667d" font-weight="400">标准库固定向量验证：正确打包与独立计算相同；未实现分词器、RoPE或模型训练。</text></g></svg>

<text x="36" y="48" font-size="28" fill="#1f3047" font-weight="700">同一份报表：先建立身份，再判断读取资格</text><text x="36" y="83" font-size="18" fill="#617187" font-weight="400">正常路径的每一层都对应本次原生 API 调用与实际读取的 37。</text>
<rect x="36" y="119" width="310" height="111" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="55" y="155" font-size="23" fill="#28384d" font-weight="700">ServiceAccount</text><text x="55" y="190" font-size="21" fill="#28384d" font-weight="400">report-a / report-reader</text><text x="55" y="218" font-size="18" fill="#617187" font-weight="400">命名的主体，不是凭证本身</text><path d="M354 174 L394 174" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="406" y="119" width="310" height="111" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="426" y="155" font-size="23" fill="#28384d" font-weight="700">TokenRequest</text><text x="426" y="190" font-size="21" fill="#28384d" font-weight="400">audience = 本集群 API</text><text x="426" y="218" font-size="18" fill="#617187" font-weight="400">申请有期限的 Bearer token</text><path d="M724 174 L764 174" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="776" y="119" width="308" height="111" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="797" y="155" font-size="23" fill="#28384d" font-weight="700">签名的短期凭证</text><text x="797" y="190" font-size="21" fill="#28384d" font-weight="400">sub / aud / exp</text><text x="797" y="218" font-size="18" fill="#617187" font-weight="400">声明要由接收方验证</text><text x="36" y="287" font-size="22" fill="#315dce" font-weight="700">GET /api/v1/namespaces/report-a/configmaps/reports-v1</text><rect x="36" y="320" width="238" height="133" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="52" y="357" font-size="22" fill="#28384d" font-weight="700">① HTTPS</text><text x="52" y="395" font-size="19" fill="#28384d" font-weight="400">CA 验证服务器</text><text x="52" y="429" font-size="18" fill="#28384d" font-weight="400">Bearer 携带凭证</text><path d="M278 386 L298 386" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="306" y="320" width="238" height="133" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="322" y="357" font-size="22" fill="#28384d" font-weight="700">② 认证</text><text x="322" y="395" font-size="19" fill="#28384d" font-weight="400">签名、受众、有效期</text><text x="322" y="429" font-size="18" fill="#28384d" font-weight="400">确定 report-reader</text><path d="M548 386 L568 386" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="576" y="320" width="238" height="133" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="592" y="357" font-size="22" fill="#28384d" font-weight="700">③ RBAC 授权</text><text x="592" y="395" font-size="19" fill="#28384d" font-weight="400">绑定 → Role 规则</text><text x="592" y="429" font-size="18" fill="#28384d" font-weight="400">get + 对象 + namespace</text><path d="M818 386 L838 386" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="846" y="320" width="238" height="133" rx="12" fill="#eaf4ed" stroke="#cbd7e8"/><text x="862" y="357" font-size="22" fill="#28384d" font-weight="700">④ 读取对象</text><text x="862" y="395" font-size="19" fill="#28384d" font-weight="400">reports-v1</text><text x="862" y="429" font-size="18" fill="#28384d" font-weight="400">200 / value = 37</text><text x="36" y="498" font-size="20" fill="#28384d" font-weight="400">SelfSubjectReview 实际主体：system:serviceaccount:report-a:report-reader</text><text x="36" y="533" font-size="18" fill="#617187" font-weight="400">管理员只建立夹具和读取 oracle；上面的业务请求不加载管理员客户端证书。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img"><title>配置快照：一次切换，不等于多次读取属于同一版</title><desc>先理解文件、内存对象和请求各持有什么，再设计热加载。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="728" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">配置快照：一次切换，不等于多次读取属于同一版</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">先理解文件、内存对象和请求各持有什么，再设计热加载。</text><text x="38" y="132" font-size="22" fill="#315dce" font-weight="700">两份真正发布过的配置</text><rect x="36" y="155" width="500" height="91" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="56" y="191" font-size="25" fill="#315dce" font-weight="700">v1</text><text x="56" y="227" font-size="24" fill="#17263e" font-weight="400">pool=4 / timeout_ms=100</text><rect x="584" y="155" width="500" height="91" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="604" y="191" font-size="25" fill="#315dce" font-weight="700">v2</text><text x="604" y="227" font-size="24" fill="#17263e" font-weight="400">pool=6 / timeout_ms=50</text><rect x="36" y="287" width="1048" height="113" rx="10" fill="#f9ecec" stroke="#ccd8e8"/><text x="58" y="324" font-size="24" fill="#b53e3e" font-weight="700">错误读取：先读pool，再换路径，再读timeout_ms</text><text x="58" y="370" font-size="25" fill="#b53e3e" font-weight="700">得到4 / 50：这组参数从未作为一个版本发布。</text><rect x="36" y="438" width="500" height="145" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="476" font-size="24" fill="#12725b" font-weight="700">完整读取 + 校验 + 发布引用</text><text x="58" y="520" font-size="24" fill="#17263e" font-weight="400">新请求拿到完整v2：6 / 50</text><text x="58" y="559" font-size="22" fill="#17263e" font-weight="400">在途请求仍持有完整v1：4 / 100</text><rect x="584" y="438" width="500" height="145" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="606" y="476" font-size="23" fill="#315dce" font-weight="700">路径与已打开文件不是同一事实</text><text x="606" y="520" font-size="22" fill="#17263e" font-weight="400">旧FD读到v1；重新打开路径读到v2</text><text x="606" y="559" font-size="22" fill="#17263e" font-weight="400">文件已更新，内存仍需主动重载。</text><text x="38" y="634" font-size="23" fill="#315dce" font-weight="700">候选失败：保留v2，不发布半份对象。回退旧业务值：发布新代际7。</text><text x="38" y="686" font-size="18" fill="#56667d" font-weight="400">实际POSIX文件/进程夹具；不是Kubernetes投射实现。两份版本目录在实验内保留。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="486" viewBox="0 0 440 486" role="img" aria-labelledby="title desc">
  <title id="title">同名工具换版后，旧批准走到哪里</title>
  <desc id="desc">收到目录变化通知后，沿用 v1 参数的宿主会在 v2 误写共享区。重新发现的宿主先拦住旧批准，接收端也拒绝带旧摘要的请求。重新确认后只写一行。</desc>
  <metadata>{"before":"archive","after":"shared","amount":42,"unsafe_writes":1,"guarded_old_writes":0,"guarded_confirmed_writes":1}</metadata>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="438" height="484" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="system-ui, sans-serif" fill="#172554">
    <text x="22" y="34" font-size="19" font-weight="700">同名工具换版后，旧批准走到哪里</text>
    <rect x="22" y="56" width="396" height="82" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="37" y="83" font-size="16" font-weight="700">v1 · 发现 publish_report</text>
    <text x="37" y="109" font-size="15">旧批准只填 report-A，默认写归档区 archive</text>
    <path d="M220 140v24" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="22" y="171" width="396" height="78" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="37" y="197" font-size="16" font-weight="700">v2 · 服务端发出 tools/list_changed</text>
    <text x="37" y="223" font-size="15">工具名与必填项照旧，默认目的地改为 shared</text>
    <path d="M220 251v12H116v17M220 263h104v17" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="22" y="287" width="188" height="155" rx="10" fill="#fff1f2" stroke="#fda4af"/>
    <rect x="230" y="287" width="188" height="155" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="37" y="315" font-size="15" font-weight="700" fill="#9f1239">沿用旧批准</text>
    <text x="37" y="344" font-size="14">旧参数仍能过结构检查</text>
    <text x="37" y="371" font-size="14">服务端执行 v2 默认值</text>
    <text x="37" y="415" font-size="15" font-weight="700" fill="#9f1239">共享区写入 42</text>
    <text x="245" y="315" font-size="15" font-weight="700" fill="#065f46">重读目录并核对摘要</text>
    <text x="245" y="343" font-size="14">旧批准无派发</text>
    <text x="245" y="367" font-size="14">旧摘要直发被接收方拒绝</text>
    <text x="245" y="391" font-size="14">确认 shared 再提交</text>
    <text x="245" y="415" font-size="15" font-weight="700" fill="#065f46">共享区写入 42 一次</text>
    <text x="22" y="468" font-size="13" fill="#475569">本机 MCP stdio · 两个独立 SQLite 接收账本</text>
  </g>
</svg>

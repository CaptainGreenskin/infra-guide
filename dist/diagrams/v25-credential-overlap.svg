<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img"><title>轮换顺序：新凭据可用，旧客户端退出，再撤销</title><desc>源文件更新、客户端缓存、服务端接受版本和既有会话分别验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="728" rx="10" fill="#f7f9fd" stroke="#ccd8e8"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">轮换顺序：新凭据可用，旧客户端退出，再撤销</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">源文件更新、客户端缓存、服务端接受版本和既有会话分别验证。</text><rect x="36" y="130" width="1048" height="94" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="167" font-size="23" fill="#315dce" font-weight="700">① 启用新凭据</text><text x="342" y="167" font-size="22" fill="#17263e" font-weight="400">服务端接受v1、v2</text><text x="342" y="205" font-size="22" fill="#17263e" font-weight="400">旧客户端仍用v1</text><path d="M178 228L178 246" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="250" width="1048" height="94" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="287" font-size="23" fill="#315dce" font-weight="700">② 探测并切换</text><text x="342" y="287" font-size="22" fill="#17263e" font-weight="400">v2新认证200</text><text x="342" y="325" font-size="22" fill="#17263e" font-weight="400">客户端重载后用v2</text><path d="M178 348L178 366" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="370" width="1048" height="94" rx="10" fill="#fff" stroke="#ccd8e8"/><text x="58" y="407" font-size="23" fill="#315dce" font-weight="700">③ 撤销旧凭据</text><text x="342" y="407" font-size="22" fill="#17263e" font-weight="400">v1新认证401 / v2仍200</text><text x="342" y="445" font-size="22" fill="#17263e" font-weight="400">旧会话在本协议下仍200</text><path d="M178 468L178 486" fill="none" stroke="#315dce" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="490" width="1048" height="94" rx="10" fill="#edf6f3" stroke="#ccd8e8"/><text x="58" y="527" font-size="23" fill="#315dce" font-weight="700">④ 独立处理旧会话</text><text x="342" y="527" font-size="22" fill="#17263e" font-weight="400">撤销该会话后401</text><text x="342" y="565" font-size="22" fill="#17263e" font-weight="400">按服务协议核对退出条件</text><text x="38" y="647" font-size="23" fill="#b53e3e" font-weight="700">反例：先撤v1，客户端还没重载 → 401；重载v2后才恢复200。</text><text x="38" y="693" font-size="18" fill="#56667d" font-weight="400">本机HTTP实测。会话与签发凭据独立撤销是此夹具协议，不能推广到所有身份服务。</text></g></svg>

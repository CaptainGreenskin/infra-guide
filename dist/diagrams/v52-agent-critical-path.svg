<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc"><title id="title">读父子关系之后，还要读时间重叠与等待</title><desc id="desc">下一阶段要等A和B都完成；先找汇合点，再算用户总等待。</desc><metadata>{&quot;kind&quot;: &quot;parallel_timeline&quot;, &quot;measured&quot;: false, &quot;intervals&quot;: [[0, 50], [50, 350], [50, 450], [450, 480], [480, 780], [780, 850], [850, 880], [880, 940], [940, 1000]], &quot;elapsed_ms&quot;: 1000, &quot;sum_child_ms&quot;: 1300, &quot;parallel_overlap_ms&quot;: 300}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="838" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">读父子关系之后，还要读时间重叠与等待</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">下一阶段要等A和B都完成；先找汇合点，再算用户总等待。</text><text x="38" y="177" font-size="21" fill="#17263e" font-weight="400">根任务</text><rect x="170.0" y="146" width="890.0" height="44" rx="5" fill="#dbe6ff"/><text x="184.0" y="176" font-size="20" fill="#17263e" font-weight="400">0—1000ms</text><text x="38" y="253" font-size="21" fill="#17263e" font-weight="400">身份</text><rect x="170.0" y="222" width="44.5" height="44" rx="5" fill="#cad5eb"/><text x="38" y="329" font-size="21" fill="#17263e" font-weight="400">查询A</text><rect x="214.5" y="298" width="267.0" height="44" rx="5" fill="#9ccab9"/><text x="228.5" y="328" font-size="20" fill="#17263e" font-weight="400">50—350ms</text><text x="38" y="405" font-size="21" fill="#17263e" font-weight="400">查询B</text><rect x="214.5" y="374" width="356.0" height="44" rx="5" fill="#5a9b83"/><text x="228.5" y="404" font-size="20" fill="#17263e" font-weight="400">50—450ms</text><text x="38" y="481" font-size="21" fill="#17263e" font-weight="400">汇合后续</text><rect x="570.5" y="450" width="489.5" height="44" rx="5" fill="#d8b16d"/><text x="584.5" y="480" font-size="20" fill="#17263e" font-weight="400">450—1000ms</text><path d="M170.0 130L170.0 512" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="4 5"/><text x="158.0" y="543" font-size="18" fill="#56667d" font-weight="400">0</text><path d="M214.5 130L214.5 512" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="4 5"/><text x="202.5" y="567" font-size="18" fill="#56667d" font-weight="400">50</text><path d="M481.5 130L481.5 512" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="4 5"/><text x="469.5" y="543" font-size="18" fill="#56667d" font-weight="400">350</text><path d="M570.5 130L570.5 512" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="4 5"/><text x="558.5" y="543" font-size="18" fill="#56667d" font-weight="400">450</text><path d="M1060.0 130L1060.0 512" fill="none" stroke="#cdd9e9" stroke-width="2" stroke-dasharray="4 5"/><text x="1048.0" y="543" font-size="18" fill="#56667d" font-weight="400">1000</text><text x="1005" y="581" font-size="18" fill="#56667d" font-weight="400">毫秒</text><rect x="36" y="608" width="1048" height="112" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="58" y="646" font-size="22" fill="#315dce" font-weight="700">50 + max(300,400) + 30 + 300 + 70 + 30 + 60 + 60 = 1000ms</text><text x="58" y="688" font-size="21" fill="#17263e" font-weight="400">逐段相加会得到1300ms，重复计算两条查询重叠的300ms。</text><text x="38" y="763" font-size="20" fill="#17263e" font-weight="400">只缩短查询A：仍等B；B从400ms减到300ms：本题后续才能提前100ms。</text><text x="38" y="804" font-size="18" fill="#56667d" font-weight="400">后续550ms为装配、模型、首次发布、等待、重试和验收。独立教学输入，不是HTTP实测。</text></g></svg>

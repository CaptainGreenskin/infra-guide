<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="713" viewBox="0 0 1120 713" role="img"><title>样本分对了，训练步数也可能不一样</title><desc>Sampler分给rank，DataLoader组批；IterableDataset还要显式分给每个worker。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="711" rx="16" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="49" font-size="28" fill="#17263e" font-weight="700">样本分对了，训练步数也可能不一样</text><text x="36" y="85" font-size="19" fill="#56667d" font-weight="400">Sampler分给rank，DataLoader组批；IterableDataset还要显式分给每个worker。</text><text x="38" y="135" font-size="22" fill="#315dce" font-weight="700">Map-style：11个样本 / 2个rank / batch_size=4 / shuffle=False</text><text x="38" y="206" font-size="21" fill="#17263e" font-weight="700">rank 0</text><rect x="145" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="170" y="208" font-size="23" fill="#17263e" font-weight="400">0</text><rect x="240" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="265" y="208" font-size="23" fill="#17263e" font-weight="400">2</text><rect x="335" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="360" y="208" font-size="23" fill="#17263e" font-weight="400">4</text><rect x="430" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="455" y="208" font-size="23" fill="#17263e" font-weight="400">6</text><rect x="525" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="550" y="208" font-size="23" fill="#17263e" font-weight="400">8</text><rect x="620" y="171" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="645" y="208" font-size="23" fill="#17263e" font-weight="400">10</text><text x="740" y="198" font-size="20" fill="#17263e" font-weight="400">首批4项 + 尾批2项</text><text x="740" y="226" font-size="18" fill="#56667d" font-weight="400">loader丢尾：只留下首批</text><text x="38" y="298" font-size="21" fill="#17263e" font-weight="700">rank 1</text><rect x="145" y="263" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="170" y="300" font-size="23" fill="#17263e" font-weight="400">1</text><rect x="240" y="263" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="265" y="300" font-size="23" fill="#17263e" font-weight="400">3</text><rect x="335" y="263" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="360" y="300" font-size="23" fill="#17263e" font-weight="400">5</text><rect x="430" y="263" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="455" y="300" font-size="23" fill="#17263e" font-weight="400">7</text><rect x="525" y="263" width="76" height="58" rx="12" fill="#edf2ff" stroke="#cdd9e9"/><text x="550" y="300" font-size="23" fill="#17263e" font-weight="400">9</text><rect x="620" y="263" width="76" height="58" rx="12" fill="#fff1e6" stroke="#cdd9e9"/><text x="645" y="300" font-size="23" fill="#17263e" font-weight="400">0</text><text x="740" y="290" font-size="20" fill="#17263e" font-weight="400">首批4项 + 尾批2项</text><text x="740" y="318" font-size="18" fill="#56667d" font-weight="400">loader丢尾：只留下首批</text><text x="147" y="365" font-size="20" fill="#17263e" font-weight="400">Sampler补一个ID 0，使每rank各6项；覆盖11个唯一ID，交付12次。</text><rect x="36" y="401" width="1048" height="196" rx="12" fill="#fff" stroke="#cdd9e9"/><text x="58" y="438" font-size="23" fill="#315dce" font-weight="700">Iterable：分给worker后，批次数还受各自尾批影响</text><text x="58" y="475" font-size="20" fill="#17263e" font-weight="700">rank 0</text><text x="170" y="475" font-size="20" fill="#17263e" font-weight="400">worker 0：[0,4] [8]</text><text x="520" y="475" font-size="20" fill="#17263e" font-weight="400">worker 1：[1,5] [9]</text><text x="911" y="475" font-size="23" fill="#b53e3e" font-weight="700">4 批</text><text x="58" y="535" font-size="20" fill="#17263e" font-weight="700">rank 1</text><text x="170" y="535" font-size="20" fill="#17263e" font-weight="400">worker 0：[2,6] [10]</text><text x="520" y="535" font-size="20" fill="#17263e" font-weight="400">worker 1：[3,7]</text><text x="911" y="535" font-size="23" fill="#b53e3e" font-weight="700">3 批</text><text x="38" y="643" font-size="20" fill="#b53e3e" font-weight="700">正确分流覆盖全部11项，仍得到4批与3批。同步训练要另行约定等步数或不等输入处理。</text><text x="38" y="679" font-size="18" fill="#56667d" font-weight="400">本图来自实际PyTorch 2.5.1 CPU/Gloo和四个worker；没有执行训练步。</text></g></svg>

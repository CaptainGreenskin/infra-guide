<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="880" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc"><title id="title">同一逻辑操作，两次尝试，五条观测跨度</title><desc id="desc">第一次提交后返回503，第二次找回原回执；中途错误与最终成功同时保留。</desc><metadata>{&quot;kind&quot;: &quot;span_parent_tree&quot;, &quot;names_are_placeholders&quot;: true, &quot;nodes&quot;: [&quot;s0&quot;, &quot;c1&quot;, &quot;s1&quot;, &quot;c2&quot;, &quot;s2&quot;], &quot;edges&quot;: [[&quot;s0&quot;, &quot;c1&quot;], [&quot;c1&quot;, &quot;s1&quot;], [&quot;s0&quot;, &quot;c2&quot;], [&quot;c2&quot;, &quot;s2&quot;]], &quot;attempts&quot;: 2, &quot;effects&quot;: 1, &quot;total&quot;: 37, &quot;root_status&quot;: &quot;OK&quot;, &quot;first_pair_status&quot;: &quot;ERROR&quot;, &quot;second_pair_status&quot;: &quot;UNSET&quot;, &quot;collector_execution&quot;: false}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#315dce"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="1" y="1" width="1118" height="878" rx="10" fill="#f7f9fd" stroke="#cdd9e9"/><text x="36" y="48" font-size="28" fill="#17263e" font-weight="700">同一逻辑操作，两次尝试，五条观测跨度</text><text x="36" y="85" font-size="18" fill="#56667d" font-weight="400">第一次提交后返回503，第二次找回原回执；中途错误与最终成功同时保留。</text><rect x="335" y="124" width="450" height="116" rx="10" fill="#edf2ff" stroke="#cdd9e9"/><text x="357" y="162" font-size="24" fill="#315dce" font-weight="700">根跨度 s0：agent.task / OK</text><text x="357" y="202" font-size="20" fill="#17263e" font-weight="400">task_id=R27；所有节点共用trace=T</text><path d="M420 245L285 309" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M700 245L835 309" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="315" width="504" height="115" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="56" y="353" font-size="24" fill="#315dce" font-weight="700">CLIENT c1 / ERROR</text><text x="56" y="392" font-size="21" fill="#17263e" font-weight="400">执行器；parent_id=s0</text><path d="M288 435L288 485" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="36" y="491" width="504" height="164" rx="10" fill="#fff6e8" stroke="#cdd9e9"/><text x="56" y="529" font-size="24" fill="#936013" font-weight="700">SERVER s1 / ERROR</text><text x="56" y="566" font-size="20" fill="#17263e" font-weight="400">工具；parent_id=c1，remote=true</text><text x="56" y="603" font-size="21" fill="#17263e" font-weight="400">HTTP 503；duplicate=false</text><text x="56" y="636" font-size="19" fill="#17263e" font-weight="400">effect_committed</text><rect x="580" y="315" width="504" height="115" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="600" y="353" font-size="24" fill="#315dce" font-weight="700">CLIENT c2 / UNSET</text><text x="600" y="392" font-size="21" fill="#17263e" font-weight="400">执行器；parent_id=s0</text><path d="M832 435L832 485" stroke="#315dce" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="580" y="491" width="504" height="164" rx="10" fill="#edf6f3" stroke="#cdd9e9"/><text x="600" y="529" font-size="24" fill="#12725b" font-weight="700">SERVER s2 / UNSET</text><text x="600" y="566" font-size="20" fill="#17263e" font-weight="400">工具；parent_id=c2，remote=true</text><text x="600" y="603" font-size="21" fill="#17263e" font-weight="400">HTTP 200；duplicate=true</text><text x="600" y="636" font-size="19" fill="#17263e" font-weight="400">receipt_reused</text><rect x="36" y="700" width="1048" height="100" rx="10" fill="#fff" stroke="#cdd9e9"/><text x="58" y="739" font-size="23" fill="#17263e" font-weight="700">两次请求：同一个op_id=R27:publish；实际效果总数37，只写一行</text><text x="58" y="777" font-size="21" fill="#17263e" font-weight="400">5个span ≠ 5次尝试。这里是2次HTTP尝试、1笔效果、1个合格任务。</text><text x="38" y="844" font-size="17" fill="#56667d" font-weight="400">占位身份用于读关系，不是有效W3C头值；树无耗时比例。本机SDK/HTTP/SQLite，无远端采集器。</text></g></svg>

<title id="title">从 API 请求到共享状态，再到观察与执行</title><desc id="desc">先定位各层职责，再进入三成员协议；箭头不表示一次 RPC 或固定耗时。</desc>
<metadata>{&quot;source_sha256&quot;:{&quot;etcd_lab.py&quot;:&quot;85415281113096df75039ccbe1667dbc63b272935bcc059bdc36b06b64c72c16&quot;},&quot;initial&quot;:{&quot;members&quot;:[{&quot;name&quot;:&quot;infra-etcd-3cfb7bcfcb51-n0&quot;,&quot;id&quot;:&quot;15524364946534927838&quot;},{&quot;name&quot;:&quot;infra-etcd-3cfb7bcfcb51-n1&quot;,&quot;id&quot;:&quot;2226843427764874273&quot;},{&quot;name&quot;:&quot;infra-etcd-3cfb7bcfcb51-n2&quot;,&quot;id&quot;:&quot;7891799260605606917&quot;}],&quot;leader_id&quot;:&quot;15524364946534927838&quot;,&quot;term&quot;:2,&quot;quorum&quot;:2,&quot;first_put_revision&quot;:2,&quot;read&quot;:{&quot;revision&quot;:2,&quot;cluster_id&quot;:&quot;1251586427138963347&quot;,&quot;member_id&quot;:&quot;15524364946534927838&quot;,&quot;rows&quot;:{&quot;/lesson/config/limit&quot;:{&quot;value&quot;:&quot;37&quot;,&quot;create_revision&quot;:2,&quot;mod_revision&quot;:2,&quot;version&quot;:1,&quot;lease&quot;:&quot;0&quot;}}}},&quot;conceptual_layers&quot;:[&quot;api&quot;,&quot;controller&quot;,&quot;business&quot;]}</metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#5275b9"/></marker></defs>
<rect width="1120" height="740" fill="#fbfcff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="36" y="48" font-size="29" fill="#202d41" font-weight="700" text-anchor="start">从 API 请求到共享状态，再到观察与执行</text>
<text x="36" y="83" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">先定位各层职责，再进入三成员协议；箭头不表示一次 RPC 或固定耗时。</text>
<rect x="36" y="132" width="246" height="116" rx="10" fill="#f1f3f7" stroke="#cbd6eb"/><text x="59" y="169" font-size="24" fill="#263448" font-weight="700" text-anchor="start">API 服务</text><text x="59" y="204" font-size="20" fill="#263448" font-weight="400" text-anchor="start">校验、存取共享对象</text><text x="59" y="231" font-size="17" fill="#65748a" font-weight="400" text-anchor="start">职责示意：本实验未运行</text><path d="M286 190 L365 190" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><rect x="382" y="121" width="700" height="261" rx="10" fill="#f7f9ff" stroke="#cbd6eb"/><text x="405" y="158" font-size="23" fill="#263448" font-weight="700" text-anchor="start">真实 etcd 三成员：同一份 limit=37</text><rect x="405" y="187" width="200" height="102" rx="10" fill="#fff1d3" stroke="#cbd6eb"/><text x="425" y="221" font-size="24" fill="#263448" font-weight="700" text-anchor="start">n0</text><text x="425" y="255" font-size="20" fill="#263448" font-weight="400" text-anchor="start">初始 leader</text><rect x="626" y="187" width="200" height="102" rx="10" fill="#e9effd" stroke="#cbd6eb"/><text x="646" y="221" font-size="24" fill="#263448" font-weight="700" text-anchor="start">n1</text><text x="646" y="255" font-size="20" fill="#263448" font-weight="400" text-anchor="start">投票成员</text><rect x="847" y="187" width="200" height="102" rx="10" fill="#e9effd" stroke="#cbd6eb"/><text x="867" y="221" font-size="24" fill="#263448" font-weight="700" text-anchor="start">n2</text><text x="867" y="255" font-size="20" fill="#263448" font-weight="400" text-anchor="start">投票成员</text><text x="405" y="333" font-size="24" fill="#315dce" font-weight="700" text-anchor="start">多数门槛 = floor(3/2)+1 = 2</text><text x="405" y="363" font-size="18" fill="#65748a" font-weight="400" text-anchor="start">保存、提交、应用有职责差别；不要求三份同时应用</text><rect x="36" y="452" width="256" height="101" rx="10" fill="#f1f3f7" stroke="#cbd6eb"/><text x="57" y="488" font-size="22" fill="#263448" font-weight="700" text-anchor="start">API 层观察接口</text><text x="57" y="522" font-size="18" fill="#263448" font-weight="400" text-anchor="start">向客户端交付对象变化</text><rect x="382" y="452" width="310" height="101" rx="10" fill="#e9f4ed" stroke="#cbd6eb"/><text x="405" y="488" font-size="22" fill="#263448" font-weight="700" text-anchor="start">控制器本地缓存</text><text x="405" y="522" font-size="18" fill="#263448" font-weight="400" text-anchor="start">收到事件，再推进调谐</text><rect x="780" y="452" width="302" height="101" rx="10" fill="#f1f3f7" stroke="#cbd6eb"/><text x="803" y="488" font-size="22" fill="#263448" font-weight="700" text-anchor="start">实际进程与用户结果</text><text x="803" y="522" font-size="18" fill="#263448" font-weight="400" text-anchor="start">继续单独检查就绪与流量</text><path d="M298 503 L374 503" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><path d="M698 503 L772 503" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 389 L730 438 L166 438 L166 447" fill="none" stroke="#5275b9" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="603" font-size="21" fill="#263448" font-weight="700" text-anchor="start">本轮真实读取：</text><text x="213" y="603" font-size="21" fill="#263448" font-weight="400" text-anchor="start">limit=37；全局 revision=2；该键 version=1</text><text x="36" y="650" font-size="20" fill="#65748a" font-weight="400" text-anchor="start">etcd CLI 为实际执行；API、控制器和业务层为职责示意。</text><text x="36" y="686" font-size="20" fill="#65748a" font-weight="400" text-anchor="start">控制状态恢复，与应用持久卷或数据库恢复分别定义目标。</text>
</g></svg>

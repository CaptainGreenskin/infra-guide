<title id="title">模型看到补录，宿主更新计划并等待批准</title>
<desc id="description">模型提出读主清单、加入补录、读补录和生成草稿四次调用。宿主保留主清单 37，计划 1 加入 late-A/v1 变为计划 2，补录 5 生成 42 草稿。之后新进程只在批准匹配 42 草稿时发布。</desc>

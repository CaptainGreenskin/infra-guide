<svg xmlns="http://www.w3.org/2000/svg" width="920" height="397" viewBox="0 0 920 397" role="img" aria-labelledby="title desc">
<title id="title">同一行加常数，两种归一化怎样响应</title>
<desc id="desc">输入一、三变成三、五后，LayerNorm 中心化后仍为负一、一。RMSNorm 的分母由根号五变为根号十七。</desc>
<metadata>{"input":[[1,3],[3,5]],"layernorm_output":[[-1,1],[-1,1]],"rms_denominator_squared":[5,17],"epsilon":0}</metadata>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#415d84"/></marker></defs>
<rect x="1" y="1" width="918" height="395" rx="16" fill="#f8fafd" stroke="#dce6f4"/>
<g font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="32" y="47" font-size="26" fill="#172743" font-weight="700" text-anchor="start">同一行加常数，两种归一化怎样响应</text>
<text x="32" y="78" font-size="17" fill="#506584" font-weight="500" text-anchor="start">对同一个位置的两个特征一起加 2。手算取 ε=0、γ=[1,1]、β=[0,0]。</text><rect x="32" y="110" width="856" height="228" rx="9" fill="#ffffff" stroke="#ccdaed"/><text x="53" y="148" font-size="18" fill="#172743" font-weight="700" text-anchor="start">输入</text><text x="286" y="148" font-size="18" fill="#172743" font-weight="700" text-anchor="start">LayerNorm：先减均值</text><text x="590" y="148" font-size="18" fill="#172743" font-weight="700" text-anchor="start">RMSNorm：直接缩放</text><path d="M50 166H868" fill="none" stroke="#ccdaed" stroke-width="1"/><text x="53" y="204" font-size="23" fill="#172743" font-weight="650" text-anchor="start">[1, 3]</text><text x="286" y="204" font-size="21" fill="#315fb5" font-weight="650" text-anchor="start">均值 2 → [−1, 1]</text><text x="590" y="204" font-size="21" fill="#087767" font-weight="650" text-anchor="start">[1, 3] ÷ √5</text><text x="53" y="273" font-size="23" fill="#172743" font-weight="650" text-anchor="start">[3, 5]</text><text x="286" y="273" font-size="21" fill="#315fb5" font-weight="650" text-anchor="start">均值 4 → [−1, 1]</text><text x="590" y="273" font-size="21" fill="#087767" font-weight="650" text-anchor="start">[3, 5] ÷ √17</text><path d="M50 225H868" fill="none" stroke="#ccdaed" stroke-width="1"/><text x="286" y="315" font-size="15" fill="#506584" font-weight="500" text-anchor="start">中心化后的输入相同</text><text x="590" y="315" font-size="15" fill="#506584" font-weight="500" text-anchor="start">分母和输出都改变</text><text x="32" y="372" font-size="17" fill="#172743" font-weight="600" text-anchor="start">统计只沿当前词元的特征轴；不同位置分别计算。</text>
</g>
</svg>

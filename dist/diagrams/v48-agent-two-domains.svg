<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">效果与进度，属于两个提交域</title><desc id="desc">真实子进程运行器和存活的本地HTTP接收方分开保存进度与效果，崩溃不会让两者自动原子提交。</desc><metadata>{&quot;kind&quot;: &quot;durability_domains&quot;, &quot;amount&quot;: 37, &quot;operation&quot;: &quot;logical-add-1&quot;, &quot;separate_sqlite_files&quot;: true, &quot;scope&quot;: &quot;real POSIX process kill and surviving local HTTP receiver, separate SQLite domains; not power-loss durability, network partition, concurrent runners, or Kairo integration&quot;}</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315dce"/></marker></defs><rect width="960" height="490" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif"><text x="32" y="45" font-size="26" fill="#24344d" font-weight="650" text-anchor="start">效果与进度，属于两个提交域</text><text x="32" y="88" font-size="19" fill="#5f708a" font-weight="400" text-anchor="start">固定动作：demo增加37，身份logical-add-1；两份SQLite文件。</text><rect x="32" y="120" width="385" height="235" rx="7" fill="#edf2fc" stroke="#cbd6e8"/><text x="58" y="160" font-size="24" fill="#315dce" font-weight="600" text-anchor="start">运行器子进程</text><text x="58" y="205" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">提交意图与操作身份</text><text x="58" y="250" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">发请求 → 收到响应</text><text x="58" y="295" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">提交观察 → 完成</text><rect x="540" y="120" width="385" height="235" rx="7" fill="#f0f7f5" stroke="#bed9d2"/><text x="565" y="160" font-size="24" fill="#236e5e" font-weight="600" text-anchor="start">独立存活的工具服务</text><text x="565" y="205" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">核对同键 / 参数指纹</text><text x="565" y="250" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">同一事务：效果 + 回执</text><text x="565" y="295" font-size="21" fill="#24344d" font-weight="400" text-anchor="start">回应或等待查询</text><path d="M417 238L535 238" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M540 305L422 305" stroke="#315dce" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="32" y="410" font-size="22" fill="#a34242" font-weight="600" text-anchor="start">杀死运行器，不会自动撤回工具事务；本地事务也不包住HTTP。</text><text x="32" y="455" font-size="20" fill="#5f708a" font-weight="400" text-anchor="start">最终核对账户、回执与本地观察，不能只看DONE。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" role="img" aria-labelledby="title desc"><title id="title">训练可以并行，为什么生成通常要逐步继续？</title><desc id="desc">四个位置的下三角因果可见性与训练、prefill、decode关系。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315dce"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif}</style><rect width="960" height="548" rx="12" fill="#f6f8fc"/><text x="30" y="30" font-size="11" fill="#315dce" font-weight="400">INFRAGUIDE / FOLLOW ONE TRAINING STEP</text><text x="30" y="68" font-size="23" fill="#203553" font-weight="600">训练可以并行，为什么生成通常要逐步继续？</text><text x="32" y="107" font-size="16" fill="#203553" font-weight="400">行是正在计算的 query 位置；列是可读取的 key / value 位置。</text><text x="55" y="178" font-size="16" fill="#203553" font-weight="400">位置 0</text><text x="185" y="143" font-size="16" fill="#203553" font-weight="400">0</text><rect x="150" y="155" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="166" y="188" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="262" y="155" width="100" height="54" rx="5" fill="#e9edf3"/><text x="278" y="188" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><rect x="374" y="155" width="100" height="54" rx="5" fill="#e9edf3"/><text x="390" y="188" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><rect x="486" y="155" width="100" height="54" rx="5" fill="#e9edf3"/><text x="502" y="188" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><text x="55" y="244" font-size="16" fill="#203553" font-weight="400">位置 1</text><text x="297" y="143" font-size="16" fill="#203553" font-weight="400">1</text><rect x="150" y="221" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="166" y="254" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="262" y="221" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="278" y="254" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="374" y="221" width="100" height="54" rx="5" fill="#e9edf3"/><text x="390" y="254" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><rect x="486" y="221" width="100" height="54" rx="5" fill="#e9edf3"/><text x="502" y="254" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><text x="55" y="310" font-size="16" fill="#203553" font-weight="400">位置 2</text><text x="409" y="143" font-size="16" fill="#203553" font-weight="400">2</text><rect x="150" y="287" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="166" y="320" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="262" y="287" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="278" y="320" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="374" y="287" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="390" y="320" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="486" y="287" width="100" height="54" rx="5" fill="#e9edf3"/><text x="502" y="320" font-size="16" fill="#7e8da2" font-weight="400">屏蔽</text><text x="55" y="376" font-size="16" fill="#203553" font-weight="400">位置 3</text><text x="521" y="143" font-size="16" fill="#203553" font-weight="400">3</text><rect x="150" y="353" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="166" y="386" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="262" y="353" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="278" y="386" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="374" y="353" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="390" y="386" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="486" y="353" width="100" height="54" rx="5" fill="#dbe6fc"/><text x="502" y="386" font-size="16" fill="#315dce" font-weight="400">可读取</text><rect x="640" y="155" width="288" height="87" rx="8" fill="white" stroke="#ccd8eb"/><text x="658" y="185" font-size="17" fill="#203553" font-weight="600">训练 / Prefill</text><text x="658" y="211" font-size="14" fill="#61748e" font-weight="400">整段输入已知，可并行处理</text><rect x="640" y="274" width="288" height="87" rx="8" fill="white" stroke="#ccd8eb"/><text x="658" y="304" font-size="17" fill="#203553" font-weight="600">Decode</text><text x="658" y="330" font-size="14" fill="#61748e" font-weight="400">新query读取历史KV与当前KV</text><text x="35" y="475" font-size="17" fill="#203553" font-weight="600">未来位置权重应为0；softmax只在允许的位置归一化。</text><text x="35" y="512" font-size="15" fill="#61748e" font-weight="400">标签在训练前已知，因此能并行计算多个位置的预测；生成时下一个输入尚未确定。</text></svg>
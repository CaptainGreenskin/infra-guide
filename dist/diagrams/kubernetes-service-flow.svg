<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#4c6ead"/></marker></defs>
<rect width="1120" height="658" fill="#fbfcff"/><g font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="36" y="48" font-size="28" fill="#1f3047" font-weight="700">先走通一条正常请求，再改变健康与版本</text><text x="36" y="83" font-size="18" fill="#617187" font-weight="400">上方是创建与探测关系，下方实线只表示真实请求与响应的数据路径。</text><rect x="36" y="121" width="300" height="112" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="55" y="157" font-size="20" fill="#28384d" font-weight="700">Deployment：期望两个副本</text><text x="55" y="191" font-size="20" fill="#28384d" font-weight="400">模板 APP_VERSION=v1</text><text x="55" y="219" font-size="18" fill="#617187" font-weight="400">控制器创建并维护 Pod</text><path d="M350 177 L408 177" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="425" y="121" width="659" height="112" rx="12" fill="#eaf4ed" stroke="#cbd7e8"/><text x="446" y="157" font-size="22" fill="#28384d" font-weight="700">Pod A / Pod B：实际运行的两个业务进程</text><text x="446" y="191" font-size="20" fill="#28384d" font-weight="400">每个 Pod 有独立 UID；返回版本、UID 与请求 ID</text><text x="446" y="219" font-size="18" fill="#617187" font-weight="400">kubelet 周期探测 /ready 与 /live，各自执行不同动作</text><rect x="36" y="255" width="520" height="90" rx="12" fill="#fff7e8" stroke="#cbd7e8"/><text x="55" y="288" font-size="21" fill="#28384d" font-weight="700">EndpointSlice：后端地址 + ready 条件</text><text x="55" y="323" font-size="18" fill="#617187" font-weight="400">控制对象；供转发组件观察，不承载 HTTP 请求</text><path d="M433 348 L433 385" stroke="#a87928" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="590" y="288" font-size="19" fill="#8a6220" font-weight="400">虚线：转发组件据此更新规则</text><text x="590" y="323" font-size="19" fill="#4c6ead" font-weight="400">实线：客户端的实际 HTTP 数据路径</text><rect x="36" y="390" width="246" height="150" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="52" y="426" font-size="22" fill="#28384d" font-weight="700">① 客户端 Pod</text><text x="52" y="467" font-size="16" fill="#28384d" font-weight="400">新连接 GET /work</text><text x="52" y="507" font-size="16" fill="#617187" font-weight="400">X-Request-ID 每次唯一</text><path d="M286 465 L304 465" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="310" y="390" width="246" height="150" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="326" y="426" font-size="22" fill="#28384d" font-weight="700">② ClusterIP 转发</text><text x="326" y="467" font-size="16" fill="#28384d" font-weight="400">稳定 IP 10.96.63.29</text><text x="326" y="507" font-size="16" fill="#617187" font-weight="400">按转发规则选择就绪后端</text><path d="M560 465 L578 465" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="584" y="390" width="246" height="150" rx="12" fill="#edf3ff" stroke="#cbd7e8"/><text x="600" y="426" font-size="22" fill="#28384d" font-weight="700">③ Pod 内应用</text><text x="600" y="467" font-size="16" fill="#28384d" font-weight="400">选中 Pod A 或 Pod B</text><text x="600" y="507" font-size="16" fill="#617187" font-weight="400">8080 端口处理 /work</text><path d="M834 465 L852 465" stroke="#4c6ead" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="858" y="390" width="226" height="150" rx="12" fill="#eaf4ed" stroke="#cbd7e8"/><text x="874" y="426" font-size="22" fill="#28384d" font-weight="700">④ 实际响应</text><text x="874" y="467" font-size="20" fill="#28384d" font-weight="400">HTTP 200 / v1</text><text x="874" y="507" font-size="16" fill="#617187" font-weight="400">回显请求 ID 与 Pod UID</text><text x="36" y="587" font-size="20" fill="#28384d" font-weight="400">正常样本实际包含两个 UID：23cdd057… 和 27e75782…</text><text x="36" y="626" font-size="19" fill="#617187" font-weight="400">Service 描述稳定入口与选择关系；它不是额外业务进程。HTTP 不会穿过 EndpointSlice。</text></g></svg>

# Example only: requires a CNI implementation that enforces NetworkPolicy.
# Allows ingress from same-namespace client Pods; does not grant DNS egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: reports-ingress, namespace: infra-lab}
spec:
  podSelector: {matchLabels: {app: reports}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {role: client}}
      ports:
        - {protocol: TCP, port: 8080}
